function drawMlExpenditureList(container, rec, liveCoaTotals){
  container.innerHTML = '';
  rec.expenditureColumns.forEach(col=>{
    const isCoa = col.source==='coa';
    const isEntries = col.source==='entries';
    const autoAmt = isCoa ? (liveCoaTotals ? (liveCoaTotals[col.coaKey]||0) : 0) : null;
    const overridden = isCoa && col.override!==undefined && col.override!==null;
    const amt = isCoa ? (overridden ? col.override : autoAmt) : isEntries ? expenditureEntryColTotal(rec, col.id) : (Number(col.amount)||0);
    const row = el(`
      <div class="line-item">
        <div class="field desc" style="margin-bottom:0;"><label>Column</label><input type="text" class="ml-exp-label" value="${escapeHtml(col.label)}"></div>
        ${isCoa
          ? `<div class="field amt" style="margin-bottom:0;"><label>Amount <span class="tag">${overridden?'manually overridden':'auto from Withdraw Notesheet: '+escapeHtml(COA.find(c=>c.key===col.coaKey)?.label||col.coaKey)}</span></label><input type="text" inputmode="decimal" class="ml-exp-amt-coa" value="${formatAsianAmount(amt)}"></div>
             <button type="button" class="secondary small ml-exp-reset" title="Clear override, go back to auto" ${overridden?'':'style="visibility:hidden;"'}>&#8635;</button>`
          : isEntries
          ? `<div class="field amt" style="margin-bottom:0;"><label>Amount <span class="tag">auto, from entries below</span></label><input type="text" disabled value="${formatAsianAmount(amt)}"></div>`
          : `<div class="field amt" style="margin-bottom:0;"><label>Amount <span class="tag">manual</span></label><input type="text" inputmode="decimal" class="ml-exp-amt" value="${formatAsianAmount(amt)}"></div>`
        }
        <button class="danger small" type="button" data-action="ml-remove-expcol" data-item="${col.id}" title="Remove">&times;</button>
      </div>
    `);
    const labelInp = row.querySelector('.ml-exp-label');
    wireLockableTextInput(labelInp);
    labelInp.oninput = (e)=>{ col.label = e.target.value; saveState(); };
    const amtInp = row.querySelector('.ml-exp-amt');
    if(amtInp) wireAmountInput(amtInp, (num)=>{ col.amount = num; saveState(); refreshMonthlyLedgerComputedOnly(); });
    const coaAmtInp = row.querySelector('.ml-exp-amt-coa');
    if(coaAmtInp){
      wireAmountInput(coaAmtInp, (num)=>{
        col.override = (num===autoAmt) ? null : num;
        saveState(); refreshMonthlyLedgerComputedOnly();
      });
    }
    const resetBtn = row.querySelector('.ml-exp-reset');
    if(resetBtn) resetBtn.onclick = ()=>{ col.override = null; saveState(); refreshMonthlyLedgerComputedOnly(); renderMonthlyLedgerWindowInPlace(); };
    container.appendChild(row);
  });
}

/* Day-by-day Expenditure entries - mirrors drawMlRevenueList, for months
   imported from an older Excel workbook that recorded actual dated
   expenditure rows (date, description, per-category amount) rather than
   relying on the Daily Ledger's Withdraw Notesheet totals. Only
   expenditure columns with source:'entries' get an amount box here;
   'coa' and 'manual' columns are unaffected and keep working as before. */
/* Labels shown in the "map to" dropdown for a custom row, and the keys
   computeMonthlyLedgerFigures's metricValues object uses for each. */
const ML_CUSTOM_ROW_METRICS = [
  {key:'totalIncome', label:'Total Income'},
  {key:'totalDue', label:'Total Due'},
  {key:'totalAmount', label:'Total Amount'},
  {key:'totalExpenditure', label:'Total Expenditure'},
  {key:'totalBalance', label:'Total Balance (Total Amount − Expenditure)'},
  {key:'cashInHand', label:'Cash in Hand'},
  {key:'bankBalance', label:'Balance in Bank Account'},
  {key:'gratuityPayable', label:'Gratuity Payable'},
  {key:'eduAssistPayable', label:'Education Assistance Payable'},
  {key:'totalAssets', label:'Total Assets'},
  {key:'equity', label:'Equity'},
  {key:'grandTotal', label:'Grand Total (Cash + Bank)'},
];
function drawMlCustomRowsList(container, rec, f){
  container.innerHTML = '';
  const rows = rec.customRows||[];
  rows.forEach((row,i)=>{
    const bg = row.color==='green' ? '#E6F4EA' : '#FFF9DB';
    const border = row.color==='green' ? '#8BC48A' : '#E8D66B';
    const val = f.customRowValues[row.id]||0;
    const wrap = el(`
      <div class="line-item" style="background:${bg};border:1px solid ${border};border-radius:6px;padding:6px 8px;margin-bottom:6px;">
        <div class="field" style="margin-bottom:0;min-width:0;display:flex;flex-direction:column;gap:2px;">
          <label>&nbsp;</label>
          <div style="display:flex;gap:2px;">
            <button class="secondary small ml-cr-up" type="button" ${i===0?'disabled':''} title="Move up" style="padding:2px 8px;">&uarr;</button>
            <button class="secondary small ml-cr-down" type="button" ${i===rows.length-1?'disabled':''} title="Move down" style="padding:2px 8px;">&darr;</button>
          </div>
        </div>
        <div class="field desc" style="margin-bottom:0;"><label>Label</label><input type="text" class="ml-cr-label" value="${escapeHtml(row.label||'')}"></div>
        <div class="field" style="margin-bottom:0;min-width:170px;">
          <label>Maps to</label>
          <select class="ml-cr-source">
            <option value="manual" ${row.source==='manual'?'selected':''}>Manual number</option>
            <option value="revenue" ${row.source==='revenue'?'selected':''}>Revenue category…</option>
            <option value="expenditure" ${row.source==='expenditure'?'selected':''}>Expenditure column…</option>
            <option value="metric" ${row.source==='metric'?'selected':''}>Existing total…</option>
          </select>
        </div>
        <div class="ml-cr-key-wrap" style="min-width:170px;">
          ${row.source==='revenue' ? `<div class="field" style="margin-bottom:0;"><label>Category</label><select class="ml-cr-key">${REVENUE_CATS.map(c=>`<option value="${c.key}" ${row.key===c.key?'selected':''}>${escapeHtml(c.label)}</option>`).join('')}</select></div>`
          : row.source==='expenditure' ? `<div class="field" style="margin-bottom:0;"><label>Column</label><select class="ml-cr-key">${rec.expenditureColumns.map(c=>`<option value="${c.id}" ${row.key===c.id?'selected':''}>${escapeHtml(c.label)}</option>`).join('')}</select></div>`
          : row.source==='metric' ? `<div class="field" style="margin-bottom:0;"><label>Total</label><select class="ml-cr-key">${ML_CUSTOM_ROW_METRICS.map(m=>`<option value="${m.key}" ${row.key===m.key?'selected':''}>${escapeHtml(m.label)}</option>`).join('')}</select></div>`
          : ''}
        </div>
        <div class="field amt" style="margin-bottom:0;">
          <label>Amount</label>
          ${row.source==='manual' ? `<input type="text" inputmode="decimal" class="ml-cr-amt" value="${formatAsianAmount(row.amount||0)}">` : `<input type="text" disabled value="${formatAsianAmount(val)}">`}
        </div>
        <button class="danger small" type="button" data-action="ml-remove-custom-row" data-item="${row.id}" title="Remove">&times;</button>
      </div>
    `);
    wireLockableTextInput(wrap.querySelector('.ml-cr-label'));
    wrap.querySelector('.ml-cr-label').oninput = (e)=>{ row.label = e.target.value; saveState(); };
    wrap.querySelector('.ml-cr-source').onchange = (e)=>{ row.source = e.target.value; row.key = null; saveState(); renderMonthlyLedgerWindowInPlace(); };
    const keySel = wrap.querySelector('.ml-cr-key');
    if(keySel){ keySel.onchange = (e)=>{ row.key = e.target.value; saveState(); refreshMonthlyLedgerComputedOnly(); renderMonthlyLedgerWindowInPlace(); }; if(!row.key){ row.key = keySel.value; saveState(); } }
    const amtInp = wrap.querySelector('.ml-cr-amt');
    if(amtInp) wireAmountInput(amtInp, (num)=>{ row.amount = num; saveState(); refreshMonthlyLedgerComputedOnly(); });
    const upBtn = wrap.querySelector('.ml-cr-up');
    const downBtn = wrap.querySelector('.ml-cr-down');
    if(upBtn) upBtn.onclick = ()=>{
      const idx = rec.customRows.indexOf(row);
      if(idx<=0) return;
      rec.customRows[idx] = rec.customRows[idx-1];
      rec.customRows[idx-1] = row;
      saveState(); renderMonthlyLedgerWindowInPlace();
    };
    if(downBtn) downBtn.onclick = ()=>{
      const idx = rec.customRows.indexOf(row);
      if(idx<0 || idx>=rec.customRows.length-1) return;
      rec.customRows[idx] = rec.customRows[idx+1];
      rec.customRows[idx+1] = row;
      saveState(); renderMonthlyLedgerWindowInPlace();
    };
    container.appendChild(wrap);
  });
}

      });
    });

/* Per-bank closing balance for the selected month's Balance Sheet - auto
   from the Daily Ledger for the live month, typed in for other months
   (same override pattern as Cash in Hand / Balance in Bank Account). */
/* One-time per-category opening balance grid, shared by the Revenue and
   Expenditure beginning-entries sections. */
function drawMlBankBreakdownList(container, rec, bankBreakdownShown, isLiveMonth){
  container.innerHTML = '';
  if(state.banks.length===0){ container.appendChild(el(`<p class="empty">No bank accounts set up yet.</p>`)); return; }
  state.banks.forEach(b=>{
    const val = bankBreakdownShown[b.id];
    // Formula-driven only - each bank's own closing balance from the
    // Daily Ledger day-chain, no manual override. Read-only display, same
    // reasoning as Cash in Hand/Balance in Bank Account being auto: this
    // number should always match what the Daily Ledger itself already
    // computed, never drift from a hand-typed figure.
    const wrap = el(`<div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">${escapeHtml(b.name)} <span class="tag">auto</span></label><div class="computed" style="padding:6px 8px;">${val===null?'&mdash;':money(val)}</div></div>`);
    container.appendChild(wrap);
  });
}

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:4px 0 4px;">
          ${state.banks.map(b=>`
            <div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">${escapeHtml(b.name)}</label><input type="text" inputmode="decimal" class="ml-seed-amt" data-group="bank" data-cat="${b.id}" value="${formatAsianAmount(existing?(existing.bankBreakdown||{})[b.id]:0)}"></div>
          `).join('') || '<p class="empty">No bank accounts set up yet.</p>'}
        </div>
        <div class="divider"></div>
        <label style="font-size:12px;">Balance Sheet preview from the figures above</label>
        <div id="ml-seed-preview" style="font-size:12.5px;background:var(--card-alt,#F7F8F4);border-radius:6px;padding:8px 10px;margin-top:4px;"></div>
        <div class="modal-actions">
          ${existing ? '<button class="secondary" type="button" id="ml-seed-clear">Clear</button>' : ''}
          <button class="secondary" type="button">Cancel</button>
          <button class="danger" type="button">Save</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const amtInputs = overlay.querySelectorAll('.ml-seed-amt');
  const previewBox = overlay.querySelector('#ml-seed-preview');
  /* Recomputed straight from whatever is currently typed in the modal
     (not yet saved) - lets the person see the resulting Balance Sheet
     shape before committing, the same figures computeMonthlyLedgerFigures
     will produce once saved and applied to the earliest tracked month. */
  const updateSeedPreview = ()=>{
    let revSum = 0, expSum = 0, bankSum = 0;
    amtInputs.forEach(inp=>{
      const val = parseAmountInput(inp.value)||0;
      if(inp.dataset.group==='revenue') revSum += val;
      else if(inp.dataset.group==='expenditure') expSum += val;
      else if(inp.dataset.group==='bank') bankSum += val;
    });
    const net = revSum - expSum;
    previewBox.innerHTML = `
      <div class="computed"><span class="lbl">Total Revenue</span><span>${money(revSum)}</span></div>
      <div class="computed"><span class="lbl">Total Expenditure</span><span>${money(expSum)}</span></div>
      <div class="computed"><span class="lbl">Net (Revenue − Expenditure)</span><span>${money(net)}</span></div>
      <div class="computed"><span class="lbl">Total Bank Balance</span><span>${money(bankSum)}</span></div>
      <div class="computed total"><span class="lbl">Grand Total (Net + Bank)</span><span>${money(net+bankSum)}</span></div>
    `;
  };
  amtInputs.forEach(inp=>{ wireAmountInput(inp, ()=>{ updateSeedPreview(); }); inp.addEventListener('input', updateSeedPreview); });
  updateSeedPreview();
  const buttons = overlay.querySelectorAll('.modal-actions button');
  const clearBtn = existing ? overlay.querySelector('#ml-seed-clear') : null;
  const cancelBtn = buttons[existing?1:0], saveBtn = buttons[existing?2:1];
  saveBtn.onclick = ()=>{
    const year = overlay.querySelector('#ml-seed-year').value.trim();
    const throughMonth = overlay.querySelector('#ml-seed-month').value;
    if(!year) return;
    const revenue = {}, expenditure = {}, bankBreakdown = {};
    amtInputs.forEach(inp=>{
      const val = parseAmountInput(inp.value);
      if(inp.dataset.group==='revenue') revenue[inp.dataset.cat] = val;
      else if(inp.dataset.group==='expenditure') expenditure[inp.dataset.cat] = val;
      else if(inp.dataset.group==='bank') bankBreakdown[inp.dataset.cat] = val;
    });
    state.monthlyLedger.seed = {year, throughMonth, revenue, expenditure, bankBreakdown, active: existing ? existing.active!==false : true};
    saveState();
    overlay.remove();
    render();
  };
  if(clearBtn) clearBtn.onclick = ()=>{ state.monthlyLedger.seed = null; saveState(); overlay.remove(); render(); };
  cancelBtn.onclick = ()=> overlay.remove();
  wireBackdropClose(overlay);
}

/* --- Monthly Ledger: full day-by-day import of a previous month's real
   workbook (Monthly Revenue + Monthly Expenditure sheets) - reads every
   dated row on both sheets into rec.revenueEntries / rec.expenditureEntries
   exactly as recorded, plus the trailer figures each sheet happens to
   have that month (Beginning Balance Bank, Total Due, Transfer between
   categories, Cash in Hand, Advance Payment, Balance in Bank Account).
   Only writes into the ONE month record being imported - every other
   month, and everything outside the Monthly Ledger, is left untouched. */
function mlNorm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function mlParseDateCell(v){
  if(v==null || v==='') return null;
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number') return excelSerialToDateStr(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    let day=m[1], mon=m[2], yr=m[3];
    if(yr.length===2) yr = (Number(yr)<70?'20':'19')+yr;
    if(Number(mon)>12){ const t=day; day=mon; mon=t; }
    return `${yr}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  return null;
}
function mlCellVal(ws, r, c){
  if(!c) return null;
  const cell = ws.getCell(r,c);
  let v = cell.value;
  if(v && typeof v==='object'){ if('result' in v) return v.result; if(v instanceof Date) return v; return null; }
  return v;
}
function mlRowLabel(ws, r, cols){ return cols.map(c=>mlNorm(mlCellVal(ws,r,c))).filter(Boolean).join(' ').trim(); }

function parseFullRevenueSheet(ws){
  let headerRow=null;
  for(let r=1;r<=ws.rowCount;r++){
    const rowText=[]; for(let c=1;c<=ws.columnCount;c++) rowText.push(mlNorm(mlCellVal(ws,r,c)));
    if(rowText.join('|').includes('date') && rowText.join('|').includes('description')){ headerRow=r; break; }
  }
  if(!headerRow) throw new Error('No Date/Description header row found in the Revenue sheet.');
  let dateCol=null, descCol=null, totalCol=null;
  for(let c=1;c<=ws.columnCount;c++){
    const v = mlNorm(mlCellVal(ws,headerRow,c));
    if(v==='date') dateCol=c; else if(v==='description') descCol=c; else if(v==='total') totalCol=c;
  }
  const catCol = {};
  for(let c=(totalCol||descCol)+1;c<=ws.columnCount;c++){
    const label = mlNorm(mlCellVal(ws,headerRow,c));
    if(!label || label==='sign' || /ibbplc|tbl/.test(label)) continue;
    const cat = REVENUE_CATS.find(rc=>{
      const names=[rc.label,...(rc.aliases||[])].map(mlNorm);
      return names.some(n=>n===label || label.includes(n) || n.includes(label));
    });
    if(cat) catCol[cat.key]=c;
  }
  const catRowSum = (r)=>Object.values(catCol).reduce((s,c)=>s+(Number(mlCellVal(ws,r,c))||0),0);
  const firstNumericAfter = (r,fromCol)=>{
    for(let c=fromCol+1;c<=ws.columnCount;c++){ const v=mlCellVal(ws,r,c); if(typeof v==='number') return v; }
    return 0;
  };
  const result = {beginningBankBalance:0, seedRevenue:{}, entries:[], totalDue:{}, transfer:{}};
  let stopped=false;
  for(let r=headerRow+1;r<=ws.rowCount && !stopped;r++){
    const label = mlRowLabel(ws,r,[1,2,3]);
    const descRaw = mlCellVal(ws,r,descCol);
    const desc = mlNorm(descRaw);
    if(/beginning balance bank/.test(label) || /beginning balance bank/.test(desc)){
      result.beginningBankBalance = totalCol ? (Number(mlCellVal(ws,r,totalCol))||0) : (catRowSum(r) || firstNumericAfter(r, descCol));
      continue;
    }
    // New per-bank format ("IBBPLC Total", "TBL Total", ...) - sums
    // whichever of these rows are present into the same combined figure,
    // for a workbook exported after the Beginning Balance Bank row was
    // split out by bank.
    if(state.banks.some(b=>{
      const bn = mlNorm(b.name);
      return (label===`${bn} total` || desc===`${bn} total`);
    })){
      result.beginningBankBalance += totalCol ? (Number(mlCellVal(ws,r,totalCol))||0) : (catRowSum(r) || firstNumericAfter(r, descCol));
      continue;
    }
    if((/yearly running total/.test(label)||/yearly running total/.test(desc)) && (/previous month/.test(label)||/previous month/.test(desc))){
      Object.keys(catCol).forEach(k=>{ const v=Number(mlCellVal(ws,r,catCol[k]))||0; if(v) result.seedRevenue[k]=v; });
      continue;
    }
    if(desc==='description') continue;
    if(label.startsWith('total income') || desc.startsWith('total income')) continue;
    if(label.includes('total due') || desc.startsWith('total due')){
      Object.keys(catCol).forEach(k=>{ result.totalDue[k] = Number(mlCellVal(ws,r,catCol[k]))||0; });
      continue;
    }
    if(/transfer.*(admis|categor)/.test(label) || /transfer.*(admis|categor)/.test(desc)){
      Object.keys(catCol).forEach(k=>{ result.transfer[k] = Number(mlCellVal(ws,r,catCol[k]))||0; });
      continue;
    }
    if(/yearly running total/.test(label) || /yearly running total/.test(desc)){
      stopped = true; continue;
    }
    if(label.startsWith('total') || desc.startsWith('total') || /^deposit to /.test(label) || /^deposit to /.test(desc)){
      continue; // an unrecognized summary/trailer row (varies by month) - skip it, keep looking for Total Due etc below
    }
    const date = mlParseDateCell(mlCellVal(ws,r,dateCol));
    const hasAmt = Object.keys(catCol).some(k=>(Number(mlCellVal(ws,r,catCol[k]))||0)!==0);
    if(!date && !hasAmt) continue;
    const entry = {id:uid(), date, desc: descRaw||''};
    Object.keys(catCol).forEach(k=>{ entry[k] = Number(mlCellVal(ws,r,catCol[k]))||0; });
    result.entries.push(entry);
  }
  return result;
}

function parseFullExpenditureSheet(ws){
  let headerRow=null;
  for(let r=1;r<=ws.rowCount;r++){
    const rowText=[]; for(let c=1;c<=ws.columnCount;c++) rowText.push(mlNorm(mlCellVal(ws,r,c)));
    if(rowText.join('|').includes('date') && rowText.join('|').includes('description')){ headerRow=r; break; }
  }
  if(!headerRow) throw new Error('No Date/Description header row found in the Expenditure sheet.');
  let dateCol=null, descCol=null, totalCol=null;
  for(let c=1;c<=ws.columnCount;c++){
    const v = mlNorm(mlCellVal(ws,headerRow,c));
    if(v==='date') dateCol=c; else if(v.startsWith('description')) descCol=c; else if(v.startsWith('total')) totalCol=c;
  }
  const cats = [];
  for(let c=(totalCol||descCol)+1;c<=ws.columnCount;c++){
    let label = mlCellVal(ws,headerRow,c);
    if(!mlNorm(label)) label = mlCellVal(ws,headerRow-1,c) || mlCellVal(ws,headerRow+1,c);
    if(!mlNorm(label)) continue;
    if(/^(ibbplc|tbl)\s*total/i.test(String(label).trim())) continue;
    cats.push({label:String(label).trim(), col:c});
  }
  const result = {entries:[], cats, balanceSheet:{}};
  let stopped=false;
  for(let r=headerRow+1;r<=ws.rowCount && !stopped;r++){
    const label = mlRowLabel(ws,r,[1,2,3]);
    const descRaw = mlCellVal(ws,r,descCol);
    const desc = mlNorm(descRaw);
    if(label.startsWith('total') || desc.startsWith('total') || label==='expenditure:' || desc==='expenditure:'){ stopped=true; continue; }
    if(desc==='description') continue;
    const date = mlParseDateCell(mlCellVal(ws,r,dateCol));
    const hasAmt = cats.some(c=>(Number(mlCellVal(ws,r,c.col))||0)!==0);
    if(!date && !hasAmt) continue;
    const entry = {id:uid(), date, desc:descRaw||'', amounts:{}};
    cats.forEach(c=>{ entry.amounts[c.label] = Number(mlCellVal(ws,r,c.col))||0; });
    result.entries.push(entry);
  }
  for(let r=1;r<=ws.rowCount;r++){
    for(let c=1;c<=ws.columnCount;c++){
      const label = mlNorm(mlCellVal(ws,r,c));
      if(label==='cash in hand'){ for(let cc=c+1;cc<=ws.columnCount;cc++){ const v=mlCellVal(ws,r,cc); if(typeof v==='number'){ result.balanceSheet.cashInHand=v; break; } } }
      if(label==='advance payment'){ for(let cc=c+1;cc<=ws.columnCount;cc++){ const v=mlCellVal(ws,r,cc); if(typeof v==='number'){ result.balanceSheet.advancePayment=v; break; } } }
      if(label==='balance in bank account'){ for(let cc=c+1;cc<=ws.columnCount;cc++){ const v=mlCellVal(ws,r,cc); if(typeof v==='number'){ result.balanceSheet.bankBalance=v; break; } } }
    }
  }
  return result;
}

async function importFullMonthFile(file){
  try{
    await loadExcelJS();
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
    await wb.xlsx.load(buf);
    const revWs = wb.worksheets.find(w=>/revenue/i.test(w.name));
    const expWs = wb.worksheets.find(w=>/expenditure/i.test(w.name));
    if(!revWs || !expWs){ showAlert('Could not find both a "Monthly Revenue" and a "Monthly Expenditure" sheet in that file.'); return; }

    let year = state.year||'', throughMonth = state.month||MONTHS[0];
    for(let r=1;r<=Math.min(6,revWs.rowCount);r++){
      const v = String(mlCellVal(revWs,r,1)||'');
      const m = v.match(/month of\s+([a-zA-Z]+)\s+(\d{4})/i);
      if(m){ throughMonth = MONTHS.find(mm=>mm.toLowerCase()===m[1].toLowerCase())||throughMonth; year = m[2]; break; }
    }
    const key = monthKeyFor(throughMonth, year);
    if(!key){ showAlert('Could not work out which month this file is for - check the title cell says something like "Month of March 2026".'); return; }

    const rev = parseFullRevenueSheet(revWs);
    const exp = parseFullExpenditureSheet(expWs);
    const revSum = rev.entries.reduce((s,e)=>s+REVENUE_CATS.reduce((s2,c)=>s2+(e[c.key]||0),0),0);
    const expSum = exp.entries.reduce((s,e)=>s+Object.values(e.amounts).reduce((a,b)=>a+b,0),0);
    const existingRec = state.monthlyLedger.months[key];
    const overwriteWarning = existingRec && (existingRec.revenueEntries.length || existingRec.expenditureEntries.length)
      ? ` This month already has ${existingRec.revenueEntries.length} revenue and ${existingRec.expenditureEntries.length} expenditure entries saved - importing will REPLACE them.`
      : '';

    showConfirm(
      `Read ${monthKeyLabel(key)}: ${rev.entries.length} revenue entries (total ${money(revSum)}), ${exp.entries.length} expenditure entries across ${exp.cats.length} categories (total ${money(expSum)}).${overwriteWarning} Import into the Monthly Ledger?`,
      ()=>{
        const rec = getMonthlyLedgerMonth(key);
        rec.revenueEntries = rev.entries;
        REVENUE_CATS.forEach(c=>{ rec.revenueTotalDue[c.key] = rev.totalDue[c.key]||0; rec.revenueTransfer[c.key] = rev.transfer[c.key]||0; });
        rec.beginningBankBalance = rev.beginningBankBalance;
        // Only the chronologically-earliest tracked month should carry a
        // "Yearly Running Total from Previous Month" forward as the
        // Starting Point seed - for every later month that figure is
        // just each month's own running total, which the app already
        // computes itself once all the months in between are entered.
        if(key===earliestTrackedMonthKey() && Object.keys(rev.seedRevenue).length){
          const prevSeed = state.monthlyLedger.seed || {year, throughMonth, revenue:{}, expenditure:{}, bankBreakdown:{}, active:true};
          state.monthlyLedger.seed = {...prevSeed, revenue:{...prevSeed.revenue, ...rev.seedRevenue}};
        }
        // Expenditure columns: replace with exactly this month's real
        // categories, each backed by the day-by-day entries just parsed
        // (source:'entries') - matches "যে মাসে যে খাত আছে সেভাবে".
        rec.expenditureColumns = exp.cats.map(c=>({id:uid(), label:c.label, source:'entries'}));
        rec.expenditureEntries = exp.entries.map(e=>{
          const amounts = {};
          exp.cats.forEach((c,i)=>{ amounts[rec.expenditureColumns[i].id] = e.amounts[c.label]||0; });
          return {id:e.id, date:e.date, desc:e.desc, amounts};
        });
        if(exp.balanceSheet.cashInHand!==undefined) rec.balanceSheet.cashInHandOverride = exp.balanceSheet.cashInHand;
        if(exp.balanceSheet.advancePayment!==undefined) rec.balanceSheet.advancePayment = exp.balanceSheet.advancePayment;
        if(exp.balanceSheet.bankBalance!==undefined) rec.balanceSheet.bankBalanceOverride = exp.balanceSheet.bankBalance;
        saveState(); render();
        showAlert(`${monthKeyLabel(key)} imported. Open Monthly Ledger and select this month to review it against the original file.`);
      },
      'Import this month'
    );
  }catch(err){
    showAlert('Could not read that file: ' + err.message);
  }
}

/* --- Monthly Ledger: import a previous month's workbook to read off its
   Yearly Running Total row, so the seed above doesn't need retyping by
   hand. Only reads - never writes back to the uploaded file. --- */
async function importMonthlyLedgerFile(file){
  try{
    await loadExcelJS();
    const buf = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
    await wb.xlsx.load(buf);
    const revSheet = wb.worksheets.find(w=>/revenue/i.test(w.name));
    if(!revSheet){ showAlert('Could not find a "Monthly Revenue" sheet in that file.'); return; }

    // Find the category header row (has "Date" and "Description" nearby)
    let headerRow = null, headerRowIdx = null;
    for(let r=1;r<=revSheet.rowCount;r++){
      const row = revSheet.getRow(r);
      const rowText = row.values.map(v=>String(v||'')).join('|').toLowerCase();
      if(rowText.includes('date') && rowText.includes('description')){ headerRow = row; headerRowIdx = r; break; }
    }
    if(!headerRow){ showAlert('Could not find the category header row (Date/Description/...) in that sheet.'); return; }
    const colsForCat = {}; // cat.key -> array of matching column indices (old formats sometimes split one category across two columns)
    REVENUE_CATS.forEach(cat=>{
      const names = [cat.label, ...(cat.aliases||[])].map(s=>s.toLowerCase().replace(/\s+/g,' ').trim());
      const matches = [];
      for(let c=1;c<=revSheet.columnCount;c++){
        const v = String(headerRow.getCell(c).value||'').toLowerCase().replace(/\s+/g,' ').trim();
        if(!v) continue;
        if(names.some(target => v===target || v.includes(target) || target.includes(v))) matches.push(c);
      }
      colsForCat[cat.key] = matches;
    });

    // Find the "Yearly Running Total" row (the NEW one, not "...from Previous Month")
    // - the label can sit in column A, B, or C depending on the file's exact layout.
    let yrtRow = null;
    for(let r=headerRowIdx;r<=revSheet.rowCount;r++){
      const rowLabel = [1,2,3].map(c=>String(revSheet.getCell(r,c).value||'')).join(' ');
      if(/yearly running total/i.test(rowLabel) && !/previous month/i.test(rowLabel)){ yrtRow = r; break; }
    }
    if(!yrtRow){ showAlert('Could not find the "Yearly Running Total" row in that sheet.'); return; }

    const revenue = {};
    REVENUE_CATS.forEach(cat=>{
      const cols = colsForCat[cat.key]||[];
      revenue[cat.key] = cols.reduce((s,c)=> s + (Number(revSheet.getCell(yrtRow, c).value)||0), 0);
    });

    // Try to read the month/year from a title cell like "Monthly Income: Month of March 2026"
    let year = state.year||'', throughMonth = state.month||MONTHS[0];
    for(let r=1;r<=Math.min(6,revSheet.rowCount);r++){
      const v = String(revSheet.getCell(r,1).value||'');
      const m = v.match(/month of\s+([a-zA-Z]+)\s+(\d{4})/i);
      if(m){ throughMonth = MONTHS.find(mm=>mm.toLowerCase()===m[1].toLowerCase())||throughMonth; year = m[2]; break; }
    }

    showConfirm(
      `Found Yearly Running Total figures through ${throughMonth} ${year}. Set this as the starting point? ` +
      REVENUE_CATS.map(c=>`${c.label}: ${money(revenue[c.key])}`).join(', '),
      ()=>{
        state.monthlyLedger.seed = {year:String(year), throughMonth, revenue};
        saveState(); render();
        showAlert('Starting point saved. Months you add from here are summed on top of it automatically.');
      },
      'Use these figures'
    );
  }catch(err){
    showAlert('Could not read that file - make sure it\'s the same format as your existing monthly ledger workbooks.');
  }
}

/* When several Revenue (or Expenditure) rows share the same date, put
   them in the same order they actually happened in on the real TBL bank
   statement, instead of an arbitrary tie order - matched by amount
   against that date's Deposit (Revenue) or Withdrawal (Expenditure)
   lines, in the sequence those lines appear in the uploaded statement.
   Runs automatically on every export whenever that month's statement has
   been uploaded (state.bankStatements, from the TBL bank's Bank
   Reconciliation card); if it hasn't, or a same-date row's amount just
   doesn't match anything on the statement (e.g. two rows tie on the
   exact same amount so which-is-which is genuinely ambiguous), that row
   simply keeps its original relative position - left for a manual look
   rather than guessed at. Only reorders WITHIN a date; the overall date
   order from the earlier sort is untouched. */
function reorderByBankStatement(rows, amountFn, side){
  const tblBank = state.banks.find(b=>/tbl/i.test(b.name));
  const stmt = tblBank && state.bankStatements[tblBank.id];
  if(!stmt || !stmt.rows || !stmt.rows.length) return rows;
  const out = [];
  let i = 0;
  while(i < rows.length){
    let j = i;
    while(j < rows.length && rows[j].date === rows[i].date) j++;
    const group = rows.slice(i, j);
    if(group.length <= 1 || !rows[i].date){ out.push(...group); i = j; continue; }
    const stmtRows = stmt.rows.filter(r=>r.date===rows[i].date && Number(r[side])>0);
    if(!stmtRows.length){ out.push(...group); i = j; continue; }
    const used = new Array(group.length).fill(false);
    const matched = [];
    stmtRows.forEach(sr=>{
      const amt = Number(sr[side])||0;
      for(let k=0;k<group.length;k++){
        if(used[k]) continue;
        if(Math.abs(amountFn(group[k]) - amt) < 0.5){ used[k]=true; matched.push(group[k]); break; }
      }
    });
    const unmatched = group.filter((_,k)=>!used[k]);
    out.push(...matched, ...unmatched);
    i = j;
  }
  return out;
}
function expRowAmount(row){
  if(row.type==='entry') return Object.values(row.entry.amounts||{}).reduce((s,v)=>s+(Number(v)||0),0);
  return Number(row.amount)||0;
}
function revRowAmount(row){
  if(row.type==='revenue') return REVENUE_CATS.reduce((s,c)=>s+(Number(row.entry[c.key])||0),0);
  return Number(row.amount)||0;
}

/* --- Monthly Ledger: export the two-sheet workbook, matching the
   institution's existing format with real formulas (not hardcoded
   results), so it recalculates correctly if opened and tweaked. --- */
async function exportMonthlyLedger(key, previewOnly){
  const rec = getMonthlyLedgerMonth(key);
  const mlFig = computeMonthlyLedgerFigures(key);
  await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value

  const FONT = {name:'Times New Roman', size:11};
  const BOLD = {name:'Times New Roman', size:11, bold:true};
  const FONT_SMALL = {name:'Times New Roman', size:10};
  const thin = {top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};

  /* ---- Monthly Revenue sheet ---- */
  const rev = wb.addWorksheet('Monthly Revenue');
  rev.pageSetup = { paperSize: 5, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }; // paperSize 5 = Legal
  rev.getColumn(1).width = 4; rev.getColumn(2).width = 12; rev.getColumn(3).width = 34;
  for(let c=4;c<=15;c++) rev.getColumn(c).width = 15;
  const REV_LAST_COL = 15; // column O

  rev.getCell('A2').value = 'INTERNATIONAL ISLAMIC INSTITUTE (MADRASHA ACCT)';
  rev.getCell('A2').font = BOLD;
  rev.mergeCells(2,1,2,REV_LAST_COL); rev.getCell(2,1).alignment = {horizontal:'center'};
  rev.getCell('A3').value = `Monthly Income: Month of ${monthKeyLabel(key)}`;
  rev.getCell('A3').font = BOLD;
  rev.mergeCells(3,1,3,REV_LAST_COL); rev.getCell(3,1).alignment = {horizontal:'center'};
  rev.getCell('A4').value = 'Madrasah Acct';
  rev.getCell('A4').font = BOLD;
  rev.mergeCells(4,1,4,REV_LAST_COL); rev.getCell(4,1).alignment = {horizontal:'center'};

  const headerRowNum = 6;
  const headers = ['Date','Description','Total', ...REVENUE_CATS.map(c=>c.label)];
  headers.forEach((h,i)=>{
    const cell = rev.getCell(headerRowNum, i+2); // starts col B
    cell.value = h; cell.font = BOLD; cell.border = thin;
    cell.alignment = {wrapText:true, vertical:'bottom', horizontal:'center'};
  });

  let r = headerRowNum+1;
  // One row per bank ("IBBPLC Total", "TBL Total", ...) rather than a
  // single combined figure - both accounts hold money even though, at the
  // moment, day-to-day deposits/withdrawals only happen through TBL.
  const bankBeginRows = {};
  state.banks.forEach(b=>{
    bankBeginRows[b.id] = r;
    rev.getCell(r,3).value = `${b.name} Total`;
    rev.getCell(r,4).value = effectiveBeginningBankBalanceFor(key, b.id);
    r++;
  });
  // House Rent Deposit only gets its own separate (non-dated) row in the
  // rare legacy case where it's a flat manually-typed monthly total with
  // no day-by-day source to date it by; the normal, dated, per-day case is
  // merged into the main date-sorted data block below instead of always
  // appearing first regardless of its actual date.
  const houseRentManual = Number(rec.houseRentDeposit)||0;
  const houseRentEntries = houseRentManual===0 ? dailyBankFieldEntries(key, 'houseRentDeposit') : [];
  let houseRentManualRow = null;
  if(!houseRentEntries.length){
    houseRentManualRow = r;
    revSummaryLabel(r, 'House Rent Deposit');
    rev.getCell(r,4).value = houseRentManual;
    r++;
  }
  const yrtBeforeRow = r;
  rev.getCell(r,3).value = 'Yearly Running Total from Previous Month';
  const yrtBefore = yearlyRunningTotalBefore(key);
  REVENUE_CATS.forEach((c,i)=>{ rev.getCell(r, 5+i).value = yrtBefore[c.key]; });
  r++;

  // One combined, chronologically-sorted block: every revenue entry plus
  // every dated House Rent Deposit line, interleaved by date rather than
  // House Rent Deposit always sitting above everything else regardless of
  // when it actually happened. Dated House Rent Deposit posts into the
  // Miscellaneous Collection category column (see below), so it's fully
  // part of Total Income like any other entry - no separate tracking
  // needed for it here.
  const dataStartRow = r;
  const mergedRevenueRows = [
    ...sortedByDate(rec.revenueEntries).map(entry=>({type:'revenue', date:entry.date, entry})),
    ...houseRentEntries.map(en=>({type:'houseRent', date:en.date, amount:en.amount})),
  ].sort((a,b)=>{
    const da = a.date||'', db = b.date||'';
    return da===db ? 0 : da===''?1: db===''?-1 : da.localeCompare(db);
  });
  const miscColIdx = REVENUE_CATS.findIndex(c=>c.key==='misc');
  reorderByBankStatement(mergedRevenueRows, revRowAmount, 'deposit').forEach(row=>{
    rev.getCell(r,2).value = row.date ? new Date(row.date) : '';
    if(row.date) rev.getCell(r,2).numFmt = 'd/m/yyyy';
    if(row.type==='houseRent'){
      // Goes in the Miscellaneous Collection category column (like any
      // other revenue entry) so it's genuinely part of Total Income, not
      // a separately-tracked addition on top of it - the description
      // still says "House Rent Deposit" so it's identifiable.
      rev.getCell(r,3).value = 'House Rent Deposit';
      rev.getCell(r,4).value = {formula:`SUM(E${r}:O${r})`};
      REVENUE_CATS.forEach((c,i)=>{ rev.getCell(r,5+i).value = i===miscColIdx ? row.amount : 0; });
    } else {
      rev.getCell(r,3).value = exportRevenueDesc(row.entry.desc);
      rev.getCell(r,4).value = {formula:`SUM(E${r}:O${r})`};
      REVENUE_CATS.forEach((c,i)=>{ rev.getCell(r,5+i).value = Number(row.entry[c.key])||0; });
    }
    for(let c=2;c<=15;c++){ rev.getCell(r,c).border = thin; rev.getCell(r,c).font = c>=4 ? FONT_SMALL : FONT; }
    r++;
  });
  const dataEndRow = r-1;
  if(dataEndRow < dataStartRow){ // no entries - keep a valid (empty) range
    rev.getCell(dataStartRow,4).value = 0;
  }

  // Rows after day-by-day data start at column A (merged A:C), left-aligned label
  function revSummaryLabel(row, text){
    rev.mergeCells(row,1,row,3);
    rev.getCell(row,1).value = text;
    rev.getCell(row,1).alignment = {horizontal:'left'};
  }

  const totalIncomeRow = r;
  revSummaryLabel(r, 'Total Income:'); rev.getCell(r,1).font = BOLD;
  // Column D (Total) sums the E:O category grid directly across the whole
  // data range, rather than summing column D's own per-row values - that
  // keeps House Rent Deposit rows (which put a plain number straight in
  // column D, no category breakdown) correctly excluded from Total
  // Income, now that they're interleaved into this same row range instead
  // of living in their own separate block above it.
  rev.getCell(r,4).value = dataEndRow>=dataStartRow ? {formula:`SUM(E${dataStartRow}:O${dataEndRow})`} : 0;
  rev.getCell(r,4).font = BOLD;
  for(let c=5;c<=15;c++){
    const colLetter = rev.getColumn(c).letter;
    rev.getCell(r,c).value = dataEndRow>=dataStartRow ? {formula:`SUM(${colLetter}${dataStartRow}:${colLetter}${dataEndRow})`} : 0;
    rev.getCell(r,c).font = BOLD;
  }
  r++;
  const totalAmountRow = r;
  revSummaryLabel(r, 'Total Amount'); rev.getCell(r,1).font = BOLD;
  // Dated House Rent Deposit now posts straight into the Miscellaneous
  // Collection column above, so it's already inside Total Income - only
  // the rare legacy non-dated manual fallback (which can't be date-sorted
  // into that block at all) still needs adding on separately here.
  const houseRentRef = houseRentManualRow ? `D${houseRentManualRow}` : '0';
  const bankBeginRef = state.banks.map(b=>`D${bankBeginRows[b.id]}`).join('+') || '0';
  rev.getCell(r,4).value = {formula:`D${totalIncomeRow}+${bankBeginRef}+${houseRentRef}`};
  rev.getCell(r,4).font = BOLD;
  r++;
  const totalDueRow = r;
  revSummaryLabel(r, 'Total Due'); rev.getCell(r,1).font = FONT;
  rev.getCell(r,4).value = {formula:`SUM(E${r}:O${r})`};
  REVENUE_CATS.forEach((c,i)=>{ rev.getCell(r,5+i).value = Number(rec.revenueTotalDue[c.key])||0; });
  r++;
  const transferRow = r;
  revSummaryLabel(r, 'Transfer from Admission Fee to Gratuity & Education Assistant Fund'); rev.getCell(r,1).font = FONT;
  rev.getCell(r,4).value = {formula:`SUM(E${r}:O${r})`};
  REVENUE_CATS.forEach((c,i)=>{ rev.getCell(r,5+i).value = effectiveRevenueTransfer(rec, c.key); });
  r++;
  const yrtNewRow = r;
  revSummaryLabel(r, 'Yearly Running Total'); rev.getCell(r,1).font = BOLD;
  REVENUE_CATS.forEach((c,i)=>{
    const colLetter = rev.getColumn(5+i).letter;
    if(c.key==='eduAssist'){
      // Net of this month's own EduAssist expenditure - can't be a live
      // formula here since the Expenditure sheet (built later) is where
      // that expenditure column lives; embed the already-computed net value.
      rev.getCell(r,5+i).value = mlFig.yrtNew.eduAssist;
    } else {
      rev.getCell(r,5+i).value = {formula:`${colLetter}${totalIncomeRow}+${colLetter}${transferRow}+${colLetter}${yrtBeforeRow}`};
    }
    rev.getCell(r,5+i).font = BOLD;
  });
  r++;

  // Bank-to-Bank Transfer: purely informational, dated - money moving
  // between the institution's own two bank accounts isn't income (it's
  // already reflected in each bank's own opening/closing balance), so
  // these rows are never summed into Total Income/Total Amount above;
  // they're just listed here, in date order, so a transfer is visible
  // somewhere in the Monthly Ledger rather than only inferable from two
  // banks' closing balances not matching their own deposit/withdrawal total.
  const bankXferRows = [];
  (allDaysEverywhere().filter(d=>d.date.slice(0,7)===key)).forEach(day=>{
    (day.bankTransfers||[]).filter(t=>t.fromBankId!==t.toBankId).forEach(t=>{
      const fromBank = state.banks.find(b=>b.id===t.fromBankId);
      const toBank = state.banks.find(b=>b.id===t.toBankId);
      bankXferRows.push({date:day.date, amount:Number(t.amount)||0, from:fromBank?fromBank.name:'?', to:toBank?toBank.name:'?'});
    });
  });
  if(bankXferRows.length){
    const bankXferHeaderRow = r;
    revSummaryLabel(r, 'Bank-to-Bank Transfer (informational - not part of Total Income)'); rev.getCell(r,1).font = BOLD;
    r++;
    bankXferRows.sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>{
      rev.getCell(r,2).value = new Date(x.date); rev.getCell(r,2).numFmt = 'd/m/yyyy';
      rev.getCell(r,3).value = `${x.from} \u2192 ${x.to}`;
      rev.getCell(r,4).value = x.amount;
      r++;
    });
  }
  const revSheetLastRow = r-1;

  // All-border across the whole used block, first line through last line -
  // also applies the Asian comma + 2-decimal number format to every amount
  // column (4 = Total, 5-15 = per-category amounts); columns 1-3 (index/
  // date/description) are left alone since numFmt has no effect on them
  // anyway, but skipping them keeps the intent clear.
  for(let rr=2; rr<=revSheetLastRow; rr++){
    for(let cc=1; cc<=REV_LAST_COL; cc++){
      rev.getCell(rr,cc).border = thin;
      if(!rev.getCell(rr,cc).font || !rev.getCell(rr,cc).font.name) rev.getCell(rr,cc).font = FONT;
      if(cc>=4) rev.getCell(rr,cc).numFmt = ASIAN_NUMFMT;
    }
  }

  /* ---- Monthly Expenditure sheet ---- */
  const exp = wb.addWorksheet('Monthly Expenditure');
  exp.pageSetup = { paperSize: 5, orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }; // paperSize 5 = Legal
  exp.getColumn(1).width = 12; exp.getColumn(2).width = 34;
  for(let c=3;c<=3+rec.expenditureColumns.length;c++) exp.getColumn(c).width = 14;
  const EXP_LAST_COL = 3+rec.expenditureColumns.length; // last expense category column ("N" or wherever it actually ends)

  exp.getCell('A2').value = 'INTERNATIONAL ISLAMIC INSTITUTE (MADRASHA ACCT)'; exp.getCell('A2').font = BOLD;
  exp.mergeCells(2,1,2,EXP_LAST_COL); exp.getCell(2,1).alignment = {horizontal:'center'};
  exp.getCell('A3').value = `Monthly Expenditure: Month of ${monthKeyLabel(key)}`; exp.getCell('A3').font = BOLD;
  exp.mergeCells(3,1,3,EXP_LAST_COL); exp.getCell(3,1).alignment = {horizontal:'center'};
  exp.getCell('A4').value = 'Madrash Acct'; exp.getCell('A4').font = BOLD;
  exp.mergeCells(4,1,4,EXP_LAST_COL); exp.getCell(4,1).alignment = {horizontal:'center'};

  const expHeaderRow = 5;
  exp.getCell(expHeaderRow,1).value = 'Date'; exp.getCell(expHeaderRow,1).font = BOLD;
  exp.getCell(expHeaderRow,2).value = 'Description'; exp.getCell(expHeaderRow,2).font = BOLD;
  exp.getCell(expHeaderRow,3).value = 'Total'; exp.getCell(expHeaderRow,3).font = BOLD;
  rec.expenditureColumns.forEach((col,i)=>{
    const cell = exp.getCell(expHeaderRow, 4+i);
    cell.value = col.label; cell.font = BOLD; cell.alignment = {wrapText:true, horizontal:'center'};
  });

  let er = expHeaderRow+2;
  // First data line: a bold section label, matching how the Revenue sheet
  // leads with "Beginning Balance Bank" - this whole block is the bank/
  // cash withdrawal side of the ledger.
  exp.getCell(er,2).value = 'Bank Cash withdraw';
  exp.getCell(er,2).font = BOLD;
  er++;
  const expDataStartRow = er;
  // One combined, chronologically-sorted block: expenditure entries (each
  // Withdraw Notesheet's own dated, per-category row) plus Bank fees,
  // Salary by Account, and Salary by Cash - all dated per-day - interleaved
  // by date instead of the latter three always trailing after everything
  // else regardless of when they actually happened. Each of these three
  // posts into its actual expenditure category column (Bank fees -> "Bank
  // Charge", Salary by Account/Cash -> "Pay & Allce") rather than only
  // ever showing up in the Total column with no category behind it - same
  // treatment as an ordinary expenditure-entry row, so ROW_NUMS below is
  // only used as a fallback for the rare case that column doesn't exist
  // (e.g. renamed/deleted), where the amount still needs a specific cell
  // reference into Total Expenditure instead of being silently dropped.
  const bankFeesEntries = dailyBankFieldEntries(key, 'fees');
  const salaryAccountManual = Number(rec.salaryByAccount)||0;
  const salaryAccountEntries = salaryAccountManual===0 ? dailyBankFieldEntries(key, 'salaryAccount') : [];
  const salaryCashManual = Number(rec.salaryByCash)||0;
  const salaryCashEntries = salaryCashManual===0 ? dailyBankFieldEntries(key, 'salaryCash') : [];
  const bankFeesRowNums = [], salaryAccountRowNums = [], salaryCashRowNums = [];
  const mergedExpRows = [
    ...sortedByDate(rec.expenditureEntries).map(entry=>({type:'entry', date:entry.date, entry})),
    ...bankFeesEntries.map(en=>({type:'fees', date:en.date, amount:en.amount})),
    ...salaryAccountEntries.map(en=>({type:'salaryAccount', date:en.date, amount:en.amount})),
    ...salaryCashEntries.map(en=>({type:'salaryCash', date:en.date, amount:en.amount})),
  ].sort((a,b)=>{
    const da = a.date||'', db = b.date||'';
    return da===db ? 0 : da===''?1: db===''?-1 : da.localeCompare(db);
  });
  const ROW_LABEL = {fees:'Bank fees', salaryAccount:'Salary by Account', salaryCash:'Salary by Cash'};
  const ROW_NUMS = {fees:bankFeesRowNums, salaryAccount:salaryAccountRowNums, salaryCash:salaryCashRowNums};
  // Which expenditure column each "plain" type actually spent from -
  // matched by label so it still works if columns get reordered, and
  // falls back to the old plain-Total-only behavior (via ROW_NUMS) if that
  // column has been renamed or deleted.
  const bankChargeCol = rec.expenditureColumns.find(c=>c.label==='Bank Charge');
  const payAllceCol = rec.expenditureColumns.find(c=>c.label==='Pay & Allce');
  const ROW_TARGET_COL = {fees:bankChargeCol, salaryAccount:payAllceCol, salaryCash:payAllceCol};
  reorderByBankStatement(mergedExpRows, expRowAmount, 'withdrawal').forEach(row=>{
    exp.getCell(er,1).value = row.date ? new Date(row.date) : '';
    if(row.date) exp.getCell(er,1).numFmt = 'd/m/yyyy';
    if(row.type==='entry'){
      exp.getCell(er,2).value = exportExpenditureDesc(row.entry, rec);
      rec.expenditureColumns.forEach((col,i)=>{
        exp.getCell(er, 4+i).value = Number((row.entry.amounts||{})[col.id])||0;
      });
      exp.getCell(er,3).value = {formula:`SUM(D${er}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${er})`};
    } else {
      exp.getCell(er,2).value = ROW_LABEL[row.type];
      const targetCol = ROW_TARGET_COL[row.type];
      if(targetCol){
        rec.expenditureColumns.forEach((col,i)=>{ exp.getCell(er, 4+i).value = col===targetCol ? row.amount : 0; });
        exp.getCell(er,3).value = {formula:`SUM(D${er}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${er})`};
      } else {
        exp.getCell(er,3).value = row.amount;
        ROW_NUMS[row.type].push(er);
      }
    }
    for(let c=1;c<=EXP_LAST_COL;c++) exp.getCell(er,c).font = c>=3 ? FONT_SMALL : FONT;
    er++;
  });
  const expDataEndRow = er-1;
  // Manual-total fallback for Bank fees/Salary (no per-day source at all
  // for this month) - a single non-dated row, same legacy case as House
  // Rent Deposit on the Revenue sheet.
  function expSummaryLabel(row, text){
    exp.mergeCells(row,1,row,2);
    exp.getCell(row,1).value = text;
    exp.getCell(row,1).alignment = {horizontal:'left'};
  }
  if(!bankFeesEntries.length){
    expSummaryLabel(er, 'Bank fees'); exp.getCell(er,1).font = FONT;
    if(bankChargeCol){
      rec.expenditureColumns.forEach((col,i)=>{ exp.getCell(er, 4+i).value = 0; });
      exp.getCell(er,3).value = {formula:`SUM(D${er}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${er})`};
    } else {
      exp.getCell(er,3).value = 0;
      bankFeesRowNums.push(er);
    }
    er++;
  }
  if(!salaryAccountEntries.length){
    expSummaryLabel(er, 'Salary by Account'); exp.getCell(er,1).font = FONT;
    if(payAllceCol){
      rec.expenditureColumns.forEach((col,i)=>{ exp.getCell(er, 4+i).value = col===payAllceCol ? salaryAccountManual : 0; });
      exp.getCell(er,3).value = {formula:`SUM(D${er}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${er})`};
    } else {
      exp.getCell(er,3).value = salaryAccountManual;
      salaryAccountRowNums.push(er);
    }
    er++;
  }
  if(!salaryCashEntries.length){
    expSummaryLabel(er, 'Salary by Cash'); exp.getCell(er,1).font = FONT;
    if(payAllceCol){
      rec.expenditureColumns.forEach((col,i)=>{ exp.getCell(er, 4+i).value = col===payAllceCol ? salaryCashManual : 0; });
      exp.getCell(er,3).value = {formula:`SUM(D${er}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${er})`};
    } else {
      exp.getCell(er,3).value = salaryCashManual;
      salaryCashRowNums.push(er);
    }
    er++;
  }
  const expDataFinalRow = er-1;
  // Manual override adjustment: only ever needed - and only ever shown -
  // when a Withdraw Notesheet category has actually been manually
  // overridden (see the coa-column override UI); the difference between
  // the override figure and what the dated notesheet rows above already
  // add up to for that column, so the column's Total Expenditure still
  // equals the override. Skipped entirely otherwise, rather than always
  // appearing as a zeroed-out line.
  const expOverrideAmounts = rec.expenditureColumns.map(col=>{
    if(col.source==='coa' && col.override!==undefined && col.override!==null) return (Number(col.override)||0) - expenditureEntryColTotal(rec, col.id);
    return 0;
  });
  let expOverrideRow = null;
  if(expOverrideAmounts.some(a=>Math.abs(a)>0.001)){
    expOverrideRow = er;
    expSummaryLabel(expOverrideRow, 'Manual override adjustment');
    rec.expenditureColumns.forEach((col,i)=>{ exp.getCell(expOverrideRow, 4+i).value = expOverrideAmounts[i]; });
    exp.getCell(expOverrideRow,3).value = {formula:`SUM(D${expOverrideRow}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${expOverrideRow})`};
    for(let c=1;c<=EXP_LAST_COL;c++) exp.getCell(expOverrideRow,c).font = c>=3 ? FONT_SMALL : FONT;
    er++;
  }
  const expBlockEndRow = er-1;

  const expTotalRow = er;
  expSummaryLabel(expTotalRow, 'Total Expenditure:'); exp.getCell(expTotalRow,1).font = BOLD;
  // Column C (Total): the D:N category grid summed directly across the
  // whole block (covers every expenditure-entry row, including the
  // override adjustment row above, since those all carry real D:N values)
  // plus the non-categorized Bank fees/Salary rows added by direct cell
  // reference, since those are scattered through the block instead of
  // being one contiguous range.
  const plainRowNums = [...bankFeesRowNums, ...salaryAccountRowNums, ...salaryCashRowNums];
  const plainRowRef = plainRowNums.length ? `+SUM(${plainRowNums.map(rn=>`C${rn}`).join(',')})` : '';
  exp.getCell(expTotalRow,3).value = expBlockEndRow>=expDataStartRow
    ? {formula:`SUM(D${expDataStartRow}:${exp.getColumn(3+rec.expenditureColumns.length).letter}${expBlockEndRow})${plainRowRef}`}
    : 0;
  exp.getCell(expTotalRow,3).font = BOLD;
  rec.expenditureColumns.forEach((col,i)=>{
    const colLetter = exp.getColumn(4+i).letter;
    exp.getCell(expTotalRow, 4+i).value = expBlockEndRow>=expDataStartRow ? {formula:`SUM(${colLetter}${expDataStartRow}:${colLetter}${expBlockEndRow})`} : 0;
    exp.getCell(expTotalRow, 4+i).font = BOLD;
  });
  er++;

  const balanceRow = expTotalRow+1;
  expSummaryLabel(balanceRow, 'Total Balance:'); exp.getCell(balanceRow,1).font = BOLD;
  // Total Income / Total Due / Transfer from Admission Fee are shown only
  // on the Revenue sheet now, not duplicated here. Total Amount is the
  // one exception - it's kept as a reference row (pulled from the Revenue
  // sheet by formula) because Total Balance below is computed from it.
  const totalAmountRefRow = balanceRow+1;
  expSummaryLabel(totalAmountRefRow, 'Total Amount:'); exp.getCell(totalAmountRefRow,1).font = FONT;
  exp.getCell(totalAmountRefRow,3).value = {formula:`'Monthly Revenue'!D${totalAmountRow}`};
  exp.getCell(balanceRow,3).value = {formula:`C${totalAmountRefRow}-C${expTotalRow}`};
  const incomeRefRow = totalAmountRefRow;

  // All-border across header through Total Income row, full width - also
  // applies the Asian comma + 2-decimal format to every amount column
  // (3 = Total, 4+ = per-category); columns 1-2 (date/description) are
  // untouched.
  for(let rr=expHeaderRow; rr<=incomeRefRow; rr++){
    for(let cc=1; cc<=EXP_LAST_COL; cc++){
      exp.getCell(rr,cc).border = thin;
      if(!exp.getCell(rr,cc).font || !exp.getCell(rr,cc).font.name) exp.getCell(rr,cc).font = FONT;
      if(cc>=3) exp.getCell(rr,cc).numFmt = ASIAN_NUMFMT;
    }
  }

  // Balance Sheet block
  let bs = incomeRefRow+2;
  exp.getCell(bs,5).value = 'Balance Sheet'; exp.getCell(bs,5).font = BOLD;
  exp.mergeCells(bs,5,bs,15); exp.getCell(bs,5).alignment = {horizontal:'center'};
  bs++;
  exp.getCell(bs,5).value = 'Asset'; exp.getCell(bs,5).font = BOLD;
  exp.getCell(bs,10).value = 'Liabilities'; exp.getCell(bs,10).font = BOLD;
  const balanceSheetHeaderRow = bs;
  const assetStartRow = bs+1;
  const cashInHand = mlFig.cashInHandShown;
  const bankBalanceVal = mlFig.bankBalanceShown;
  const otherAsset = rec.balanceSheet.otherAsset || {label:'Debt to III Assets Ltd', amount:250000};

  exp.getCell(assetStartRow,5).value = 1; exp.getCell(assetStartRow,6).value = 'Cash in Hand'; exp.getCell(assetStartRow,9).value = Number(cashInHand)||0;
  exp.getCell(assetStartRow,10).value = 1; exp.getCell(assetStartRow,11).value = 'Equity';
  exp.getCell(assetStartRow+1,5).value = 2; exp.getCell(assetStartRow+1,6).value = 'Balance in Bank Account'; exp.getCell(assetStartRow+1,9).value = Number(bankBalanceVal)||0;
  exp.getCell(assetStartRow+1,10).value = 2; exp.getCell(assetStartRow+1,11).value = 'Advance Payment'; exp.getCell(assetStartRow+1,14).value = Number(rec.balanceSheet.advancePayment)||0;
  const gratuityColLetter = rev.getColumn(5 + REVENUE_CATS.findIndex(c=>c.key==='gratuity')).letter;
  const eduAssistColLetter = rev.getColumn(5 + REVENUE_CATS.findIndex(c=>c.key==='eduAssist')).letter;
  exp.getCell(assetStartRow+2,5).value = 3; exp.getCell(assetStartRow+2,6).value = 'Due Payment'; exp.getCell(assetStartRow+2,9).value = {formula:`'Monthly Revenue'!D${totalDueRow}`};
  exp.getCell(assetStartRow+2,10).value = 3; exp.getCell(assetStartRow+2,11).value = 'Gratuity Payable'; exp.getCell(assetStartRow+2,14).value = {formula:`'Monthly Revenue'!${gratuityColLetter}${yrtNewRow}`};
  exp.getCell(assetStartRow+3,5).value = 4; exp.getCell(assetStartRow+3,6).value = otherAsset.label||'Debt to III Assets Ltd'; exp.getCell(assetStartRow+3,9).value = Number(otherAsset.amount)||0;

  const eduAssistRow = assetStartRow+3;
  exp.getCell(eduAssistRow,10).value = 4; exp.getCell(eduAssistRow,11).value = 'Education Assistance Payable';
  exp.getCell(eduAssistRow,14).value = {formula:`'Monthly Revenue'!${eduAssistColLetter}${yrtNewRow}`};

  const totalRow = assetStartRow+4;
  exp.getCell(totalRow,5).value = 'Total'; exp.getCell(totalRow,5).font = BOLD;
  exp.getCell(totalRow,9).value = {formula:`SUM(I${assetStartRow}:I${assetStartRow+3})`};
  exp.getCell(totalRow,10).value = 'Total'; exp.getCell(totalRow,10).font = BOLD;
  exp.getCell(totalRow,14).value = {formula:`SUM(N${assetStartRow}:N${eduAssistRow})`};
  exp.getCell(assetStartRow,14).value = {formula:`I${totalRow}-N${assetStartRow+1}-N${assetStartRow+2}-N${eduAssistRow}`};

  // Balance Sheet block: all-border across its full data width (E:O)
  for(let rr=bs; rr<=totalRow; rr++){
    for(let cc=5; cc<=15; cc++){
      exp.getCell(rr,cc).border = thin;
      if(!exp.getCell(rr,cc).font || !exp.getCell(rr,cc).font.name) exp.getCell(rr,cc).font = FONT;
    }
  }
  // Only columns 9 (asset amount) and 14 (liability amount) hold money here -
  // column 5/10 are the plain 1/2/3/4 item numbers, which should stay as-is.
  for(let rr=assetStartRow; rr<=totalRow; rr++){
    exp.getCell(rr,9).numFmt = ASIAN_NUMFMT;
    exp.getCell(rr,14).numFmt = ASIAN_NUMFMT;
  }

  // Head-wise distribution of Balance in Account (left block) and Bank
  // Balance Breakdown (right block, next to it) - one blank line after the
  // Balance Sheet's own Total row, side by side.
  let hw = totalRow+2;
  const bbCol = 11; // Bank Balance Breakdown starts a few columns right of Head-wise
  exp.getCell(hw,5).value = 'Note: Head wise distribution of Balance in Account'; exp.getCell(hw,5).font = BOLD;
  exp.getCell(hw,bbCol).value = 'Bank Balance breakdown'; exp.getCell(hw,bbCol).font = BOLD;
  hw++;
  const hwStartRow = hw;
  exp.getCell(hw,5).value = 'Account Balance for Gratuity'; exp.getCell(hw,9).value = {formula:`N${assetStartRow+2}`};
  if(state.banks[0]){ exp.getCell(hw,bbCol).value = state.banks[0].name; exp.getCell(hw,bbCol+3).value = Number(mlFig.bankBreakdownShown[state.banks[0].id])||0; }
  hw++;
  exp.getCell(hw,5).value = 'Account Balance for Education Assistant Fund'; exp.getCell(hw,9).value = {formula:`N${eduAssistRow}`};
  if(state.banks[1]){ exp.getCell(hw,bbCol).value = state.banks[1].name; exp.getCell(hw,bbCol+3).value = Number(mlFig.bankBreakdownShown[state.banks[1].id])||0; }
  hw++;
  exp.getCell(hw,5).value = 'Remaining Balance'; exp.getCell(hw,9).value = {formula:`I${assetStartRow+1}-N${assetStartRow+2}-N${eduAssistRow}`}; const hwRemainRow = hw;
  state.banks.slice(2).forEach((b,i)=>{
    // extra banks beyond the first two just extend the breakdown block downward
    exp.getCell(hw+1+i,bbCol).value = b.name; exp.getCell(hw+1+i,bbCol+3).value = Number(mlFig.bankBreakdownShown[b.id])||0;
  });
  hw++;
  exp.getCell(hw,5).value = 'Total'; exp.getCell(hw,5).font = BOLD;
  exp.getCell(hw,9).value = {formula:`SUM(I${hwRemainRow-2}:I${hwRemainRow})`}; exp.getCell(hw,9).font = BOLD;
  const bbEndRow = Math.max(hw, hwStartRow + Math.max(state.banks.length,1) - 1);
  exp.getCell(bbEndRow,bbCol).value = exp.getCell(bbEndRow,bbCol).value || 'Total';
  exp.getCell(bbEndRow,bbCol+3).value = {formula:`SUM(${exp.getColumn(bbCol+3).letter}${hwStartRow}:${exp.getColumn(bbCol+3).letter}${bbEndRow-1})`};
  exp.getCell(bbEndRow,bbCol).font = BOLD; exp.getCell(bbEndRow,bbCol+3).font = BOLD;
  // Both side-by-side blocks bordered across whatever data they contain
  for(let rr=hw-4; rr<=Math.max(hw,bbEndRow); rr++){
    for(let cc=5; cc<=9; cc++){ exp.getCell(rr,cc).border = thin; if(!exp.getCell(rr,cc).font||!exp.getCell(rr,cc).font.name) exp.getCell(rr,cc).font = FONT; }
    for(let cc=bbCol; cc<=bbCol+3; cc++){ exp.getCell(rr,cc).border = thin; if(!exp.getCell(rr,cc).font||!exp.getCell(rr,cc).font.name) exp.getCell(rr,cc).font = FONT; }
  }
  // Only column 9 (head-wise amount) and bbCol+3 (bank breakdown amount) hold
  // money in this block - column 5/bbCol are labels/bank names.
  for(let rr=hw-4; rr<=Math.max(hw,bbEndRow); rr++){
    exp.getCell(rr,9).numFmt = ASIAN_NUMFMT;
    exp.getCell(rr,bbCol+3).numFmt = ASIAN_NUMFMT;
  }

  // User-added extra rows (green/yellow), each mapped to a figure already
  // computed for this month - written directly below the Balance Sheet
  // block, filled with the same colour chosen for it in the app.
  if(rec.customRows && rec.customRows.length){
    let cr = Math.max(hw, bbEndRow) + 2;
    exp.getCell(cr,6).value = 'Extra rows'; exp.getCell(cr,6).font = BOLD; cr++;
    rec.customRows.forEach(row=>{
      const val = mlFig.customRowValues[row.id]||0;
      const fillColor = row.color==='green' ? 'FFC6E9C6' : 'FFFCF3A1';
      exp.getCell(cr,6).value = row.label||'';
      exp.getCell(cr,9).value = val;
      exp.getCell(cr,9).numFmt = ASIAN_NUMFMT;
      [6,7,8,9].forEach(col=>{ exp.getCell(cr,col).fill = {type:'pattern', pattern:'solid', fgColor:{argb:fillColor}}; });
      cr++;
    });
  }

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${monthKeyLabel(key).replace(/\s+/g,'_')}_Madrasa_Account.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}

            ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0'); return `<option value="${v}" ${searchFilters.month===v?'selected':''}>${m}</option>`;}).join('')}
          </select>
        </div>
        <div class="field" style="min-width:150px;">
          <label>Group results by</label>
          <select id="srch-group">
            <option value="" ${searchFilters.groupBy===''?'selected':''}>No grouping</option>
            <option value="month" ${searchFilters.groupBy==='month'?'selected':''}>By month</option>
            <option value="year" ${searchFilters.groupBy==='year'?'selected':''}>By year</option>
          </select>
        </div>
      </div>
      <div class="row" style="flex-wrap:wrap;">
        <div class="field"><label>From date <span class="tag">optional</span></label><input type="date" id="srch-from" value="${searchFilters.fromDate}"></div>
        <div class="field"><label>To date <span class="tag">optional</span></label><input type="date" id="srch-to" value="${searchFilters.toDate}"></div>
        <div class="field"><label>Min amount <span class="tag">optional</span></label><input type="text" inputmode="decimal" class="amt-input" id="srch-min" value="${searchFilters.minAmt!==''?formatAsianAmount(searchFilters.minAmt):''}"></div>
        <div class="field"><label>Max amount <span class="tag">optional</span></label><input type="text" inputmode="decimal" class="amt-input" id="srch-max" value="${searchFilters.maxAmt!==''?formatAsianAmount(searchFilters.maxAmt):''}"></div>
      </div>
      <div class="field">
        <label>Description or voucher text</label>
        <input type="text" id="srch-text" placeholder="e.g. warranty, pure it kit, misc18/6/26" value="${escapeHtml(searchFilters.text)}">
        <span class="tag" style="margin-top:4px; display:inline-block;">Doesn't need to be exact - order and small typos/spelling are forgiven; each word just needs to appear somewhere in the description, voucher no. or note</span>
      </div>
      <div class="settings-panel-group" style="margin-top:12px;">
        <div class="settings-panel-label">Synonym groups <span class="tag">optional</span></div>
        <p class="subnote" style="margin-top:0;">Words you group together here are treated as the same word when searching - e.g. group "microbus, gari, vehicle" so any of those three finds the same entries. Type words separated by commas, one group at a time.</p>
        <div class="row" style="align-items:flex-end; gap:10px; flex-wrap:wrap;">
          <div class="field" style="flex:1 1 260px;">
            <label>New group (comma-separated words)</label>
            <input type="text" id="syn-new-group" placeholder="e.g. microbus, gari, vehicle">
          </div>
          <button class="secondary" type="button" id="syn-add-group-btn">&#10133; Add group</button>
        </div>
        <div id="syn-group-list" style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
          ${(state.synonymGroups||[]).map((g,gi)=>`
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <span class="tag" style="padding:4px 10px;">${g.map(w=>escapeHtml(w)).join(' = ')}</span>
              <button type="button" class="danger small" data-action="delete-synonym-group" data-idx="${gi}" title="Delete this group" style="padding:1px 8px;">&times;</button>

          `).join('')}
        </div>
      </div>
      <div class="row" style="justify-content:flex-end; gap:8px;">
        <button type="button" class="secondary" id="srch-ai-btn">&#10024; AI Search <span class="tag">works inside Claude.ai only</span></button>
        <button type="button" class="secondary" id="srch-export-btn">&#128190; Export this search to Excel</button>
      </div>
      <div id="srch-ai-results"></div>
      <div id="srch-results"></div>
    </div>
  `);
  function drawResults(){
    const box = card.querySelector('#srch-results');
    const results = filteredVouchers(searchFilters, searchList);
    const total = results.reduce((s,v)=>s+v.amount,0);
    box.innerHTML = '';
    box.appendChild(el(`<div class="computed total"><span class="lbl">${results.length} voucher${results.length===1?'':'s'} found</span><span>${money(total)}</span></div>`));
    if(results.length===0){
      box.appendChild(el(`<p class="empty">No matching vouchers.</p>`));
      return;
    }
    // Quick per-year totals strip - shows automatically whenever the
    // results span more than one year, regardless of the Group-by
    // dropdown, so a multi-year search always gives an at-a-glance
    // breakdown next to the grand total without needing to set anything.
    const yearTotals = groupSum(results, v=>v.date.slice(0,4), key=>key);
    if(yearTotals.length>1){
      box.appendChild(el(`
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px;">
          ${yearTotals.map(y=>`
            <div style="display:flex; align-items:center; gap:7px; padding:5px 10px; border:1px solid var(--line-soft); border-radius:8px; background:#fff; font-size:12.5px;">
              <span style="font-weight:600;">${escapeHtml(y.label)}</span>
              <span class="mono">${money(y.total)}</span>
            </div>
          `).join('')}
        </div>
      `));
    }
    if(searchFilters.groupBy==='month' || searchFilters.groupBy==='year'){
      const groupBy = searchFilters.groupBy;
      const keyFn = groupBy==='year' ? (v=>v.date.slice(0,4)) : (v=>v.date.slice(0,7));
      const labelFn = key => {
        if(groupBy==='year') return key;
        const [y,m] = key.split('-');
        return `${MONTHS[Number(m)-1]} ${y}`;
      };
      const groups = groupSum(results, keyFn, labelFn);
      const groupTable = el(`
        <div style="overflow-x:auto; margin-top:10px;">
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
              <th style="padding:6px 8px;">${groupBy==='year'?'Year':'Month'}</th>
              <th style="padding:6px 8px; text-align:right;">Vouchers</th>
              <th style="padding:6px 8px; text-align:right;">Total</th>
            </tr></thead>
            <tbody>
              ${groups.map(g=>{
                const count = results.filter(v=>keyFn(v)===g.key).length;
                return `<tr style="border-bottom:1px solid var(--line-soft);">
                  <td style="padding:6px 8px;">${escapeHtml(g.label)}</td>
                  <td style="padding:6px 8px; text-align:right;">${count}</td>
                  <td style="padding:6px 8px; text-align:right;" class="mono">${money(g.total)}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `);
      box.appendChild(groupTable);
    }
    const table = el(`
      <div style="overflow-x:auto; margin-top:10px;">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
            <th style="padding:6px 8px;">Date</th>
            <th style="padding:6px 8px;">Category</th>
            <th style="padding:6px 8px;">Voucher</th>
            <th style="padding:6px 8px;">Description</th>
            <th style="padding:6px 8px;">Internal note</th>
            <th style="padding:6px 8px; text-align:right;">Amount</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `);
    const tbody = table.querySelector('tbody');
    results.slice().forEach(v=>{
      tbody.appendChild(el(`
        <tr style="border-bottom:1px solid var(--line-soft);">
          <td style="padding:6px 8px; white-space:nowrap;" class="mono">${voucherDateLabel(v)}</td>
          <td style="padding:6px 8px;">${escapeHtml(v.cat.label)}</td>
          <td style="padding:6px 8px;" class="mono">${highlightMatches(v.voucher, searchFilters.text)}</td>
          <td style="padding:6px 8px;">${highlightMatches(v.desc, searchFilters.text)}</td>
          <td style="padding:6px 8px; color:var(--ink-soft); font-size:12.5px;">${v.note?highlightMatches(v.note, searchFilters.text):''}</td>
          <td style="padding:6px 8px; text-align:right;" class="mono">${money(v.amount)}</td>
        </tr>
      `));
    });
    box.appendChild(table);
  }
  drawResults();
  card.querySelector('#srch-export-btn').onclick = ()=>{
    const results = filteredVouchers(searchFilters, searchList);
    exportSearchResults(searchFilters, results, searchCatList);
  };
  card.querySelector('#syn-add-group-btn').onclick = ()=>{
    const inp = card.querySelector('#syn-new-group');
    const words = inp.value.split(',').map(w=>w.trim()).filter(Boolean);
    if(words.length<2){ showAlert('Type at least two words separated by commas (e.g. microbus, gari, vehicle).'); return; }
    state.synonymGroups = state.synonymGroups || [];
    state.synonymGroups.push(words);
    saveState();
    inp.value = '';
    render();
  };
  const aiBtn = card.querySelector('#srch-ai-btn');
  const aiResultsBox = card.querySelector('#srch-ai-results');
  aiBtn.onclick = async ()=>{
    const q = (card.querySelector('#srch-text').value||'').trim();
    if(!q){ showAlert('Type what you\u2019re looking for in the Description/voucher text box first.'); return; }
    const nonTextFilters = Object.assign({}, searchFilters, {text:''});
    const candidates = filteredVouchers(nonTextFilters, searchList);
    if(!candidates.length){ showAlert('No entries match the other filters (category/date/amount) to search within.'); return; }
    aiBtn.disabled = true;
    const originalLabel = aiBtn.innerHTML;
    aiBtn.innerHTML = '&#8987; Asking AI\u2026';
    aiResultsBox.innerHTML = '';
    try{
      const matches = await aiSearchVouchers(q, candidates);
      const total = matches.reduce((s,v)=>s+v.amount,0);
      const cappedNote = candidates.length>AI_SEARCH_CANDIDATE_CAP
        ? `<p class="subnote">Only the ${AI_SEARCH_CANDIDATE_CAP} most recent matching entries were considered - narrow with Category/Year/Month above for a more precise AI search.</p>` : '';
      if(!matches.length){
        aiResultsBox.innerHTML = `<div class="card" style="background:#F6F3EA;"><h4 style="margin-top:0;">&#10024; AI Search</h4><p class="empty">AI didn't find anything it's confident is related to "${escapeHtml(q)}".</p>${cappedNote}</div>`;
      } else {
        const box2 = el(`
          <div class="card" style="background:#F6F3EA;">
            <h4 style="margin-top:0;">&#10024; AI Search &mdash; ${matches.length} possible match${matches.length===1?'':'es'}</h4>
            <p class="subnote">These may use different wording than "${escapeHtml(q)}" but are what AI judged as related - double-check before relying on them.</p>
            ${cappedNote}
            <div class="computed total"><span class="lbl">Total</span><span>${money(total)}</span></div>
            <div style="overflow-x:auto; margin-top:8px;">
              <table style="width:100%; border-collapse:collapse; font-size:13px;">
                <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
                  <th style="padding:6px 8px;">Date</th>
                  <th style="padding:6px 8px;">Category</th>
                  <th style="padding:6px 8px;">Voucher</th>
                  <th style="padding:6px 8px;">Description</th>
                  <th style="padding:6px 8px; text-align:right;">Amount</th>
                </tr></thead>
                <tbody>
                  ${matches.slice().reverse().map(v=>`
                    <tr style="border-bottom:1px solid var(--line-soft);">
                      <td style="padding:6px 8px; white-space:nowrap;" class="mono">${voucherDateLabel(v)}</td>
                      <td style="padding:6px 8px;">${escapeHtml(v.cat.label)}</td>
                      <td style="padding:6px 8px;" class="mono">${escapeHtml(v.voucher)}</td>
                      <td style="padding:6px 8px;">${escapeHtml(v.desc)}</td>
                      <td style="padding:6px 8px; text-align:right;" class="mono">${money(v.amount)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `);
        aiResultsBox.innerHTML = '';
        aiResultsBox.appendChild(box2);
      }
    }catch(e){
      aiResultsBox.innerHTML = `<div class="card" style="background:#FBEAEA;"><h4 style="margin-top:0;">&#10024; AI Search unavailable</h4><p class="subnote">AI Search only works while this file is open inside a Claude.ai chat - it couldn't be reached just now, which usually means this copy is running outside Claude.ai (e.g. from GitHub Pages or a downloaded file). Try again from within Claude.ai, or use the keyword search above (with Synonym groups) instead.</p></div>`;
    }finally{
      aiBtn.disabled = false;
      aiBtn.innerHTML = originalLabel;
    }
  };
  card.querySelector('#srch-cat').onchange = (e)=>{ searchFilters.catKey = e.target.value; drawResults(); };
  card.querySelector('#srch-year').onchange = (e)=>{ searchFilters.year = e.target.value; drawResults(); };
  card.querySelector('#srch-month').onchange = (e)=>{ searchFilters.month = e.target.value; drawResults(); };
  card.querySelector('#srch-group').onchange = (e)=>{ searchFilters.groupBy = e.target.value; drawResults(); };
  card.querySelector('#srch-from').onchange = (e)=>{ searchFilters.fromDate = e.target.value; drawResults(); };
  card.querySelector('#srch-to').onchange = (e)=>{ searchFilters.toDate = e.target.value; drawResults(); };
  card.querySelector('#srch-text').oninput = (e)=>{ searchFilters.text = e.target.value; drawResults(); };
  wireAmountInput(card.querySelector('#srch-min'), (num)=>{ searchFilters.minAmt = num||''; drawResults(); });
  wireAmountInput(card.querySelector('#srch-max'), (num)=>{ searchFilters.maxAmt = num||''; drawResults(); });
  return card;
}

    summaryFilters.catKeys = [catList[0].key];
