          ${sections.length>1?`<span class="mono" style="font-size:11px;color:var(--ink-soft);width:16px;">${idx+1}.</span>`:''}
          <div class="field desc" style="margin-bottom:0;"><label>Description</label><input type="text" class="settle-sec-desc" list="settle-desc-suggest" autocomplete="off" value="${escapeHtml(sec.desc)}"></div>
          <div class="field amt" style="margin-bottom:0;"><label>Amount</label><input type="text" inputmode="decimal" class="settle-sec-amt" placeholder="e.g. 930 or 1000-70" value="${sec.amount?formatAsianAmount(sec.amount):''}"></div>
          ${sections.length>1?`<button class="danger small" type="button" title="Remove">&times;</button>`:''}
        </div>
      `);
      const descInp = row.querySelector('.settle-sec-desc');
      wireLockableTextInput(descInp);
      descInp.oninput = ()=>{ sec.desc = descInp.value; };
      wireAmountInput(row.querySelector('.settle-sec-amt'), (num)=>{ sec.amount = num; updatePreview(); });
      const removeBtn = row.querySelector('button.danger');
      if(removeBtn) removeBtn.onclick = ()=>{ sections = sections.filter(x=>x!==sec); renderSections(); updatePreview(); };
      sectionsBox.appendChild(row);
    });
  }
  renderSections();
  overlay.querySelector('#settle-add-section').onclick = ()=>{
    sections.push({desc:'', amount:0});
    renderSections();
    const lastDesc = sectionsBox.querySelectorAll('.settle-sec-desc');
    lastDesc[lastDesc.length-1].focus();
  };

  wireAmountInput(returnInput, (num)=>{ returnedVal = num; updatePreview(); });

  function updatePreview(){
    const spent = totalSpent();
    const returned = returnedVal;
    if(!spent || spent<=0){ preview.textContent=''; returnWrap.style.display='none'; return; }
    if(!catSelect.value){ preview.textContent = 'Pick a category to see what this will record.'; returnWrap.style.display='none'; return; }
    const catLabel = COA.find(c=>c.key===catSelect.value).label;
    const balanceAfterSpend = item.amount - spent;
    if(balanceAfterSpend<=0){
      returnWrap.style.display='none';
      preview.textContent = spent>item.amount
        ? `Records ${money(spent)} under ${catLabel} and fully closes this IOU. The extra ${money(spent-item.amount)} is more than the IOU covered &mdash; it'll be tracked as an amount owed back to them until it's paid out.`
        : `Records ${money(spent)} under ${catLabel} and fully closes this IOU.`;
      return;
    }
    returnWrap.style.display='block';
    const remaining = balanceAfterSpend - returned;
    if(returned>0 && remaining<=0){
      preview.textContent = `Records ${money(spent)} under ${catLabel}, plus ${money(returned)} received back in cash. Fully closes this IOU.`;
    } else if(returned>0){
      preview.textContent = `Records ${money(spent)} under ${catLabel}, plus ${money(returned)} received back in cash. Remaining ${money(remaining)} still carries forward.`;
    } else {
      preview.textContent = `Records ${money(spent)} under ${catLabel}. Remaining ${money(balanceAfterSpend)} still owed and carries forward from ${dayLabel(day.date)}.`;
    }
  }
  catSelect.addEventListener('change', updatePreview);

  const reduceIou = (settledAmount)=>{
    const remaining = Math.max(0, item.amount - settledAmount);
    if(item.fromDate===day.date){
      /* Never carried forward yet - safe to edit the record in place. */
      if(remaining<=0){
        const idx = state.iouRegistry.findIndex(x=>x.id===item.id);
        state.iouRegistry = state.iouRegistry.filter(x=>x.id!==item.id);
        return ()=>{ state.iouRegistry.splice(idx,0,item); };
      } else {
        const prevAmount = item.amount;
        item.amount = remaining;
        return ()=>{ item.amount = prevAmount; };
      }
    } else {
      /* Has carried-forward history - close the original as of yesterday
         so earlier days keep showing the original amount, and open a
         fresh record from today for any remaining balance. */
      const prevToDate = item.toDate;
      item.toDate = addDaysStr(day.date, -1);
      let newItem = null;
      if(remaining>0){
        newItem = {id:uid(), desc:item.desc, amount:remaining, fromDate:day.date, toDate:null};
        state.iouRegistry.push(newItem);
      }
      return ()=>{
        item.toDate = prevToDate;
        if(newItem) state.iouRegistry = state.iouRegistry.filter(x=>x.id!==newItem.id);
      };
    }
  };

  const doSettle = ()=>{
    const catKey = catSelect.value;
    if(!catKey){ errBox.textContent = 'Select an expense category first - settling needs to know where this money was actually spent.'; catSelect.focus(); return; }
    const validSections = sections.filter(s=>(Number(s.amount)||0)>0);
    if(validSections.length===0){ errBox.textContent = 'Enter a positive amount in at least one section.'; return; }
    if(validSections.some(s=>!s.desc.trim())){ errBox.textContent = 'Every section with an amount needs a description.'; return; }
    const spent = validSections.reduce((s,sec)=>s+(Number(sec.amount)||0), 0);
    const returned = Math.max(0, returnedVal);
    const overage = Math.max(0, spent - item.amount);

    const voucher = addCoaVoucher(day, catKey);
    voucher.sections = validSections.map(s=>({id:uid(), desc:s.desc.trim(), amount:Number(s.amount)||0}));
    syncCoaItemFromSections(voucher);
    const prevRevenue = day.serviceRevenue;
    if(returned>0) day.serviceRevenue = (Number(day.serviceRevenue)||0) + returned;
    const undoIou = reduceIou(spent + returned);

    let newPayable = null;
    if(overage>0){
      const desc = validSections.map(s=>s.desc.trim()).join(', ');
      newPayable = {id:uid(), desc, amount:overage, fromDate:day.date, toDate:null};
      state.payableRegistry.push(newPayable);
    }

    pushUndo('IOU settlement undone.', ()=>{
      day.coa[catKey] = day.coa[catKey].filter(x=>x.id!==voucher.id);
      day.serviceRevenue = prevRevenue;
      undoIou();
      if(newPayable) state.payableRegistry = state.payableRegistry.filter(x=>x.id!==newPayable.id);
    });
    saveState();
    overlay.remove();
    render();
  };
  confirmBtn.onclick = doSettle;
  cancelBtn.onclick = ()=> overlay.remove();
  returnInput.onkeydown = (e)=>{ if(e.key==='Enter') doSettle(); };
  wireBackdropClose(overlay);
  setTimeout(()=>{ const first = sectionsBox.querySelector('.settle-sec-amt'); if(first) first.focus(); }, 30);
}

function showPasswordPrompt(message, onConfirm, confirmText='Unlock', hashToCheck){
  if(hashToCheck===undefined) hashToCheck = state.lockPasswordHash;
  if(!hashToCheck){ showConfirm(message, onConfirm, confirmText); return; }
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <input type="password" id="pw-prompt-input" autocomplete="current-password" placeholder="Password" style="margin:2px 0 4px;">
        <div id="pw-prompt-error" style="color:var(--danger); font-size:12.5px; margin:-2px 0 8px; min-height:1em;"></div>
        <div class="modal-actions">
          <button class="secondary" type="button">Cancel</button>
          <button class="danger" type="button">${escapeHtml(confirmText)}</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#pw-prompt-input');
  wirePasswordToggle(input);
  const errorEl = overlay.querySelector('#pw-prompt-error');
  const buttons = overlay.querySelectorAll('.modal-actions button');
  const cancelBtn = buttons[0], confirmBtn = buttons[1];
  const attempt = async ()=>{
    const hash = await sha256Hex(input.value||'');
    if(hash === hashToCheck){
      overlay.remove();
      onConfirm();
    } else {
      errorEl.textContent = 'Incorrect password.';
      input.value = '';
      input.focus();
    }
  };
  confirmBtn.onclick = attempt;
  cancelBtn.onclick = ()=> overlay.remove();
  input.onkeydown = (e)=>{ if(e.key==='Enter') attempt(); };
  wireBackdropClose(overlay);
  setTimeout(()=>input.focus(), 30);
}

/* ======================================================================
   Rendering
   ====================================================================== */
function render(){
  const scrollY = window.scrollY;
  const mlBody = document.getElementById('ml-floating-body');
  const mlScrollTop = mlBody ? mlBody.scrollTop : null;
  renderApp();
  /* Restore scroll position after the rebuild, instantly - the page has
     html{scroll-behavior:smooth}, which would otherwise animate this
     restore into a visible slide. behavior:'instant' overrides that for
     just this call. Done now (in case the browser already clamped it
     synchronously) and again on the next frame (in case the clamp/
     re-layout happens after paint) - without fighting any deliberate
     scrollIntoView a caller does right after render(). */
  if(window.scrollY !== scrollY) window.scrollTo({top:scrollY, left:0, behavior:'instant'});
  const restoreMlScroll = ()=>{
    if(mlScrollTop===null) return;
    const freshBody = document.getElementById('ml-floating-body');
    if(freshBody && freshBody.scrollTop !== mlScrollTop) freshBody.scrollTop = mlScrollTop;
  };
  restoreMlScroll();
  requestAnimationFrame(()=>{
    if(window.scrollY !== scrollY) window.scrollTo({top:scrollY, left:0, behavior:'instant'});
    restoreMlScroll();
  });
}
function renderApp(){
  /* Build into a detached fragment and swap it in with ONE DOM mutation
     (replaceChildren) instead of clearing #app (innerHTML='') and then
     re-appending piece by piece. The old clear-then-rebuild approach
     made the page's height collapse to ~0 for a moment, which made the
     browser (or the outer page, if this is running in an auto-sizing
     iframe/artifact preview) clamp scroll to the top; swapping the
     whole subtree in one step avoids that empty in-between state. */
  const app = document.createDocumentFragment();
  const shellEl = document.getElementById('app-shell');
  if(vaultLocked || (state.lockPasswordHash && locked)){
    // Screen is locked - no nav needed until it's unlocked, and no reason
    // to leave the sidebar's fixed-width gutter reserved on desktop.
    shellEl.classList.add('no-sidebar');
    document.getElementById('app-sidebar').replaceChildren();
  } else {
    shellEl.classList.remove('no-sidebar');
    const sidebarEl = document.getElementById('app-sidebar');
    sidebarEl.classList.toggle('open', sidebarOpen);
    sidebarEl.replaceChildren(renderSidebar());
    document.getElementById('sidebar-overlay').classList.toggle('open', sidebarOpen);
  }
  if(vaultLocked){
    app.appendChild(renderVaultUnlockScreen());
    document.getElementById('app').replaceChildren(app);
    return;
  }
  if(state.lockPasswordHash && locked){
    app.appendChild(renderLockScreen());
    document.getElementById('app').replaceChildren(app);
    return;
  }
  if(!state.setupDone){
    app.appendChild(renderHeader());
    if(passwordFormOpen) app.appendChild(renderPasswordForm());
    if(dayLockPasswordFormOpen) app.appendChild(renderDayLockPasswordForm());
    if(monthLockPasswordFormOpen) app.appendChild(renderMonthLockPasswordForm());
    if(securityFormOpen) app.appendChild(renderSecurityQuestionForm());
    if(vaultSetupFormOpen && !vaultEnabled) app.appendChild(renderVaultSetupForm());
    app.appendChild(renderSetup());
    document.getElementById('app').replaceChildren(app);
    return;
  }
  app.appendChild(renderHeader());
  if(passwordFormOpen) app.appendChild(renderPasswordForm());
  if(dayLockPasswordFormOpen) app.appendChild(renderDayLockPasswordForm());
  if(monthLockPasswordFormOpen) app.appendChild(renderMonthLockPasswordForm());
  if(securityFormOpen) app.appendChild(renderSecurityQuestionForm());
  if(vaultSetupFormOpen && !vaultEnabled) app.appendChild(renderVaultSetupForm());
  // A sidebar section that's currently a stale key (its flag got cleared
  // some other way) shouldn't strand the user on a blank page - fall back
  // to Home in that case.
  if(viewingPanel){
    const p = panelInfo(viewingPanel);
    if(!p || !p[1]()) viewingPanel = null;
  }
  if(viewingPanel){
    app.appendChild(renderPanelPage(viewingPanel));
  } else {
    app.appendChild(renderMainViewTabs());
    if(monthlyLedgerOpen){
      app.appendChild(renderMonthlyLedgerWindow());
    } else {
      app.appendChild(renderDayTabs());
      const computed = computeAll();
      if(state.days.length===0){
        app.appendChild(el(`<div class="card"><p class="empty">No days added yet. Click "+ Add day" above to start entering the first day of ${state.month} ${state.year}.</p></div>`));
      } else {
        if(!selectedDayId || !findDay(selectedDayId)){
          const todayDay = state.days.find(d=>d.date===todayDateStr());
          selectedDayId = todayDay ? todayDay.id : state.days[state.days.length-1].id;
        }
        app.appendChild(renderDayPanel(selectedDayId, computed));
        app.appendChild(renderNotesheetCard());
        app.appendChild(renderDepositNotesheetCard());
        app.appendChild(el(`
          <div class="card" id="section-monthly-ledger-launch">
            <h3><span class="num">&#128220;</span> Monthly Ledger</h3>
            <p class="subnote">Pulls together this month's Revenue, Expenditure and Balance Sheet in one place — Withdraw Notesheet totals feed the Expenditure columns automatically, and Deposit Notesheet totals feed Revenue, so most of it fills itself in as you generate notesheets above.</p>
            <button type="button" data-action="toggle-monthly-ledger">Go to Monthly Ledger tab</button>
            <button type="button" class="secondary" data-action="toggle-ml-settings" style="margin-left:8px;">&#9881; Data Links &amp; Export Format</button>
          </div>
        `));
        app.appendChild(renderAnnualSummaryCard());
      }
    }
  }
  app.appendChild(renderFooter());
  if(mlSettingsOpen) app.appendChild(renderMlSettingsModal());
  if(lastUndo) app.appendChild(renderUndoToast());
  if(duplicateWarning) app.appendChild(renderDuplicateWarningToast());
  document.getElementById('app').replaceChildren(app);
}

  return el(`

function renderSidebar(){

          <label>New encryption passphrase</label>
          <input type="password" id="vault-new" autocomplete="new-password">
        </div>

          <input type="password" id="vault-confirm" autocomplete="new-password">

    if(a!==b){ errBox.textContent = 'Passphrases do not match.'; return; }
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));

        <button type="button" id="unlock-btn">${lockScreenChangeMode ? 'Change password &amp; unlock' : 'Unlock'}</button>
        <div style="margin-top:10px;text-align:center;">
          ${state.securityAnswerHash ? `<button class="secondary small" type="button" id="unlock-toggle-change">${lockScreenChangeMode ? 'Back to unlock' : 'Change password instead'}</button>` : ''}
        </div>
        <div class="divider"></div>
        <p class="subnote" style="margin-bottom:10px;">Forgotten the password? There's no reset here &mdash; the only way back in is a backup file exported earlier.</p>

        <input type="file" id="lock-import-file-input" accept="application/json,.json" style="display:none;">
      </div>
    </div>
  `);
  const pwInp = wrap.querySelector('#unlock-pw');
  wirePasswordToggle(pwInp);
  const secAnsInp = wrap.querySelector('#unlock-secanswer');
  const newPwInp = wrap.querySelector('#unlock-newpw');
  const newPwConfirmInp = wrap.querySelector('#unlock-newpw-confirm');
  if(secAnsInp) wirePasswordToggle(secAnsInp);
  if(newPwInp) wirePasswordToggle(newPwInp);
  if(newPwConfirmInp) wirePasswordToggle(newPwConfirmInp);
  const doUnlock = async ()=>{
    const hash = await sha256Hex(pwInp.value);
    if(hash === state.lockPasswordHash){
      locked = false;
      lockError = '';
      lockScreenChangeMode = false;
      render();
    } else {
      lockError = 'Incorrect password.';
      render();
    }
  };
  const doChange = async ()=>{
    const curHash = await sha256Hex(pwInp.value||'');
    if(curHash !== state.lockPasswordHash){ lockError = 'Current password is incorrect.'; render(); return; }
    if(!(await verifySecurityAnswer(secAnsInp.value))){ lockError = 'Security answer is incorrect.'; render(); return; }
    const a = newPwInp.value, b = newPwConfirmInp.value;
    if(!a){ lockError = 'Enter a new password.'; render(); return; }
    if(a.length<4){ lockError = 'Use at least 4 characters.'; render(); return; }
    if(a!==b){ lockError = 'New passwords do not match.'; render(); return; }
    state.lockPasswordHash = await sha256Hex(a);
    locked = false;
    lockError = '';
    lockScreenChangeMode = false;
    await saveState();
    render();
    showAlert('Password changed.');
  };
  wrap.querySelector('#unlock-btn').onclick = ()=>{ lockScreenChangeMode ? doChange() : doUnlock(); };
  pwInp.onkeydown = (e)=>{ if(e.key==='Enter' && !lockScreenChangeMode) doUnlock(); };
  const toggleBtn = wrap.querySelector('#unlock-toggle-change');
  if(toggleBtn) toggleBtn.onclick = ()=>{ lockScreenChangeMode = !lockScreenChangeMode; lockError = ''; render(); };
  const importFileInput = wrap.querySelector('#lock-import-file-input');
  wrap.querySelector('#lock-import-backup').onclick = ()=>importFileInput.click();
  importFileInput.onchange = ()=>{
    const file = importFileInput.files[0];
    if(file) importBackupJson(file);
    importFileInput.value = '';
  };
  setTimeout(()=>pwInp.focus(), 0);
  return wrap;
}

   is locked - i.e. the saved data is encrypted and hasn't been decrypted
   yet this session. Distinct from renderLockScreen() above (that's just
   a screen lock over already-readable data; this is the real thing). */
function renderVaultUnlockScreen(){
  const wrap = el(`
    <div class="lock-screen">
      <div class="lock-card">
        <div class="lock-icon">&#128272;</div>
        <div class="eyebrow">Financial Administration &middot; International Islamic Institute</div>
        <h1>Data Encrypted</h1>
        <p class="subnote">This ledger's saved data is encrypted. Enter the encryption passphrase to open it.</p>
        <div class="field">
          <label>Encryption passphrase</label>
          <input type="password" id="vault-unlock-pw" autocomplete="current-password">
        </div>
        <div id="vault-unlock-error" style="color:var(--danger); font-size:12.5px; margin:-4px 0 10px;">${escapeHtml(vaultError)}</div>
        <button type="button" id="vault-unlock-btn">Unlock</button>
        <div class="divider"></div>
        <p class="subnote" style="margin-bottom:10px;">Forgotten the passphrase? There's no reset &mdash; the data cannot be decrypted without it. If you have an older unencrypted (or differently-encrypted) backup file, you can import that instead; it will replace what's here.</p>
        <button class="secondary small" type="button" id="vault-lock-import-backup" style="width:100%;">Import a backup file instead</button>
        <input type="file" id="vault-lock-import-file-input" accept="application/json,.json" style="display:none;">
      </div>
    </div>
  `);
  const pwInp = wrap.querySelector('#vault-unlock-pw');
  wirePasswordToggle(pwInp);
  const doUnlock = async ()=>{
    const ok = await attemptVaultUnlock(pwInp.value);
    if(ok){ vaultError=''; render(); }
    else { vaultError = 'Incorrect passphrase, or the data is corrupted.'; render(); }
  };
  wrap.querySelector('#vault-unlock-btn').onclick = doUnlock;
  pwInp.onkeydown = (e)=>{ if(e.key==='Enter') doUnlock(); };
  const importFileInput = wrap.querySelector('#vault-lock-import-file-input');
  wrap.querySelector('#vault-lock-import-backup').onclick = ()=>importFileInput.click();
  importFileInput.onchange = ()=>{
    const file = importFileInput.files[0];
    if(file) importBackupJson(file);
    importFileInput.value = '';
  };
  setTimeout(()=>pwInp.focus(), 0);
  return wrap;
}

function renderDayTabs(){
  const wrap = el(`<div></div>`);
  const row = el(`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;"></div>`);

  // Group days by month so the tabs/jump list only ever shows ONE month's
  // days, however many months' worth have piled up in state.days overall
  // (which is one continuous, never-reset list across every month).
  const monthKeys = [...new Set(state.days.map(d=>d.date ? d.date.slice(0,7) : null).filter(Boolean))].sort();
  const liveKey = monthKeyFor(state.month, state.year);
  const selectedDay = findDay(selectedDayId);
  if(!dayTabsViewMonth || !monthKeys.includes(dayTabsViewMonth)){
    if(selectedDay && selectedDay.date && monthKeys.includes(selectedDay.date.slice(0,7))){
      dayTabsViewMonth = selectedDay.date.slice(0,7); // keep whatever day is already open in view
    } else {
      dayTabsViewMonth = monthKeys.includes(liveKey) ? liveKey : (monthKeys[monthKeys.length-1] || liveKey);
    }
  }
  const visibleDays = state.days.filter(d=>d.date && d.date.slice(0,7)===dayTabsViewMonth);

  if(monthKeys.length>1){
    const monthSel = el(`
      <select style="flex:none;font-size:12.5px;font-family:'IBM Plex Mono',monospace;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-weight:600;">
        ${monthKeys.map(k=>`<option value="${k}" ${k===dayTabsViewMonth?'selected':''}>${monthKeyLabel(k)}</option>`).join('')}
      </select>
    `);
    monthSel.onchange = ()=>{
      dayTabsViewMonth = monthSel.value;
      const inMonth = state.days.filter(d=>d.date && d.date.slice(0,7)===dayTabsViewMonth);
      if(inMonth.length){
        const sorted = [...inMonth].sort((a,b)=> (a.date||'') < (b.date||'') ? -1 : 1);
        selectedDayId = sorted[sorted.length-1].id; // land on that month's last day
      }
      render();
    };
    row.appendChild(monthSel);
  }

  const tabs = el(`<div class="day-tabs" style="margin-bottom:0;flex:1 1 auto;min-width:0;"></div>`);
  visibleDays.forEach(d=>{
    tabs.appendChild(el(`<div class="day-tab ${d.id===selectedDayId?'active':''}" data-action="select-day" data-day="${d.id}">${dayLabel(d.date)}</div>`));
  });
  tabs.appendChild(el(`<button class="secondary small" style="flex:none;" data-action="add-day">+ Add day</button>`));
  // "Jump to day" - lets you land on any date in this month directly
  // instead of having to scroll the day-tabs strip to find it.
  if(visibleDays.length>1){
    const sortedDays = [...visibleDays].sort((a,b)=> (a.date||'') < (b.date||'') ? -1 : 1);
    const jump = el(`
      <select style="flex:none;font-size:12.5px;font-family:'IBM Plex Mono',monospace;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);">
        <option value="">Jump to day&hellip;</option>
        ${sortedDays.map(d=>`<option value="${d.id}" ${d.id===selectedDayId?'selected':''}>${dayLabel(d.date)}</option>`).join('')}
      </select>
    `);
    jump.onchange = ()=>{
      if(jump.value){ selectedDayId = jump.value; render(); }
    };
    row.appendChild(jump);
  }
  row.appendChild(tabs);
  wrap.appendChild(row);
  // Jump straight to the active (current) day tab instead of leaving the
  // strip scrolled to the start of the month - the days you actually need
  // (today and recent) are near the end, older ones rarely matter.
  requestAnimationFrame(()=>{
    const active = tabs.querySelector('.day-tab.active');
    if(active) active.scrollIntoView({behavior:'instant', inline:'center', block:'nearest'});
  });
  return wrap;
}

function refreshComputedOnly(){
  const computed = computeAll();
  const day = findDay(selectedDayId);
  if(!day) return;
  const c = computed[day.id];
  setText('c-openingCash', money(c.openingCash));
  setText('c-cashCollected', money(c.cashCollected));
  setText('c-totalAmountCash', money(c.totalAmountCash));
  setText('c-totalCashDisbursed', money(c.totalCashDisbursed));
  setText('c-closingAmount', money(c.closingAmount));
  setText('c-iouTotal', money(c.iouTotal));
  setText('c-cashInHand', money(c.cashInHand));
  setText('c-grandTotal', money(c.grandTotal));
  state.banks.forEach(b=>{
    const bc = c.banks[b.id]; if(!bc) return;
    setText('bc-opening-'+b.id, money(bc.opening));
    setText('bc-totalIn-'+b.id, money(bc.totalIn));
    setText('bc-totalOut-'+b.id, money(bc.totalOut));
    setText('bc-closing-'+b.id, money(bc.closing));
  });
  COA.forEach(cat=>{ setText('coa-cat-total-'+cat.key, money(c.coaTotals[cat.key]||0)); });
  saveState();
}
function setText(id, text){
  const e=document.getElementById(id);
  if(!e) return;
  const changed = e.textContent !== text;
  e.textContent = text;
  if(changed){
    e.classList.remove('value-pop');
    void e.offsetWidth; // restart the animation
    e.classList.add('value-pop');
  }
}

        <label>Bank Reconciliation ${/tbl/i.test(b.name) ? '<span class="tag" style="background:var(--danger-soft);color:var(--danger);">mandatory</span>' : '<span class="tag">optional</span>'}</label>
        <p class="subnote" style="margin-top:-4px;">Enter the bank statement's closing balance for this day to check it against the ledger's own figure.${/tbl/i.test(b.name) ? ' TBL must be reconciled before you can consider the day fully closed.' : ''}</p>
        <div class="row">
          <div class="field">
            <label>Bank statement balance</label>
            <input type="text" inputmode="decimal" class="amt-input ${/tbl/i.test(b.name) && bd.reconciledBalance==null ? 'input-missing' : ''}" id="recon-bal-${b.id}" value="${bd.reconciledBalance!=null?formatAsianAmount(bd.reconciledBalance):''}" placeholder="${/tbl/i.test(b.name) ? 'Required \u2014 not checked yet' : 'Not checked yet'}">
          </div>
          <div class="field">
            <label>Note <span class="tag">optional</span></label>
            <input type="text" id="recon-note-${b.id}" value="${escapeHtml(bd.reconcileNote)}" placeholder="e.g. matches statement dated...">
          </div>
        </div>
        ${/tbl/i.test(b.name) && bd.reconciledBalance==null ? `<p class="subnote" style="color:var(--danger);margin-top:-2px;">&#9888; TBL reconciliation is required for this day.</p>` : ''}
        ${bd.reconciledBalance!=null ? (()=>{
          const diff = Math.round((bc.closing - bd.reconciledBalance)*100)/100;
          if(diff===0){
            return `<div class="computed" style="background:#DDEEE3;border-style:solid;border-color:var(--primary);"><span class="lbl">&#9989; Reconciled &mdash; matches the bank statement</span><span>${money(bc.closing)}</span></div>`;
          }
          const rows = [
            ['Opening balance', bc.opening],
            ['+ Other deposit / SSL Commerz', bc.sslDeposit],
            ['+ Other deposit / House Rent', bc.houseRentDeposit],
            ['+ Deposits transferred into this bank', bc.transferIn],
            ['+ Bank-to-bank transfer in', bc.bankXferIn],
            ['&minus; Bank fees', -bc.fees],
            ['&minus; Salary paid by account', -bc.salaryAccount],
            ['&minus; Salary paid by cash', -bc.salaryCash],
            ['&minus; Withdrawn from this bank (Cash Disbursed)', -bc.transferOut],
            ['&minus; Bank-to-bank transfer out', -bc.bankXferOut],
          ].filter(([,v])=>v);
          return `
            <div class="computed" style="background:var(--danger-soft);border-style:solid;border-color:var(--danger);"><span class="lbl">&#9888; Difference (ledger &minus; statement)</span><span style="color:var(--danger);font-weight:700;">${money(diff)}</span></div>
            <button type="button" class="secondary small" data-action="toggle-recon-detail" data-bank="${b.id}" style="margin-top:6px;">${reconDetailOpen[b.id] ? 'Hide' : 'Show'} details &mdash; where might this mismatch be?</button>
            ${reconDetailOpen[b.id] ? `
              <table style="width:100%; font-size:12.5px; border-collapse:collapse; margin-top:8px;">
                <tbody>
                  ${rows.map(([label,val])=>`
                    <tr style="border-bottom:1px solid var(--line-soft);">
                      <td style="padding:4px 6px;">${label}</td>
                      <td style="padding:4px 6px; text-align:right;" class="mono">${money(val)}</td>
                    </tr>`).join('')}
                  <tr style="border-top:2px solid var(--line);">
                    <td style="padding:4px 6px; font-weight:700;">= Ledger's closing balance</td>
                    <td style="padding:4px 6px; text-align:right; font-weight:700;" class="mono">${money(bc.closing)}</td>
                  </tr>
                  <tr>
                    <td style="padding:4px 6px;">Bank statement balance (what you entered)</td>
                    <td style="padding:4px 6px; text-align:right;" class="mono">${money(bd.reconciledBalance)}</td>
                  </tr>
                </tbody>
              </table>
              <p class="subnote" style="margin-top:4px;">Check each line above against the physical bank statement one at a time &mdash; the first line where they stop matching is where the mismatch is. Common causes: a fee or SSL Commerz credit the bank posted on a different date than the ledger, a transfer recorded on the wrong day, or a transaction missing from one side.</p>
            ` : ''}
          `;
        })() : ''}
      </div>
    `);
    bankCard.querySelectorAll('input[data-field]').forEach(inp=>{
      wireAmountInput(inp, (num)=>{ bd[inp.dataset.field] = num; refreshComputedOnly(); });
      inp.addEventListener('blur', ()=>{ saveState(); });
    });
    const reconInput = bankCard.querySelector('#recon-bal-'+b.id);
    wireAmountInput(reconInput, (num)=>{ bd.reconciledBalance = (reconInput.value.trim()==='') ? null : num; refreshComputedOnly(); });
    reconInput.addEventListener('blur', ()=>{ saveState(); render(); });
    bankCard.querySelector('#recon-note-'+b.id).oninput = (e)=>{ bd.reconcileNote = e.target.value; saveState(); };
    drawBankTransferList(bankCard.querySelector('#bank-xfer-list-'+b.id), day);
    if(day.locked) bankCard.classList.add('locked-day');
    wrap.appendChild(bankCard);
  });

  /* --- Day summary --- */
  const bankBoxes = state.banks.map(b=>{
    const bc = c.banks[b.id];
    return `<div class="summary-box"><div class="lbl">${escapeHtml(b.name)} closing</div><div class="val">${money(bc.closing)}</div></div>`;
  }).join('');
  const summary = el(`
    <div class="card">
      <h3>Day summary</h3>
      <div class="summary-grid">
        <div class="summary-box"><div class="lbl">Cash in hand</div><div class="val">${money(c.cashInHand)}</div></div>
        ${bankBoxes}
        <div class="summary-box grand"><div class="lbl">Grand total (Closing amount + banks)</div><div class="val" id="c-grandTotal">${money(c.grandTotal)}</div></div>
      </div>
      <div class="divider"></div>
      <button class="danger small" data-action="delete-day" data-day="${day.id}" ${day.locked?'disabled title="Unlock this day first"':''}>Delete this day</button>
    </div>
  `);
  wrap.appendChild(summary);
  wrap.appendChild(renderSectionNav(day));
  wrap.appendChild(renderHomeEndNav());

  return wrap;
}

/* Right-side quick-scroll buttons: Home jumps to the very top of the
   page, End jumps to the very bottom - grouped into one small floating
   panel (bottom-right) instead of two separate detached buttons, same
   idea as Ctrl+Home/Ctrl+End in MS Word, for the common case of just
   wanting either end of a long day's page rather than a specific section. */
function renderHomeEndNav(){
  const nav = el(`
    <nav class="corner-nav-panel" aria-label="Scroll to top or bottom">
      <button type="button" class="corner-nav-btn" title="Go to the top of the page (Ctrl+Home)">&#8963;</button>
      <div class="corner-nav-panel-divider"></div>
      <button type="button" class="corner-nav-btn" title="Go to the bottom of the page (Ctrl+End)">&#8964;</button>
    </nav>
  `);
  const [homeBtn, endBtn] = nav.querySelectorAll('.corner-nav-btn');
  homeBtn.onclick = scrollPageToTop;
  endBtn.onclick = scrollPageToBottom;
  return nav;
}
function scrollPageToTop(){ window.scrollTo({top:0, left:0, behavior:'smooth'}); }
function scrollPageToBottom(){ window.scrollTo({top:document.documentElement.scrollHeight, left:0, behavior:'smooth'}); }
/* Same idea as scrollPageToTop/Bottom, for the Monthly Ledger section.
   The Monthly Ledger used to be a real floating window with its own
   scrollable body (#ml-floating-body, overflow:auto) - now it's "docked"
   into the normal page flow instead (see .floating-window.docked in the
   stylesheet), so that element no longer scrolls on its own; the whole
   page scrolls instead. Check which case we're in rather than assuming,
   so these buttons work in both. */
function scrollMlToTop(){
  const b = document.getElementById('ml-floating-body');
  if(b && b.scrollHeight > b.clientHeight + 1){ b.scrollTo({top:0, left:0, behavior:'smooth'}); }
  else { scrollPageToTop(); }
}
function scrollMlToBottom(){
  const b = document.getElementById('ml-floating-body');
  if(b && b.scrollHeight > b.clientHeight + 1){ b.scrollTo({top:b.scrollHeight, left:0, behavior:'smooth'}); }
  else { scrollPageToBottom(); }
}

/* Shared jump-to-element helper: waits a frame (twice, to survive a
   re-render that's still settling - e.g. right after opening the Monthly
   Ledger window) so the target is measured/scrolled against its final
   layout, not a mid-reflow one. scrollIntoView (not a manual
   window.scrollTo) is what correctly finds whichever scroll container
   actually needs to move - the main page, or the Monthly Ledger window's
   own inner scroll area - so the same function works for both. Briefly
   highlights the landed-on element so the jump is visually confirmed. */
function scrollToId(id){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const target = document.getElementById(id);
    if(!target) return;
    target.scrollIntoView({behavior:'smooth', block:'start'});
    document.querySelectorAll('.section-nav-target').forEach(x=>{
      if(x!==target) x.classList.remove('section-nav-target');
    });
    target.classList.add('section-nav-target');
    clearTimeout(target._navHighlightTimer);
    target._navHighlightTimer = setTimeout(()=>target.classList.remove('section-nav-target'), 4500);
  }));
}

/* Floating section-jump nav for the day panel. Numbered dots for the
   day's 5(ish) top-level sections (Cash received / Cash disbursed /
   Deposits+IOU / one per bank) stay fixed on screen while scrolling, so
   a long voucher list doesn't mean a long scroll to reach another
   section. The Cash disbursed dot opens a flyout of the 10 CoA
   categories so you can jump straight into e.g. Transport or
   Miscellaneous without scrolling past every category in between. */
function renderSectionNav(day){
  const sections = [
    {id:'section-cash-received', num:'1', label:'Cash received'},
    {id:'section-cash-disbursed', num:'2', label:'Cash disbursed', flyout:COA.map((cat,i)=>({id:'cat-section-'+cat.key, num:String(i+1).padStart(2,'0'), label:coaText(cat,'label')}))},
    {id:'section-deposits-iou', num:'3', label:'Deposits & IOUs'},
    ...state.banks.map((b,bi)=>({id:'section-bank-'+b.id, num:String(4+bi), label:b.name})),
    {id:'section-notesheets', num:String(4+state.banks.length), label:'Notesheets', flyout:[
      {id:'section-notesheets', num:'', label:'Withdraw Notesheets & Summary'},
      {id:'section-deposit-notesheet', num:'', label:'Deposit Notesheet'},
      {id:'ml:section-online-payment', num:'', label:'Online Payment (SSL Commerz)'},
      {id:'ml:section-bank-statement', num:'', label:'TBL Bank Statement Cross-Check'},
      {id:'ml:section-due-register', num:'', label:'Import Due Register'},
      {id:'__open-monthly-ledger__', num:'', label:'Monthly Ledger'},
    ]},
  ];
  const nav = el(`<nav class="section-nav" aria-label="Jump to section"><div class="section-nav-label">&#9673; Jump to</div></nav>`);
  sections.forEach(sec=>{
    const dot = el(`
      <div class="section-nav-item">
        <button type="button" class="section-nav-dot" title="${escapeHtml(sec.label)}"><span class="num">${sec.num}.</span> ${escapeHtml(sec.label)}</button>
        ${sec.flyout ? `<div class="section-nav-flyout"></div>` : ''}
      </div>
    `);
    const dotBtn = dot.querySelector('.section-nav-dot');
    const closeOtherFlyouts = ()=>{
      nav.querySelectorAll('.section-nav-item.open').forEach(d=>{ if(d!==dot) d.classList.remove('open'); });
    };
    if(sec.flyout){
      const flyout = dot.querySelector('.section-nav-flyout');
      flyout.appendChild(el(`<div class="section-nav-flyout-title">${escapeHtml(sec.label)}</div>`));
      sec.flyout.forEach(sub=>{
        const subBtn = el(`<button type="button" class="section-nav-flyout-item">${sub.num} &middot; ${escapeHtml(sub.label)}</button>`);
        subBtn.onclick = ()=>{
          if(sub.id==='__open-monthly-ledger__'){
            monthlyLedgerOpen = true;
            if(!monthlyLedgerViewKey) monthlyLedgerViewKey = monthKeyFor(state.month, state.year);
            render();
          } else if(sub.id.startsWith('ml:')){
            const realId = sub.id.slice(3);
            monthlyLedgerOpen = true;
            if(!monthlyLedgerViewKey) monthlyLedgerViewKey = monthKeyFor(state.month, state.year);
            render();
            requestAnimationFrame(()=> scrollToId(realId));
          } else {
            scrollToId(sub.id);
          }
          dot.classList.remove('open');
        };
        flyout.appendChild(subBtn);
      });
      dotBtn.onclick = ()=>{ closeOtherFlyouts(); dot.classList.toggle('open'); };
    } else {
      dotBtn.onclick = ()=>{ closeOtherFlyouts(); scrollToId(sec.id); };
    }
    nav.appendChild(dot);
  });
  ensureSectionNavGlobalListener();
  return nav;
}
let sectionNavGlobalListenerWired = false;
function ensureSectionNavGlobalListener(){
  if(sectionNavGlobalListenerWired) return;
  sectionNavGlobalListenerWired = true;
  /* One listener for the app's lifetime, not one per render - it always
     looks up whichever .section-nav is currently in the DOM. */
  document.addEventListener('click', (e)=>{
    const nav = document.querySelector('.section-nav');
    if(nav && !nav.contains(e.target)) nav.querySelectorAll('.section-nav-item.open').forEach(d=>d.classList.remove('open'));
  });
}

/* --- Advanced Search: find any Cash Disbursed voucher across every
   recorded day (current month + archived months), by category, year,

function renderDashboardCard(){

    });

  const topCats = COA.map(c=>({cat:c, total:catTotals[c.key]})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);

    let t = 0;
    COA.forEach(cat=>{ (day.coa[cat.key]||[]).forEach(item=>{ t += Number(item.amount)||0; }); });

  const sparkline = trendValues.length>1 ? buildSparklineSvg(trendValues, trendDays.map(d=>dayLabel(d.date))) : '';

        ${outstandingPayableTotal>0 ? `<div class="summary-box" style="border-color:#B8860B;"><div class="lbl">Owed back to staff</div><div class="val" style="color:#B8860B;">${money(outstandingPayableTotal)}</div></div>` : ''}
      </div>
      ${sparkline ? `

      <div class="divider"></div>
      <h3 style="font-size:14px;">This month by category</h3>

        <div class="computed"><span class="lbl">${escapeHtml(x.cat.label)}</span><span>${money(x.total)}</span></div>

      ${outstandingIous.map(i=>`<div class="computed"><span class="lbl">${escapeHtml(i.desc||'IOU')} &middot; since ${dayLabel(i.fromDate)}</span><span>${money(i.amount)}</span></div>`).join('')}

/* Builds a compact inline SVG line-chart of daily spend for the Dashboard.
   Deliberately simple (no library) - just enough to show a trend at a
   glance, with the last point picked out and a light fill under the line. */
function buildSparklineSvg(values, labels){
  const w = 100, h = 34, pad = 3;
  const max = Math.max(...values, 1);
  const min = 0;
  const stepX = values.length>1 ? (w-2*pad)/(values.length-1) : 0;
  const yFor = (v)=> h-pad - ((v-min)/(max-min||1))*(h-2*pad);
  const pts = values.map((v,i)=> [pad+i*stepX, yFor(v)]);
  const line = pts.map(p=>p.join(',')).join(' ');
  const fillPath = `M${pad},${h-pad} L` + line.split(' ').join(' L') + ` L${pad+(values.length-1)*stepX},${h-pad} Z`;
  const last = pts[pts.length-1];
  const titleParts = values.map((v,i)=> `${labels[i]}: ${formatAsianAmount(v)}`);
  return `
    <div style="background:var(--card-alt,#F7F8F4);border-radius:8px;padding:8px 10px;">
      <svg viewBox="0 0 ${w} ${h}" width="100%" height="52" preserveAspectRatio="none" style="display:block;overflow:visible;">
        <title>${escapeHtml(titleParts.join(' | '))}</title>
        <path d="${fillPath}" fill="var(--primary)" opacity="0.08"></path>
        <polyline points="${line}" fill="none" stroke="var(--primary)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></polyline>
        <circle cx="${last[0]}" cy="${last[1]}" r="1.8" fill="var(--primary-dark)"></circle>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:2px;">
        <span>${escapeHtml(labels[0])}</span>
        <span>${escapeHtml(labels[labels.length-1])}</span>
      </div>
    </div>
  `;
}

/* ======================================================================
   Monthly Ledger card - Revenue / Expenditure / Balance Sheet workbook,
   replicating the institution's existing manual Excel format so the
   monthly file can be generated straight from data already on hand
   instead of retyped from scratch each month.
   ====================================================================== */
/* All derived figures for one month's ledger, in one place so the
   initial render and the lightweight live-refresh (below) can't drift
   out of sync with each other. */
/* Cash in Hand for the Balance Sheet's Cash in Hand row: the previous
   month's last recorded day's closing cash (not the selected month's own
   days) - runs the same day-to-day chain as the Daily Ledger, across
   every day ever entered, so it works for any selected month. */
/* Cash in Hand for the Balance Sheet's Cash in Hand row: that month's own
   last recorded day's closing cash box amount (cash only, no bank; and
   including money currently out on IOU, not the IOU-net cashInHand figure
   used elsewhere) - works for the live month (via the cached computeAll())
   and for archived months too (via a fresh chain scoped to that month's
   own days, since archived days aren't part of state.days). */
/* Cumulative day-chain result as of a month's own last recorded day - NOT
   just that month's own days in isolation. Bug fixed: this used to filter
   to only the target month's days and start the chain fresh from
   state.banks[].opening for every archived month, silently dropping every
   prior month's contribution (beyond the Monthly Ledger's one-time
   "seed" starting point) from the running Cash/Bank balance. Now it
   chains through every day ever recorded up to the end of that month, so
   an archived month's auto Cash-in-Hand/Bank-Balance actually reflects
   everything before it, not just its own days in a vacuum. */
function lastDayComputedInMonth(monthKey){
  const [y, m] = monthKey.split('-');
  const monthEnd = `${y}-${m}-31`; // safe upper bound - date strings compare lexicographically
  const daysThisMonth = allDaysEverywhere().filter(d=>d.date.startsWith(`${y}-${m}`)).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(daysThisMonth.length===0) return null;
  const isLive = monthKey === monthKeyFor(state.month, state.year);
  if(isLive){
    const computed = computeAll();
    const last = daysThisMonth[daysThisMonth.length-1];
    return computed[last.id] || null;
  }
  const daysThroughMonth = allDaysEverywhere().filter(d=>d.date<=monthEnd).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const computed = computeDayChain(daysThroughMonth);
  const last = daysThisMonth[daysThisMonth.length-1];
  return computed[last.id] || null;
}
function lastDayCashInHandInMonth(monthKey){
  const c = lastDayComputedInMonth(monthKey);
  return c ? c.closingAmount : null;
}
/* Same idea, for one bank's own closing balance as of that month's last
   recorded day - the "formula" (auto-computed, not hand-typed) source for
   the Bank Balance breakdown, in both the app and the export. Works for
   any month, live or archived, same as lastDayCashInHandInMonth above. */
function lastDayBankClosingInMonth(monthKey, bankId){
  const c = lastDayComputedInMonth(monthKey);
  return (c && c.banks[bankId]) ? c.banks[bankId].closing : null;
}
/* Same day-chain machinery, but for one specific date rather than "the
   last day of a month" - used by the TBL statement cross-check to verify
   the app's own closing balance as of the statement's own last date.
   Same cumulative-from-the-start fix as lastDayComputedInMonth above. */
function computedForDate(dateISO){
  const monthKey = dateISO.slice(0,7);
  const isLive = monthKey === monthKeyFor(state.month, state.year);
  const day = allDaysEverywhere().find(d=>d.date===dateISO);
  if(!day) return null;
  if(isLive){
    const computed = computeAll();
    return computed[day.id] || null;
  }
  const daysThroughDate = allDaysEverywhere().filter(d=>d.date<=dateISO).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const computed = computeDayChain(daysThroughDate);
  return computed[day.id] || null;
}

/* Sums a per-bank Daily Ledger field (salaryAccount or salaryCash, from
   each day's Bank section) across every day in the given month, across
   all banks - this is what lets a Salary entry made in the Daily Ledger
   flow into the Monthly Ledger automatically. */
function sumDailyBankFieldForMonth(key, field){
  let total = 0;
  state.days.forEach(day=>{
    if(day.date.slice(0,7)!==key) return;
    Object.values(day.banksDaily||{}).forEach(bd=>{ total += Number(bd && bd[field])||0; });
  });
  return total;
}
/* House Rent Deposit / Salary by Cash / Salary by Account each happen only
   once a month, on the last banking day - so unlike a true aggregate,
   there IS one real date to show. Returns that day's date, or null if
   nothing was entered for this field in this month (or, in the unusual
   case of more than one non-zero day, the latest one). */
function dayDateForBankField(key, field){
  let foundDate = null;
  state.days.forEach(day=>{
    if(day.date.slice(0,7)!==key) return;
    let dayTotal = 0;
    Object.values(day.banksDaily||{}).forEach(bd=>{ dayTotal += Number(bd && bd[field])||0; });
    if(dayTotal>0) foundDate = day.date;
  });
  return foundDate;
}
/* Same idea, but returns every non-zero day (not just the last one) - so
   if House Rent/Salary is ever mistakenly entered on more than one date
   in the same month, each shows up on its own dated row in the export
   instead of being silently merged into a single total. */
function dailyBankFieldEntries(key, field){
  const out = [];
  state.days.forEach(day=>{
    if(day.date.slice(0,7)!==key) return;
    let dayTotal = 0;
    Object.values(day.banksDaily||{}).forEach(bd=>{ dayTotal += Number(bd && bd[field])||0; });
    if(dayTotal>0) out.push({date:day.date, amount:dayTotal});
  });
  return out;
}
/* Effective Salary by Account/Cash and House Rent Deposit for the
   Monthly Ledger: the old manual figure if this month still has one
   from before Manual Bank Items was removed, otherwise the sum of
   what's been entered day by day in the Daily Ledger's Bank section -
   which is now the only place these are entered. */
function effectiveSalaryByAccount(key){
  const rec = getMonthlyLedgerMonth(key);
  const manual = Number(rec.salaryByAccount)||0;
  return manual!==0 ? manual : sumDailyBankFieldForMonth(key, 'salaryAccount');
}
function effectiveSalaryByCash(key){
  const rec = getMonthlyLedgerMonth(key);
  const manual = Number(rec.salaryByCash)||0;
  return manual!==0 ? manual : sumDailyBankFieldForMonth(key, 'salaryCash');
}
function effectiveHouseRentDeposit(key){
  const rec = getMonthlyLedgerMonth(key);
  const manual = Number(rec.houseRentDeposit)||0;
  return manual!==0 ? manual : sumDailyBankFieldForMonth(key, 'houseRentDeposit');
}

const _mlFigStack = new Set();
let _mlFigDepth = 0;
const MLFIG_MAX_DEPTH = 30; // hard circuit breaker - normal use never nests this deep
function computeMonthlyLedgerFigures(key){
  if(_mlFigStack.has(key) || _mlFigDepth > MLFIG_MAX_DEPTH){
    // Reentrant call for a month whose figures are already being computed
    // further up this same call stack (e.g. Beginning Balance/Opening Cash
    // looking back through earlier months ends up circling back here), or
    // the lookback chain has gone unexpectedly deep. Return a safe zeroed
    // stand-in instead of recursing forever / blowing the call stack.
    const rec0 = getMonthlyLedgerMonth(key);
    return {rec:rec0, isLiveMonth:false, revTotals:Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0])),
      revTotalIncome:0, yrtBefore:Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0])), yrtNew:Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0])),
      totalDueSum:0, totalAmount:0, liveCoaTotals:Object.fromEntries(COA.map(c=>[c.key,0])), expColAmounts:[], expTotal:0, totalBalance:0,
      cashInHandShown:0, autoBankTotal:null, bankBalanceShown:0, formulaBankTotal:0, bankFormulaMismatch:false,
      bankBreakdownShown:null, bankBreakdownSum:0, bankBreakdownHasData:false, bankBreakdownMismatch:false, otherAsset:rec0.balanceSheet.otherAsset||{label:'',amount:0}, otherAssetAmount:0,
      remainingBalance:0, noteTotal:0, noteTotalMismatch:false, totalLiabilities:0, assetLiabilityMismatch:false,
      gratuityPayable:0, eduAssistPayable:0, totalAssets:0, equity:0, customRowValues:{}, metricValues:{}, mandatoryIssues:[]};
  }
  _mlFigStack.add(key);
  _mlFigDepth++;
  try{
  const rec = getMonthlyLedgerMonth(key);
  const isLiveMonth = key === monthKeyFor(state.month, state.year);

  const revTotals = monthRevenueTotals(rec);
  // Gratuity and Education Assistance Fund come from their own entered
  // amounts (rec.revenueEntries), same as every other category - NOT
  // derived from Admission Fee & Form income. Admission Fee bundles the
  // admission fee itself with the separate form fee, and the form fee
  // is not the source of Gratuity/Education Assistance money, so no
  // fraction of it is carried over automatically here.
  // One-time starting-point figures (entered once via "Set Starting
  // Point", covering Revenue, Expenditure and Bank amounts together) -
  // applied only to the earliest month ever tracked in this tool, so
  // they add in exactly once instead of inflating every month.
  const isEarliestTrackedMonth = key === earliestTrackedMonthKey();
  const seed = state.monthlyLedger.seed;
  const seedActive = isEarliestTrackedMonth && seed && seed.active!==false;
  // NOTE: seed.revenue is intentionally NOT added into revTotals here.
  // It already flows into yrtBefore via yearlyRunningTotalBefore() below
  // (that function adds it for the earliest month's year). Adding it a
  // second time here used to double it in yrtNew/gratuityPayable/
  // eduAssistPayable and everywhere the Balance Sheet reads those.
  const revTotalIncome = REVENUE_CATS.reduce((s,c)=>s+revTotals[c.key],0);
  const yrtBefore = yearlyRunningTotalBefore(key);
  const yrtNew = {};
  REVENUE_CATS.forEach(c=>{ yrtNew[c.key] = yrtBefore[c.key] + revTotals[c.key] + effectiveRevenueTransfer(rec, c.key); });
  const totalDueSum = REVENUE_CATS.reduce((s,c)=>s+(Number(rec.revenueTotalDue[c.key])||0),0);
  const beginningBankBalanceSum = state.banks.reduce((s,b)=>s+effectiveBeginningBankBalanceFor(key,b.id),0);
  const totalAmount = beginningBankBalanceSum + revTotalIncome + effectiveHouseRentDeposit(key);

  const liveCoaTotals = monthWithdrawCoaTotals(key);
  if(seedActive){
    COA.forEach(c=>{ liveCoaTotals[c.key] = (liveCoaTotals[c.key]||0) + (Number((seed.expenditure||{})[c.key])||0); });
  }
  let expTotal = 0;
  const expColAmounts = rec.expenditureColumns.map(col=>{
    let amt = 0;
    if(col.source==='coa'){ amt = (col.override!==undefined && col.override!==null) ? Number(col.override)||0 : (liveCoaTotals ? (liveCoaTotals[col.coaKey]||0) : 0); }
    else if(col.source==='entries'){ amt = expenditureEntryColTotal(rec, col.id); }
    else { amt = Number(col.amount)||0; }
    expTotal += amt;
    return amt;
  });
  expTotal += effectiveSalaryByAccount(key) + effectiveSalaryByCash(key);
  const totalBalance = totalAmount - expTotal; // Total Amount (Beginning Balance + Total Income) minus Expenditure, per the Revenue sheet

  const expAssistCol = rec.expenditureColumns.find(c=>resolveColCoaKey(c)==='EduAssist');
  const expAssistIdx = expAssistCol ? rec.expenditureColumns.indexOf(expAssistCol) : -1;
  const expAssistAmt = expAssistIdx>=0 ? expColAmounts[expAssistIdx] : 0;

  const latestDay = state.days.length ? state.days[state.days.length-1] : null;
  const computed = isLiveMonth ? computeAll() : null;
  const latestComputed = latestDay && computed ? computed[latestDay.id] : null;
  const autoCashInHand = lastDayCashInHandInMonth(key);
  const autoBankTotal = latestComputed ? state.banks.reduce((s,b)=>s+latestComputed.banks[b.id].closing,0) : null;
  const cashInHandShown = rec.balanceSheet.cashInHandOverride!==null ? rec.balanceSheet.cashInHandOverride : autoCashInHand;

  yrtNew.eduAssist -= expAssistAmt; // net of this month's own EduAssist expenditure - carries forward correctly via the updated yearlyRunningTotalBefore
  const gratuityPayable = yrtNew.gratuity;
  const eduAssistPayable = yrtNew.eduAssist; // already net of expenditure, see above

  // "Balance in Bank Account" = the sum of each bank's own closing balance
  // in the breakdown below (straight from the Daily Ledger day-chain),
  // so the two can never disagree with each other. Beginning Balance +
  // Income − Expenditure is kept only as a sanity-check figure (shown in
  // the mismatch warning) and as the fallback for a month with no
  // day-chain data at all for any bank yet.
  const formulaBankTotal = totalBalance; // totalBalance already = (Beginning Balance + Income) - Expenditure
  const bankBreakdownShown = {};
  state.banks.forEach(b=>{
    // Formula-driven only (no manual override) - each bank's own closing
    // balance as of this month's last recorded day, straight from the
    // Daily Ledger day-chain (works for the live month and, once real
    // archived day-by-day data exists, any other month too).
    const base = lastDayBankClosingInMonth(key, b.id);
    const beginningAdd = seedActive ? (Number((seed.bankBreakdown||{})[b.id])||0) : 0;
    // House Rent Deposit is a money movement that doesn't pass through
    // the day-to-day voucher flow, so it's layered on top separately.
    // Salary by Account/Cash only gets the same treatment when it's a
    // genuine manual figure typed into Manual Bank Items - when it's
    // instead auto-summed from the Daily Ledger's Bank section, it's
    // already reflected in that bank's own day-by-day closing balance,
    // so adjusting again here would double-count it.
    let manualAdj = 0;
    if(rec.houseRentDepositBankId===b.id) manualAdj += Number(rec.houseRentDeposit)||0;
    if((Number(rec.salaryByAccount)||0)!==0 && rec.salaryByAccountBankId===b.id) manualAdj -= Number(rec.salaryByAccount)||0;
    if((Number(rec.salaryByCash)||0)!==0 && rec.salaryByCashBankId===b.id) manualAdj -= Number(rec.salaryByCash)||0;
    bankBreakdownShown[b.id] = (base===null && beginningAdd===0 && manualAdj===0) ? null : (Number(base)||0) + beginningAdd + manualAdj;
  });
  const bankBreakdownSum = state.banks.reduce((s,b)=>s+(Number(bankBreakdownShown[b.id])||0),0);
  const bankBreakdownHasData = state.banks.some(b=>bankBreakdownShown[b.id]!==null);
  const bankBalanceShown = rec.balanceSheet.bankBalanceOverride!==null ? rec.balanceSheet.bankBalanceOverride : (bankBreakdownHasData ? bankBreakdownSum : formulaBankTotal);
  const bankFormulaMismatch = bankBalanceShown!==null && Math.abs((Number(bankBalanceShown)||0) - formulaBankTotal) > 1;
  const bankBreakdownMismatch = bankBalanceShown!==null && Math.abs(bankBreakdownSum - (Number(bankBalanceShown)||0)) > 1;

  const otherAsset = rec.balanceSheet.otherAsset || {label:'Debt to III Assets Ltd', amount:250000};
  const otherAssetAmount = Number(otherAsset.amount)||0;

  // Head-wise distribution of the bank balance (Gratuity + Education
  // Assistance + Remaining = Total), where Total should match "Balance in
  // Bank Account" above.
  const remainingBalance = (Number(bankBalanceShown)||0) - gratuityPayable - eduAssistPayable;
  const noteTotal = gratuityPayable + eduAssistPayable + remainingBalance;
  const noteTotalMismatch = bankBalanceShown!==null && Math.abs(noteTotal - (Number(bankBalanceShown)||0)) > 1;

  const totalAssets = (Number(cashInHandShown)||0) + (Number(bankBalanceShown)||0) + totalDueSum + otherAssetAmount;
  const equity = totalAssets - (Number(rec.balanceSheet.advancePayment)||0) - gratuityPayable - eduAssistPayable;
  const totalLiabilities = equity + (Number(rec.balanceSheet.advancePayment)||0) + gratuityPayable + eduAssistPayable;
  const assetLiabilityMismatch = Math.abs(totalAssets - totalLiabilities) > 1;

  // User-added custom rows (the "green/yellow boxes" the person can add
  // freely and map to any figure already tracked elsewhere in the month,
  // instead of typing a number that then goes stale). 'manual' rows just
  // hold whatever was typed into them.
  const metricValues = {
    totalIncome:revTotalIncome, totalDue:totalDueSum, totalAmount, totalExpenditure:expTotal,
    totalBalance, cashInHand:cashInHandShown, bankBalance:bankBalanceShown, gratuityPayable, eduAssistPayable,
    totalAssets, equity, grandTotal:(Number(cashInHandShown)||0)+(Number(bankBalanceShown)||0)
  };
  const customRowValues = {};
  (rec.customRows||[]).forEach(row=>{
    let v = 0;
    if(row.source==='manual') v = Number(row.amount)||0;
    else if(row.source==='revenue') v = revTotals[row.key]||0;
    else if(row.source==='expenditure'){ const i = rec.expenditureColumns.findIndex(c=>c.id===row.key); v = i>=0 ? (expColAmounts[i]||0) : 0; }
    else if(row.source==='metric') v = metricValues[row.key]||0;
    customRowValues[row.id] = v;
  });

  // Mandatory manual figures - must be filled in (non-zero) by hand each
  // month; flagged in the UI and checked before export. Only enforced
  // from July 2026 onward - that's when day-by-day Daily Ledger use (and
  // therefore these auto-summed figures) actually started; the earlier
  // months were imported wholesale from an existing Excel workbook and
  // can't be retrofitted the same way.
  const mandatoryIssues = [];
  if(key>=MANDATORY_FIELDS_START_KEY){
    if(!effectiveHouseRentDeposit(key)) mandatoryIssues.push('House Rent Deposit (Revenue)');
    if(!effectiveSalaryByAccount(key)) mandatoryIssues.push('Salary by Account (Expenditure)');
    if(!effectiveSalaryByCash(key)) mandatoryIssues.push('Salary by Cash (Expenditure)');
  }

  return {rec, isLiveMonth, revTotals, revTotalIncome, yrtBefore, yrtNew, totalDueSum, totalAmount,
    liveCoaTotals, expColAmounts, expTotal, totalBalance, cashInHandShown, autoBankTotal,
    bankBalanceShown, formulaBankTotal, bankFormulaMismatch, bankBreakdownShown, bankBreakdownSum, bankBreakdownHasData, bankBreakdownMismatch,
    otherAsset, otherAssetAmount, remainingBalance, noteTotal, noteTotalMismatch, totalLiabilities, assetLiabilityMismatch,
    gratuityPayable, eduAssistPayable, totalAssets, equity, customRowValues, metricValues, mandatoryIssues};
  } finally {
    _mlFigStack.delete(key);
    _mlFigDepth--;
  }
}

/* Self-service editing modal: lets the user fix small "data link" and
   "export formatting" issues himself, directly in the tool, without
   needing to prompt Claude each time. Two sections:
   1. Data Links - which Deposit Notesheet line description maps to
      which Revenue category (state.settings.depositRevenueMap).
   2. Export Formatting - border style + row heights + signature indent
      used when generating the Withdraw Summary sheet
      (state.settings.exportFormat). */
function renderMlSettingsModal(){
  const s = state.settings;
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal" style="max-width:640px;">
        <div class="modal-header">
          <h3>&#9881; Data Links &amp; Export Format</h3>
          <button class="icon-btn" data-action="toggle-ml-settings" title="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p class="subnote">Fix these yourself, any time - changes save immediately and apply to every future notesheet/ledger you generate.</p>

          <h4 style="margin-bottom:4px;">Data Links: Deposit description &rarr; Revenue category</h4>
          <p class="subnote" style="margin-top:0;">If a Collection Register line isn't landing in the right Monthly Ledger revenue column, fix the mapping here.</p>
          <div id="ml-deplink-list"></div>
          <button class="secondary small" type="button" data-action="ml-deplink-add" style="margin-top:6px;">+ Add mapping</button>

          <div class="divider"></div>

          <h4 style="margin-bottom:4px;">Export Formatting (Withdraw Summary sheet)</h4>
          <div class="row">
            <div class="field">
              <label>Border style</label>
              <select id="ml-fmt-border">
                ${['thin','medium','thick','double'].map(v=>`<option value="${v}" ${s.exportFormat.borderStyle===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Taka-in-words row height</label>
              <input type="text" inputmode="numeric" id="ml-fmt-wordsrow" value="${s.exportFormat.wordsRowHeight}">
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>Signature row height</label>
              <input type="text" inputmode="numeric" id="ml-fmt-sigrow" value="${s.exportFormat.sigRowHeight}">
            </div>
            <div class="field">
              <label>Signature indent (spaces)</label>
              <input type="text" inputmode="numeric" id="ml-fmt-sigindent" value="${s.exportFormat.sigIndentSpaces}">
            </div>
          </div>
          <p class="subnote">If a signature line or the taka-in-words line looks cramped/misaligned in the exported Excel, nudge these numbers and re-export - no code changes needed.</p>
          <button class="secondary small" type="button" data-action="ml-fmt-reset">Reset export formatting to default</button>
        </div>
      </div>
    </div>
  `);

  function drawDepLinks(){
    const list = overlay.querySelector('#ml-deplink-list');
    list.innerHTML = '';
    Object.keys(s.depositRevenueMap).forEach(desc=>{
      const row = el(`
        <div class="line-item">
          <div class="field desc" style="margin-bottom:0;"><label>Deposit description</label><input type="text" class="ml-deplink-desc" value="${escapeHtml(desc)}"></div>
          <div class="field" style="margin-bottom:0;"><label>Revenue category</label>
            <select class="ml-deplink-cat">
              ${REVENUE_CATS.map(c=>`<option value="${c.key}" ${s.depositRevenueMap[desc]===c.key?'selected':''}>${escapeHtml(c.label)}</option>`).join('')}
            </select>
          </div>
          <button class="danger small" type="button" data-action="ml-deplink-remove" title="Remove">&times;</button>
        </div>
      `);
      const descInp = row.querySelector('.ml-deplink-desc');
      const catSel = row.querySelector('.ml-deplink-cat');
      descInp.addEventListener('change', ()=>{
        const oldKey = desc, newKey = descInp.value.trim();
        if(!newKey || newKey===oldKey) { descInp.value = oldKey; return; }
        const catVal = s.depositRevenueMap[oldKey];
        delete s.depositRevenueMap[oldKey];
        s.depositRevenueMap[newKey] = catVal;
        saveState(); drawDepLinks();
      });
      catSel.onchange = ()=>{ s.depositRevenueMap[desc] = catSel.value; saveState(); };
      row.querySelector('[data-action="ml-deplink-remove"]').onclick = ()=>{ delete s.depositRevenueMap[desc]; saveState(); drawDepLinks(); };
      list.appendChild(row);
    });
  }
  drawDepLinks();

  overlay.querySelector('[data-action="ml-deplink-add"]').onclick = ()=>{
    let base = 'New line', n = 1, key = base;
    while(s.depositRevenueMap[key]!==undefined){ key = `${base} ${++n}`; }
    s.depositRevenueMap[key] = REVENUE_CATS[0].key;
    saveState(); drawDepLinks();
  };

  overlay.querySelector('#ml-fmt-border').onchange = (e)=>{ s.exportFormat.borderStyle = e.target.value; saveState(); };
  overlay.querySelector('#ml-fmt-wordsrow').onchange = (e)=>{ s.exportFormat.wordsRowHeight = Number(e.target.value)||60; saveState(); };
  overlay.querySelector('#ml-fmt-sigrow').onchange = (e)=>{ s.exportFormat.sigRowHeight = Number(e.target.value)||50; saveState(); };
  overlay.querySelector('#ml-fmt-sigindent').onchange = (e)=>{ s.exportFormat.sigIndentSpaces = Number(e.target.value)||0; saveState(); };
  overlay.querySelector('[data-action="ml-fmt-reset"]').onclick = ()=>{
    s.exportFormat = defaultState().settings.exportFormat;
    saveState(); render();
  };

  overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ mlSettingsOpen = false; render(); } });
  return overlay;
}

/* Updates just the read-only computed figures in an already-rendered
   Monthly Ledger card, without rebuilding the DOM - rebuilding on every
   keystroke (the way a full render() would) steals focus out of
   whichever input the person is still typing in. */
function setDisplay(id, show){ const e=document.getElementById(id); if(e) e.style.display = show?'':'none'; }
function refreshMonthlyLedgerComputedOnly(){
  if(!monthlyLedgerOpen || !monthlyLedgerViewKey) return;
  const f = computeMonthlyLedgerFigures(monthlyLedgerViewKey);
  setText('ml-total-income', money(f.revTotalIncome));
  setText('ml-total-due-sum', money(f.totalDueSum));
  setText('ml-total-amount', money(f.totalAmount));
  setText('ml-total-expenditure', money(f.expTotal));
  setText('ml-total-balance', money(f.totalBalance));
  setText('ml-bs-balance-bank', money(f.bankBalanceShown||0));
  setText('ml-bs-due-payment', money(f.totalDueSum));
  setText('ml-bs-gratuity', money(f.gratuityPayable));
  setText('ml-bs-eduassist', money(f.eduAssistPayable));
  setText('ml-note-gratuity', money(f.gratuityPayable));
  setText('ml-note-eduassist', money(f.eduAssistPayable));
  setText('ml-total-assets', money(f.totalAssets));
  setText('ml-equity', money(f.equity));
  setText('ml-bank-breakdown-sum', money(f.bankBreakdownSum));
  setText('ml-note-remaining', money(f.remainingBalance));
  setText('ml-note-total', money(f.noteTotal));
  setDisplay('ml-warn-bank-formula', f.bankFormulaMismatch);
  setDisplay('ml-warn-bank-breakdown', f.bankBreakdownMismatch);
  setDisplay('ml-warn-note-total', f.noteTotalMismatch);
  setDisplay('ml-warn-asset-liability', f.assetLiabilityMismatch);
  const yrtNewBox = document.getElementById('ml-yrt-new');
  if(yrtNewBox) yrtNewBox.innerHTML = REVENUE_CATS.map(c=>`<div><span style="opacity:.75;">${escapeHtml(c.label)}:</span> ${money(f.yrtNew[c.key])}</div>`).join('');
  const bankBreakdownBox = document.getElementById('ml-bank-breakdown-list');
  if(bankBreakdownBox) drawMlBankBreakdownList(bankBreakdownBox, f.rec, f.bankBreakdownShown, f.isLiveMonth);
}

/* Combined view across every month ever tracked in the Monthly Ledger -
   shown only when the person explicitly asks for it (default view stays
   the single selected month, per computeMonthlyLedgerFigures above).
   Revenue and Expenditure are additive across months, so those are
   summed; Bank Balance and Cash in Hand are point-in-time figures (not
   additive), so this shows the latest tracked month's figures for those
   instead of a meaningless sum. */
function renderMlTotalBox(){
  const keys = Object.keys(state.monthlyLedger.months||{}).sort();
  if(keys.length===0) return '<div class="card" style="background:var(--card-alt,#F7F8F4);padding:10px;margin-top:8px;"><p class="empty">No months tracked yet.</p></div>';
  let totalRevenue = 0, totalExpenditure = 0;
  keys.forEach(k=>{
    const f = computeMonthlyLedgerFigures(k);
    totalRevenue += f.revTotalIncome;
    totalExpenditure += f.expTotal;
  });
  const latestKey = keys[keys.length-1];
  const latestF = computeMonthlyLedgerFigures(latestKey);
  return `
    <div class="card" style="background:var(--card-alt,#F7F8F4);padding:10px;margin-top:8px;">
      <p class="subnote" style="margin-top:0;">Revenue and Expenditure summed across all ${keys.length} tracked month(s) (${monthKeyLabel(keys[0])} &ndash; ${monthKeyLabel(latestKey)}). Cash/Bank figures are a point-in-time balance, not a sum, so these show ${monthKeyLabel(latestKey)}'s (the latest tracked month's) figures.</p>
      <div class="computed"><span class="lbl">Total Revenue (all months)</span><span>${money(totalRevenue)}</span></div>
      <div class="computed"><span class="lbl">Total Expenditure (all months)</span><span>${money(totalExpenditure)}</span></div>
      <div class="computed total"><span class="lbl">Net (Revenue &minus; Expenditure, all months)</span><span>${money(totalRevenue-totalExpenditure)}</span></div>
      <div class="computed"><span class="lbl">Cash in Hand (as of ${monthKeyLabel(latestKey)})</span><span>${money(latestF.cashInHandShown||0)}</span></div>
      <div class="computed"><span class="lbl">Bank Balance (as of ${monthKeyLabel(latestKey)})</span><span>${money(latestF.bankBalanceShown||0)}</span></div>
    </div>
  `;
}

  drawMlGrid(card.querySelector('#ml-transfer-grid'), rec.revenueTransfer, 'transfer', rec);
  drawMlExpenditureList(card.querySelector('#ml-expenditure-list'), rec, liveCoaTotals);
  drawMlExpenditureEntryList(card.querySelector('#ml-expenditure-entry-list'), rec);
  drawMlCustomRowsList(card.querySelector('#ml-custom-rows-list'), rec, f);
  drawMlBankBreakdownList(card.querySelector('#ml-bank-breakdown-list'), rec, bankBreakdownShown, isLiveMonth);

  /* SSL Commerz, Due Register import, and the TBL notesheet-matching
     cross-check all feed or check this same month's figures, so they're
     rendered as part of this same Monthly Ledger window (not separate
     top-level page sections anymore) - each keeps its own saved history
     below its form, removable, and removing an entry un-does whatever it
     applied to this Monthly Ledger month. */
  const wrap = document.createDocumentFragment();
  wrap.appendChild(card);
  wrap.appendChild(renderOnlinePaymentCard());
  wrap.appendChild(renderDueRegisterCard());
  wrap.appendChild(renderBankStatementCard());
  return wrap;
}

function drawMlGrid(container, dataObj, kind, rec){
  container.innerHTML = '';
  const autoTransfer = kind==='transfer' ? autoGratuityEduAssist(rec) : null;
  REVENUE_CATS.forEach(c=>{
    if(kind==='transfer' && c.key==='admissionFee'){
      const autoVal = -(effectiveRevenueTransfer(rec,'gratuity') + effectiveRevenueTransfer(rec,'eduAssist'));
      const wrap = el(`<div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">${escapeHtml(c.label)} <span class="tag">auto: &minus;(Gratuity+EduAssist)</span></label><input type="text" disabled value="${formatAsianAmount(autoVal)}"></div>`);
      container.appendChild(wrap);
      return;
    }
    if(kind==='transfer' && (c.key==='gratuity' || c.key==='eduAssist')){
      const auto = autoTransfer[c.key];
      const overrideKey = c.key+'Override';
      const overridden = dataObj[overrideKey]!==undefined && dataObj[overrideKey]!==null;
      const val = overridden ? dataObj[overrideKey] : auto;
      const wrap = el(`
        <div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">${escapeHtml(c.label)} <span class="tag">${overridden?'manually overridden':'auto: 1/'+(c.key==='gratuity'?'6':'30')+' of Admission Fee'}</span></label><input type="text" inputmode="decimal" value="${formatAsianAmount(val)}"></div>
      `);
      const inp = wrap.querySelector('input');
      wireAmountInput(inp, (num)=>{
        dataObj[overrideKey] = (num===auto) ? null : num;
        saveState(); refreshMonthlyLedgerComputedOnly(); renderMonthlyLedgerWindowInPlace();
      });
      if(overridden){
        const resetBtn = el(`<button type="button" class="secondary small" title="Clear override, go back to auto" style="margin-left:4px;">&#8635;</button>`);
        resetBtn.onclick = ()=>{ dataObj[overrideKey] = null; saveState(); refreshMonthlyLedgerComputedOnly(); renderMonthlyLedgerWindowInPlace(); };
        wrap.appendChild(resetBtn);
      }
      container.appendChild(wrap);
      return;
    }
    const wrap = el(`<div class="field" style="margin-bottom:0;"><label style="font-size:11.5px;">${escapeHtml(c.label)}</label><input type="text" inputmode="decimal" value="${formatAsianAmount(dataObj[c.key])}"></div>`);
    const inp = wrap.querySelector('input');
    wireAmountInput(inp, (num)=>{
      dataObj[c.key] = num; saveState(); refreshMonthlyLedgerComputedOnly();
    });
    container.appendChild(wrap);
  });
}
