   older/oddly-labelled sheets be imported without matching the exact CoA
   wording, and lets the person point a file at any of their custom
   historical categories.
   overrideYear: when set (from the import form's optional year picker),
   replaces just the YEAR portion of whatever from/to date and range label
   get read from B5, in case the source sheet's year is missing, wrong, or
   ambiguous - the month/day/voucher-range text as written are kept as-is. */
async function parseHistoricalNotesheetFile(file, overrideCatKey, overrideYear){
  await loadExcelJS();
  const buf = await file.arrayBuffer();
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(buf);
  if(!wb.worksheets.length) throw new Error('Could not read this workbook - no sheet found.');

  // One .xlsx can contain several notesheets, one per tab (e.g. a combined
  // "transport 01-10.xlsx" with tabs "transport 08", "transport 09",
  // "transport 10" ...). Parse every sheet and return one record per sheet
  // that successfully parses; sheets that don't look like a notesheet at
  // all (no recognizable header) are skipped rather than failing the whole
  // file, but a sheet that looks like a notesheet yet has a real problem
  // still throws so the person sees it.
  const records = [];
  const sheetErrors = [];
  for(const ws of wb.worksheets){
    try{
      const rec = parseHistoricalNotesheetSheet(ws, file, overrideCatKey, overrideYear);
      if(rec) records.push(rec);
    }catch(e){
      sheetErrors.push(`${ws.name}: ${e.message}`);
    }
  }
  if(records.length===0){
    throw new Error(sheetErrors.length ? sheetErrors.join(' | ') : 'No recognizable notesheet found in this workbook.');
  }
  return records;
}
function parseHistoricalNotesheetSheet(ws, file, overrideCatKey, overrideYear){
  const cellText = addr => {
    const v = ws.getCell(addr).value;
    if(v==null) return '';
    if(typeof v==='object' && 'richText' in v) return v.richText.map(rt=>rt.text).join('');
    if(typeof v==='object' && 'result' in v) return String(v.result||'');
    if(v instanceof Date) return v.toISOString();
    return String(v);
  };
  const COLS = ['A','B','C','D','E','F','G','H','I','J','K'];

  // Locate the "III/.../Withdraw/<Category>/<Number>" header line - it can
  // sit at B3 or C3 depending on the sheet's layout, so scan a small
  // neighborhood rather than assuming one fixed cell.
  let b3 = '', b3Found = false;
  outerB3:
  for(let r=1;r<=6;r++){
    for(const col of COLS){
      const text = cellText(col+r).trim();
      if(text.includes('/Withdraw/')){ b3 = text; b3Found = true; break outerB3; }
    }
  }
  if(!b3Found) return null; // doesn't look like a notesheet at all - skip silently

  let cat;
  if(overrideCatKey){
    cat = findHistoryCategory(overrideCatKey);
    if(!cat) throw new Error(`Unrecognized category key "${overrideCatKey}".`);
  } else {
    // Real notesheet headers don't always follow the exact slash layout
    // this app currently writes, and the category word inside them isn't
    // always an exact match either (e.g. "Transport expense" vs the
    // category's own label "Transport") - so instead of picking one fixed
    // slash-separated part and requiring an exact match, check the whole
    // header line for any known category name appearing in it, preferring
    // the longest/most specific name so e.g. "Books & Stationery" wins
    // over a shorter unrelated partial match.
    const b3Norm = normalizeCatLabel(b3);
    const candidates = historyCategories().slice().sort((a,b)=>
      normalizeCatLabel(b.notesheetLabel||b.label).length - normalizeCatLabel(a.notesheetLabel||a.label).length);
    cat = candidates.find(c=> b3Norm.includes(normalizeCatLabel(c.notesheetLabel)) || b3Norm.includes(normalizeCatLabel(c.label)));
    if(!cat) throw new Error(`Unrecognized category in the notesheet header: "${b3}" - pick a category in the import form instead.`);
  }

  // The date-range sentence is normally at B5, but some older/exported
  // notesheets shift it down or across a column or two (extra title rows,
  // merged cells, etc.) - scan a small neighborhood of rows/columns for the
  // matching sentence instead of assuming it's exactly at B5.
  // Two known phrasings show up in the wild:
  //   "...from 1st July 2024 - 15th July 2024 (voucher no: X - Y)"
  //   "...from 1st July 2024 to 15th July 2024" (voucher info in a
  //    separate following sentence, e.g. "Voucher no( ... )")
  // The voucher numbers themselves aren't used anywhere below (only the
  // dates are), so the regex only needs to capture the date range and can
  // accept either "-" or "to" as the separator, with or without a trailing
  // voucher clause.
  const DATE_RANGE_RE = /from\s+(\d+)\w*\s+([A-Za-z]+)\s+(\d{4})\s*(?:-|to)\s*(\d+)\w*\s+([A-Za-z]+)\s+(\d{4})/i;
  let m = null;
  outerScan:
  for(let r=1;r<=15;r++){
    for(const col of COLS){
      const text = cellText(col+r).trim();
      if(!text) continue;
      const found = text.match(DATE_RANGE_RE);
      if(found){ m = found; break outerScan; }
    }
  }
  if(!m) throw new Error('Could not read the date-range sentence in this notesheet.');
  // Source sheets aren't consistent about writing the full month name -
  // some use abbreviations ("Feb"), and at least one had a plain typo
  // ("Octoberber"). Accept an exact match first, then fall back to
  // whichever direction of prefix-match makes sense: the written text is
  // a prefix of the real month name (abbreviations), or the real month
  // name is a prefix of the written text (typo'd extra letters tacked on
  // the end). Require at least 3 letters so short/ambiguous fragments
  // don't silently match the wrong month.
  const monthIdx = name => {
    const n = name.toLowerCase();
    let idx = MONTHS.findIndex(mm=>mm.toLowerCase()===n);
    if(idx>=0) return idx;
    if(n.length>=3) idx = MONTHS.findIndex(mm=>{
      const ml = mm.toLowerCase();
      return ml.startsWith(n) || n.startsWith(ml);
    });
    return idx;
  };
  const fMonth = monthIdx(m[2]), tMonth = monthIdx(m[5]);
  if(fMonth<0 || tMonth<0) throw new Error(`Unrecognized month name in the date range: "${m[2]}" / "${m[5]}".`);
  const fYear = overrideYear || m[3];
  const tYear = overrideYear || m[6];
  const fromDate = `${fYear}-${String(fMonth+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const toDate = `${tYear}-${String(tMonth+1).padStart(2,'0')}-${m[4].padStart(2,'0')}`;
  const rangeLabel = `${m[1]} ${MONTHS[fMonth].slice(0,3)} ${fYear} - ${m[4]} ${MONTHS[tMonth].slice(0,3)} ${tYear}`;

  // The item table's header row has "S/no" (or a close variant),
  // "Description", and "Amount" as separate cells - but NOT necessarily in
  // adjacent columns (e.g. S/no in D, Description in E, Amount all the way
  // over in I, with blank columns in between for print spacing). So each
  // column is found independently by matching its own header text on
  // whichever row the "S/no" cell turns up in, rather than assuming
  // Description/Amount sit right next to S/no.
  const normHeader = s => s.toLowerCase().replace(/[.\s]/g,'');
  const SNO_VARIANTS = new Set(['s/no','sno','sl','slno','serialno','s/n']);
  let headerRow = null, voucherCol = null;
  outerHeaderScan:
  for(let r=1;r<=25;r++){
    for(const col of COLS){
      const text = normHeader(cellText(col+r).trim());
      if(text && SNO_VARIANTS.has(text)){ headerRow = r; voucherCol = col; break outerHeaderScan; }
    }
  }
  if(!headerRow) throw new Error('Could not find the item table (S/no header) in this notesheet.');

  let descCol = null, amountCol = null;
  for(const col of COLS){
    const text = normHeader(cellText(col+headerRow).trim());
    if(!descCol && text==='description') descCol = col;
    if(!amountCol && text==='amount') amountCol = col;
  }
  // Fall back to the two columns right after S/no if a label wasn't found
  // (e.g. a blank/merged header cell) - matches the layout this app itself
  // writes when generating notesheets.
  const voucherColIdx = COLS.indexOf(voucherCol);
  if(!descCol) descCol = COLS[voucherColIdx+1];
  if(!amountCol) amountCol = COLS[voucherColIdx+2];

  const items = [];
  for(let r=headerRow+1; r<headerRow+500; r++){
    const cVal = cellText(voucherCol+r).trim();
    const dVal = cellText(descCol+r).trim();
    const eVal = cellText(amountCol+r).trim();
    if(/^total\s*amount/i.test(cVal)) break;
    if(cVal==='' && dVal==='' && eVal==='') continue; // skip blank spacer rows rather than stopping
    const amt = Number(eVal.replace(/,/g,''))||0;
    if(amt>0) items.push({voucher:cVal, desc:dVal, amount:amt});
  }
  if(items.length===0) throw new Error('No line items found in this notesheet.');
  const total = items.reduce((s,it)=>s+it.amount,0);

  return {id:uid(), fileName:file.name+' ('+ws.name+')', catKey:cat.key, fromDate, toDate, rangeLabel, items, total, importedAt:new Date().toISOString()};
}
function voucherYearsPresent(list){
  const years = new Set((list || allVouchers()).map(v=>v.date.slice(0,4)));
  return Array.from(years).sort().reverse();
}
/* --- Advanced Search text matching --------------------------------------
   Plain substring-of-the-whole-phrase matching means you have to remember
   the description almost exactly. This is a lighter, offline stand-in for
   "search-engine-like" matching: the query is split into words, and a
   voucher matches if every query word is found somewhere in the
   description/voucher/note - as a substring OR close enough in spelling
   (small typo tolerance that scales with word length) - in any order,
   anywhere among the three fields. It's not real synonym/meaning search
   (e.g. it won't know "microbus" and "gari" refer to the same thing) -
   that would need an AI/internet lookup this offline app doesn't have -
   but it forgives typos, wrong word order, and only remembering part of
   what was written. */
function normalizeSearchText(s){
  return String(s||'').toLowerCase()
    .replace(/[.,;:()\-_/\\।]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function levenshteinDistance(a,b){
  if(a===b) return 0;
  const al=a.length, bl=b.length;
  if(al===0) return bl;
  if(bl===0) return al;
  const dp = new Array(bl+1);
  for(let j=0;j<=bl;j++) dp[j]=j;
  for(let i=1;i<=al;i++){
    let prev = dp[0];
    dp[0]=i;
    for(let j=1;j<=bl;j++){
      const tmp = dp[j];
      dp[j] = Math.min(dp[j]+1, dp[j-1]+1, prev + (a[i-1]===b[j-1]?0:1));
      prev = tmp;
    }
  }
  return dp[bl];
}
function wordsCloseEnough(qWord, textWord){
  if(!qWord || !textWord) return false;
  if(textWord.includes(qWord) || qWord.includes(textWord)) return true;
  const maxDist = qWord.length<=3 ? 0 : (qWord.length<=6 ? 1 : 2);
  return levenshteinDistance(qWord, textWord) <= maxDist;
}
/* Your own synonym groups (state.synonymGroups: array of word-groups, e.g.
   [["microbus","gari","vehicle"], ["servicing","repair","meramot"]]) let a
   search word also match anything else in its group - a fixed, offline
   stand-in for "similar word" search, entirely under your control (see
   the "Synonym groups" panel in Advanced Search). Only groups containing
   a word close to qWord (by the same substring/typo rule above) expand
   the search. */
function synonymExpand(qWord){
  const groups = state.synonymGroups || [];
  const expansions = new Set([qWord]);
  groups.forEach(group=>{
    const gWordsNorm = (group||[]).map(w=>normalizeSearchText(w)).filter(Boolean);
    if(gWordsNorm.some(gw=>wordsCloseEnough(qWord, gw))){
      gWordsNorm.forEach(gw=>expansions.add(gw));
    }
  });
  return Array.from(expansions);
}
function textMatchesQuery(haystack, query){
  const qWords = normalizeSearchText(query).split(' ').filter(Boolean);
  if(!qWords.length) return true;
  const hWords = normalizeSearchText(haystack).split(' ').filter(Boolean);
  return qWords.every(qw=>{
    const candidates = synonymExpand(qw);
    return hWords.some(hw => candidates.some(cw=>wordsCloseEnough(cw, hw)));
  });
}
/* --- AI Search (Advanced Search "meaning" search) ------------------------
   Calls Claude directly from the browser (see the app's built-in Anthropic
   API access) to find entries the query is plausibly ABOUT, not just
   entries that contain matching words - real synonym/meaning matching,
   unlike textMatchesQuery above which only knows the synonym groups you
   typed in yourself. This only works while this file is open inside a
   Claude.ai chat/artifact preview: that's the only place the fetch below
   is authorized to reach api.anthropic.com without your own API key. Open
   as a plain file (double-clicked, or hosted on GitHub Pages/anywhere
   else), the fetch will fail - callers must catch that and say so, never
   leave the person staring at a stuck spinner. */
const AI_SEARCH_CANDIDATE_CAP = 300;
async function aiSearchVouchers(query, candidates){
  const capped = candidates.length > AI_SEARCH_CANDIDATE_CAP
    ? candidates.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0, AI_SEARCH_CANDIDATE_CAP)
    : candidates;
  const payload = capped.map((v,i)=>({i, date:v.date, cat:v.cat.label, voucher:v.voucher, desc:v.desc, note:v.note||'', amount:v.amount}));
  const system = "You help search a Bengali madrasa's expense ledger. You are given a search QUERY (may be Bengali, English, or mixed, and may use different words than the ledger text - synonyms, related terms, abbreviations, or a description of what the item/service IS rather than its exact name) and a JSON array of ENTRIES, each with an index \"i\". Return ONLY a JSON array of the \"i\" values of entries that plausibly refer to what the query is about. Consider desc, voucher, note, and cat together. Be reasonably inclusive of true synonyms/related items but exclude entries that are clearly unrelated. Respond with ONLY a JSON array of integers - no words, no markdown fences, no explanation.";
  const userMsg = `QUERY: ${query}\n\nENTRIES:\n${JSON.stringify(payload)}`;
  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system,
      messages: [{role:"user", content:userMsg}]
    })
  });
  if(!resp.ok) throw new Error('AI request failed (HTTP '+resp.status+')');
  const data = await resp.json();
  const text = (data.content||[]).map(c=>c.text||'').join('');
  const clean = text.replace(/```json|```/g,'').trim();
  let idxs;
  try{ idxs = JSON.parse(clean); }catch(e){ throw new Error('Could not read the AI response'); }
  if(!Array.isArray(idxs)) throw new Error('Unexpected AI response');
  return idxs.map(Number).filter(i=>Number.isInteger(i) && i>=0 && i<capped.length).map(i=>capped[i]);
}
function filteredVouchers(f, list){
  return (list || allVouchers()).filter(v=>{
    if(f.catKeys && f.catKeys.length && !f.catKeys.includes(v.catKey)) return false;
    if(f.catKey && v.catKey!==f.catKey) return false;
    if(f.year && v.date.slice(0,4)!==f.year) return false;
    if(f.month && v.date.slice(5,7)!==f.month) return false;
    if(f.fromDate && v.date<f.fromDate) return false;
    if(f.toDate && v.date>f.toDate) return false;
    if(f.text){
      const haystack = v.desc + ' ' + v.voucher + ' ' + (v.note||'');
      if(!textMatchesQuery(haystack, f.text)) return false;
    }
    if(f.minAmt!=='' && f.minAmt!==undefined && v.amount<Number(f.minAmt)) return false;
    if(f.maxAmt!=='' && f.maxAmt!==undefined && v.amount>Number(f.maxAmt)) return false;
    return true;
  });
}
function groupSum(vouchers, keyFn, labelFn){
  const map = new Map();
  vouchers.forEach(v=>{
    const k = keyFn(v);
    map.set(k, (map.get(k)||0) + v.amount);
  });
  return Array.from(map.entries())
    .sort((a,b)=>a[0].localeCompare(b[0]))
    .map(([k,total])=>({key:k, label:labelFn?labelFn(k):k, total}));
}

/* --- Simple password lock screen -------------------------------------
   This only gates the on-screen view; the underlying data in browser
   storage is NOT encrypted, so it isn't real protection against someone
   who opens dev tools - it's a screen lock, not a vault. We hash the
   password (SHA-256) rather than store it in plain text, purely so it
   isn't sitting in the open in state. */
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* Security question: one shared question/answer used to verify identity
   before changing any of the three lock passwords below (login, day-lock,
   month-lock). The answer is normalized (trimmed, lowercased) before
   hashing so capitalization/whitespace don't cause false rejections. */
function normalizeSecurityAnswer(s){ return (s||'').trim().toLowerCase(); }
async function verifySecurityAnswer(answer){
  if(!state.securityAnswerHash) return false;
  const h = await sha256Hex(normalizeSecurityAnswer(answer));
  return h === state.securityAnswerHash;
}

/* --- Data Encryption (vault) ------------------------------------------
   Real encryption of the saved data itself, on top of (and independent
   from) the screen-lock above. AES-256-GCM with a key derived from a
   user passphrase via PBKDF2-SHA256 (600,000 iterations - the strongest
   practical choice available through the browser's native Web Crypto
   API, which is what every reputable password manager and encrypted-
   notes tool builds on; there is no dependency-free way to reach for
   memory-hard KDFs like Argon2 without pulling in an external library,
   which would mean trusting that library's supply chain with the same
   financial data this feature exists to protect - so PBKDF2 at a high
   iteration count is the deliberate choice here, not a shortcut).
   Nothing about the passphrase or the derived key is ever written to
   disk/cloud - only the random salt and the ciphertext are. That means
   there is NO recovery path if the passphrase is lost; that's what makes
   this real encryption rather than a resettable screen lock. */
const VAULT_ENC_MAGIC = '__ledgerEnc';
function b64FromBuf(buf){
  // NOTE: deliberately NOT String.fromCharCode(...new Uint8Array(buf)) -
  // spreading a large typed array passes every byte as its own function
  // argument, and engines cap how many arguments a call can take (tens of
  // thousands). This buffer is the whole encrypted app state, which easily
  // exceeds that once notesheet history builds up, so the spread form
  // throws "Maximum call stack size exceeded" on save. A plain byte-by-byte
  // loop has no such limit.
  const bytes = new Uint8Array(buf);
  let binary = '';
  for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
function bufFromB64(b64){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }
async function deriveVaultKey(passphrase, saltBytes){
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), {name:'PBKDF2'}, false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: saltBytes, iterations: 600000, hash:'SHA-256'},
    baseKey, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function vaultEncrypt(plainText, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(plainText));
  return { iv: b64FromBuf(iv), data: b64FromBuf(cipherBuf) };
}
async function vaultDecrypt(envelope, key){
  const iv = new Uint8Array(bufFromB64(envelope.iv));
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, bufFromB64(envelope.data));
  return new TextDecoder().decode(plainBuf);
}
function looksLikeVaultEnvelope(text){
  try{
    const obj = JSON.parse(text);
    if(obj && obj[VAULT_ENC_MAGIC]===true && obj.salt && obj.iv && obj.data) return obj;
  }catch(e){}
  return null;
}
/* Wraps a plain state-JSON string for persistence: encrypted if the
   vault is currently on and unlocked, otherwise passed through as-is. */
async function serializeForPersistence(plainJson){
  if(vaultEnabled && vaultKey){
    const {iv,data} = await vaultEncrypt(plainJson, vaultKey);
    return JSON.stringify({[VAULT_ENC_MAGIC]:true, v:1, salt:vaultSaltB64, iv, data});
  }
  return plainJson;
}
/* Tries to unlock the envelope captured at load time with a passphrase
   the person just typed. On success, loads it as the live state and
   keeps the derived key in memory for subsequent saves this session. */
async function attemptVaultUnlock(passphrase){
  if(!pendingVaultEnvelope) return false;
  try{
    const saltBytes = new Uint8Array(bufFromB64(pendingVaultEnvelope.salt));
    const key = await deriveVaultKey(passphrase, saltBytes);
    const plainJson = await vaultDecrypt(pendingVaultEnvelope, key);
    const parsed = JSON.parse(plainJson);
    state = parsed;
    migrateState();
    vaultKey = key;
    vaultSaltB64 = pendingVaultEnvelope.salt;
    vaultEnabled = true;
    vaultLocked = false;
    pendingVaultEnvelope = null;
    locked = !!state.lockPasswordHash;
    return true;
  }catch(e){
    return false; // wrong passphrase, or corrupted/tampered data
  }
}
/* Promise-based passphrase prompt for one-off decrypt operations (an
   encrypted file being connected, or an encrypted backup being
   imported) that aren't the main boot-time unlock screen. */
function promptVaultPassphrase(message){
  return new Promise((resolve)=>{
    const overlay = el(`
      <div class="modal-overlay">
        <div class="modal-box">
          <p>${escapeHtml(message)}</p>
          <input type="password" id="vault-pp-input" autocomplete="current-password" placeholder="Encryption passphrase" style="margin:2px 0 4px;">
          <div id="vault-pp-error" style="color:var(--danger); font-size:12.5px; margin:-2px 0 8px; min-height:1em;"></div>
          <div class="modal-actions">
            <button class="secondary" type="button" id="vault-pp-cancel">Cancel</button>
            <button class="danger" type="button" id="vault-pp-ok">Unlock</button>
          </div>
        </div>
      </div>
    `);
    document.body.appendChild(overlay);
    const input = overlay.querySelector('#vault-pp-input');
    wirePasswordToggle(input);
    const finish = (val)=>{ overlay.remove(); resolve(val); };
    overlay.querySelector('#vault-pp-cancel').onclick = ()=> finish(null);
    overlay.querySelector('#vault-pp-ok').onclick = ()=>{
      const v = input.value||'';
      if(!v) return;
      finish(v);
    };
    input.onkeydown = (e)=>{ if(e.key==='Enter') overlay.querySelector('#vault-pp-ok').click(); };
    let downOnBackdrop = false;
    overlay.addEventListener('mousedown', (e)=>{ downOnBackdrop = (e.target===overlay); });
    overlay.addEventListener('mouseup', (e)=>{ if(downOnBackdrop && e.target===overlay) finish(null); downOnBackdrop=false; });
    setTimeout(()=>input.focus(), 30);
  });
}

function addDaysStr(dateStr, delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  // Build the "YYYY-MM-DD" string from the Date object's own local
  // year/month/day fields, NOT toISOString() (which converts to UTC first -
  // for any timezone ahead of UTC, e.g. Bangladesh/UTC+6, local midnight
  // converts to the previous UTC day, silently shifting the result back by
  // one day and cancelling out a +1-day advance).
  return toLocalDateStr(d);
}
/* An IOU carries forward automatically from the day it's added until it's
   removed - "removed" just closes off its toDate so it stops appearing on
   later days, without touching the days it already appeared on. */
function activeIousForDay(dateStr){
  return state.iouRegistry.filter(r => r.fromDate<=dateStr && (r.toDate===null || dateStr<=r.toDate));
}
/* Payables are the reverse of an IOU: money the institution owes a
   person (e.g. they fronted more than their advance covered). Tracked
   separately so it's visible and doesn't get forgotten, but - unlike an
   IOU - it is NOT subtracted from cash in hand, since it isn't cash
   currently held; it's a future obligation to pay out. */
function activePayablesForDay(dateStr){
  return state.payableRegistry.filter(r => r.fromDate<=dateStr && (r.toDate===null || dateStr<=r.toDate));
}

/* Bangladeshi (Indian numbering: Crore/Lakh/Thousand) taka-in-words formatter */
const NUM_ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const NUM_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function twoDigitWords(n){
  if(n<20) return NUM_ONES[n];
  const t=Math.floor(n/10), o=n%10;
  return NUM_TENS[t] + (o? ' '+NUM_ONES[o] : '');
}
function threeDigitWords(n){
  const h=Math.floor(n/100), r=n%100;
  const parts=[];
  if(h) parts.push(NUM_ONES[h]+' Hundred');
  if(r) parts.push(twoDigitWords(r));
  return parts.join(' ');
}
function takaInWords(amount){
  let n = Math.round(Number(amount)||0);
  if(n===0) return 'Zero Taka Only';
  const neg = n<0; n = Math.abs(n);
  const crore = Math.floor(n/10000000); n%=10000000;
  const lakh = Math.floor(n/100000); n%=100000;
  const thousand = Math.floor(n/1000); n%=1000;
  const rest = n;
  const parts=[];
  if(crore) parts.push(threeDigitWords(crore)+' Crore');
  if(lakh) parts.push(twoDigitWords(lakh)+' Lac');
  if(thousand) parts.push(twoDigitWords(thousand)+' Thousand');
  if(rest) parts.push(threeDigitWords(rest));
  return (neg?'Minus ':'')+parts.join(' ')+' Taka Only';
}
/* The month a notesheet's signature block shows is always the real
   calendar month/year the sheet is generated in (today's actual date) -
   deliberately NOT tied to the Daily Ledger's currently-selected month
   dropdown (state.month/state.year), which covers the accounting period
   being worked on and can easily be left on an earlier month while
   today's real date has already moved on - that mismatch is exactly what
   used to make a freshly-generated notesheet still show last month's name
   in the signature. */
function monthYearAbbr(){
  const d = new Date();
  return MONTHS[d.getMonth()].slice(0,3)+' '+String(d.getFullYear()).slice(-2);
}
/* A real Date value (1st of the current calendar month) to store in a
   hidden reference cell on each notesheet, so the "month" line under
   every signatory can be a formula that reads this cell (TEXT(...,
   "mmm-yy")) instead of a typed-in string with no traceable source. The
   date itself is never displayed - only its formatted month/year. */
function monthRefDate(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
/* Third signature line under Name/Designation on notesheets: a bare
   "Jul 26" with no label reads like a stray date, so it's always prefixed
   "Ref: " - and there's deliberately no separate "Date" line/label at all. */
function monthRefLine(){
  return `Ref: ${monthYearAbbr()}`;
}

/* ======================================================================
   Notesheet / Withdraw Summary generation
   Gathers every CoA voucher across a chosen date range, grouped by
   category (skipping categories with no expense in that range), so it
   can be exported as one notesheet per category plus a Withdraw Summary,
   in the same voucher-code, date-range and signature-block style used in
   Rafsan's existing hand-built notesheets.
   ====================================================================== */
function collectNotesheetRange(startDate, endDate){
  const days = state.days.filter(d=>d.date>=startDate && d.date<=endDate).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const cats = [];
  SUMMARY_ORDER.forEach(key=>{
    const cat = COA.find(c=>c.key===key);
    const rawItems = [];
    days.forEach(day=>{
      (day.coa[key]||[]).forEach(it=>{
        const amt = Number(it.amount)||0;
        if(amt>0){ rawItems.push({voucher:it.voucher, desc:it.desc||cat.label, amount:amt, date:day.date}); }
      });
    });
    if(rawItems.length===0) return;
    // If the same description (e.g. the same person's name, for a salary
    // or honorarium category) appears more than once in this category,
    // combine them into one line with the summed amount - instead of
    // repeating that name/description on separate lines.
    const byDesc = new Map();
    const items = [];
    rawItems.forEach(it=>{
      const existing = byDesc.get(it.desc);
      if(existing){ existing.amount += it.amount; existing.voucher += `, ${it.voucher}`; }
      else{ const merged = {voucher:it.voucher, desc:it.desc, amount:it.amount, date:it.date}; byDesc.set(it.desc, merged); items.push(merged); }
    });
    const total = items.reduce((s,it)=>s+it.amount,0);
    cats.push({key, cat, items, total, firstDate:rawItems[0].date, lastDate:rawItems[rawItems.length-1].date,
               firstVoucher:rawItems[0].voucher, lastVoucher:rawItems[rawItems.length-1].voucher});
  });
  const grandTotal = cats.reduce((s,c)=>s+c.total,0);
  return {cats, grandTotal};
}

/* ======================================================================
   Storage
   ====================================================================== */
/* window.storage only exists inside Claude.ai. When this file is opened
   directly in a browser (downloaded, double-clicked, or self-hosted),
   window.storage isn't there at all, so we fall back to the browser's own
   localStorage - which works fine in a normal tab - so data still
   survives reloads. Claude.ai is always tried first so nothing changes
   for artifact use. */
const LOCAL_STORAGE_KEY = 'daily_cash_bank_ledger_state_v1';

/* --- File System Access API: optional direct-to-disk auto-save ---------
   Chrome/Edge only (Firefox/Safari don't implement it - the feature just
   hides itself there and window.storage/localStorage remain the only
   record). Lets the person link this tool to one real file on their
   computer; every change then writes straight to that file, so the data
   survives PC restarts and isn't tied to any one browser profile. The
   FileSystemFileHandle itself is remembered in IndexedDB (localStorage
   can't hold a handle object) so we can try to silently reconnect on the
   next page load - though the browser may still require a fresh click to
   re-grant permission, by design. */
let fsFileHandle = null;
let fsFileName = '';
function fsApiSupported(){
  return typeof window!=='undefined' && typeof window.showOpenFilePicker==='function' && typeof window.showSaveFilePicker==='function';
}
function idbGet(key){
  return new Promise((resolve)=>{
    try{
      const req = indexedDB.open('ledger-fs-links', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
      req.onsuccess = ()=>{
        const tx = req.result.transaction('handles','readonly');
        const g = tx.objectStore('handles').get(key);
        g.onsuccess = ()=>resolve(g.result||null);
        g.onerror = ()=>resolve(null);
      };
      req.onerror = ()=>resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbSet(key, value){
  return new Promise((resolve)=>{
    try{
      const req = indexedDB.open('ledger-fs-links', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
      req.onsuccess = ()=>{
        const tx = req.result.transaction('handles','readwrite');
        tx.objectStore('handles').put(value, key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>resolve(false);
      };
      req.onerror = ()=>resolve(false);
    }catch(e){ resolve(false); }
  });
}
function idbDelete(key){
  return new Promise((resolve)=>{
    try{
      const req = indexedDB.open('ledger-fs-links', 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
      req.onsuccess = ()=>{
        const tx = req.result.transaction('handles','readwrite');
        tx.objectStore('handles').delete(key);
        tx.oncomplete = ()=>resolve(true);
        tx.onerror = ()=>resolve(false);
      };
      req.onerror = ()=>resolve(false);
    }catch(e){ resolve(false); }
  });
}
async function writeStateToConnectedFile(preSerialized){
  if(!fsFileHandle) return;
  try{
    const perm = await fsFileHandle.queryPermission({mode:'readwrite'});
    if(perm!=='granted') return; // don't block saving elsewhere; UI offers "Reconnect"
    const text = preSerialized!==undefined ? preSerialized : await serializeForPersistence(JSON.stringify(state, null, 2));
    const writable = await fsFileHandle.createWritable();
    await writable.write(text);
    await writable.close();
  }catch(e){ /* disk write failed - window.storage/localStorage still has the data */ }
}
async function connectToFile(){
  if(!fsApiSupported()){
    showAlert("This browser can't connect directly to a file (needs Chrome or Edge). Use Export/Import backup instead.");
    return;
  }
  let handle;
  try{
    [handle] = await window.showOpenFilePicker({
      types:[{description:'Ledger backup', accept:{'application/json':['.json']}}]
    });
  }catch(e){
    return; // person cancelled the picker
  }
  try{
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ showAlert('Permission to read/write that file was not granted.'); return; }
    const file = await handle.getFile();
    const text = await file.text();
    if(text && text.trim()){
      let parsed;
      const envelope = looksLikeVaultEnvelope(text);
      if(envelope){
        const pass = await promptVaultPassphrase('This file is encrypted. Enter its passphrase to load it.');
        if(pass===null) return;
        try{
          const saltBytes = new Uint8Array(bufFromB64(envelope.salt));
          const key = await deriveVaultKey(pass, saltBytes);
          const plainJson = await vaultDecrypt(envelope, key);
          parsed = JSON.parse(plainJson);
          vaultKey = key; vaultSaltB64 = envelope.salt; vaultEnabled = true;
        }catch(e){
          showAlert('Incorrect passphrase, or the file could not be read.');
          return;
        }
      } else {
        try{ parsed = JSON.parse(text); }catch(e){ parsed = null; }
      }
      if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.days)){
        showAlert("That file isn't a ledger backup. Pick an empty/new file, or one exported from this tool.");
        return;
      }
      showConfirm(`"${handle.name}" already has ledger data in it. Load that data now (replacing what's currently shown here)?`, async ()=>{
        state = parsed;
        migrateState();
        selectedDayId = null;
        locked = !!state.lockPasswordHash;
        fsFileHandle = handle; fsFileName = handle.name;
        await idbSet('lastHandle', handle);
        await saveState();
        render();
      }, 'Load from file');
    } else {
      fsFileHandle = handle; fsFileName = handle.name;
      await idbSet('lastHandle', handle);
      await writeStateToConnectedFile();
      render();
    }
  }catch(e){ showAlert('Could not connect to that file.'); }
}
async function createNewFile(){
  if(!fsApiSupported()){
    showAlert("This browser can't connect directly to a file (needs Chrome or Edge). Use Export/Import backup instead.");
    return;
  }
  let handle;
  try{
    handle = await window.showSaveFilePicker({
      suggestedName: (state.month&&state.year?`Ledger_${state.month}${state.year}`:'Ledger_Data')+'.json',
      types:[{description:'Ledger backup', accept:{'application/json':['.json']}}]
    });
  }catch(e){
    return; // person cancelled the picker
  }
  try{
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm!=='granted'){ showAlert('Permission to write that file was not granted.'); return; }
    fsFileHandle = handle; fsFileName = handle.name;
    await idbSet('lastHandle', handle);
    await writeStateToConnectedFile();
    render();
  }catch(e){ showAlert('Could not create that file.'); }
}
async function disconnectFile(){
  fsFileHandle = null;
  fsFileName = '';
  await idbDelete('lastHandle');
  render();
}
async function tryReconnectFile(){
  if(!fsApiSupported()) return;
  const handle = await idbGet('lastHandle');
  if(!handle) return;
  try{
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){ fsFileHandle = handle; fsFileName = handle.name; }
    // if not granted, leave fsFileHandle null - the header offers a
    // "Reconnect" button, since browsers require a fresh click to re-grant
  }catch(e){ /* handle may be stale (file moved/deleted) */ }
}

async function saveState(){
  if(vaultLocked) return; // never overwrite still-encrypted storage with the placeholder state
  const plainJson = JSON.stringify(state);
  const toWrite = await serializeForPersistence(plainJson);
  let savedToCloud = false;
  try{
    const res = await window.storage.set('state', toWrite);
    if(res) savedToCloud = true;
  }catch(e){ /* window.storage not available here */ }
  let savedLocally = false;
  if(!savedToCloud){
    try{ localStorage.setItem(LOCAL_STORAGE_KEY, toWrite); savedLocally = true; }
    catch(e){ /* localStorage blocked too (e.g. private browsing, or quota/size exceeded) */ }
  }
  writeStateToConnectedFile(toWrite);
  if(!savedToCloud && !savedLocally) warnSaveFailed();
}
let saveFailWarned = false; // only nag once per session, not on every keystroke while storage stays full
function warnSaveFailed(){
  if(saveFailWarned) return;
  saveFailWarned = true;
  showAlert("IMPORTANT: your latest change could NOT be saved (storage is full or unavailable - this often happens once the app's data grows very large). Please export a backup right now (Settings \u2192 Export backup) before closing the app, or this and any further changes will be lost.");
}
function migrateState(){
  const d = defaultState();
  if(state.days && state.days.length) state.days.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(Array.isArray(state.withdrawNotesheetLog)){
    state.withdrawNotesheetLog.forEach(log=>{
      if(log.migratedToML) return;
      log.migratedToML = true;
      const attribDate = log.generatedDate || log.endDate;
      if(!attribDate || !Array.isArray(log.categories) || log.categories.length===0) return;
      const [y, m] = attribDate.split('-');
      const mlKey = monthKeyFor(MONTHS[parseInt(m,10)-1], y);
      const mlRec = getMonthlyLedgerMonth(mlKey);
      const amounts = {};
      log.categories.forEach(cat=>{
        const coaCat = COA.find(c=>coaText(c,'summaryLabel')===cat.label || c.summaryLabel===cat.label);
        if(!coaCat) return;
        let col = mlRec.expenditureColumns.find(c=>c.source==='coa' && c.coaKey===coaCat.key);
        if(!col){ col = {id:uid(), label:coaCat.label, source:'coa', coaKey:coaCat.key}; mlRec.expenditureColumns.push(col); }
        amounts[col.id] = (amounts[col.id]||0) + (Number(cat.total)||0);
      });
      if(Object.keys(amounts).length) mlRec.expenditureEntries.push({id:uid(), date:attribDate, desc:`Withdraw Notesheet ${log.summaryLabel||''}`, amounts});
    });
  }
  // Every generated notesheet's full Excel file gets embedded (as base64)
  // in its log entry for later re-download - this grows without bound and
  // eventually pushes the whole saved state past the storage size limit,
  // causing saves to silently fail (the in-memory app keeps working, but
  // nothing persists - data appears to "vanish" on next open). Keep the
  // re-downloadable file for only the most recent entries; older ones keep
  // all their real figures (categories, totals, dates) but drop the file
  // bytes - they can always be regenerated from the underlying data.
  const KEEP_FILES = 25;
  [state.depositNotesheetLog, state.withdrawNotesheetLog].forEach(log=>{
    if(!Array.isArray(log) || log.length<=KEEP_FILES) return;
    log.slice(0, log.length-KEEP_FILES).forEach(entry=>{ if(entry.fileBase64) delete entry.fileBase64; });
  });
  if(!state.notesheetCounters) state.notesheetCounters = d.notesheetCounters;
  else COA.forEach(c=>{ if(!(c.key in state.notesheetCounters)) state.notesheetCounters[c.key] = 0; });
  if(state.summaryCounterYear===undefined) state.summaryCounterYear = d.summaryCounterYear;
  if(state.summaryCounterNum===undefined) state.summaryCounterNum = d.summaryCounterNum;
  if(!state.signatories) state.signatories = d.signatories;
  if(!state.iouRegistry){
    /* Older saves kept IOUs as a plain per-day list with no carry-forward.
       Bring each of those in as a single-day entry so historical Cash In
       Hand figures for already-recorded days don't silently change. */
    state.iouRegistry = [];
    (state.days||[]).forEach(day=>{
      (day.ious||[]).forEach(i=>{
        state.iouRegistry.push({id:i.id||uid(), desc:i.desc, amount:i.amount, fromDate:day.date, toDate:day.date});
      });
      delete day.ious;
    });
  }
  (state.days||[]).forEach(day=>{ if(!day.bankTransfers) day.bankTransfers = []; });
  (state.days||[]).forEach(day=>{ ensureMiscCollectionSections(day); });
  (state.archive||[]).forEach(m=>{ (m.days||[]).forEach(day=>{ ensureMiscCollectionSections(day); }); });
  // Gratuity/Education Assistance Fund transfer used to be a plain manual
  // number per month (rec.revenueTransfer.gratuity/eduAssist); it's now
  // auto-computed from that month's Admission-Fee-only Deposit Notesheet
  // collections, with .gratuityOverride/.eduAssistOverride as the manual
  // override. One-time carry-over so already-recorded months keep showing
  // exactly what was typed in for them before, instead of silently
  // switching to the (likely 0, since old entries predate the
  // admissionFeeOnly split) auto-computed figure.
  Object.values(state.monthlyLedger.months||{}).forEach(rec=>{
    if(!rec.revenueTransfer || rec.revenueTransferMigrated) return;
    rec.revenueTransferMigrated = true;
    if(rec.revenueTransfer.gratuityOverride===undefined && Number(rec.revenueTransfer.gratuity)) rec.revenueTransfer.gratuityOverride = Number(rec.revenueTransfer.gratuity);
    if(rec.revenueTransfer.eduAssistOverride===undefined && Number(rec.revenueTransfer.eduAssist)) rec.revenueTransfer.eduAssistOverride = Number(rec.revenueTransfer.eduAssist);
  });
  // Cash in Hand / Balance in Bank Account used to lock in a manual
  // override on every single blur of their input - including just
  // clicking in and back out without typing anything - so a month could
  // silently end up "stuck" showing a frozen 0 forever instead of the
  // real auto-computed figure. Now fixed so only an actually-different
  // typed number creates an override; this one-time pass clears out any
  // exactly-zero override that's very likely a leftover from that old
  // behavior rather than a genuine "cash in hand really is zero" entry,
  // so auto-calculation can take back over. A genuinely nonzero override
  // is left untouched either way.
  Object.values(state.monthlyLedger.months||{}).forEach(rec=>{
    if(!rec.balanceSheet || rec.zeroOverrideMigrated) return;
    rec.zeroOverrideMigrated = true;
    if(rec.balanceSheet.cashInHandOverride===0) rec.balanceSheet.cashInHandOverride = null;
    if(rec.balanceSheet.bankBalanceOverride===0) rec.balanceSheet.bankBalanceOverride = null;
  });
  if(state.lockPasswordHash===undefined) state.lockPasswordHash = null;
  if(state.dayLockPasswordHash===undefined) state.dayLockPasswordHash = null;
  if(state.monthLockPasswordHash===undefined) state.monthLockPasswordHash = null;
  if(state.securityQuestion===undefined) state.securityQuestion = '';
  if(state.securityAnswerHash===undefined) state.securityAnswerHash = null;
  if(state.payableRegistry===undefined) state.payableRegistry = [];
  if(state.monthlyLedger===undefined) state.monthlyLedger = { months:{}, seed:null };
  if(state.settings===undefined) state.settings = defaultState().settings;
  if(state.settings.depositRevenueMap===undefined) state.settings.depositRevenueMap = defaultState().settings.depositRevenueMap;
  if(state.settings.exportFormat===undefined) state.settings.exportFormat = defaultState().settings.exportFormat;
  if(state.settings.coaOverrides===undefined) state.settings.coaOverrides = {};
  if(state.settings.revenueLabelOverrides===undefined) state.settings.revenueLabelOverrides = {};
  if(!state.archive) state.archive = [];
  if(!state.templates) state.templates = [];
  if(!state.bankStatements) state.bankStatements = {};
  if(!state.bankHolidays) state.bankHolidays = [];
  if(!state.fixedAssetRegister) state.fixedAssetRegister = { items: [] };
  if(!state.auditLog) state.auditLog = [];
  if(!state.historicalImports) state.historicalImports = [];
  if(!state.customHistoricalCategories) state.customHistoricalCategories = [];
  if(!state.synonymGroups) state.synonymGroups = [];
  Object.values((state.monthlyLedger&&state.monthlyLedger.months)||{}).forEach(rec=>{
    if(!rec.balanceSheet) rec.balanceSheet = { cashInHandOverride:null, advancePayment:0 };
    if(rec.balanceSheet.bankBalanceOverride===undefined) rec.balanceSheet.bankBalanceOverride = null;
    if(rec.balanceSheet.bankBreakdown===undefined) rec.balanceSheet.bankBreakdown = {};
    if(rec.balanceSheet.otherAsset===undefined) rec.balanceSheet.otherAsset = {label:'Debt to III Assets Ltd', amount:250000};
    if(!rec.expenditureEntries) rec.expenditureEntries = [];
    if(!rec.customRows) rec.customRows = [];
    if(rec.locked===undefined) rec.locked = false;
    if(rec.houseRentDeposit===undefined) rec.houseRentDeposit = 0;
    if(rec.salaryByAccount===undefined) rec.salaryByAccount = 0;
    if(rec.salaryByCash===undefined) rec.salaryByCash = 0;
    if(rec.houseRentDepositDate===undefined) rec.houseRentDepositDate = '';
    if(rec.houseRentDepositBankId===undefined) rec.houseRentDepositBankId = null;
    if(rec.salaryByAccountDate===undefined) rec.salaryByAccountDate = '';
    if(rec.salaryByAccountBankId===undefined) rec.salaryByAccountBankId = null;
    if(rec.salaryByCashDate===undefined) rec.salaryByCashDate = '';
    if(rec.salaryByCashBankId===undefined) rec.salaryByCashBankId = null;
    if(!rec.beginningBankBalanceByBank) rec.beginningBankBalanceByBank = {};
  });
  (state.days||[]).forEach(day=>{ if(day.locked===undefined) day.locked = false; });
  const stampStatus = (day)=>{
    COA.forEach(cat=>{ (day.coa[cat.key]||[]).forEach(it=>{ if(it.status===undefined) it.status = 'draft'; }); });
  };
  (state.days||[]).forEach(stampStatus);
  (state.archive||[]).forEach(m=>{ (m.days||[]).forEach(stampStatus); });
}
async function loadState(){
  let raw = null;
  try{
    const res = await window.storage.get('state');
    if(res && res.value) raw = res.value;
  }catch(e){ /* window.storage not available here */ }
  if(raw===null){
    try{ raw = localStorage.getItem(LOCAL_STORAGE_KEY); }
    catch(e){ /* localStorage not available either */ }
  }
  if(!raw){ state = defaultState(); return; }
  const envelope = looksLikeVaultEnvelope(raw);
  if(envelope){
    pendingVaultEnvelope = envelope;
    vaultEnabled = true;
    vaultLocked = true;
    state = defaultState(); // placeholder until attemptVaultUnlock() succeeds
    return;
  }
  try{ state = JSON.parse(raw); migrateState(); }
  catch(e){ state = defaultState(); }
}

/* --- Portable JSON backup ---------------------------------------------
   window.storage and localStorage are both tied to one Claude.ai chat or
   one browser/file location. A downloaded backup file is the only copy
   that survives a deleted chat, a different browser, or a different
   computer - the person carries it themselves and re-imports it wherever
   they open this tool next. */
async function exportBackupJson(){
  const label = (state.month && state.year) ? `${state.month}${state.year}` : 'backup';
  const plainJson = JSON.stringify(state, null, 2);
  const toWrite = await serializeForPersistence(plainJson);
  const blob = new Blob([toWrite], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Ledger_Backup_${label}_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importBackupJson(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const text = reader.result;
    const envelope = looksLikeVaultEnvelope(text);
    const doImport = async ()=>{
      let parsed;
      if(envelope){
        const pass = await promptVaultPassphrase('This backup is encrypted. Enter its passphrase to import it.');
        if(pass===null) return;
        try{
          const saltBytes = new Uint8Array(bufFromB64(envelope.salt));
          const key = await deriveVaultKey(pass, saltBytes);
          const plainJson = await vaultDecrypt(envelope, key);
          parsed = JSON.parse(plainJson);
          if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.days)) throw new Error('not a ledger backup');
          vaultKey = key; vaultSaltB64 = envelope.salt; vaultEnabled = true;
        }catch(e){
          showAlert('Incorrect passphrase, or the file could not be read as a valid backup.');
          return;
        }
      } else {
        try{
          parsed = JSON.parse(text);
          if(!parsed || typeof parsed!=='object' || !Array.isArray(parsed.days)) throw new Error('not a ledger backup');
        }catch(e){
          showAlert('That file could not be read as a valid Daily Cash & Bank Ledger backup.');
          return;
        }
      }
      state = parsed;
      migrateState();
      selectedDayId = null;
      notesheetRange = null;
      locked = !!state.lockPasswordHash;
      await saveState();
      render();
      showAlert('Backup imported successfully.');
    };
    showConfirm('Importing a backup replaces all data currently in this ledger (in this browser/chat) with what\'s in the file. Continue?', doImport, 'Import & replace');
  };
  reader.readAsText(file);
}

/* ======================================================================
   Computation engine (single source of truth for every number shown
   on screen AND every number written into the exported spreadsheets)
   ====================================================================== */
let computeAllInProgress = false;
let computeAllLastResult = null;
/* Core per-day computation chain, generic over any ordered day list - used
   both for the live computeAll() below (state.days, cached) and for
   looking up a past/archived month's closing figures (e.g. the Balance
   Sheet's Cash in Hand), which aren't part of state.days once a month has
   been archived. Kept as one function so both call sites can never drift
   out of sync with each other. */
function computeDayChain(days){
  const results = {};
  let prevCash = null;
  let prevBankClose = {};
  state.banks.forEach(b=>{ prevBankClose[b.id] = b.opening||0; });

  days.forEach((day, idx)=>{
    const openingCash = idx===0 ? effectiveOpeningCashManual(day) : prevCash;
    const withdrawTotal = day.withdrawals.reduce((s,w)=>s+(Number(w.amount)||0),0);
    const cashCollected = (Number(day.serviceRevenue)||0) + (Number(day.miscCollection)||0) + withdrawTotal;
    const totalAmountCash = openingCash + cashCollected;

    let coaTotal = 0;
    const coaTotals = {};
    COA.forEach(c=>{
      const t = (day.coa[c.key]||[]).reduce((s,l)=>s+(Number(l.amount)||0),0);
      coaTotals[c.key]=t; coaTotal += t;
    });
    const depositTotal = day.deposits.reduce((s,d)=>s+(Number(d.amount)||0),0);
    const totalCashDisbursed = coaTotal + depositTotal;
    const closingAmount = totalAmountCash - totalCashDisbursed;
    const iouTotal = activeIousForDay(day.date).reduce((s,i)=>s+(Number(i.amount)||0),0);
    const cashInHand = closingAmount - iouTotal;

    const banks = {};
    state.banks.forEach(b=>{
      const bd = day.banksDaily[b.id] || {sslDeposit:0,houseRentDeposit:0,fees:0,salaryAccount:0,salaryCash:0};
      const opening = prevBankClose[b.id];
      const transferIn = day.deposits.filter(d=>d.bankId===b.id).reduce((s,d)=>s+(Number(d.amount)||0),0);
      const transferOut = day.withdrawals.filter(w=>w.bankId===b.id).reduce((s,w)=>s+(Number(w.amount)||0),0);
      const bankXfers = (day.bankTransfers||[]).filter(t=>t.fromBankId!==t.toBankId);
      const bankXferIn = bankXfers.filter(t=>t.toBankId===b.id).reduce((s,t)=>s+(Number(t.amount)||0),0);
      const bankXferOut = bankXfers.filter(t=>t.fromBankId===b.id).reduce((s,t)=>s+(Number(t.amount)||0),0);
      const totalIn = opening + (Number(bd.sslDeposit)||0) + (Number(bd.houseRentDeposit)||0) + transferIn + bankXferIn;
      const totalOut = (Number(bd.fees)||0) + (Number(bd.salaryAccount)||0) + (Number(bd.salaryCash)||0) + transferOut + bankXferOut;
      const closing = totalIn - totalOut;
      banks[b.id] = {opening, sslDeposit:Number(bd.sslDeposit)||0, houseRentDeposit:Number(bd.houseRentDeposit)||0, transferIn, bankXferIn, totalIn,
                      fees:Number(bd.fees)||0, salaryAccount:Number(bd.salaryAccount)||0, salaryCash:Number(bd.salaryCash)||0,
                      transferOut, bankXferOut, totalOut, closing};
      prevBankClose[b.id] = closing;
    });

    const grandTotal = closingAmount + Object.values(banks).reduce((s,b)=>s+b.closing,0);

    results[day.id] = {openingCash, withdrawTotal, cashCollected, totalAmountCash, coaTotals, coaTotal,
                        depositTotal, totalCashDisbursed, closingAmount, iouTotal, cashInHand, banks, grandTotal};
    prevCash = closingAmount;
  });
  return results;
}
function computeAll(){
  if(computeAllInProgress) return computeAllLastResult || {};
  computeAllInProgress = true;
  try{
    const results = computeDayChain(state.days);
    computeAllLastResult = results;
    return results;
  } finally {
    computeAllInProgress = false;
  }
}

/* ======================================================================
   Small DOM helper
   ====================================================================== */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

/* Description/note boxes: if a box already has text, it opens locked
   (read-only) so a stray click while scrolling/selecting can't nudge the
   wording - double-click to actually edit it. An empty box stays open
   for typing right away, no double-click needed. Re-locks on blur once
   there's text in it again. */
/* Adds a show/hide "eye" toggle button to a <input type="password">,
   wrapping it in a positioned container so the button sits inside
   the field on the right - lets the user confirm what they typed. */
function wirePasswordToggle(inputEl){
  if(!inputEl || inputEl.dataset.pwToggled) return;
  inputEl.dataset.pwToggled = '1';
  const wrap = document.createElement('div');
  wrap.className = 'pw-wrap';
  inputEl.parentNode.insertBefore(wrap, inputEl);
  wrap.appendChild(inputEl);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pw-toggle-btn';
  btn.textContent = '\u{1F441}';
  btn.title = 'Show/hide password';
  btn.tabIndex = -1;
  btn.onmousedown = (e)=> e.preventDefault(); // don't steal focus from the input
  btn.onclick = ()=>{
    inputEl.type = inputEl.type==='password' ? 'text' : 'password';
    btn.textContent = inputEl.type==='password' ? '\u{1F441}' : '\u{1F576}';
  };
  wrap.appendChild(btn);
}

function wireLockableTextInput(inputEl){
  let auditFocusVal = inputEl.value;
  inputEl.addEventListener('focus', ()=>{ auditFocusVal = inputEl.value; });
  const syncLock = ()=>{
    const hasText = !!inputEl.value.trim();
    inputEl.readOnly = hasText;
    inputEl.title = hasText ? 'Double-click to edit' : '';
    inputEl.classList.toggle('locked-text', hasText);
  };
  syncLock();
  // Unlock on the *mousedown* of a double/triple click (before the browser
  // applies its native selection for that click), so the field is already
  // editable when selection happens. This lets native behavior take over:
  // double-click selects the word under the cursor, triple-click selects
  // the whole field's text.
  inputEl.addEventListener('mousedown', (e)=>{
    if(e.detail >= 2 && inputEl.readOnly){
      inputEl.readOnly = false;
      inputEl.classList.remove('locked-text');
      inputEl.title = '';
    }
  });
  // Pasting into an already-filled (locked) box needs the same unlock -
  // a paste doesn't fire a double-click event, so without this a filled
  // description box would silently reject anything pasted into it until
  // the person happened to double-click it first.
  inputEl.addEventListener('paste', ()=>{
    if(inputEl.readOnly){
      inputEl.readOnly = false;
      inputEl.classList.remove('locked-text');
      inputEl.title = '';
    }
  });
  inputEl.addEventListener('blur', syncLock);
  inputEl.addEventListener('blur', ()=>{
    logAuditChange(nearestEntityLabel(inputEl), nearestFieldLabel(inputEl), auditFocusVal, inputEl.value);
    auditFocusVal = inputEl.value;
  });
  // Spell-check suggestion strip - on blur (once the person has finished
  // typing), checks the text against every description word used
  // elsewhere in the tool before and shows any likely typo as a clickable
  // "wrong -> right" chip. Harmless no-op on Bangla note fields since only
  // Latin-script words are indexed/checked.
  inputEl.addEventListener('blur', ()=>{
    const host = inputEl.parentElement;
    if(!host) return;
    const existing = host.querySelector('.spell-suggest-strip');
    if(existing) existing.remove();
    const suggestions = findSpellingSuggestions(inputEl.value, descriptionWordIndex());
    if(!suggestions.length) return;
    const strip = el(`<div class="spell-suggest-strip" style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;"></div>`);
    strip.appendChild(el(`<span style="opacity:.7;">Spelling?</span>`));
    suggestions.forEach(s=>{
      const chip = el(`<button type="button" style="border:1px solid var(--line-soft);background:#fff;border-radius:12px;padding:2px 9px;font-size:11.5px;cursor:pointer;color:var(--primary-dark);">${escapeHtml(s.wrong)} &rarr; <strong>${escapeHtml(s.suggestion)}</strong></button>`);
      chip.onclick = ()=>{
        inputEl.readOnly = false;
        inputEl.classList.remove('locked-text');
        const escaped = s.wrong.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
        inputEl.value = inputEl.value.replace(new RegExp(`\\b${escaped}\\b`), s.suggestion);
        inputEl.dispatchEvent(new Event('input', {bubbles:true}));
        strip.remove();
        inputEl.dispatchEvent(new Event('blur'));
      };
      strip.appendChild(chip);
    });
    host.appendChild(strip);
  });
}
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
/* Wraps every case-insensitive occurrence of query in <mark>, escaping
   everything safely (matching is done on the raw text, then each segment
   is escaped separately, so this never breaks on &, <, > etc. in text). */
function highlightMatches(text, query){
  const raw = (text||'').toString();
  const qWords = normalizeSearchText(query).split(' ').filter(Boolean);
  if(!qWords.length) return escapeHtml(raw);
  const expandedWords = new Set();
  qWords.forEach(w=>synonymExpand(w).forEach(x=>expandedWords.add(x)));
  const lower = raw.toLowerCase();
  const ranges = [];
  expandedWords.forEach(w=>{
    let i = 0;
    while(true){
      const idx = lower.indexOf(w, i);
      if(idx===-1) break;
      ranges.push([idx, idx+w.length]);
      i = idx + w.length;
    }
  });
  if(!ranges.length) return escapeHtml(raw);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  ranges.forEach(r=>{
    if(merged.length && r[0]<=merged[merged.length-1][1]) merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], r[1]);
    else merged.push(r.slice());
  });
  let out = '', i = 0;
  merged.forEach(([s,e])=>{
    out += escapeHtml(raw.slice(i,s));
    out += '<mark class="search-hit">' + escapeHtml(raw.slice(s,e)) + '</mark>';
    i = e;
  });
  out += escapeHtml(raw.slice(i));
  return out;
}

/* Closes a modal overlay on backdrop click - but only a genuine click.
   Selecting text inside the box (e.g. dragging right-to-left over a
   description field) can end the drag with the mouse outside the box,
   which used to look like a backdrop click and closed the modal
   mid-selection. Requiring mousedown AND mouseup to both land on the
   backdrop itself fixes that without losing click-outside-to-close. */
function wireBackdropClose(overlay){
  let downOnBackdrop = false;
  overlay.addEventListener('mousedown', (e)=>{ downOnBackdrop = (e.target===overlay); });
  overlay.addEventListener('mouseup', (e)=>{
    if(downOnBackdrop && e.target===overlay) overlay.remove();
    downOnBackdrop = false;
  });
}

/* Moves a voucher that was entered under the wrong category to the
   correct one. Gets a fresh voucher number in the destination category
   (so its code always matches where it's actually filed) but keeps the
   description, amount and review status. */
function showMoveVoucherModal(day, fromCatKey, item){
  const fromLabel = COA.find(c=>c.key===fromCatKey).label;
  const catOptions = COA.filter(c=>c.key!==fromCatKey).map(c=>`<option value="${c.key}">${escapeHtml(c.label)}</option>`).join('');
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <p><strong>Move voucher</strong><br>
        <span style="color:var(--ink-soft);font-size:12.5px;">${escapeHtml(item.voucher)} &mdash; ${escapeHtml(item.desc||'(no description)')} &mdash; ${money(item.amount)}<br>Currently under: ${escapeHtml(fromLabel)}</span></p>
        <label style="font-size:12.5px;color:var(--ink-soft);">Move to</label>
        <select id="move-cat-select" style="margin:2px 0 10px;">
          <option value="" selected>-- Select a category --</option>
          ${catOptions}
        </select>
        <div id="move-error" style="color:var(--danger); font-size:12.5px; margin:-2px 0 8px; min-height:1em;"></div>
        <div class="modal-actions">
          <button class="secondary" type="button">Cancel</button>
          <button class="danger" type="button">Move</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const catSelect = overlay.querySelector('#move-cat-select');
  const errBox = overlay.querySelector('#move-error');
  const buttons = overlay.querySelectorAll('.modal-actions button');
  const cancelBtn = buttons[0], confirmBtn = buttons[1];
  const doMove = ()=>{
    const toCatKey = catSelect.value;
    if(!toCatKey){ errBox.textContent = 'Select a destination category.'; catSelect.focus(); return; }
    day.coa[fromCatKey] = day.coa[fromCatKey].filter(x=>x.id!==item.id);
    const newVoucher = addCoaVoucher(day, toCatKey);
    newVoucher.desc = item.desc;
    newVoucher.amount = item.amount;
    newVoucher.status = item.status;
    newVoucher.note = item.note;
    // The description/amount fields shown in the list are actually read
    // from item.sections[0] (drawCoaList), not from item.desc/item.amount
    // directly - those two are just kept in sync FROM sections. Carrying
    // over only desc/amount left the new voucher's sections at their
    // freshly-created blank default, so the move looked like it silently
    // discarded the amount and description. Carry the real sections
    // across (deep-copied so editing one voucher doesn't mutate the
    // other) so syncCoaItemFromSections/rendering see the moved data.
    newVoucher.sections = (item.sections && item.sections.length)
      ? item.sections.map(s=>({id:uid(), desc:s.desc||'', amount:Number(s.amount)||0}))
      : [{id:uid(), desc:item.desc||'', amount:Number(item.amount)||0}];
    pushUndo(`Voucher moved to ${COA.find(c=>c.key===toCatKey).label} - undone.`, ()=>{
      day.coa[toCatKey] = day.coa[toCatKey].filter(x=>x.id!==newVoucher.id);
      day.coa[fromCatKey].push(item);
    });
    saveState();
    overlay.remove();
    render();
  };
  confirmBtn.onclick = doMove;
  cancelBtn.onclick = ()=> overlay.remove();
  wireBackdropClose(overlay);
  setTimeout(()=>catSelect.focus(), 30);
}

/* Native confirm()/alert() are often blocked inside a sandboxed artifact
   iframe (they silently no-op). These custom modals work everywhere. */
function showModal({message, confirmText='OK', cancelText=null, danger=false, onConfirm, onCancel}){
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal-box">
        <p>${escapeHtml(message)}</p>
        <div class="modal-actions">
          ${cancelText ? `<button class="secondary" type="button">${escapeHtml(cancelText)}</button>` : ''}
          <button class="${danger?'danger':''}" type="button">${escapeHtml(confirmText)}</button>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);
  const buttons = overlay.querySelectorAll('.modal-actions button');
  const confirmBtn = buttons[buttons.length-1];
  const cancelBtn = buttons.length>1 ? buttons[0] : null;
  confirmBtn.onclick = ()=>{ overlay.remove(); if(onConfirm) onConfirm(); };
  if(cancelBtn) cancelBtn.onclick = ()=>{ overlay.remove(); if(onCancel) onCancel(); };
  wireBackdropClose(overlay);
}
function showAlert(message){ showModal({message, confirmText:'OK'}); }

/* Opens a print-ready tab. No automatic window.print() call - triggering
   the native print dialog immediately made the main app tab unresponsive
   until the dialog was dismissed (some browsers treat the print dialog
   as blocking the whole browser, not just the new tab). The person now
   clicks "Print" inside the new tab whenever they're ready, so the app
   tab stays fully usable in the meantime. */
function printHtmlDoc(title, bodyHtml, pageSize, orientation){
  pageSize = pageSize || 'A4';
  orientation = orientation || 'portrait';
  const w = window.open('', '_blank');
  if(!w){ showAlert('The browser blocked the print window - please allow pop-ups for this page and try again.'); return; }
  const landscape = orientation==='landscape';
  /* Printable-area height in mm, used for .page-frame instead of the
     vh unit. 100vh is unreliable inside a print stylesheet - Chrome
     computes it against a default page size before @page is fully
     applied, so it doesn't match the real A5/A4 page. That inflated a
     single short voucher to look "full page" only by accident; the
     moment real content grew even slightly (a 2nd/3rd section whose
     description wraps to two lines), the inflated frame height plus
     that extra content together exceeded the true one-page height and
     spilled onto a second, mostly-blank page. Sizing the frame to the
     exact printable area (page size minus margin) fixes both: the
     frame still visually fills the page, but never adds phantom height
     on top of whatever the content actually needs. */
  const pageDims = {A5:{w:148,h:210}, A4:{w:210,h:297}}[pageSize] || {w:210,h:297};
  const marginMm = pageSize==='A5' ? 6 : 10;
  const pageW = landscape ? pageDims.h : pageDims.w;
  const pageH = landscape ? pageDims.w : pageDims.h;
  const frameH = pageH - marginMm*2;
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
  <style>
    @page{ size:${pageSize} ${orientation}; margin:${marginMm}mm; }
    body{ font-family:'Times New Roman', Georgia, serif; color:#111; margin:0; }
    h1,h2,h3{ text-align:center; margin:2px 0; }
    h1{ font-size:16px; } h2{ font-size:13px;font-weight:600; } h3{ font-size:12px;font-weight:400;color:#333; }
    table{ width:100%; border-collapse:collapse; margin-top:6px; table-layout:fixed; }
    table.no-outer td{ border:none !important; }
    td, th{ border:1px solid #000; padding:${pageSize==='A5'?'1px 5px':'4px 7px'}; font-size:${pageSize==='A5'?'10':(landscape?'11':'12.5')}px; line-height:1.15; vertical-align:top; word-wrap:break-word; }
    th{ background:#f0f0ea; font-weight:700; text-align:center; }
    .amt{ text-align:right; white-space:pre-line; font-variant-numeric:tabular-nums; }
    .desc{ white-space:pre-line; }
    .mono{ font-variant-numeric:tabular-nums; }
    .no-border{ border:none; }
    .right{ text-align:right; }
    .center{ text-align:center; }
    .bold{ font-weight:700; }
    .meta{ font-size:12.5px; margin:2px 0; }
    .voucher-header{ text-align:center; margin-bottom:4px; }
    .inst-name{ color:#0B6E2A; font-weight:700; font-size:14px; }
    .inst-line{ font-size:9px; color:#222; }
    .voucher-title-box{ border:1px solid #000; text-align:center; color:#1352B0; font-weight:700; font-size:12.5px; width:150px; margin:4px auto; padding:2px; }
    .boxed{ border:1px solid #000; display:inline-block; padding:1px 8px; min-width:110px; }
    .page-frame{ border:2px solid #000; padding:${pageSize==='A5'?'8px':'14px'}; box-sizing:border-box; height:${frameH}mm; overflow:hidden; page-break-inside:avoid; }
    .sig-row{ display:flex; justify-content:space-between; margin-top:${pageSize==='A5'?'14px':'40px'}; }
    .sig-row.four .sig-box{ flex:1; }
    .sig-box{ text-align:center; font-size:10.5px; }
    .sig-line{ border-top:1px solid #000; width:80%; margin:0 auto 4px; }
    .print-bar{ text-align:center; margin:10px 0; }
    @media print{ .print-bar{ display:none; } }
  </style></head><body>
  <div class="print-bar"><button onclick="window.print()" style="padding:6px 16px;">Print</button></div>
  ${bodyHtml}
  </body></html>`);
  w.document.close();
}

  `);
  document.body.appendChild(overlay);

  let sections = [{desc:item.desc||'', amount:0}];

  const totalSpent = ()=> sections.reduce((s,sec)=>s+(Number(sec.amount)||0), 0);

  function renderSections(){

    sections.forEach((sec, idx)=>{
      const row = el(`
