/* Online Payment (SSL Commerz): unlike a cash collection, this money lands
   straight in the TBL bank account automatically - there's no cash in
   hand to physically carry to the bank, so no Deposit Notesheet document
   is generated for it. The accountant enters the date money actually
   landed in the account (bank-credit date; normally the next day, later
   if that day is a Friday/Saturday or a listed government holiday) and
   uploads the same "Collection Register Account Wise Summary" export used
   for Deposit Notesheets, purely to split the total across revenue
   categories. The export's own date (payment date, one or more days
   earlier) is ignored on purpose - the Monthly Ledger entry always uses
   the bank-credit date the user typed. */
/* TBL (Trust Bank) Bank Statement Cross-Check: parses the bank's own
   Account Statement export (Tran Date / Particular / Withdrawal / Deposit
   / Balance, one header row, ending at a "Grand Total" row) and matches
   each deposit/withdrawal the app has recorded for the month (Deposit
   Notesheets, Online Payments/SSL Commerz, Withdraw Notesheets) against a
   same-date, same-amount line in the statement. Anything that doesn't
   line up - on either side - is surfaced clearly so it can be checked,
   rather than silently assumed correct. SSL Commerz entries get a wider
   +/-1 day tolerance since that lag is expected and already explained by
   the user; everything else must match exactly on date. */
async function parseTBLStatement(arrayBuffer){
  await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
  await wb.xlsx.load(arrayBuffer);
  const ws = wb.worksheets[0];
  let headerRow = null;
  for(let r=1;r<=15;r++){
    if(String(ws.getCell(r,1).value||'').trim()==='Tran Date'){ headerRow=r; break; }
  }
  if(!headerRow) throw new Error("Couldn't find the 'Tran Date' header row - is this a Trust Bank Account Statement export?");
  const rows = [];
  for(let r=headerRow+1; r<=ws.rowCount; r++){
    const dateRaw = ws.getCell(r,1).value;
    const particular = String(ws.getCell(r,2).value||'').trim();
    if(particular==='Grand Total') break;
    if(!dateRaw) continue;
    const m = String(dateRaw).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m) continue;
    if(particular==='Balance B/F') continue; // opening balance line, not a transaction
    rows.push({
      date: `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`,
      particular,
      withdrawal: Number(ws.getCell(r,3).value)||0,
      deposit: Number(ws.getCell(r,4).value)||0,
      balance: Number(ws.getCell(r,5).value)||0,
    });
  }
  return rows;
}

function daysBetween(iso1, iso2){
  return Math.round((new Date(iso1+'T00:00:00Z') - new Date(iso2+'T00:00:00Z')) / 86400000);
}
/* Monthly Ledger revenue/expenditure entries are pushed in whatever order
   notesheets happen to get generated in (e.g. Deposit Notesheet #117-119
   generated before #115-116 is filed in afterward) - display and export
   should always read chronologically by the entry's own date regardless
   of that generation order. Stable sort on a copy; entries with no date
   sort last so nothing silently disappears. */
function sortedByDate(entries){
  return (entries||[]).map((e,i)=>({e,i})).sort((a,b)=>{
    const da = a.e.date||'', db = b.e.date||'';
    if(da!==db) return da===''?1: db===''?-1 : da.localeCompare(db);
    return a.i-b.i;
  }).map(x=>x.e);
}
/* Export-only description formatting for the Monthly Revenue/Expenditure
   sheets. The stored entry.desc strings (e.g. "Deposit Notesheet #117
   (2026-07-09 to 2026-07-16)", "Online Payment (SSL Commerz) - entered
   2026-07-26", "Withdraw Notesheet 26-15") stay exactly as-is in the data,
   since the bank cross-check's exclusion matching and the in-app editable
   list both key off those exact prefixes. Only the exported spreadsheet
   shows the friendlier, accountant-facing label built from the same desc. */
function exportRevenueDesc(desc){
  const m = /^Deposit Notesheet #(\S+) \(/.exec(desc||'');
  if(m) return `Service Revenue Deposited (Notesheet #${m[1]})`;
  if(/^Online Payment \(SSL Commerz\)/.test(desc||'')) return 'Deposit through SSL Commerz';
  return desc||'';
}
/* Shorter category names specifically for the Withdraw Notesheet export
   description (e.g. "Misc, Trans, Tailor, Utility, BooksSty (Summary
   26-15)") - uses the same CoA "short" abbreviation shown before the
   auto serial number on a bill voucher (e.g. Hons7/7/26), so the export
   description matches voucher shorthand exactly. Falls back to the
   column's own label (used everywhere else: column headers, the app's
   own UI) for anything that doesn't resolve to a CoA category, including
   any custom-added column, which keeps whatever name it was given. */
function exportCatAbbrev(col){
  const coaKey = resolveColCoaKey(col);
  const coa = coaKey ? COA.find(c=>c.key===coaKey) : null;
  return coa ? coa.short : (col.label||'');
}
function exportExpenditureDesc(entry, rec){
  const m = /^Withdraw Notesheet (.+)$/.exec(entry.desc||'');
  if(!m) return entry.desc||'';
  const cats = (rec.expenditureColumns||[]).filter(col=>Number((entry.amounts||{})[col.id])>0).map(exportCatAbbrev);
  return cats.length ? `${cats.join(', ')} (Summary ${m[1]})` : (entry.desc||'');
}

function crossCheckTBLStatement(stmtRows){
  // Build the list of what the app expects to see. Money that moves through
  // the bank comes from two kinds of source in this app:
  //  1. Deposit/Withdraw Notesheet totals, which the accountant also enters
  //     day-by-day as Deposit/Withdraw rows in the Daily Ledger - that's the
  //     actual bank-dated record, and more reliable than the notesheet log's
  //     own generation/attribution date (which can legitimately differ from
  //     the date the bank actually cleared the money).
  //  2. Other bank movement entered directly in the Daily Ledger's per-day
  //     Bank section: Salary by Cash, Salary by Account, Bank fees, and
  //     House Rent Deposit - the same per-day dates that feed the Monthly
  //     Ledger (see dailyBankFieldEntries()).
  // SSL Commerz online payments are handled separately below: the bank only
  // ever shows these as a BEFTN inward transfer (never a plain cash/online
  // deposit line), so they're matched only against statement rows whose own
  // description says BEFTN, rather than against the general pool.
  const expected = [];
  (state.days||[]).forEach(day=>{
    (day.deposits||[]).forEach(d=>{
      const amt = Number(d.amount)||0;
      if(amt) expected.push({side:'deposit', checkDate:day.date, amount:amt, label: d.note ? `Deposit - ${d.note}` : 'Deposit (Daily Ledger)', tolDays:0});
    });
    (day.withdrawals||[]).forEach(w=>{
      const amt = Number(w.amount)||0;
      if(amt) expected.push({side:'withdrawal', checkDate:day.date, amount:amt, label: w.note ? `Withdrawal - ${w.note}` : 'Withdrawal (Daily Ledger)', tolDays:0});
    });
    Object.values(day.banksDaily||{}).forEach(bd=>{
      if(!bd) return;
      if(Number(bd.salaryCash)) expected.push({side:'withdrawal', checkDate:day.date, amount:Number(bd.salaryCash), label:'Salary by Cash', tolDays:0});
      if(Number(bd.salaryAccount)) expected.push({side:'withdrawal', checkDate:day.date, amount:Number(bd.salaryAccount), label:'Salary by Account', tolDays:0});
      if(Number(bd.fees)) expected.push({side:'withdrawal', checkDate:day.date, amount:Number(bd.fees), label:'Bank fees', tolDays:0});
      if(Number(bd.houseRentDeposit)) expected.push({side:'deposit', checkDate:day.date, amount:Number(bd.houseRentDeposit), label:'House Rent Deposit', tolDays:0});
    });
  });
  const expectedSsl = (state.onlinePaymentLog||[]).map(l=>({side:'deposit', checkDate:l.bankDate, amount:l.grandTotal, label:'Online Payment (SSL Commerz)', tolDays:2}));
  // The manual "Other deposit / SSL Commerz" field in the Daily Ledger's
  // per-day Bank section is how the accountant records that day's bank
  // balance increase for SSL Commerz money. When that same collection is
  // ALSO split into revenue categories via the Online Payment (SSL Commerz)
  // import, both entries describe the exact same one bank transaction -
  // only one bank-statement line exists for it, so only one of the two
  // should be checked against the statement. Skip a sslDeposit entry here
  // if an onlinePaymentLog entry already matches it (same amount, within
  // the same +/-2 day settlement window) - only genuinely standalone
  // sslDeposit entries (a BEFTN credit with no matching online-payment
  // import) get added as their own expectation.
  (state.days||[]).forEach(day=>{
    Object.values(day.banksDaily||{}).forEach(bd=>{
      if(!bd || !Number(bd.sslDeposit)) return;
      const amt = Number(bd.sslDeposit);
      const alreadyCovered = (state.onlinePaymentLog||[]).some(l=>Math.abs((l.grandTotal||0)-amt)<=1 && Math.abs(daysBetween(l.bankDate, day.date))<=2);
      if(!alreadyCovered) expectedSsl.push({side:'deposit', checkDate:day.date, amount:amt, label:'Other deposit / SSL Commerz', tolDays:2});
    });
  });

  // Not every BEFTN inward transfer is an SSL Commerz collection - some are
  // one-off transfers (e.g. Bangladesh Post, a direct bank transfer) that
  // only ever get recorded as a plain Monthly Ledger revenue entry, never
  // through the Deposit Notesheet flow (so they're not in the Daily Ledger's
  // Deposit rows either). Include those too, as a fallback - but skip any
  // revenue entry that's actually a Deposit Notesheet's own linked entry,
  // since that money is already accounted for above via Daily Ledger deposits.
  // Matched by both shared id (current data) and the "Deposit Notesheet #"
  // description prefix (older entries generated before log/revenue entries
  // were linked by id still carry this label and must be excluded the
  // same way, or they show up as a phantom duplicate of the real deposit).
  const depositNotesheetIds = new Set((state.depositNotesheetLog||[]).map(l=>l.id));
  const expectedManualRevenue = [];
  Object.values(state.monthlyLedger.months||{}).forEach(rec=>{
    (rec.revenueEntries||[]).forEach(entry=>{
      if(depositNotesheetIds.has(entry.id)) return;
      if(/^Deposit Notesheet #/.test(entry.desc||'')) return;
      // Same duplicate-representation issue as Deposit Notesheet above:
      // every Online Payment (SSL Commerz) bucket writes BOTH a
      // state.onlinePaymentLog entry (already checked against BEFTN rows
      // via expectedSsl) AND this Monthly Ledger revenue entry for the
      // exact same bank transaction. Without this exclusion, the revenue
      // entry re-claims the same statement row after expectedSsl already
      // matched it, and shows up as a phantom "missing" duplicate.
      if(/^Online Payment \(SSL Commerz\)/.test(entry.desc||'')) return;
      const amt = REVENUE_CATS.reduce((s,c)=>s+(Number(entry[c.key])||0),0);
      if(amt && entry.date) expectedManualRevenue.push({side:'deposit', checkDate:entry.date, amount:amt, label: entry.desc || 'Monthly Ledger revenue entry', tolDays:0});
    });
  });

  const isBeftnRow = r => /beftn/i.test(r.particular||'');
  const beftnStmtRows = stmtRows.filter(isBeftnRow);
  const otherStmtRows = stmtRows.filter(r=>!isBeftnRow(r));

  // The statement only covers one period (whatever the uploaded file spans)
  // but `expected` above is built from the app's ENTIRE history. Without
  // scoping to the statement's own date range, every entry from every other
  // month gets flagged as "not found in the statement" just because this
  // statement was never going to contain it. Scope by the (relevant rows')
  // min/max date, padded by the widest tolerance in use.
  const inWindow = (checkDate, minD, maxD, tol)=>{
    if(!minD || !maxD) return true;
    return daysBetween(checkDate, minD) >= -tol && daysBetween(checkDate, maxD) <= tol;
  };

  const usedStmtIdx = new Set(); // indices into the original stmtRows array
  const matched = [], missingFromStatement = [];
  function tryMatch(expectedList, rowsPool, windowMin, windowMax, tol){
    expectedList.forEach(e=>{
      if(!e.amount) return; // nothing to check without an amount
      if(!e.checkDate){ missingFromStatement.push(e); return; } // no resolvable date - surface it rather than silently dropping it
      if(!inWindow(e.checkDate, windowMin, windowMax, tol)) return; // outside this statement's own coverage - not this statement's business
      let foundIdx = -1;
      for(const row of rowsPool){
        const i = stmtRows.indexOf(row);
        if(usedStmtIdx.has(i)) continue;
        const amt = e.side==='deposit' ? row.deposit : row.withdrawal;
        if(amt<=0) continue;
        if(Math.abs(amt-e.amount)>1) continue;
        if(Math.abs(daysBetween(row.date, e.checkDate))>e.tolDays) continue;
        foundIdx = i; break;
      }
      if(foundIdx>=0){ usedStmtIdx.add(foundIdx); matched.push({...e, stmtDate:stmtRows[foundIdx].date}); }
      else missingFromStatement.push(e);
    });
  }

  const otherDates = otherStmtRows.map(r=>r.date).filter(Boolean).sort();
  tryMatch(expected, otherStmtRows, otherDates[0], otherDates[otherDates.length-1], Math.max(0, ...expected.map(e=>e.tolDays||0)));
  const beftnDates = beftnStmtRows.map(r=>r.date).filter(Boolean).sort();
  tryMatch(expectedSsl, beftnStmtRows, beftnDates[0], beftnDates[beftnDates.length-1], Math.max(0, ...expectedSsl.map(e=>e.tolDays||0)));
  const allDates = stmtRows.map(r=>r.date).filter(Boolean).sort();
  tryMatch(expectedManualRevenue, stmtRows, allDates[0], allDates[allDates.length-1], 0);

  const unmatchedStmtRows = stmtRows.filter((r,i)=>!usedStmtIdx.has(i) && (r.deposit>0 || r.withdrawal>0));
  return {matched, missingFromStatement, unmatchedStmtRows};
}

/* Due Register import: the raw export is one row per outstanding fee (or
   advance payment) as of right now, tagged with which account(s)/category
   it's under and (for context only) which month it originally arose in.
   This is a current-state snapshot, not a monthly flow - so every row's
   Dues Amount rolls into ONE combined per-category total, applied to
   whichever month is currently open in the Monthly Ledger (its "Due
   Payment" balance as of that month's end), matching the "Due as on <date>"
   framing of the Due List export built alongside it. A row naming
   MULTIPLE categories (comma-separated) is never guessed at - it's
   collected and handed back to the accountant to split/assign by hand,
   by Student ID. */
const DUE_ACCOUNT_TO_REVENUE_KEY = {
  'transport -ar':'transportFee', 'transport-ar':'transportFee', 'transport':'transportFee',
  'tuition fee':'tuitionFee',
  'late fine':'tuitionFee', 'late fine -ar':'tuitionFee', 'late fine-ar':'tuitionFee',
  'uniform fees':'uniform', 'uniform':'uniform',
  'admission fee':'admissionFee', 'admission fee & form':'admissionFee', 'admission fee -ar':'admissionFee',
  'muqaddam fees':'mqmFee',
  'session fees':'sessionFee', 'session fee':'sessionFee',
  'books & sty':'booksSty', 'books & stationeries':'booksSty',
  'book & mp: stationery':'booksSty', 'book & mp : stationery':'booksSty', 'book & mp:stationery':'booksSty',
  'books & mp: stationery':'booksSty', 'books & mp : stationery':'booksSty', 'book and mp: stationery':'booksSty',
  'book & stationary':'booksSty', 'book &amp : stationary':'booksSty', 'book & amp: stationary':'booksSty',
  'books & stationary':'booksSty', 'book and stationary':'booksSty',
  'event fee':'eventFee',
};
// Section titles for the Due List export, matching the accountant's own template wording
const DUE_LIST_SECTION_TITLE = {
  tuitionFee:'Tuition Fee', admissionFee:'Admission Fee & Admission Form', transportFee:'Transport Fee Due',
  mqmFee:'Muqaddam Fee', uniform:'Uniform Fee Due', sessionFee:'Session Fee Due', booksSty:'Books & Stationery Due', eventFee:'Event Fee Due',
};
async function parseDuesRegisterFile(arrayBuffer){
  await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
  await wb.xlsx.load(arrayBuffer);
  const ws = wb.worksheets[0];
  let headerRow = null, headers = {};
  for(let r=1;r<=10;r++){
    const found = {};
    ws.getRow(r).eachCell((cell,colNum)=>{ found[String(cell.value||'').trim()] = colNum; });
    if(found['Student ID'] && found['Dues Amount']){ headerRow=r; headers=found; break; }
  }
  if(!headerRow) throw new Error("Couldn't find the 'Student ID' / 'Dues Amount' header row in this file.");
  const dueTotals = {}; // catKey -> total amount
  const dueStudents = {}; // catKey -> [{studentId, name, category, amount}]
  let advanceTotal = 0;
  const needsReview = [];
  for(let r=headerRow+1; r<=ws.rowCount; r++){
    const row = ws.getRow(r);
    const studentId = row.getCell(headers['Student ID']).value;
    if(!studentId) continue;
    const name = row.getCell(headers['Student Name']).value||'';
    const category = row.getCell(headers['Category']) ? (row.getCell(headers['Category']).value||'') : '';
    const duesAmt = Number(row.getCell(headers['Dues Amount']).value)||0;
    const advAmt = Number(row.getCell(headers['Advance Amount']).value)||0;
    const duesMonthLabel = row.getCell(headers['Dues Month/Year']).value;
    const duesAccounts = String(row.getCell(headers['Dues Account(s)']).value||'').trim();

    if(duesAmt>0){
      const accList = duesAccounts.split(',').map(s=>s.trim()).filter(Boolean);
      const singleKey = accList.length===1 ? DUE_ACCOUNT_TO_REVENUE_KEY[accList[0].toLowerCase()] : null;
      if(accList.length!==1 || !singleKey){
        needsReview.push({studentId, name, amount:duesAmt, accounts:duesAccounts, monthLabel:duesMonthLabel, type:'due'});
      } else {
        dueTotals[singleKey] = (dueTotals[singleKey]||0) + duesAmt;
        if(!dueStudents[singleKey]) dueStudents[singleKey] = [];
        const existingRow = dueStudents[singleKey].find(s=>s.studentId===String(studentId));
        if(existingRow){ existingRow.amount += duesAmt; }
        else{ dueStudents[singleKey].push({studentId:String(studentId), name:String(name), category:String(category), amount:duesAmt}); }
      }
    }
    advanceTotal += advAmt; // one combined figure across every row - goes into a single Advance Payment box, not split by month
  }
  return {dueTotals, dueStudents, advanceTotal, needsReview};
}

async function buildDueListWorkbook(dueStudents, monthKey){
  await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
  const ws = wb.addWorksheet('Due List');
  const FONT = {name:'Times New Roman', size:11};
  const BOLD = {name:'Times New Roman', size:11, bold:true};
  const TOTAL_BOLD = {name:'Times New Roman', size:12, bold:true};
  const GRAND_BOLD = {name:'Times New Roman', size:13, bold:true};
  const THIN_BORDER = {top:{style:'thin'}, left:{style:'thin'}, bottom:{style:'thin'}, right:{style:'thin'}};
  const CENTER = {horizontal:'center', vertical:'middle'};
  ws.getColumn(1).width = 14; ws.getColumn(2).width = 30; ws.getColumn(3).width = 20; ws.getColumn(4).width = 14; ws.getColumn(5).width = 16;
  const [y,m] = monthKey.split('-');
  const monthIdx = MONTHS.indexOf(m);
  const lastDay = new Date(Date.UTC(parseInt(y,10), monthIdx+1, 0)).getUTCDate();
  const ordinal = n => n%10===1&&n!==11?n+'st':n%10===2&&n!==12?n+'nd':n%10===3&&n!==13?n+'rd':n+'th';
  const borderRow = (row, cols)=>{ for(let cc=1;cc<=cols;cc++) ws.getCell(row,cc).border = THIN_BORDER; };

  let r = 1;
  ws.mergeCells(r,1,r,4);
  ws.getCell(r,1).value = `Due as on ${ordinal(lastDay)} ${m} ${y}`; ws.getCell(r,1).font = BOLD; ws.getCell(r,1).alignment = CENTER;
  borderRow(r,4);
  r++;

  let grandTotal = 0;
  let sectionsWritten = 0;
  const sectionTotalAddrs = [];
  REVENUE_CATS.forEach(c=>{
    const students = dueStudents[c.key];
    if(!students || !students.length) return;

    if(sectionsWritten>0){
      // Separator line between the previous section's Total and this new category
      ws.mergeCells(r,1,r,4);
      ws.getCell(r,1).alignment = CENTER;
      borderRow(r,4);
      r++;
    }
    sectionsWritten++;

    ws.mergeCells(r,1,r,4);
    ws.getCell(r,1).value = DUE_LIST_SECTION_TITLE[c.key] || c.label; ws.getCell(r,1).font = BOLD; ws.getCell(r,1).alignment = CENTER;
    borderRow(r,4);
    r++;

    ws.getCell(r,1).value = 'Student ID'; ws.getCell(r,2).value = 'Student Name'; ws.getCell(r,3).value = 'Category'; ws.getCell(r,4).value = 'Dues Amount';
    for(let cc=1;cc<=4;cc++) ws.getCell(r,cc).font = BOLD;
    borderRow(r,4);
    r++;

    let sectionTotal = 0;
    const dataStart = r;
    students.forEach(s=>{
      ws.getCell(r,1).value = s.studentId; ws.getCell(r,2).value = s.name; ws.getCell(r,3).value = s.category; ws.getCell(r,4).value = s.amount;
      ws.getCell(r,4).numFmt = ASIAN_NUMFMT;
      for(let cc=1;cc<=4;cc++) ws.getCell(r,cc).font = FONT;
      borderRow(r,4);
      sectionTotal += s.amount;
      r++;
    });
    const dataEnd = r-1;

    ws.mergeCells(r,1,r,3);
    ws.getCell(r,1).value = 'Total'; ws.getCell(r,1).font = TOTAL_BOLD; ws.getCell(r,1).alignment = CENTER;
    ws.getCell(r,4).value = dataEnd>=dataStart ? {formula:`SUM(D${dataStart}:D${dataEnd})`} : 0;
    ws.getCell(r,4).font = TOTAL_BOLD; ws.getCell(r,4).numFmt = ASIAN_NUMFMT;
    borderRow(r,4);
    sectionTotalAddrs.push(`D${r}`);
    grandTotal += sectionTotal;
    r++;
  });

  ws.getCell(r,5).value = sectionTotalAddrs.length ? {formula: sectionTotalAddrs.join('+')} : grandTotal;
  ws.getCell(r,5).font = GRAND_BOLD; ws.getCell(r,5).numFmt = ASIAN_NUMFMT;
  return wb;
}
async function exportDueList(dueStudents, monthKey){
  const wb = await buildDueListWorkbook(dueStudents, monthKey);
  await downloadWorkbook(wb, `Due_List_${monthKeyLabel(monthKey).replace(/\s+/g,'_')}.xlsx`);
}

      const buf = await file.arrayBuffer();

      const {matched, missingFromStatement, unmatchedStmtRows} = crossCheckTBLStatement(stmtRows);
      statusEl.textContent = `${stmtRows.length} statement line(s) read. ${matched.length} matched, ${missingFromStatement.length} app entr${missingFromStatement.length===1?'y':'ies'} not found in the statement, ${unmatchedStmtRows.length} statement line(s) not yet recorded in the app.`;
      // Also verify the app's own TBL closing balance, as of the
      // statement's own last date, against that date's statement balance -
      // catches anything the line-by-line match above wouldn't (e.g. a
      // transaction recorded on the wrong date, or missed entirely on
      // both sides in a way that still happens to net out).
      let balanceCheckHtml = '';
      const tblBank = state.banks.find(b=>/tbl/i.test(b.name));
      // Save the parsed statement into state.bankStatements too, so this
      // one upload also feeds: (1) the Monthly Ledger's own "Bank
      // Statement Cross-Check" summary (deposit/withdrawal totals, matched/
      // mismatched days) for this bank, and (2) the Monthly/Revenue
      // Expenditure export's same-date row ordering, which matches ledger
      // entries to the actual sequence of transactions on the statement.
      // (Each day's own Bank Reconciliation balance stays manual - typed in
      // by hand, not auto-filled from here.) Merge by date range rather
      // than overwrite outright, so uploading one month's statement
      // doesn't erase an earlier month's already-saved rows - only the
      // newly uploaded date range is replaced (handles a corrected
      // re-upload of the same month too).
      if(tblBank && stmtRows.length){
        const existingRows = (state.bankStatements[tblBank.id] && state.bankStatements[tblBank.id].rows) || [];
        const newDates = stmtRows.map(r=>r.date).sort();
        const minD = newDates[0], maxD = newDates[newDates.length-1];
        const kept = existingRows.filter(r=> r.date<minD || r.date>maxD);
        state.bankStatements[tblBank.id] = {
          fileName: file.name,
          rows: kept.concat(stmtRows).sort((a,b)=>a.date.localeCompare(b.date)),
          uploadedAt: new Date().toISOString()
        };

        const lastRow = stmtRows.slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
        const dayComputed = computedForDate(lastRow.date);
        const appClosing = dayComputed && dayComputed.banks[tblBank.id] ? dayComputed.banks[tblBank.id].closing : null;
        if(appClosing===null){
          balanceCheckHtml = `<p class="subnote">Couldn't verify TBL's closing balance against ${lastRow.date} &mdash; no Daily Ledger day recorded for that date.</p>`;
        } else {
          const diff = Math.round((appClosing - lastRow.balance)*100)/100;
          balanceCheckHtml = Math.abs(diff)>1
            ? `<p class="subnote" style="color:var(--danger);font-weight:600;">&#9888; TBL closing balance mismatch as of ${lastRow.date}: app shows ${money(appClosing)}, statement shows ${money(lastRow.balance)} (difference ${money(diff)}).</p>`
            : `<p class="subnote" style="color:#2E7D32;">&#10003; TBL closing balance matches the statement as of ${lastRow.date} (${money(appClosing)}).</p>`;
        }
      }
      resultsEl.innerHTML = balanceCheckHtml + buildCrossCheckResultsHtml(matched, missingFromStatement, unmatchedStmtRows);
      if(!Array.isArray(state.bankCrossCheckLog)) state.bankCrossCheckLog = [];
      state.bankCrossCheckLog.push({
        id:uid(), checkedAt:new Date().toISOString(), fileName:file.name,
        matchedCount:matched.length, missingCount:missingFromStatement.length, unmatchedCount:unmatchedStmtRows.length,
        matched, missingFromStatement, unmatchedStmtRows,
        fileBase64: arrayBufferToBase64(buf)
      });
      saveState();
      // Refresh just the saved-history block below - the results just
      // shown above (in #bs-results) are left alone so they don't vanish.
      const oldHist = card.querySelector('#bs-history-wrap');
      const newHistHtml = bankCrossCheckHistoryHtml();
      if(oldHist) oldHist.outerHTML = newHistHtml;
      else if(newHistHtml) card.appendChild(el(newHistHtml));
    }catch(e){
      statusEl.textContent = '';
      showAlert('Could not read that file: ' + e.message);
    }
  };
  return card;
}

/* Online Payment (SSL Commerz): the raw export is a whole month's worth of
   individual student transactions (one row per payment, dated the day the
   student paid). SSL Commerz doesn't settle same-day - money lands in the
   TBL account the next day; but if that next day is a bank holiday - the
   Friday/Saturday weekend, or a Bangladesh government holiday from the
   list below - no money moves that day, so it instead lands on the next
   day the bank is actually open (skipping over back-to-back holidays too,
   e.g. a holiday that falls right after the weekend). So one uploaded
   file typically needs to be split into SEVERAL Monthly Ledger entries,
   one per computed bank-credit date, each with its own category
   breakdown. The computed date is a best-effort default from that rule;
   the real source of truth is the bank statement, so every bucket's date
   stays editable before saving in case a holiday not yet added below, or
   some other bank delay, shifted it. */
function isBankHoliday(dateISO){
  const d = new Date(dateISO+'T00:00:00Z');
  const wd = d.getUTCDay(); // 0=Sun..6=Sat
  if(wd===5 || wd===6) return true; // Bangladesh weekend: Friday, Saturday
  return (state.bankHolidays||[]).includes(dateISO);
}
function sslBankCreditDateISO(tranDateISO){
  const d = new Date(tranDateISO+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+1); // starts as simply "the next day"
  let iso = d.toISOString().slice(0,10);
  while(isBankHoliday(iso)){
    d.setUTCDate(d.getUTCDate()+1);
    iso = d.toISOString().slice(0,10);
  }
  return iso;
}
async function parseSSLCommerzTransactionFile(arrayBuffer){
  await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
  await wb.xlsx.load(arrayBuffer);
  const ws = wb.worksheets[0];
  let headerRow = null, headers = {};
  for(let r=1;r<=15;r++){
    const found = {};
    ws.getRow(r).eachCell((cell,colNum)=>{ found[String(cell.value||'').trim()] = colNum; });
    if(found['TranDate']){ headerRow=r; headers=found; break; }
  }
  if(!headerRow) throw new Error("Couldn't find the TranDate column header in this file.");
  let eventFeeCol = headers['Event Fee -I'];
  if(!eventFeeCol) Object.keys(headers).forEach(k=>{ if(/event\s*fee/i.test(k)) eventFeeCol = headers[k]; });
  const get = (row,name)=>{ const c = headers[name]; return c ? (Number(row.getCell(c).value)||0) : 0; };
  const buckets = {}; // creditDateISO -> {admissionFee, sessionFee, tuitionFee, mqmFee, booksSty, transportFee, uniform, eventFee, misc, total}
  const zeroCats = ()=>({admissionFee:0,sessionFee:0,tuitionFee:0,mqmFee:0,booksSty:0,transportFee:0,uniform:0,eventFee:0,misc:0,total:0});
  for(let r=headerRow+1; r<=ws.rowCount; r++){
    const row = ws.getRow(r);
    const raw = row.getCell(headers['TranDate']).value;
    if(!raw) continue;
    let tranISO = null;
    if(raw instanceof Date) tranISO = raw.toISOString().slice(0,10);
    else{
      const m = String(raw).trim().match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
      if(m) tranISO = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    }
    if(!tranISO) continue;
    const creditISO = sslBankCreditDateISO(tranISO);
    if(!buckets[creditISO]) buckets[creditISO] = zeroCats();
    const b = buckets[creditISO];
    b.admissionFee += get(row,'Admission Fee -I') + get(row,'Admission Form-I');
    b.sessionFee   += get(row,'Session Fees -I');
    b.tuitionFee   += get(row,'Tuition Fee -I');
    b.mqmFee       += get(row,'Muqaddam Fees -I');
    b.booksSty     += get(row,'Books & Stationeries -I');
    b.transportFee += get(row,'Transport -I');
    b.uniform      += get(row,'Uniform Fees -I');
    b.eventFee     += eventFeeCol ? (Number(row.getCell(eventFeeCol).value)||0) : 0;
    b.misc         += get(row,'Exam Fee -I') + get(row,'Late Fine-I');
    b.total        += Number(row.getCell(headers['TotalAmount']).value)||0;
  }
  return Object.keys(buckets).sort().map(date=>({date, ...buckets[date]}));
}

/* One small single-sheet workbook per bank-credit bucket, purely so the
   category breakdown that was recorded can be viewed/downloaded again
   later from the saved history list, same as a notesheet. */
async function buildOnlinePaymentWorkbook(b){
  await loadExcelJS();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
  const ws = wb.addWorksheet('Online Payment');
  const BOLD = {bold:true};
  ws.getColumn(1).width = 34; ws.getColumn(2).width = 18;
  let r=1;
  ws.getCell(r,1).value = `Online Payment (SSL Commerz) \u2014 bank credit ${b.date}`; ws.getCell(r,1).font = BOLD; r+=2;
  const rows = [
    ['Admission Fee', b.admissionFee], ['Session Fee', b.sessionFee], ['Tuition Fee', b.tuitionFee],
    ['Muqaddam Fee', b.mqmFee], ['Books & Stationery', b.booksSty], ['Transport Fee', b.transportFee],
    ['Uniform Fee', b.uniform], ['Event Fee', b.eventFee], ['Misc (Exam Fee / Late Fine)', b.misc],
  ];
  rows.forEach(([label,amt])=>{
    if(!amt) return;
    ws.getCell(r,1).value = label; ws.getCell(r,2).value = amt; r++;
  });
  ws.getCell(r,1).value = 'Total'; ws.getCell(r,1).font = BOLD;
  ws.getCell(r,2).value = b.total; ws.getCell(r,2).font = BOLD;
  return wb;
}
async function saveOnlinePaymentBucket(b){
  const logId = uid();
  const revEntry = {id:logId, date:b.date, desc:`Online Payment (SSL Commerz) - entered ${b.date}`};
  REVENUE_CATS.forEach(c=>{ revEntry[c.key] = 0; });
  revEntry.admissionFee = b.admissionFee;
  revEntry.sessionFee = b.sessionFee;
  revEntry.tuitionFee = b.tuitionFee;
  revEntry.mqmFee = b.mqmFee;
  revEntry.booksSty = b.booksSty;
  revEntry.transportFee = b.transportFee;
  revEntry.uniform = b.uniform;
  revEntry.eventFee = b.eventFee;
  revEntry.misc = (revEntry.misc||0) + b.misc;
  const [y,m] = b.date.split('-');
  const mlKey = monthKeyFor(MONTHS[parseInt(m,10)-1], y);
  getMonthlyLedgerMonth(mlKey).revenueEntries.push(revEntry);
  if(!Array.isArray(state.onlinePaymentLog)) state.onlinePaymentLog = [];
  const fileName = `Online_Payment_${b.date}.xlsx`;
  let fileBase64 = null;
  try{ fileBase64 = await workbookToBase64(await buildOnlinePaymentWorkbook(b)); }catch(e){ /* view/download simply won't be offered for this entry if this fails */ }
  state.onlinePaymentLog.push({id:logId, generatedAt:new Date().toISOString(), bankDate:b.date, grandTotal:b.total, fileName, fileBase64});
}

/* Every description ever typed for a given CoA category, so the browser's
   native autocomplete can suggest it again - e.g. type "b" in Transport
   and "Bank conveyance bill" shows up if it's been used before. */
/* Splits old free-typed multi-item description text into individual
   suggestion candidates, and strips a trailing amount if one was typed
   inline (a habit from before per-item description+amount sections
   existed) - e.g. "১. গ্যাস লোড ৫০০/-  ২. পানির বিল ৩০০/-" becomes
   ["গ্যাস লোড", "পানির বিল"], not one unmatchable blob with numbers and
   money baked in that a suggestion box could never match against. */
function splitDescIntoSuggestionParts(raw){
  if(!raw) return [];
  let text = raw;
  if(text.includes(',')){
    return text.split(',').map(p=>p.trim()).filter(Boolean);
  }
  // Normalize numbered-list markers (Bengali or English digits + "." or
  // "।"), whether at a line start or inline, to one delimiter.
  text = text.replace(/(^|\n|\s)([0-9\u09E6-\u09EF]+)\s*[.।]\s*/g, '$1\u0001');
  let parts = text.split('\u0001');
  if(parts.length===1 && text.includes('\n')) parts = text.split('\n');
  return parts
    .map(p=>p.replace(/[৳৲]?\s*[0-9\u09E6-\u09EF][0-9\u09E6-\u09EF,]*\s*\/?-\s*(?:টাকা|taka)?\s*$/i, ''))
    .map(p=>p.trim())
    .filter(Boolean);
}
function descriptionSuggestions(catKey){
  const seen = new Set();
  allVouchers().forEach(v=>{
    if(v.catKey===catKey && v.desc && v.desc.trim()){
      splitDescIntoSuggestionParts(v.desc.trim()).forEach(t=>seen.add(t));
    }
  });
  return Array.from(seen).sort((a,b)=>a.localeCompare(b));
}
/* Same suggestion-splitting logic as descriptionSuggestions(), but
   sourced from every "Collected from (head)" ever typed under Misc
   Collection, across every day - this box had no suggestions at all
   before. */
function miscCollectionDescSuggestions(){

  allDaysEverywhere().forEach(d=>{

}
function iouDescSuggestions(){

      } else {

      }
    }

  return Array.from(seen).sort((a,b)=>a.localeCompare(b));
}
function transferNoteSuggestions(field){

/* Plain Levenshtein edit distance between two strings - used only for the
   description spell-check suggestion below, on short Latin-script words. */
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = [];
  for(let i=0;i<=m;i++){ dp.push([i]); }
  for(let j=1;j<=n;j++){ dp[0][j] = j; }
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
/* Every Latin-script word (3+ letters) ever typed across every
   description-like field in the whole tool - vouchers, misc collection,
   IOU/payable descriptions, recurring templates, Monthly Ledger manual
   entries. This is the "known correct spellings" vocabulary the spell
   suggestion checks against, since there's no real dictionary here - just
   what's actually been typed (and reused) before. Tracks the most-used
   original casing per word so a suggestion reads naturally, e.g.
   "Tuition" rather than "tuition". */
function descriptionWordIndex(){
  const idx = new Map();
  const addText = (text)=>{
    if(!text) return;
    String(text).split(/[^A-Za-z]+/).forEach(raw=>{
      if(raw.length<3) return;
      const key = raw.toLowerCase();
      let e = idx.get(key);
      if(!e){ e = {count:0, forms:new Map()}; idx.set(key,e); }
      e.count++;
      e.forms.set(raw, (e.forms.get(raw)||0)+1);
    });
  };
  allVouchers().forEach(v=>addText(v.desc));
  allDaysEverywhere().forEach(d=>{
    (d.miscCollectionSections||[]).forEach(sec=>addText(sec.desc));
  });
  (state.iouRegistry||[]).forEach(i=>addText(i.desc));
  (state.payableRegistry||[]).forEach(i=>addText(i.desc));
  (state.templates||[]).forEach(t=>addText(t.desc));
  return idx;
}
/* Flags words in `text` that don't exactly match the known vocabulary
   above but are close (1 edit for short words, 2 for longer ones) to a
   word that's been used more than once before - a likely typo, not just
   an uncommon-but-correct word. */
function findSpellingSuggestions(text, idx){
  if(!text) return [];
  const out = [];
  const seen = new Set();
  [...text.matchAll(/[A-Za-z]{3,}/g)].forEach(m=>{
    const raw = m[0];
    const key = raw.toLowerCase();
    if(idx.has(key) || seen.has(key)) return; // already a known/correct spelling
    let best = null, bestDist = Infinity;
    idx.forEach((entry, candKey)=>{
      if(entry.count<2) return; // only trust spellings seen more than once
      const maxDist = candKey.length<=4 ? 1 : 2;
      const dist = levenshtein(key, candKey);
      if(dist<=maxDist && dist<bestDist){ bestDist = dist; best = entry; }
    });
    if(best){
      seen.add(key);
      const form = [...best.forms.entries()].sort((a,b)=>b[1]-a[1])[0][0];
      out.push({wrong: raw, suggestion: form});
    }
  });
  return out;
}

/* Adds a new blank voucher line to a category and returns it - shared by
   the "+ Add voucher" button and Enter-key quick entry so numbering stays
   consistent between both paths. */
/* Draft -> Reviewed -> Approved review workflow for CoA vouchers. Purely
   a personal checklist (this tool is single-user) - no sign-off identity
   is attached, just a quick visual cue for what's been double-checked
   before a day gets locked. */
const STATUS_ORDER = ['draft','reviewed','approved'];
const STATUS_LABELS = {draft:'Draft', reviewed:'Reviewed', approved:'Approved'};
function statusLabel(s){ return STATUS_LABELS[s] || STATUS_LABELS.draft; }
function nextStatus(s){
  const i = STATUS_ORDER.indexOf(s);
  return STATUS_ORDER[(i+1) % STATUS_ORDER.length] || 'draft';
}

function addCoaVoucher(day, catKey){
  const cat = COA.find(c=>c.key===catKey);
  state.voucherCounters[catKey] += 1;
  // The month/year in a voucher number are the DAY's own date, not the
  // global "live" Setup month - a day can be entered before the live
  // month gets switched over (see Daily Ledger month-filter), and the
  // voucher number must still reflect its own actual month.
  const [yy,mm] = (day.date||todayDateStr()).split('-');
  const yearShort = yy.slice(-2);
  const monthNum = Number(mm);
  const voucher = `${cat.short}${state.voucherCounters[catKey]}/${monthNum}/${yearShort}`;
  const item = {id:uid(), voucher, voucherSeq:state.voucherCounters[catKey], desc:'', note:'', amount:0, status:'draft', sections:[{id:uid(), desc:'', amount:0}]};
  day.coa[catKey].push(item);
  return item;
}
/* If the voucher being removed was the most recently issued number in
   its category (and nothing newer has been added since), gives that
   number back so the next "+ Add voucher" reuses it instead of skipping
   ahead - covers both "added a blank line then deleted it without
   filling it in" and "filled one in, then deleted it right after". If a
   newer voucher already exists, the number stays retired (reusing it
   then would collide with that newer voucher). */
function reclaimVoucherNumberIfLast(catKey, removedItem){
  if(!removedItem || removedItem.voucherSeq==null) return;
  if(state.voucherCounters[catKey]===removedItem.voucherSeq){
    state.voucherCounters[catKey] -= 1;
  }
}
/* Keeps item.desc/item.amount (used everywhere - totals, exports, search)
   in sync with item.sections. One section behaves exactly like the plain
   desc/amount of old; 2+ sections becomes a numbered multi-line list with
   the combined total, e.g. "1. Toner purchase\n2. Travel fare". */
function syncCoaItemFromSections(item){
  if(!item.sections || item.sections.length===0) item.sections = [{id:uid(), desc:item.desc||'', amount:item.amount||0}];
  if(item.sections.length===1){
    item.desc = item.sections[0].desc||'';
    item.amount = Number(item.sections[0].amount)||0;
  } else {
    item.desc = item.sections.map((s,i)=>`${i+1}. ${s.desc||''}`).join('\n');
    item.amount = item.sections.reduce((sum,s)=>sum+(Number(s.amount)||0),0);
  }
}

/* Miscellaneous Collection: occasional cash income collected under a
   head other than Service Revenue (e.g. a Tailor fee paid in cash on a
   day that isn't a formal deposit). Modeled exactly like a Cash
   Disbursed voucher's sections: empty by default; the first entry
   added behaves like a plain single line; a second+ becomes a
   numbered list ("1. ...", "2. ...") under one voucher, with the
   amounts summed into day.miscCollection, which feeds Cash In Hand
   and the day's Excel export the same way Service Revenue does. */
function ensureMiscCollectionSections(day){
  if(!day.miscCollectionSections) day.miscCollectionSections = [];
  return day.miscCollectionSections;
}
function syncMiscCollectionFromSections(day){
  const sections = ensureMiscCollectionSections(day);
  day.miscCollection = sections.reduce((sum,s)=>sum+(Number(s.amount)||0),0);
}
function miscCollectionDescText(day){
  const sections = ensureMiscCollectionSections(day);
  if(sections.length===0) return '';
  if(sections.length===1) return sections[0].desc||'';
  /* Multiple sections all fold into ONE export line: descriptions
     comma-separated, amount is the combined total (not one row per
     section) - e.g. "Tailor fees, Transport fees" with total 560. */
  return sections.map(s=>s.desc||'').filter(Boolean).join(', ');
}

          </div>

      const detail = linkRow.querySelector('.asset-link-detail');
      const select = linkRow.querySelector('.asset-link-select');
      const qtyInp = linkRow.querySelector('.asset-link-qty');

        <div class="field desc" style="margin-bottom:0;">
          <label>Description ${carried?`<span class="tag">carried from ${dayLabel(item.fromDate)}</span>`:''}</label>
          <input type="text" class="desc-input" value="${escapeHtml(item.desc)}" placeholder="e.g. Khairul - extra fronted">
        </div>
        <div class="field amt" style="margin-bottom:0;"><label>Amount owed</label><input type="text" inputmode="decimal" class="amt-input" value="${formatAsianAmount(item.amount)}"></div>
        <button class="secondary small" type="button" data-action="pay-payable" data-day="${day.id}" data-item="${item.id}" title="Mark as paid out (remember to also enter the cash voucher)">Paid</button>
      </div>
    `);
    const descInp = row.querySelector('.desc-input');
    const amtInp = row.querySelector('.amt-input');
    descInp.oninput = ()=>{ item.desc = descInp.value; saveState(); };
    wireLockableTextInput(descInp);
    wireAmountInput(amtInp, (num)=>{ item.amount = num; refreshComputedOnly(); });
    container.appendChild(row);
  });
}

function distinctDayMonthKeys(){
  const keys = new Set();
  state.days.forEach(d=>{ if(d.date) keys.add(d.date.slice(0,7)); }); // "YYYY-MM" sorts correctly as a plain string
  return Array.from(keys).sort();
}
/* The month currently "selected" in the Daily Ledger - same footer
   selector used for "Download whole month", falling back to the open day
   tab's month, then the active Month/Year. Used to filter notesheet log
   lists to just this month's entries. */
function currentSelectedMonthKey(){
  const keys = distinctDayMonthKeys();
  if(dlMonthKey && keys.includes(dlMonthKey)) return dlMonthKey;
  const activeDay = findDay(selectedDayId);
  if(activeDay && activeDay.date) return activeDay.date.slice(0,7);
  return monthKeyFor(state.month, state.year);
}
function renderFooter(){
  const keys = distinctDayMonthKeys();
  if(keys.length && (!dlMonthKey || !keys.includes(dlMonthKey))){
    const activeDay = findDay(selectedDayId);
    const preferred = (activeDay && activeDay.date) ? activeDay.date.slice(0,7) : null;
    dlMonthKey = (preferred && keys.includes(preferred)) ? preferred : keys[keys.length-1];
  }
  const wrap = el(`
    <footer class="dl">
      <button class="secondary" data-action="dl-day">Download this day (Excel)</button>
      ${keys.length>1 ? `<select id="dl-month-select" title="Month to download">
        ${keys.map(k=>`<option value="${k}" ${k===dlMonthKey?'selected':''}>${monthKeyLabel(k)}</option>`).join('')}
      </select>` : ''}
      <button data-action="dl-month">Download whole month (Excel)</button>
      <div style="width:100%;text-align:center;font-size:10.5px;color:var(--ink-soft);opacity:.6;margin-top:6px;">v${APP_BUILD} &middot; updated ${APP_UPDATED_LABEL}</div>
    </footer>
  `);
  const sel = wrap.querySelector('#dl-month-select');
  if(sel) sel.onchange = (e)=>{ dlMonthKey = e.target.value; };
  return wrap;
}

/* ======================================================================
   ONE delegated listener for every button in the app.
   Buttons never get per-render onclick rebinding, so there is no way
   for a stale handler to fire on the wrong row.
   ====================================================================== */
function wireDelegation(){
  document.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-action]');
    if(!t) return;
    const action = t.dataset.action;
    const dayId = t.dataset.day;
    const day = dayId ? findDay(dayId) : null;

    // Any nav-item click on the narrow/mobile layout should close the
    // slide-out drawer, whatever action it triggers - otherwise the menu
    // stays covering the screen after the user picked something from it.
    if(t.classList.contains('nav-item') && window.innerWidth<=900) sidebarOpen = false;

    if(action==='toggle-sidebar'){ sidebarOpen = !sidebarOpen; render(); return; }
    if(action==='close-sidebar'){ sidebarOpen = false; render(); return; }
    if(action==='open-panel'){ openPanel(t.dataset.panel); render(); return; }
    if(action==='go-home'){ viewingPanel = null; render(); return; }
    if(action==='hide-panel-page'){ viewingPanel = null; render(); return; }
    if(action==='close-panel-page'){
      const p = viewingPanel ? panelInfo(viewingPanel) : null;
      if(p) p[2](false);
      viewingPanel = null; render(); return;
    }

    if(action==='toggle-password-form'){ passwordFormOpen = !passwordFormOpen; render(); return; }
    if(action==='toggle-daylock-password-form'){ dayLockPasswordFormOpen = !dayLockPasswordFormOpen; render(); return; }
    if(action==='toggle-monthlock-password-form'){ monthLockPasswordFormOpen = !monthLockPasswordFormOpen; render(); return; }
    if(action==='toggle-security-form'){ securityFormOpen = !securityFormOpen; render(); return; }
    if(action==='lock-now'){
      if(!state.lockPasswordHash){ showAlert('Set a password first.'); return; }
      locked = true; lockError = ''; render();
      return;
    }
    if(action==='toggle-vault-form'){ vaultSetupFormOpen = !vaultSetupFormOpen; render(); return; }
    if(action==='vault-lock-now'){
      if(!vaultEnabled || !vaultKey){ return; }
      (async ()=>{
        const plainJson = JSON.stringify(state);
        const {iv,data} = await vaultEncrypt(plainJson, vaultKey);
        pendingVaultEnvelope = {[VAULT_ENC_MAGIC]:true, v:1, salt:vaultSaltB64, iv, data};
        vaultKey = null;
        vaultError = '';
        vaultLocked = true;
        render();
      })();
      return;
    }
    if(action==='disable-vault'){
      showConfirm('Turn off data encryption? The saved data will be re-written in plain (unencrypted) form from here on.', async ()=>{
        vaultEnabled = false;
        vaultKey = null;
        vaultSaltB64 = null;

    if(action==='export-backup'){ exportBackupJson(); return; }

    if(action==='edit-setup'){ state.setupDone=false; render(); return; }
    if(action==='delete-historical-import'){

      return;

    if(action==='dismiss-dup-warning'){ if(duplicateWarningTimer) clearTimeout(duplicateWarningTimer); duplicateWarning=null; render(); return; }

    if(!day && action!=='dl-day' && action!=='dl-month'){ return; }

    if(action==='add-withdraw'){ if(day.locked) return; day.withdrawals.push({id:uid(), amount:0, bankId:state.banks[0].id, note:''}); render(); return; }
    if(action==='remove-withdraw'){
      if(day.locked) return;
      const idx = day.withdrawals.findIndex(x=>x.id===t.dataset.item);
      const removed = day.withdrawals[idx];
      day.withdrawals = day.withdrawals.filter(x=>x.id!==t.dataset.item);
      pushUndo('Withdrawal removed.', ()=>{ day.withdrawals.splice(idx,0,removed); });
      saveState(); render(); return;
    }
    if(action==='add-deposit'){ if(day.locked) return; day.deposits.push({id:uid(), amount:0, bankId:state.banks[0].id, note:''}); render(); return; }
    if(action==='remove-deposit'){
      if(day.locked) return;
      const idx = day.deposits.findIndex(x=>x.id===t.dataset.item);
      const removed = day.deposits[idx];
      day.deposits = day.deposits.filter(x=>x.id!==t.dataset.item);
      pushUndo('Deposit removed.', ()=>{ day.deposits.splice(idx,0,removed); });
      saveState(); render(); return;
    }
    if(action==='add-iou'){ if(day.locked) return; state.iouRegistry.push({id:uid(), desc:'', amount:0, fromDate:day.date, toDate:null}); render(); return; }
    if(action==='open-settle-iou'){
      if(day.locked) return;
      const item = state.iouRegistry.find(x=>x.id===t.dataset.item);
      if(item) showSettleIouModal(day, item);
      return;
    }
    if(action==='remove-iou'){
      if(day.locked) return;
      const item = state.iouRegistry.find(x=>x.id===t.dataset.item);
      if(item){
        if(item.fromDate===day.date){
          const idx = state.iouRegistry.findIndex(x=>x.id===item.id);
          logAuditDelete('IOU', item);
          state.iouRegistry = state.iouRegistry.filter(x=>x.id!==item.id);
          pushUndo('IOU removed.', ()=>{ state.iouRegistry.splice(idx,0,item); });
        } else {
          const prevToDate = item.toDate;
          item.toDate = addDaysStr(day.date, -1);
          pushUndo('IOU stopped carrying forward.', ()=>{ item.toDate = prevToDate; });
        }
      }
      saveState(); render();
      return;
    }
    if(action==='add-payable'){
      if(day.locked) return;
      state.payableRegistry.push({id:uid(), desc:'', amount:0, fromDate:day.date, toDate:null});
      render();
      return;
    }
    if(action==='pay-payable'){
      if(day.locked) return;
      const item = state.payableRegistry.find(x=>x.id===t.dataset.item);
      if(item){
        if(item.fromDate===day.date){
          const idx = state.payableRegistry.findIndex(x=>x.id===item.id);
          state.payableRegistry = state.payableRegistry.filter(x=>x.id!==item.id);
          pushUndo('Payable marked paid.', ()=>{ state.payableRegistry.splice(idx,0,item); });
        } else {
          const prevToDate = item.toDate;
          item.toDate = addDaysStr(day.date, -1);
          pushUndo('Payable marked paid.', ()=>{ item.toDate = prevToDate; });
        }
      }
      saveState(); render();
      return;
    }
    if(action==='add-bank-transfer'){
      if(day.locked) return;
      if(state.banks.length<2){ showAlert('Add at least two bank accounts to make a transfer.'); return; }
      if(!day.bankTransfers) day.bankTransfers = [];
      const from = state.banks[0], to = state.banks[1];
      day.bankTransfers.push({id:uid(), fromBankId:from.id, toBankId:to.id, amount:0});
      render();
      return;
    }
    if(action==='remove-bank-transfer'){
      if(day.locked) return;
      const idx = (day.bankTransfers||[]).findIndex(x=>x.id===t.dataset.item);
      const removed = day.bankTransfers[idx];
      day.bankTransfers = (day.bankTransfers||[]).filter(x=>x.id!==t.dataset.item);
      pushUndo('Bank transfer removed.', ()=>{ day.bankTransfers.splice(idx,0,removed); });
      saveState(); render();
      return;
    }

    if(action==='add-coa'){
      if(day.locked) return;
      addCoaVoucher(day, t.dataset.cat);
      render();
      return;
    }
    if(action==='add-coa-from-template'){
      if(day.locked) return;
      const tpl = state.templates.find(x=>x.id===t.dataset.tpl);
      if(!tpl) return;
      const cat = COA.find(c=>c.key===tpl.catKey);
      state.voucherCounters[tpl.catKey] += 1;
      const [yy,mm] = (day.date||todayDateStr()).split('-');
      const yearShort = yy.slice(-2);
      const monthNum = Number(mm);
      const voucher = `${cat.short}${state.voucherCounters[tpl.catKey]}/${monthNum}/${yearShort}`;
      day.coa[tpl.catKey].push({id:uid(), voucher, voucherSeq:state.voucherCounters[tpl.catKey], desc:tpl.desc, amount:tpl.amount, status:'draft'});
      render();
      return;
    }
    if(action==='print-day-sheet'){
      printDaySheet(day, computeAll()[day.id]);
      return;
    }
    if(action==='print-all-vouchers'){
      printAllVouchersForDay(day);
      return;
    }
    if(action==='print-coa-voucher'){
      const cat = COA.find(c=>c.key===t.dataset.cat);
      const item = (day.coa[t.dataset.cat]||[]).find(x=>x.id===t.dataset.item);
      if(cat && item) printDebitVoucher(day, cat, item);
      return;
    }
    if(action==='upload-bank-statement'){
      const inp = document.getElementById('bank-statement-input-'+t.dataset.bank);
      if(inp) inp.click();
      return;
    }
    if(action==='add-misc-collection-section'){
      if(day.locked) return;
      ensureMiscCollectionSections(day).push({id:uid(), desc:'', amount:0});
      syncMiscCollectionFromSections(day);
      saveState(); render();
      return;
    }
    if(action==='remove-misc-collection-section'){
      if(day.locked) return;
      const sections = ensureMiscCollectionSections(day);
      const removedSec = sections.find(s=>s.id===t.dataset.section);
      if(removedSec) logAuditDelete('Misc Collection', removedSec);
      day.miscCollectionSections = sections.filter(s=>s.id!==t.dataset.section);
      syncMiscCollectionFromSections(day);
      saveState(); render();
      return;
    }
    if(action==='add-coa-section'){
      const catKey = t.dataset.cat;
      const item = (day.coa[catKey]||[]).find(x=>x.id===t.dataset.item);
      if(item){
        if(!item.sections) item.sections = [{id:uid(), desc:item.desc||'', amount:item.amount||0}];
        item.sections.push({id:uid(), desc:'', amount:0});
        syncCoaItemFromSections(item);
        saveState(); render();
      }
      return;
    }
    if(action==='remove-coa-section'){
      const catKey = t.dataset.cat;
      const item = (day.coa[catKey]||[]).find(x=>x.id===t.dataset.item);
      if(item && item.sections && item.sections.length>1){
        const removedSec = item.sections.find(s=>s.id===t.dataset.section);
        if(removedSec) logAuditDelete(`${catKey} voucher section`, removedSec);
        item.sections = item.sections.filter(s=>s.id!==t.dataset.section);
        syncCoaItemFromSections(item);
        saveState(); render();
      }
      return;
    }
    if(action==='remove-coa'){
      if(day.locked) return;
      const catKey = t.dataset.cat;
      const idx = day.coa[catKey].findIndex(x=>x.id===t.dataset.item);
      const removed = day.coa[catKey][idx];
      logAuditDelete(`${catKey} voucher`, {voucher:removed.voucher, desc:removed.desc, amount:removed.amount});
      let removedAssetEntry = null, removedAssetItemId = null;
      if(removed.assetLink){
        const assetItem = state.fixedAssetRegister.items.find(a=>a.id===removed.assetLink.assetItemId);
        const entry = assetItem && assetItem.entries.find(e=>e.id===removed.assetLink.entryId);
        if(assetItem && entry){
          logAuditDelete(`Asset entry (${assetItem.name})`, entry);
          removedAssetEntry = entry; removedAssetItemId = assetItem.id;
          assetItem.entries = assetItem.entries.filter(e=>e.id!==entry.id);
        }
      }
      day.coa[catKey] = day.coa[catKey].filter(x=>x.id!==t.dataset.item);
      const reclaimedSeq = (removed.voucherSeq!=null && state.voucherCounters[catKey]===removed.voucherSeq) ? removed.voucherSeq : null;
      reclaimVoucherNumberIfLast(catKey, removed);
      pushUndo((removed.desc||catKey+' voucher')+' removed.', ()=>{
        day.coa[catKey].splice(idx,0,removed);
        // If the delete had freed up this number and nothing new has
        // claimed it since, put the counter back too - otherwise the
        // restored voucher and the next new one would collide.
        if(reclaimedSeq!=null && state.voucherCounters[catKey]===reclaimedSeq-1){
          state.voucherCounters[catKey] = reclaimedSeq;
        }
        if(removedAssetEntry && removedAssetItemId){
          const assetItem = state.fixedAssetRegister.items.find(a=>a.id===removedAssetItemId);
          if(assetItem) assetItem.entries.push(removedAssetEntry);
        }
      });
      saveState(); render();
      return;
    }
    if(action==='open-move-coa'){
      if(day.locked) return;
      const catKey = t.dataset.cat;
      const item = day.coa[catKey].find(x=>x.id===t.dataset.item);
      if(item) showMoveVoucherModal(day, catKey, item);
      return;
    }

    if(action==='dl-day'){ exportDay(selectedDayId); return; }
    if(action==='dl-month'){ exportMonth(); return; }
  });
}



/* ======================================================================
   Excel export (ExcelJS) — mirrors the original workbook's layout:
   Times New Roman throughout, bold section/total rows, thin borders on
   every used cell, and live =SUM(...) / cross-sheet formulas instead of
   hard-coded numbers, so the file behaves exactly like the hand-built
   sample once opened in Excel.
   ====================================================================== */
const EXCELJS_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
  'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',
  'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js'
];
let excelJsLoadPromise = null;
/* --- Bank Statement upload & cross-check -------------------------------
   Reads an uploaded Excel export of the real bank statement (Date,
   Deposit/Credit, Withdrawal/Debit, Balance columns - header names vary
   by bank, so we match by keyword) and stores the parsed rows. On
   upload, every day already recorded in the app whose date appears in
   the statement gets its Bank Reconciliation "statement balance" field
   auto-filled, which drives the existing per-day mismatch breakdown
   further down. A summary (matched/mismatched day counts + a table of
   exactly which dates and amounts differ) is shown separately so a
   mismatch doesn't require opening every day one at a time. */
function excelSerialToDateStr(n){
  // Excel's day-0 is 1899-12-30 in the (incorrect, but universal) 1900 date system.
  const ms = Math.round((Number(n)-25569)*86400*1000);
  const d = new Date(ms);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function parseStatementDateCell(v){
  if(v==null || v==='') return null;
  if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number') return excelSerialToDateStr(v);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    let [,, a, b, y] = [null, ...m]; // a=day-or-month, b=month-or-day, y=year
    let day = m[1], mon = m[2], yr = m[3];
    if(yr.length===2) yr = (Number(yr)<70?'20':'19')+yr;
    if(Number(mon)>12){ const t=day; day=mon; mon=t; } // swap if the "month" is >12, it must be the day
    return `${yr}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3,})[\s\-](\d{2,4})/);
  if(m){
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const mi = months.indexOf(m[2].slice(0,3).toLowerCase());
    if(mi>=0){ let yr=m[3]; if(yr.length===2) yr=(Number(yr)<70?'20':'19')+yr; return `${yr}-${String(mi+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  }
  return null;
}
function parseStatementAmountCell(v){
  if(v==null || v==='') return 0;
  if(typeof v==='number') return v;
  const s = String(v).replace(/[,\s৳]/g,'').replace(/^Tk\.?/i,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
async function parseBankStatementFile(bankId, file){
  await loadExcelJS();
  const buf = await file.arrayBuffer();
  const wb = new ExcelJS.Workbook();
  wb.calcProperties = {fullCalcOnLoad:true}; // force Excel to recalculate on open, never show a stale cached month/value
  await wb.xlsx.load(buf);
  const ws = wb.worksheets[0];
  if(!ws) throw new Error('No sheet found in that file.');
  let headerRow = null, cols = {};
  for(let r=1; r<=Math.min(15, ws.rowCount); r++){
    const row = ws.getRow(r);
    const found = {};
    row.eachCell({includeEmpty:false}, (cell, c)=>{
      const t = String(cell.value||'').trim().toLowerCase();
      if(!t) return;
      if(/date/.test(t) && found.date===undefined) found.date = c;
      else if(/(deposit|credit)/.test(t) && found.deposit===undefined) found.deposit = c;
      else if(/(withdraw|debit)/.test(t) && found.withdrawal===undefined) found.withdrawal = c;
      else if(/balance/.test(t) && found.balance===undefined) found.balance = c;
    });
    if(found.date!==undefined && found.balance!==undefined){ headerRow = r; cols = found; break; }
  }
  if(headerRow===null) throw new Error('Could not find Date/Balance column headers in the first 15 rows - check the file has a header row like "Date, Deposit, Withdrawal, Balance".');
  const rows = [];
  for(let r=headerRow+1; r<=ws.rowCount; r++){
    const row = ws.getRow(r);
    const dateCell = row.getCell(cols.date).value;
    const date = parseStatementDateCell(dateCell);
    if(!date) continue;
    rows.push({
      date,
      deposit: cols.deposit!==undefined ? parseStatementAmountCell(row.getCell(cols.deposit).value) : 0,
      withdrawal: cols.withdrawal!==undefined ? parseStatementAmountCell(row.getCell(cols.withdrawal).value) : 0,
      balance: parseStatementAmountCell(row.getCell(cols.balance).value)
    });
  }
  if(rows.length===0) throw new Error('Found the header row but no data rows under it.');
  return rows;
}
/* Fills bd.reconciledBalance for every day (current + archived) whose
   date matches a row in the uploaded statement, so the existing mismatch
   breakdown (further down the bank card) reflects the real statement
   without retyping each closing balance by hand. Only overwrites values
   that were previously auto-filled or empty - a manually typed note
   survives, and a manually typed balance the person clearly entered on
   purpose is left alone unless it now conflicts with the statement (in
   which case the statement wins, since that's the source of truth). */
function applyBankStatementToDays(bankId){
  const stmt = state.bankStatements[bankId];
  if(!stmt) return;
  const byDate = {};
  stmt.rows.forEach(r=>{ byDate[r.date] = r; });
  const applyToDayList = (days)=>{
    days.forEach(day=>{
      const row = byDate[day.date];
      if(!row) return;
      const bd = ensureBankDaily(day, bankId);
      bd.reconciledBalance = row.balance;
      bd.reconcileNote = `Auto from statement: ${stmt.fileName}`;
    });
  };
  applyToDayList(state.days||[]);
  (state.archive||[]).forEach(m=>applyToDayList(m.days||[]));
}
/* Cross-check summary for a bank + date range (typically the days
   currently loaded for the live month): matched/mismatched counts,
   totals, and the list of mismatched dates with both figures. */
function bankStatementCrossCheck(bankId, days, computed){
  const stmt = state.bankStatements[bankId];
  if(!stmt) return null;
  const byDate = {};
  stmt.rows.forEach(r=>{ byDate[r.date] = r; });
  let matched=0, mismatched=0, stmtDepositTotal=0, stmtWithdrawTotal=0, appDepositTotal=0, appWithdrawTotal=0;
  const diffs = [];
  days.forEach(day=>{
    const row = byDate[day.date];
    const bc = computed[day.id] && computed[day.id].banks[bankId];
    if(row){
      stmtDepositTotal += row.deposit; stmtWithdrawTotal += row.withdrawal;
    }
    if(bc){
      appDepositTotal += bc.sslDeposit + bc.transferIn + bc.bankXferIn;
      appWithdrawTotal += bc.fees + bc.salaryAccount + bc.salaryCash + bc.transferOut + bc.bankXferOut;
    }
    if(row && bc){
      const diff = Math.round((bc.closing - row.balance)*100)/100;
      if(diff===0) matched++;
      else { mismatched++; diffs.push({date:day.date, appClosing:bc.closing, stmtBalance:row.balance, diff}); }
    }
  });
  return {fileName:stmt.fileName, uploadedAt:stmt.uploadedAt, rowCount:stmt.rows.length, matched, mismatched,
          stmtDepositTotal, stmtWithdrawTotal, appDepositTotal, appWithdrawTotal, diffs};
}

function loadExcelJS(){
  if(typeof ExcelJS !== 'undefined') return Promise.resolve();
  if(excelJsLoadPromise) return excelJsLoadPromise;
  excelJsLoadPromise = (async ()=>{
    for(const url of EXCELJS_URLS){
      try{
        await new Promise((resolve, reject)=>{
          const s = document.createElement('script');
          s.src = url;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        if(typeof ExcelJS !== 'undefined') return;
      }catch(e){ /* try next source */ }
    }
    throw new Error('Could not load the Excel export library from any source.');
  })();
  return excelJsLoadPromise;
}

function base64ToArrayBuffer(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
