  const years = voucherYearsPresent(voucherList);
  const selectedLabel = ()=> summaryFilters.catKeys.map(k=>catList.find(c=>c.key===k).label).join(' + ');
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128202;</span> Category-wise Summary</h3>
      <p class="subnote">Tick one category to see it alone, or several to see their combined total &mdash; grouped by month or year, or totalled over any custom date range. Expenditure totals include any imported historical notesheets alongside real Daily Ledger vouchers.</p>
      <div class="row" style="flex-wrap:wrap; align-items:flex-start;">
        <div class="field" style="min-width:160px;">
          <label>Type</label>
          <select id="sum-type">
            <option value="expenditure" ${summaryFilters.type==='income'?'':'selected'}>Expenditure</option>
            <option value="income" ${summaryFilters.type==='income'?'selected':''}>Income</option>
          </select>
        </div>
        <div class="field" style="min-width:220px;">
          <label>Categories</label>
          <div id="sum-cat-checks" style="display:flex; flex-wrap:wrap; gap:4px 14px; border:1px solid var(--line-soft); border-radius:8px; padding:8px 10px; background:#fff;">
            ${catList.map(c=>`
              <label style="display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:normal; margin:0;">
                <input type="checkbox" class="sum-cat-check" value="${c.key}" ${summaryFilters.catKeys.includes(c.key)?'checked':''}>
                ${escapeHtml(c.label)}
              </label>
            `).join('')}
          </div>
        </div>
        <div class="field" style="min-width:220px;">
          <label>View</label>
          <select id="sum-mode">
            <option value="month" ${summaryFilters.mode==='month'?'selected':''}>By month</option>
            <option value="year" ${summaryFilters.mode==='year'?'selected':''}>By year</option>
            <option value="range" ${summaryFilters.mode==='range'?'selected':''}>Custom date range</option>
          </select>
        </div>
        ${summaryFilters.mode==='month' ? `
        <div class="field" style="min-width:120px;">
          <label>Year <span class="tag">optional</span></label>
          <select id="sum-year">
            <option value="">All years</option>
            ${years.map(y=>`<option value="${y}" ${summaryFilters.year===y?'selected':''}>${y}</option>`).join('')}
          </select>
        </div>` : ''}
        ${summaryFilters.mode==='range' ? `
        <div class="field"><label>From date</label><input type="date" id="sum-from" value="${summaryFilters.fromDate}"></div>
        <div class="field"><label>To date</label><input type="date" id="sum-to" value="${summaryFilters.toDate}"></div>
        ` : ''}
      </div>
      <div id="sum-results"></div>
    </div>
  `);
  function drawResults(){
    const box = card.querySelector('#sum-results');
    box.innerHTML = '';
    if(summaryFilters.catKeys.length===0){
      box.appendChild(el(`<p class="empty">Tick at least one category above.</p>`));
      return;
    }
    const catFilter = { catKeys: summaryFilters.catKeys };
    if(summaryFilters.mode==='month'){
      const f = Object.assign({}, catFilter, summaryFilters.year ? {year:summaryFilters.year} : {});
      const filtered = filteredVouchers(f, voucherList);
      const rows = groupSum(filtered, v=>v.date.slice(0,7), k=>{
        const [y,m] = k.split('-');
        return `${MONTHS[parseInt(m,10)-1]} ${y}`;
      });
      renderSummaryTable(box, rows, 'Month', filtered, v=>v.date.slice(0,7));
    } else if(summaryFilters.mode==='year'){
      const filtered = filteredVouchers(catFilter, voucherList);
      const rows = groupSum(filtered, v=>v.date.slice(0,4));
      renderSummaryTable(box, rows, 'Year', filtered, v=>v.date.slice(0,4));
    } else {
      const f = Object.assign({}, catFilter, {fromDate:summaryFilters.fromDate, toDate:summaryFilters.toDate});
      const results = filteredVouchers(f, voucherList);
      const total = results.reduce((s,v)=>s+v.amount,0);
      box.appendChild(el(`<div class="computed total"><span class="lbl">${escapeHtml(selectedLabel())} total for this range</span><span>${money(total)}</span></div>`));
      if(results.length===0){
        box.appendChild(el(`<p class="empty">No vouchers in this range.</p>`));
      } else {
        box.appendChild(el(`<p class="subnote" style="margin-top:8px;">${results.length} voucher${results.length===1?'':'s'}:</p>`));
        results.forEach(v=>{
          box.appendChild(el(`<div class="computed"><span class="lbl">${voucherDateLabel(v)} &middot; ${escapeHtml(v.cat.label)}${v.voucher?' &middot; '+escapeHtml(v.voucher):''}${v.desc?' &mdash; '+escapeHtml(v.desc):''}</span><span>${money(v.amount)}</span></div>`));
        });
      }
    }
  }
  function renderSummaryTable(box, rows, groupLabel, sourceVouchers, rowKeyFn){
    if(rows.length===0){ box.appendChild(el(`<p class="empty">No data for ${escapeHtml(selectedLabel())} yet.</p>`)); return; }
    const grand = rows.reduce((s,r)=>s+r.total,0);
    const table = el(`
      <div style="overflow-x:auto; margin-top:10px;">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
            <th style="padding:6px 8px;">${groupLabel}</th>
            <th style="padding:6px 8px; text-align:right;">Total</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `);
    const tbody = table.querySelector('tbody');
    // Clicking a row drills into that month/year's individual vouchers,
    // largest amount first - same click again collapses it.
    rows.slice().reverse().forEach(r=>{
      const tr = el(`<tr style="border-bottom:1px solid var(--line-soft); cursor:pointer;" data-row-key="${escapeHtml(r.key)}"><td style="padding:6px 8px;">${escapeHtml(r.label)} <span style="opacity:.4; font-size:11px;">&#9662;</span></td><td style="padding:6px 8px; text-align:right;" class="mono">${money(r.total)}</td></tr>`);
      tr.onclick = ()=>{
        const existing = tr.nextElementSibling;
        if(existing && existing.dataset.expansionFor===r.key){ existing.remove(); return; }
        tbody.querySelectorAll('tr[data-expansion-for]').forEach(x=>x.remove());
        const vouchers = (sourceVouchers||[]).filter(v=>rowKeyFn(v)===r.key).sort((a,b)=>b.amount-a.amount);
        const detailTr = el(`<tr data-expansion-for="${escapeHtml(r.key)}"><td colspan="2" style="padding:0;background:var(--paper-soft, #f7f6f2);"></td></tr>`);
        const cell = detailTr.querySelector('td');
        vouchers.forEach(v=>{
          cell.appendChild(el(`<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 8px 6px 22px;border-bottom:1px solid var(--line-soft);font-size:12.5px;">
            <span>${voucherDateLabel(v)}${v.cat?' &middot; '+escapeHtml(v.cat.label):''}${v.voucher?' &middot; '+escapeHtml(v.voucher):''}${v.desc?' &mdash; '+escapeHtml(v.desc):''}</span>
            <span class="mono" style="flex:none;">${money(v.amount)}</span>
          </div>`));
        });
        if(!vouchers.length){
          cell.appendChild(el(`<p class="empty" style="padding:6px 8px 6px 22px;">No vouchers.</p>`));
        }
        tr.after(detailTr);
      };
      tbody.appendChild(tr);
    });
    box.appendChild(table);
    box.appendChild(el(`<div class="computed total" style="margin-top:10px;"><span class="lbl">${escapeHtml(selectedLabel())} grand total</span><span>${money(grand)}</span></div>`));
  }
  drawResults();
  card.querySelector('#sum-type').onchange = (e)=>{
    summaryFilters.type = e.target.value;
    summaryFilters.catKeys = []; // reset - the other side uses a different category set
    render();
  };
  card.querySelectorAll('.sum-cat-check').forEach(chk=>{
    chk.onchange = ()=>{
      const checked = Array.from(card.querySelectorAll('.sum-cat-check:checked')).map(x=>x.value);
      summaryFilters.catKeys = checked;
      drawResults();
    };
  });
  card.querySelector('#sum-mode').onchange = (e)=>{ summaryFilters.mode = e.target.value; render(); };
  const yearSel = card.querySelector('#sum-year');
  if(yearSel) yearSel.onchange = (e)=>{ summaryFilters.year = e.target.value; drawResults(); };
  const fromInp = card.querySelector('#sum-from');
  const toInp = card.querySelector('#sum-to');
  if(fromInp) fromInp.onchange = (e)=>{ summaryFilters.fromDate = e.target.value; drawResults(); };
  if(toInp) toInp.onchange = (e)=>{ summaryFilters.toDate = e.target.value; drawResults(); };
  return card;
}

/* --- Historical Withdraw Notesheet Import: upload old .xlsx notesheets
   (this app's own generated format) purely so they're findable in
   Advanced Search / Category Summary - see allHistoricalVouchers() and
   parseHistoricalNotesheetFile() above. Never touches real accounting. --- */
function historicalImportListHtml(){
  // Sort by the notesheet's own date range (oldest first), not by when it
  // happened to be uploaded - a person importing files out of order
  // shouldn't see the list jump around by upload time instead of reading
  // top-to-bottom like a real chronological record.
  const imports = (state.historicalImports||[]).slice().sort((a,b)=>(a.fromDate||'').localeCompare(b.fromDate||''));
  if(!imports.length) return `<p class="empty" style="margin-top:10px;">No historical notesheets imported yet.</p>`;
  return `
    <div style="overflow-x:auto; margin-top:14px;">
      <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
          <th style="padding:6px 8px;">File</th>
          <th style="padding:6px 8px;">Category</th>
          <th style="padding:6px 8px;">Date range (as written)</th>
          <th style="padding:6px 8px; text-align:right;">Items</th>
          <th style="padding:6px 8px; text-align:right;">Total</th>
          <th style="padding:6px 8px;"></th>
        </tr></thead>
        <tbody>
          ${imports.map(imp=>{
            const cat = findHistoryCategory(imp.catKey);
            return `<tr style="border-bottom:1px solid var(--line-soft);">
              <td style="padding:6px 8px;" class="mono">${escapeHtml(imp.fileName)}</td>
              <td style="padding:6px 8px;">${cat?escapeHtml(cat.label):escapeHtml(imp.catKey)}</td>
              <td style="padding:6px 8px;">${escapeHtml(imp.rangeLabel)}</td>
              <td style="padding:6px 8px; text-align:right;">${imp.items.length}</td>
              <td style="padding:6px 8px; text-align:right;" class="mono">${money(imp.total)}</td>
              <td style="padding:6px 8px; text-align:right;"><button type="button" class="danger small" data-action="delete-historical-import" data-id="${imp.id}" title="Delete this import">&times;</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}
function renderHistoricalImportCard(){
  const HIST_YEARS = ['2024','2025','2026'];
  const catOptionsHtml = ()=>{
    const customCats = state.customHistoricalCategories||[];
    return `
      <option value="">Auto-detect from file</option>
      <optgroup label="Main expense categories">
        ${COA.map(c=>`<option value="${c.key}">${escapeHtml(c.label)}</option>`).join('')}
      </optgroup>
      ${customCats.length ? `<optgroup label="Custom (historical-only) categories">
        ${customCats.map(c=>`<option value="${c.key}">${escapeHtml(c.label)}</option>`).join('')}
      </optgroup>` : ''}
    `;
  };
  const customCatListHtml = ()=>{
    const customCats = state.customHistoricalCategories||[];
    if(!customCats.length) return '';
    return `
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">
        ${customCats.map(c=>`
          <span class="tag" style="display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 10px;">
            ${escapeHtml(c.label)}
            <button type="button" class="danger small" data-action="delete-hist-category" data-key="${c.key}" title="Delete this custom category" style="padding:1px 6px;">&times;</button>
          </span>
        `).join('')}
      </div>
    `;
  };
  const card = el(`
    <div class="card" id="section-historical-import">
      <h3><span class="num">&#128194;</span> Historical Notesheet Import</h3>
      <p class="subnote">Upload old Withdraw Notesheet .xlsx files (the ones this app itself generates) so their line items show up in Advanced Search and Category Summary. This is lookup-only &mdash; it never feeds the Monthly Ledger, reconciliation, or any accounting total. Exact per-item dates aren't needed; each notesheet's own written date range, category, and every line's own amount are what get read in.</p>
      <div class="row" style="align-items:flex-end; gap:14px; flex-wrap:wrap;">
        <div class="field" style="flex:1 1 300px;">
          <label>Notesheet files (.xlsx) &mdash; choose one or several at once</label>
          <input type="file" id="hist-file-input" accept=".xlsx" multiple>
        </div>
        <div class="field" style="min-width:220px;">
          <label>Category <span class="tag">applies to all files chosen above</span></label>
          <select id="hist-cat">${catOptionsHtml()}</select>
        </div>
        <div class="field" style="min-width:120px;">
          <label>Year <span class="tag">optional</span></label>
          <select id="hist-year">
            <option value="">As written in file</option>
            ${HIST_YEARS.map(y=>`<option value="${y}">${y}</option>`).join('')}
          </select>
        </div>
        <button class="secondary" type="button" id="hist-import-btn">&#128229; Import</button>
      </div>
      <div class="settings-panel-group" style="margin-top:14px;">
        <div class="settings-panel-label">Add a custom historical category</div>
        <p class="subnote" style="margin-top:0;">The categories above (Transport, Tailor, Utility, ...) are the institute's main expense categories. If an old notesheet used a category that isn't one of these, add it here first, then pick it from the Category list above before importing.</p>
        <div class="row" style="align-items:flex-end; gap:10px; flex-wrap:wrap;">
          <div class="field" style="flex:1 1 240px;">
            <label>New category name</label>
            <input type="text" id="hist-new-cat-name" placeholder="e.g. Old Building Rent">
          </div>
          <button class="secondary" type="button" id="hist-add-cat-btn">&#10133; Add category</button>
        </div>
        <div id="hist-cat-list">${customCatListHtml()}</div>
      </div>
      <div id="hist-status" style="font-size:12.5px; color:var(--ink-soft); margin-top:6px;"></div>
      <div id="hist-import-results"></div>
      <div id="hist-import-list">${historicalImportListHtml()}</div>
    </div>
  `);
  const fileInp = card.querySelector('#hist-file-input');
  const catSel = card.querySelector('#hist-cat');
  const yearSel = card.querySelector('#hist-year');
  const statusEl = card.querySelector('#hist-status');
  const resultsEl = card.querySelector('#hist-import-results');
  card.querySelector('#hist-add-cat-btn').onclick = ()=>{
    const nameInp = card.querySelector('#hist-new-cat-name');
    const label = nameInp.value.trim();
    if(!label){ showAlert('Type a name for the new category first.'); return; }
    if(historyCategories().some(c=>normalizeCatLabel(c.label)===normalizeCatLabel(label))){
      showAlert('A category with that name already exists.'); return;
    }
    const key = 'hist_'+uid();
    state.customHistoricalCategories.push({key, label});
    saveState();
    nameInp.value = '';
    catSel.innerHTML = catOptionsHtml();
    catSel.value = key;
    card.querySelector('#hist-cat-list').innerHTML = customCatListHtml();
  };
  card.querySelector('#hist-import-btn').onclick = async ()=>{
    const files = Array.from(fileInp.files||[]);
    if(!files.length){ showAlert('Choose one or more notesheet .xlsx files first.'); return; }
    const overrideCatKey = catSel.value || null;
    const overrideYear = yearSel.value || null;
    statusEl.textContent = `Reading ${files.length} file${files.length===1?'':'s'}\u2026`;
    resultsEl.innerHTML = '';
    const ok = [], failed = [];
    for(const file of files){
      try{
        const recs = await parseHistoricalNotesheetFile(file, overrideCatKey, overrideYear);
        recs.forEach(rec=>{ state.historicalImports.push(rec); ok.push(rec); });
      }catch(e){
        failed.push({fileName:file.name, message:e.message});
      }
    }
    statusEl.textContent = `${ok.length} imported, ${failed.length} failed.`;
    resultsEl.innerHTML =
      (ok.length ? `<p class="subnote" style="color:#2E7D32;">&#10003; Imported:<br>${ok.map(r=>{
        const cat = findHistoryCategory(r.catKey);
        return escapeHtml(r.fileName)+' &mdash; '+(cat?escapeHtml(cat.label):r.catKey)+' &middot; '+escapeHtml(r.rangeLabel)+' ('+r.items.length+' item'+(r.items.length===1?'':'s')+', '+money(r.total)+')';
      }).join('<br>')}</p>` : '') +
      (failed.length ? `<p class="subnote" style="color:var(--danger);">&#9888; Could not read:<br>${failed.map(f=>escapeHtml(f.fileName)+' &mdash; '+escapeHtml(f.message)).join('<br>')}</p>` : '');
    if(ok.length){
      saveState();
      fileInp.value = '';
      card.querySelector('#hist-import-list').innerHTML = historicalImportListHtml();
    }
  };
  return card;
}

/* --- Journal / General Ledger / Trial Balance: a separate double-entry
   practice view built from buildJournalEntries() (see definition near
   COA/REVENUE_CATS above). Read-only, doesn't affect any real report. --- */
function renderJournalCard(){
  const allEntries = buildJournalEntries();
  const years = [...new Set(allEntries.map(e=>e.date.slice(0,4)))].sort().reverse();
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128209;</span> Journal / Ledger / Trial Balance</h3>
      <p class="subnote">A separate, traditional double-entry practice view built from your existing vouchers and Deposit-Notesheet revenue figures &mdash; for learning alongside the institution's actual records. Doesn't feed the Monthly Ledger, Balance Sheet, or any export, and changes nothing there.</p>
      <div class="row" style="flex-wrap:wrap;">
        <div class="field" style="min-width:220px;">
          <label>View</label>
          <select id="jr-view">
            <option value="journal" ${journalFilters.view==='journal'?'selected':''}>Journal (day book)</option>
            <option value="ledger" ${journalFilters.view==='ledger'?'selected':''}>General Ledger</option>
            <option value="trial" ${journalFilters.view==='trial'?'selected':''}>Trial Balance</option>
          </select>
        </div>
        <div class="field" style="min-width:120px;">
          <label>Year <span class="tag">optional</span></label>
          <select id="jr-year">
            <option value="">All years</option>
            ${years.map(y=>`<option value="${y}" ${journalFilters.year===y?'selected':''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:140px;">
          <label>Month <span class="tag">optional</span></label>
          <select id="jr-month">
            <option value="">All months</option>
            ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0'); return `<option value="${v}" ${journalFilters.month===v?'selected':''}>${m}</option>`;}).join('')}
          </select>
        </div>
        ${journalFilters.view==='ledger' ? `
        <div class="field" style="min-width:220px;">
          <label>Account</label>
          <select id="jr-account">
            ${journalAccountList().map(a=>`<option value="${escapeHtml(a)}" ${(journalLedgerAccount||JOURNAL_CASH_ACCOUNT.label)===a?'selected':''}>${escapeHtml(a)}</option>`).join('')}
          </select>
        </div>` : ''}
      </div>
      <div id="jr-body"></div>
    </div>
  `);
  function filteredEntries(){
    return allEntries.filter(e=>{
      if(journalFilters.year && e.date.slice(0,4)!==journalFilters.year) return false;
      if(journalFilters.month && e.date.slice(5,7)!==journalFilters.month) return false;
      return true;
    });
  }
  function drawBody(){
    const box = card.querySelector('#jr-body');
    box.innerHTML = '';
    const entries = filteredEntries();
    if(journalFilters.view==='journal'){
      if(!entries.length){ box.appendChild(el(`<p class="empty">No journal entries for this period yet.</p>`)); return; }
      const table = el(`
        <div style="overflow-x:auto; margin-top:10px;">
          <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
              <th style="padding:6px 8px;">Date</th>
              <th style="padding:6px 8px;">Particulars</th>
              <th style="padding:6px 8px; text-align:right;">Debit</th>
              <th style="padding:6px 8px; text-align:right;">Credit</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      `);
      const tbody = table.querySelector('tbody');
      let totalDr = 0, totalCr = 0;
      entries.forEach(e=>{
        totalDr += e.amount; totalCr += e.amount;
        tbody.appendChild(el(`
          <tr style="border-bottom:1px solid var(--line-soft); vertical-align:top;">
            <td class="mono" style="padding:6px 8px; white-space:nowrap;">${dayLabel(e.date)} ${e.date.slice(0,4)}</td>
            <td style="padding:6px 8px;">
              <div>${escapeHtml(e.debitAccount)} <span style="opacity:.5;">Dr</span></div>
              <div style="padding-left:18px;">${escapeHtml(e.creditAccount)} <span style="opacity:.5;">Cr</span></div>
              <div style="opacity:.65; font-size:11.5px; margin-top:2px;">${escapeHtml(e.desc)}${e.voucher?' &middot; '+escapeHtml(e.voucher):''} <span style="opacity:.7;">(${escapeHtml(e.source)})</span></div>
            </td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${money(e.amount)}</td>
            <td class="mono" style="padding:6px 8px; text-align:right;"></td>
          </tr>
        `));
      });
      box.appendChild(table);
      box.appendChild(el(`<div class="computed total" style="margin-top:10px;"><span class="lbl">Total (Debit = Credit)</span><span>${money(totalDr)} = ${money(totalCr)}</span></div>`));
    } else if(journalFilters.view==='ledger'){
      const account = journalLedgerAccount || JOURNAL_CASH_ACCOUNT.label;
      const type = journalAccountType(account);
      const rows = entries.filter(e=>e.debitAccount===account || e.creditAccount===account)
        .sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
      if(!rows.length){ box.appendChild(el(`<p class="empty">No entries in ${escapeHtml(account)} for this period yet.</p>`)); return; }
      const table = el(`
        <div style="overflow-x:auto; margin-top:10px;">
          <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
              <th style="padding:6px 8px;">Date</th>
              <th style="padding:6px 8px;">Particulars</th>
              <th style="padding:6px 8px; text-align:right;">Debit</th>
              <th style="padding:6px 8px; text-align:right;">Credit</th>
              <th style="padding:6px 8px; text-align:right;">Balance</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      `);
      const tbody = table.querySelector('tbody');
      // Asset/Expense accounts grow on the Debit side; Income/Liability
      // accounts grow on the Credit side - the running balance follows
      // whichever side is this account's natural side.
      const growsOnDebit = (type==='asset' || type==='expense');
      let bal = 0;
      rows.forEach(e=>{
        const isDr = e.debitAccount===account;
        bal += (isDr ? e.amount : -e.amount) * (growsOnDebit ? 1 : -1);
        tbody.appendChild(el(`
          <tr style="border-bottom:1px solid var(--line-soft);">
            <td class="mono" style="padding:6px 8px; white-space:nowrap;">${dayLabel(e.date)} ${e.date.slice(0,4)}</td>
            <td style="padding:6px 8px;">${escapeHtml(e.desc)}<div style="opacity:.6; font-size:11.5px;">${escapeHtml(isDr ? e.creditAccount : e.debitAccount)}</div></td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${isDr?money(e.amount):''}</td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${!isDr?money(e.amount):''}</td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${money(Math.abs(bal))} ${bal<0?'(Cr)':'(Dr)'}</td>
          </tr>
        `));
      });
      box.appendChild(table);
      box.appendChild(el(`<div class="computed total" style="margin-top:10px;"><span class="lbl">${escapeHtml(account)} closing balance</span><span>${money(Math.abs(bal))} ${bal<0?'Cr':'Dr'}</span></div>`));
    } else {
      const totals = new Map(); // account -> {dr, cr}
      entries.forEach(e=>{
        if(!totals.has(e.debitAccount)) totals.set(e.debitAccount, {dr:0, cr:0});
        if(!totals.has(e.creditAccount)) totals.set(e.creditAccount, {dr:0, cr:0});
        totals.get(e.debitAccount).dr += e.amount;
        totals.get(e.creditAccount).cr += e.amount;
      });
      const rows = journalAccountList().filter(a=>totals.has(a)).map(a=>{
        const t = totals.get(a);
        const net = t.dr - t.cr;
        return {account:a, drCol: net>0?net:0, crCol: net<0?-net:0};
      });
      if(!rows.length){ box.appendChild(el(`<p class="empty">No entries for this period yet.</p>`)); return; }
      const table = el(`
        <div style="overflow-x:auto; margin-top:10px;">
          <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
              <th style="padding:6px 8px;">Account</th>
              <th style="padding:6px 8px; text-align:right;">Debit</th>
              <th style="padding:6px 8px; text-align:right;">Credit</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      `);
      const tbody = table.querySelector('tbody');
      let totalDr = 0, totalCr = 0;
      rows.forEach(r=>{
        totalDr += r.drCol; totalCr += r.crCol;
        tbody.appendChild(el(`
          <tr style="border-bottom:1px solid var(--line-soft); cursor:pointer;">
            <td style="padding:6px 8px;">${escapeHtml(r.account)}</td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${r.drCol?money(r.drCol):''}</td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${r.crCol?money(r.crCol):''}</td>
          </tr>
        `)).onclick = ()=>{
          journalLedgerAccount = r.account; journalFilters.view = 'ledger'; render();
        };
      });
      box.appendChild(table);
      box.appendChild(el(`
        <div class="computed total" style="margin-top:10px; ${Math.round(totalDr*100)===Math.round(totalCr*100)?'':'color:var(--danger,#B3261E);'}">
          <span class="lbl">Total ${Math.round(totalDr*100)===Math.round(totalCr*100)?'(balanced &#10003;)':'(NOT balanced - check entries)'}</span><span>${money(totalDr)} = ${money(totalCr)}</span>
        </div>
      `));
      box.appendChild(el(`<p class="subnote" style="margin-top:4px;">Click any account to open its General Ledger.</p>`));
    }
  }
  drawBody();
  card.querySelector('#jr-view').onchange = (e)=>{ journalFilters.view = e.target.value; render(); };
  card.querySelector('#jr-year').onchange = (e)=>{ journalFilters.year = e.target.value; drawBody(); };
  card.querySelector('#jr-month').onchange = (e)=>{ journalFilters.month = e.target.value; drawBody(); };
  const acctSel = card.querySelector('#jr-account');
  if(acctSel) acctSel.onchange = (e)=>{ journalLedgerAccount = e.target.value; drawBody(); };
  return card;
}

/* --- Fixed Asset Register + Depreciation: see newAssetItem/newAssetEntry/
   depreciationForEntry above. Entirely separate view, doesn't touch the
   Balance Sheet or any export. --- */
function renderAssetRegisterCard(){
  const items = state.fixedAssetRegister.items;
  if(!assetRegisterItemId && items.length) assetRegisterItemId = items[0].id;
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128188;</span> Fixed Asset Register</h3>
      <p class="subnote">Mirrors your paper register (serial, date, new, old, defective, shortage, total) with an optional value + useful life per acquisition, so Straight-Line Depreciation can be practiced. Separate from the Balance Sheet - doesn't change any real report.</p>
      <div class="row" style="flex-wrap:wrap; align-items:flex-end;">
        <div class="field" style="min-width:200px;">
          <label>View</label>
          <select id="ar-view">
            <option value="register" ${assetRegisterView==='register'?'selected':''}>Item Register</option>
            <option value="depreciation" ${assetRegisterView==='depreciation'?'selected':''}>Depreciation Summary</option>
          </select>
        </div>
        ${assetRegisterView==='register' ? `
        <div class="field" style="min-width:200px;">
          <label>Item</label>
          <select id="ar-item">
            ${items.length ? items.map(it=>`<option value="${it.id}" ${it.id===assetRegisterItemId?'selected':''}>${escapeHtml(it.name)}</option>`).join('') : `<option value="">No items yet</option>`}
          </select>
        </div>
        <div class="field" style="flex:none;">
          <button type="button" class="secondary small" id="ar-new-item">+ New item</button>
        </div>` : ''}
      </div>
      <div id="ar-body"></div>
    </div>
  `);
  const body = card.querySelector('#ar-body');

  function drawRegister(){
    body.innerHTML = '';
    const item = items.find(it=>it.id===assetRegisterItemId);
    if(!item){
      body.appendChild(el(`<p class="empty">No item selected yet - click "+ New item" above to start a register for something like Chair, Table, or Generator.</p>`));
      return;
    }
    const nameRow = el(`<div class="row" style="align-items:flex-end;margin-top:6px;">
      <div class="field" style="min-width:220px;">
        <label>Item name</label>
        <input type="text" id="ar-item-name" value="${escapeHtml(item.name)}"/>
      </div>
      <div class="field" style="flex:none;">
        <button type="button" class="danger small" id="ar-del-item">Delete this item</button>
      </div>
    </div>`);
    body.appendChild(nameRow);
    nameRow.querySelector('#ar-item-name').onchange = (e)=>{ item.name = e.target.value.trim()||item.name; saveState(); render(); };
    nameRow.querySelector('#ar-del-item').onclick = ()=>{
      if(!confirm(`Delete the whole "${item.name}" register (${item.entries.length} entries)? This can't be undone.`)) return;
      logAuditDelete('Fixed Asset item', {name:item.name, entries:item.entries.length});
      state.fixedAssetRegister.items = items.filter(it=>it.id!==item.id);
      assetRegisterItemId = state.fixedAssetRegister.items[0] ? state.fixedAssetRegister.items[0].id : null;
      saveState(); render();
    };

    if(item.entries.length){
      const table = el(`
        <div style="overflow-x:auto; margin-top:10px;">
          <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
              <th style="padding:6px 6px;">ক্রমিক</th>
              <th style="padding:6px 6px;">তারিখ</th>
              <th style="padding:6px 6px; text-align:right;">নতুন</th>
              <th style="padding:6px 6px; text-align:right;">পুরাতন</th>
              <th style="padding:6px 6px; text-align:right;">অকেজো</th>
              <th style="padding:6px 6px; text-align:right;">ঘাটতি</th>
              <th style="padding:6px 6px; text-align:right;">মোট</th>
              <th style="padding:6px 6px; text-align:right;">মূল্য/দাম</th>
              <th style="padding:6px 6px; text-align:right;">Useful life (yr)</th>
              <th style="padding:6px 6px;"></th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      `);
      const tbody = table.querySelector('tbody');
      item.entries.forEach((e,i)=>{
        e.qtyTotal = assetEntryTotal(e); // always kept in sync, shown read-only
        const tr = el(`
          <tr style="border-bottom:1px solid var(--line-soft);">
            <td class="mono" style="padding:5px 6px;">${i+1}</td>
            <td style="padding:5px 6px;"><input type="date" data-f="date" value="${e.date||''}" style="width:128px;"/></td>
            <td style="padding:5px 6px;"><input type="number" data-f="qtyNew" value="${e.qtyNew||0}" style="width:60px;text-align:right;"/></td>
            <td style="padding:5px 6px;"><input type="number" data-f="qtyOld" value="${e.qtyOld||0}" style="width:60px;text-align:right;"/></td>
            <td style="padding:5px 6px;"><input type="number" data-f="qtyDefective" value="${e.qtyDefective||0}" style="width:60px;text-align:right;"/></td>
            <td style="padding:5px 6px;"><input type="number" data-f="qtyShortage" value="${e.qtyShortage||0}" style="width:60px;text-align:right;"/></td>
            <td class="mono" style="padding:5px 6px; text-align:right; font-weight:600;">${e.qtyTotal}</td>
            <td style="padding:5px 6px;"><input type="number" data-f="value" placeholder="&#2661;" value="${e.value==null?'':e.value}" style="width:90px;text-align:right;"/></td>
            <td style="padding:5px 6px;"><input type="number" data-f="usefulLifeYears" placeholder="yr" value="${e.usefulLifeYears==null?'':e.usefulLifeYears}" style="width:60px;text-align:right;"/></td>
            <td style="padding:5px 6px;"><button type="button" class="danger small" data-del="1">&times;</button></td>
          </tr>
        `);
        tr.querySelectorAll('input[data-f]').forEach(inp=>{
          inp.onchange = ()=>{
            const f = inp.dataset.f;
            const oldVal = e[f];
            e[f] = (f==='date') ? inp.value : (inp.value===''? (f==='value'||f==='usefulLifeYears'? null : 0) : Number(inp.value));
            logAuditChange(`Asset entry (${item.name})`, f, oldVal, e[f]);
            saveState();
            drawRegister();
          };
        });
        tr.querySelector('[data-del]').onclick = ()=>{
          logAuditDelete(`Asset entry (${item.name})`, e);
          item.entries = item.entries.filter(x=>x.id!==e.id);
          saveState(); drawRegister();
        };
        tbody.appendChild(tr);
      });
      body.appendChild(table);
    } else {
      body.appendChild(el(`<p class="empty" style="margin-top:10px;">No entries yet for "${escapeHtml(item.name)}".</p>`));
    }
    const addBtn = el(`<button type="button" class="secondary small" style="margin-top:10px;">+ Add entry</button>`);
    addBtn.onclick = ()=>{
      const prevTotal = item.entries.length ? assetEntryTotal(item.entries[item.entries.length-1]) : 0;
      item.entries.push(newAssetEntry(prevTotal));
      saveState(); drawRegister();
    };
    body.appendChild(addBtn);
  }

  function drawDepreciation(){
    body.innerHTML = '';
    const asOf = todayDateStr();
    const rows = [];
    items.forEach(item=>{
      item.entries.forEach(e=>{
        const dep = depreciationForEntry(e, asOf);
        if(dep) rows.push({item:item.name, date:e.date, ...dep});
      });
    });
    if(!rows.length){
      body.appendChild(el(`<p class="empty" style="margin-top:10px;">No depreciable entries yet - add a value and useful life (years) to an acquisition row in the Item Register.</p>`));
      return;
    }
    rows.sort((a,b)=> a.date===b.date?0:(a.date<b.date?-1:1));
    const table = el(`
      <div style="overflow-x:auto; margin-top:10px;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
            <th style="padding:6px 8px;">Item</th>
            <th style="padding:6px 8px;">Acquired</th>
            <th style="padding:6px 8px; text-align:right;">Value</th>
            <th style="padding:6px 8px; text-align:right;">Life (yr)</th>
            <th style="padding:6px 8px; text-align:right;">Accum. Dep.</th>
            <th style="padding:6px 8px; text-align:right;">Book Value</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `);
    const tbody = table.querySelector('tbody');
    let totalValue=0, totalAccum=0, totalBook=0;
    rows.forEach(r=>{
      totalValue += r.value; totalAccum += r.accumulated; totalBook += r.bookValue;
      tbody.appendChild(el(`
        <tr style="border-bottom:1px solid var(--line-soft);">
          <td style="padding:6px 8px;">${escapeHtml(r.item)}</td>
          <td class="mono" style="padding:6px 8px;">${dayLabel(r.date)} ${r.date.slice(0,4)}</td>
          <td class="mono" style="padding:6px 8px; text-align:right;">${money(r.value)}</td>
          <td class="mono" style="padding:6px 8px; text-align:right;">${r.life}</td>
          <td class="mono" style="padding:6px 8px; text-align:right;">${money(r.accumulated)}</td>
          <td class="mono" style="padding:6px 8px; text-align:right; ${r.fullyDepreciated?'opacity:.6;':''}">${money(r.bookValue)}${r.fullyDepreciated?' (fully dep.)':''}</td>
        </tr>
      `));
    });
    body.appendChild(table);
    body.appendChild(el(`
      <div class="computed total" style="margin-top:10px;">
        <span class="lbl">Total original value / accumulated dep. / book value (as of ${dayLabel(asOf)} ${asOf.slice(0,4)})</span>
        <span>${money(totalValue)} / ${money(totalAccum)} / ${money(totalBook)}</span>
      </div>
    `));
    body.appendChild(el(`<p class="subnote" style="margin-top:4px;">Straight-Line method: value &divide; useful life (years), accrued monthly from the acquisition date.</p>`));
  }

  function draw(){ assetRegisterView==='register' ? drawRegister() : drawDepreciation(); }
  draw();
  card.querySelector('#ar-view').onchange = (e)=>{ assetRegisterView = e.target.value; render(); };
  const itemSel = card.querySelector('#ar-item');
  if(itemSel) itemSel.onchange = (e)=>{ assetRegisterItemId = e.target.value; drawRegister(); };
  const newItemBtn = card.querySelector('#ar-new-item');
  if(newItemBtn) newItemBtn.onclick = ()=>{
    const name = prompt('Item name (e.g. Chair, Table, Generator):');
    if(!name || !name.trim()) return;
    const it = newAssetItem(name.trim());
    state.fixedAssetRegister.items.push(it);
    assetRegisterItemId = it.id;
    saveState(); render();
  };
  return card;
}

/* --- Ratio Analysis & Cash Flow Statement: see ratioFiguresForMonth/
   outstandingPayablesAsOf above. Entirely separate view, doesn't touch
   the Balance Sheet, Monthly Ledger, or any export. --- */
function renderRatioCashFlowCard(){
  const allEntries = buildJournalEntries();
  const years = [...new Set([
    ...allEntries.map(e=>e.date.slice(0,4)),
    ...Object.keys(state.monthlyLedger.months).map(k=>k.slice(0,4))
  ])].sort().reverse();
  if(!ratioCashFlowFilters.year && years.length) ratioCashFlowFilters.year = years[0];
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128200;</span> Ratio Analysis &amp; Cash Flow Statement</h3>
      <p class="subnote">Two more separate, traditional-accounting practice views &mdash; Current/Cash Ratio and an Operating/Investing/Financing Cash Flow Statement, built from your existing vouchers and Monthly Ledger figures. Doesn't feed the Balance Sheet, Monthly Ledger, or any export.</p>
      <div class="row" style="flex-wrap:wrap;">
        <div class="field" style="min-width:220px;">
          <label>View</label>
          <select id="rc-view">
            <option value="ratio" ${ratioCashFlowFilters.view==='ratio'?'selected':''}>Ratio Analysis</option>
            <option value="cashflow" ${ratioCashFlowFilters.view==='cashflow'?'selected':''}>Cash Flow Statement</option>
          </select>
        </div>
        <div class="field" style="min-width:120px;">
          <label>Year</label>
          <select id="rc-year">
            ${years.map(y=>`<option value="${y}" ${ratioCashFlowFilters.year===y?'selected':''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:140px;">
          <label>Month <span class="tag">${ratioCashFlowFilters.view==='ratio'?'as-of':'optional'}</span></label>
          <select id="rc-month">
            ${ratioCashFlowFilters.view==='cashflow' ? `<option value="">Whole year</option>` : ''}
            ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0'); return `<option value="${v}" ${ratioCashFlowFilters.month===v?'selected':''}>${m}</option>`;}).join('')}
          </select>
        </div>
      </div>
      <div id="rc-body"></div>
    </div>
  `);
  function drawBody(){
    const box = card.querySelector('#rc-body');
    box.innerHTML = '';
    const year = ratioCashFlowFilters.year;
    if(ratioCashFlowFilters.view==='ratio'){
      const month = ratioCashFlowFilters.month || (()=>{
        const keysThisYear = Object.keys(state.monthlyLedger.months).filter(k=>k.startsWith(year+'-')).sort();
        return keysThisYear.length ? keysThisYear[keysThisYear.length-1].slice(5,7) : '';
      })();
      if(!month){ box.appendChild(el(`<p class="empty">Pick a month to see its ratios (Current Ratio is a snapshot "as of" a date, not a period total).</p>`)); return; }
      const key = `${year}-${month}`;
      const fig = ratioFiguresForMonth(key);
      const periodEntries = allEntries.filter(e=>e.date.slice(0,7)===key);
      const revenue = periodEntries.filter(e=>e.source!=='Expenditure Voucher').reduce((s,e)=>s+e.amount,0);
      const expenditure = periodEntries.filter(e=>e.source==='Expenditure Voucher').reduce((s,e)=>s+e.amount,0);
      const currentAssets = (fig.cash||0) + (fig.bank||0);
      const currentLiabilities = fig.payables;
      const anyUnknown = fig.cash==null || fig.bank==null;
      const rows = [
        {label:'Current Ratio', formula:'(Cash + Bank) &divide; Outstanding Payables', value: currentLiabilities>0 ? (currentAssets/currentLiabilities) : null, suffix:'', note: currentLiabilities>0 ? '' : 'No outstanding payables this month - ratio undefined (treat as strong).'},
        {label:'Cash Ratio', formula:'Cash in Hand &divide; Outstanding Payables', value: currentLiabilities>0 ? ((fig.cash||0)/currentLiabilities) : null, suffix:'', note: currentLiabilities>0 ? '' : 'No outstanding payables this month - ratio undefined.'},
        {label:'Net Surplus Margin', formula:'(Revenue &minus; Expenditure) &divide; Revenue &times; 100', value: revenue>0 ? ((revenue-expenditure)/revenue*100) : null, suffix:'%', note: revenue>0?'':'No revenue recorded this month.'},
        {label:'Expense Ratio', formula:'Expenditure &divide; Revenue &times; 100', value: revenue>0 ? (expenditure/revenue*100) : null, suffix:'%', note: revenue>0?'':'No revenue recorded this month.'},
      ];
      box.appendChild(el(`
        <div class="row" style="flex-wrap:wrap; margin-top:8px;">
          <div class="summary-box"><div class="lbl">Cash in Hand</div><div class="val">${fig.cash!=null?money(fig.cash):'&mdash;'}</div></div>
          <div class="summary-box"><div class="lbl">Bank Balance</div><div class="val">${fig.bank!=null?money(fig.bank):'&mdash;'}</div></div>
          <div class="summary-box"><div class="lbl">Outstanding Payables</div><div class="val">${money(fig.payables)}</div></div>
        </div>
      `));
      if(anyUnknown) box.appendChild(el(`<p class="subnote" style="color:var(--danger,#B3261E);">Cash/Bank figure not available for this month yet (no day-chain data and no manual figure saved in the Monthly Ledger's Balance Sheet) - ratios below may be incomplete.</p>`));
      const table = el(`
        <div style="overflow-x:auto; margin-top:10px;">
          <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
              <th style="padding:6px 8px;">Ratio</th>
              <th style="padding:6px 8px;">Formula</th>
              <th style="padding:6px 8px; text-align:right;">Value</th>
            </tr></thead>
            <tbody></tbody>
          </table>
        </div>
      `);
      const tbody = table.querySelector('tbody');
      rows.forEach(r=>{
        tbody.appendChild(el(`
          <tr style="border-bottom:1px solid var(--line-soft);">
            <td style="padding:6px 8px; font-weight:600;">${r.label}</td>
            <td style="padding:6px 8px; opacity:.7; font-size:11.5px;">${r.formula}</td>
            <td class="mono" style="padding:6px 8px; text-align:right;">${r.value!=null ? (r.suffix==='%' ? r.value.toFixed(1)+'%' : r.value.toFixed(2)) : `<span style="opacity:.5;">${r.note}</span>`}</td>
          </tr>
        `));
      });
      box.appendChild(table);
    } else {
      const month = ratioCashFlowFilters.month;
      const periodEntries = allEntries.filter(e=> month ? e.date.slice(0,7)===`${year}-${month}` : e.date.slice(0,4)===year);
      const operatingIn = periodEntries.filter(e=>e.debitAccount===JOURNAL_CASH_ACCOUNT.label).reduce((s,e)=>s+e.amount,0);
      const operatingOut = periodEntries.filter(e=>e.creditAccount===JOURNAL_CASH_ACCOUNT.label && e.source==='Expenditure Voucher' && journalAccountType(e.debitAccount)==='expense').reduce((s,e)=>s+e.amount,0);
      const investingOut = periodEntries.filter(e=>e.creditAccount===JOURNAL_CASH_ACCOUNT.label && e.source==='Expenditure Voucher' && journalAccountType(e.debitAccount)==='asset').reduce((s,e)=>s+e.amount,0);
      const netOperating = operatingIn - operatingOut;
      const netInvesting = -investingOut;
      const netFinancing = 0;
      const netChange = netOperating + netInvesting + netFinancing;
      const periodLabel = month ? `${MONTHS[Number(month)-1]} ${year}` : `Full year ${year}`;
      box.appendChild(el(`
        <div style="margin-top:10px;">
          <div class="computed"><span class="lbl">Cash from Operating Activities</span><span></span></div>
          <div class="computed" style="padding-left:16px;"><span class="lbl">Cash received (revenue + misc collection)</span><span>${money(operatingIn)}</span></div>
          <div class="computed" style="padding-left:16px;"><span class="lbl">Cash paid for operating expenses</span><span>(${money(operatingOut)})</span></div>
          <div class="computed total"><span class="lbl">Net cash from Operating</span><span>${money(netOperating)}</span></div>
          <div class="computed" style="margin-top:10px;"><span class="lbl">Cash from Investing Activities</span><span></span></div>
          <div class="computed" style="padding-left:16px;"><span class="lbl">Loan disbursed (III Assets Ltd)</span><span>(${money(investingOut)})</span></div>
          <div class="computed total"><span class="lbl">Net cash from Investing</span><span>${money(netInvesting)}</span></div>
          <div class="computed" style="margin-top:10px;"><span class="lbl">Cash from Financing Activities</span><span></span></div>
          <div class="computed" style="padding-left:16px;"><span class="lbl">None recorded</span><span>${money(0)}</span></div>
          <div class="computed total"><span class="lbl">Net cash from Financing</span><span>${money(netFinancing)}</span></div>
          <div class="computed total" style="margin-top:10px; border-top:2px solid var(--line); padding-top:6px;"><span class="lbl">Net change in cash &mdash; ${escapeHtml(periodLabel)}</span><span>${money(netChange)}</span></div>
        </div>
      `));
      box.appendChild(el(`<p class="subnote" style="margin-top:8px;">Built only from vouchers and Deposit-Notesheet revenue figures - internal cash&harr;bank transfers, bank fees, and salary paid directly from a bank account aren't modelled here, so this won't exactly match the real change in Cash + Bank for the period.</p>`));
    }
  }
  drawBody();
  card.querySelector('#rc-view').onchange = (e)=>{ ratioCashFlowFilters.view = e.target.value; render(); };
  card.querySelector('#rc-year').onchange = (e)=>{ ratioCashFlowFilters.year = e.target.value; drawBody(); };
  card.querySelector('#rc-month').onchange = (e)=>{ ratioCashFlowFilters.month = e.target.value; drawBody(); };
  return card;
}

/* --- Audit Trail / Edit Log: see pushAuditEntry/logAuditChange/
   logAuditDelete near the top of the file. Entirely separate view. --- */
function renderAuditLogCard(){
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128270;</span> Audit Trail / Edit Log</h3>
      <p class="subnote">Every field edit and deletion made anywhere in the tool, newest first, with the previous value kept - not a "who did it" log (single-user tool), just "what did this used to say" and "what got deleted". Separate from every other report.</p>
      <div class="row" style="flex-wrap:wrap; align-items:flex-end;">
        <div class="field" style="min-width:160px;">
          <label>Show</label>
          <select id="al-kind">
            <option value="">All</option>
            <option value="edit">Edits only</option>
            <option value="delete">Deletions only</option>
          </select>
        </div>
        <div class="field" style="flex:1 1 200px; min-width:160px;">
          <label>Search</label>
          <input type="text" id="al-search" placeholder="Filter by entity, field, or value&hellip;"/>
        </div>
        <div class="field" style="flex:none;">
          <button type="button" class="danger small" id="al-clear">Clear entire log</button>
        </div>
      </div>
      <div id="al-body"></div>
    </div>
  `);
  function draw(){
    const box = card.querySelector('#al-body');
    box.innerHTML = '';
    const kind = card.querySelector('#al-kind').value;
    const q = card.querySelector('#al-search').value.trim().toLowerCase();
    const rows = state.auditLog.filter(e=>{
      if(kind && e.kind!==kind) return false;
      if(q){
        const hay = [e.entity, e.field, e.oldVal, e.newVal, e.snapshot].filter(Boolean).join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    }).slice().reverse().slice(0,500); // newest first, cap what's rendered at once
    if(!rows.length){ box.appendChild(el(`<p class="empty" style="margin-top:10px;">No log entries yet${kind||q?' matching this filter':''}.</p>`)); return; }
    const table = el(`
      <div style="overflow-x:auto; margin-top:10px;">
        <table style="width:100%; border-collapse:collapse; font-size:12px;">
          <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
            <th style="padding:5px 6px;">When</th>
            <th style="padding:5px 6px;">Entity</th>
            <th style="padding:5px 6px;">What changed</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `);
    const tbody = table.querySelector('tbody');
    rows.forEach(e=>{
      tbody.appendChild(el(`
        <tr style="border-bottom:1px solid var(--line-soft); vertical-align:top;">
          <td class="mono" style="padding:5px 6px; white-space:nowrap; opacity:.75;">${escapeHtml(e.at)}</td>
          <td style="padding:5px 6px;">${escapeHtml(e.entity)}</td>
          <td style="padding:5px 6px;">
            ${e.kind==='delete'
              ? `<span style="color:var(--danger,#B3261E);font-weight:600;">Deleted</span> &mdash; <span style="opacity:.8;">${escapeHtml(e.snapshot||'(no details)')}</span>`
              : `<strong>${escapeHtml(e.field)}</strong>: <span style="opacity:.6;text-decoration:line-through;">${escapeHtml(e.oldVal||'(empty)')}</span> &rarr; <span>${escapeHtml(e.newVal||'(empty)')}</span>`
            }
          </td>
        </tr>
      `));
    });
    box.appendChild(table);
    if(state.auditLog.length>500) box.appendChild(el(`<p class="subnote" style="margin-top:6px;">Showing the most recent 500 matching entries (log holds up to 3000 total, oldest trimmed automatically).</p>`));
  }
  draw();
  card.querySelector('#al-kind').onchange = draw;
  card.querySelector('#al-search').oninput = draw;
  card.querySelector('#al-clear').onclick = ()=>{
    if(!confirm('Clear the entire audit log? This cannot be undone.')) return;
    state.auditLog = [];
    saveState(); draw();
  };
  return card;
}

/* --- SSL Commerz Entry Report: which dates had an SSL Commerz figure
   hand-entered in the Daily Ledger's Bank section, for a chosen month -
   a plain on-screen list, no export/print. --- */
function renderSslReportCard(){
  const allKeys = [...new Set(allDaysEverywhere().map(d=>d.date.slice(0,7)))].sort().reverse();
  const years = [...new Set(allKeys.map(k=>k.slice(0,4)))];
  if(!sslReportFilters.year && years.length) sslReportFilters.year = years[0];
  if(!sslReportFilters.month){
    const inYear = allKeys.filter(k=>k.startsWith(sslReportFilters.year+'-'));
    if(inYear.length) sslReportFilters.month = inYear[0].slice(5,7);
  }
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128179;</span> SSL Commerz Entries</h3>
      <p class="subnote">Just a list, on screen only - which dates this month have an SSL Commerz figure entered in the Daily Ledger's Bank section. No print, no export.</p>
      <div class="row" style="flex-wrap:wrap;">
        <div class="field" style="min-width:120px;">
          <label>Year</label>
          <select id="ssl-year">
            ${years.map(y=>`<option value="${y}" ${sslReportFilters.year===y?'selected':''}>${y}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="min-width:140px;">
          <label>Month</label>
          <select id="ssl-month">
            ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0'); return `<option value="${v}" ${sslReportFilters.month===v?'selected':''}>${m}</option>`;}).join('')}
          </select>
        </div>
      </div>
      <div id="ssl-body"></div>
    </div>
  `);
  function draw(){
    const box = card.querySelector('#ssl-body');
    box.innerHTML = '';
    const key = `${sslReportFilters.year}-${sslReportFilters.month}`;
    const rows = [];
    allDaysEverywhere().filter(d=>d.date.slice(0,7)===key).sort((a,b)=>a.date.localeCompare(b.date)).forEach(day=>{
      state.banks.forEach(b=>{
        const amt = Number((day.banksDaily && day.banksDaily[b.id] && day.banksDaily[b.id].sslDeposit) || 0);
        if(amt>0) rows.push({date:day.date, bank:b.name, amount:amt});
      });
    });
    if(!rows.length){ box.appendChild(el(`<p class="empty" style="margin-top:10px;">No SSL Commerz entries found for ${MONTHS[Number(sslReportFilters.month)-1]} ${sslReportFilters.year}.</p>`)); return; }
    const table = el(`
      <div style="overflow-x:auto; margin-top:10px;">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead><tr style="text-align:left; border-bottom:2px solid var(--line);">
            <th style="padding:6px 8px;">Date</th>
            <th style="padding:6px 8px;">Bank</th>
            <th style="padding:6px 8px; text-align:right;">Amount</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    `);
    const tbody = table.querySelector('tbody');
    let total = 0;
    rows.forEach(r=>{
      total += r.amount;
      tbody.appendChild(el(`
        <tr style="border-bottom:1px solid var(--line-soft);">
          <td class="mono" style="padding:6px 8px;">${dayLabel(r.date)} ${r.date.slice(0,4)}</td>
          <td style="padding:6px 8px;">${escapeHtml(r.bank)}</td>
          <td class="mono" style="padding:6px 8px; text-align:right;">${money(r.amount)}</td>
        </tr>
      `));
    });
    box.appendChild(table);
    box.appendChild(el(`<div class="computed total" style="margin-top:10px;"><span class="lbl">${rows.length} ${rows.length===1?'entry':'entries'} &mdash; total</span><span>${money(total)}</span></div>`));
  }
  draw();
  card.querySelector('#ssl-year').onchange = (e)=>{ sslReportFilters.year = e.target.value; sslReportFilters.month = ''; render(); };
  card.querySelector('#ssl-month').onchange = (e)=>{ sslReportFilters.month = e.target.value; draw(); };
  return card;
}

/* --- Recurring Entry Templates: save a category+description+amount combo
   once, then add it as a new voucher with one click - handy for monthly
   recurring costs like rent, internet, or a fixed salary top-up. --- */
function renderTemplatesCard(){
  const card = el(`
    <div class="card">
      <h3><span class="num">&#128203;</span> Recurring Entry Templates</h3>
      <p class="subnote">Save a category + description + amount once. Each one then shows as a quick-add button under that category in the day panel below.</p>
      <div class="row" style="flex-wrap:wrap;">
        <div class="field" style="min-width:150px;">
          <label>Category</label>
          <select id="tpl-cat">${COA.map(c=>`<option value="${c.key}">${c.label}</option>`).join('')}</select>
        </div>
        <div class="field" style="min-width:180px;">
          <label>Description</label>
          <input type="text" id="tpl-desc" placeholder="e.g. Monthly internet bill">
        </div>
        <div class="field" style="min-width:130px;">
          <label>Amount <span class="tag">optional</span></label>
          <input type="text" inputmode="decimal" class="amt-input" id="tpl-amt" value="">
        </div>
      </div>
      <button type="button" id="tpl-add">+ Save template</button>
      <div class="divider"></div>
      <div id="tpl-list"></div>
    </div>
  `);
  let tplAmt = 0;
  wireAmountInput(card.querySelector('#tpl-amt'), (num)=>{ tplAmt = num; });
  function drawList(){
    const box = card.querySelector('#tpl-list');
    box.innerHTML = '';
    if(state.templates.length===0){ box.appendChild(el(`<p class="empty">No templates saved yet.</p>`)); return; }
    state.templates.forEach(tpl=>{
      const cat = COA.find(c=>c.key===tpl.catKey);
      const row = el(`
        <div class="line-item">
          <div class="voucher-badge mono">${escapeHtml(cat?cat.short:tpl.catKey)}</div>
          <div class="field desc" style="margin-bottom:0;"><label>Description</label><div class="mono" style="padding:8px 0;">${escapeHtml(tpl.desc)||'<span class=\"empty\">(blank)</span>'}</div></div>
          <div class="field amt" style="margin-bottom:0;"><label>Amount</label><div class="mono" style="padding:8px 0;">${tpl.amount?money(tpl.amount):'<span class=\"empty\">(set each time)</span>'}</div></div>
          <button class="danger small" type="button" data-action="remove-template" data-item="${tpl.id}" title="Remove template">&times;</button>
        </div>
      `);
      box.appendChild(row);
    });
  }
  drawList();
  card.querySelector('#tpl-add').onclick = ()=>{
    const catKey = card.querySelector('#tpl-cat').value;
    const desc = card.querySelector('#tpl-desc').value.trim();
    if(!desc){ showAlert('Give the template a description.'); return; }
    state.templates.push({id:uid(), catKey, desc, amount:tplAmt});
    saveState();
    card.querySelector('#tpl-desc').value = '';
    card.querySelector('#tpl-amt').value = '';
    tplAmt = 0;
    drawList();
  };
  return card;
}

function renderNotesheetCard(){
  const sortedDates = state.days.map(d=>d.date).sort();
  const minDate = sortedDates[0], maxDate = sortedDates[sortedDates.length-1];
  // Default (and re-default) the range to the currently-viewed month's own
  // days, not the oldest/newest day ever entered across all history - a
  // freshly-added day in a new month should make the notesheet range
  // follow it here, instead of staying stuck on whatever month it was
  // first opened in during this session.
  const curMonthKey = currentSelectedMonthKey();
  if(!notesheetRange || notesheetRangeMonthKey !== curMonthKey){
    const monthDates = state.days.map(d=>d.date).filter(d=>d.slice(0,7)===curMonthKey).sort();
    notesheetRange = {
      start: monthDates[0] || minDate,
      end: monthDates[monthDates.length-1] || maxDate,
    };
    notesheetRangeMonthKey = curMonthKey;
  }
  if(notesheetRange.start < minDate) notesheetRange.start = minDate;
  if(notesheetRange.end > maxDate) notesheetRange.end = maxDate;
  // "Post to Monthly Ledger as of" defaults to the generation date (today),
  // not the last date of the range - it's editable either way.
  if(!notesheetRange.attrib) notesheetRange.attrib = todayDateStr();

  const {cats, grandTotal} = collectNotesheetRange(notesheetRange.start, notesheetRange.end);

  const card = el(`
    <div class="card" id="section-notesheets">
      <h3><span class="num">&#9776;</span> Notesheets &amp; Withdraw Summary</h3>
      <p class="subnote">Pick a date range to generate one notesheet per Chart of Accounts category that had expenses (categories with none are skipped automatically), plus one consolidated Withdraw Summary &mdash; matching the existing notesheet format, voucher numbering and signature blocks.</p>
      <div class="row">
        <div class="field">
          <label>From date</label>
          <input type="date" id="ns-start" min="${minDate}" max="${maxDate}" value="${notesheetRange.start}">

        <div class="field">
          <label>To date</label>
          <input type="date" id="ns-end" min="${minDate}" max="${maxDate}" value="${notesheetRange.end}">

        <div class="field">
          <label>Post to Monthly Ledger as of <span class="tag" title="Which month this counts toward in Monthly Ledger - defaults to the To date, but you can pick any date">editable</span></label>

      <div class="computed total" style="margin-top:14px;"><span class="lbl">Grand total across all categories in range</span><span id="ns-grand-total">${money(grandTotal)}</span></div>

        <input type="checkbox" id="ns-save-toggle" checked> Save this to history (used by Monthly Ledger for cross-checking)
      </label>
    </div>
  `);

  function drawPreview(){
    const {cats, grandTotal} = collectNotesheetRange(notesheetRange.start, notesheetRange.end);
    const preview = card.querySelector('#ns-preview');
    preview.innerHTML = '';
    if(cats.length===0){
      preview.appendChild(el(`<p class="empty">No expenses recorded in this date range yet.</p>`));
    } else {
      cats.forEach(c=>{
        preview.appendChild(el(`
          <div class="computed"><span class="lbl">${c.cat.label} &mdash; next notesheet #${(state.notesheetCounters[c.key]||0)+1} &middot; ${c.items.length} voucher${c.items.length===1?'':'s'} &middot; ${dayLabel(c.firstDate)}&ndash;${dayLabel(c.lastDate)}</span><span>${money(c.total)}</span></div>
