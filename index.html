<style>
  :root{
    --paper:#F3F7F0;
    --card:#FFFFFF;
    --ink:#1F2A23;
    --ink-soft:#5B6459;
    --primary:#1B4B43;
    --primary-dark:#0F332C;
    --primary-tint:#DCE8E2;
    --accent:#B8863B;
    --accent-deep:#8C6423;
    --accent-soft:#EADFC5;
    --danger:#A23B2E;
    --danger-soft:#F3DFDA;
    --line:#D9E4D5;
    --line-soft:#E9F0E4;
    --radius:12px;
    --ease:cubic-bezier(.19,.85,.32,1.05);
    --shadow-sm:0 1px 2px rgba(15,51,44,.05), 0 1px 1px rgba(15,51,44,.04);
    --shadow-md:0 4px 14px rgba(15,51,44,.07), 0 1px 3px rgba(15,51,44,.05);
    --shadow-lg:0 14px 34px rgba(15,51,44,.14), 0 3px 10px rgba(15,51,44,.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  body{
    background:
      radial-gradient(1100px 520px at 12% -8%, rgba(184,134,59,.06), transparent 55%),
      radial-gradient(1000px 620px at 100% 0%, rgba(27,75,67,.08), transparent 55%),
      linear-gradient(180deg, #EFF6ED 0%, var(--paper) 320px);
    min-height:100vh;
  }
  body::before{
    content:'';position:fixed;top:0;left:0;right:0;height:3px;z-index:999;
    background:linear-gradient(90deg, var(--primary) 0%, var(--accent) 52%, var(--primary) 100%);
    background-size:200% 100%;
    animation:sheen 9s linear infinite;
  }
  @keyframes sheen{0%{background-position:0% 0;}100%{background-position:200% 0;}}
  .app-shell{display:flex;align-items:flex-start;min-height:100vh;}
  .wrap{flex:1 1 auto;min-width:0;max-width:980px;margin:0 auto;padding:22px 18px 90px;}
  /* Shift the middle ledger ~2in (192px) left of true-center, using
     margin (not transform) so it doesn't disturb position:fixed
     descendants like the right-side "Jump to" panel (which lives
     inside .wrap - a transform on this element would drag it along
     and off the visible viewport). Clamped to 0 so it can never push
     the ledger under the sidebar on narrower desktop widths; only
     active from the 901px breakpoint up (desktop, sidebar reserved). */
  @media (min-width:901px){
    .wrap{ margin-left:max(0px, calc(max(0px, 50vw - 594px) - 192px)); margin-right:auto; }
  }

  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--primary-dark);letter-spacing:-.01em;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;display:inline-flex;align-items:center;gap:7px;}
  .eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  header.top{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;padding-bottom:12px;position:relative;animation:fadeDown .5s var(--ease) both;}
  header.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg, var(--primary-dark) 0%, var(--line) 65%, transparent 100%);}
  .top-title-row{display:flex;align-items:flex-start;gap:12px;}
  .top-title h1{font-size:27px;margin-top:3px;}
  .top-title p{margin:5px 0 0;color:var(--ink-soft);font-size:13.5px;}

  .settings-panel-group{margin-bottom:14px;}
  .settings-panel-group:last-child{margin-bottom:0;}
  .settings-panel-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:7px;}

  .toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:6px;box-shadow:var(--shadow-sm);width:fit-content;max-width:100%;}
  .toolbar-group{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .toolbar-divider{width:1px;align-self:stretch;background:var(--line-soft);margin:4px 6px;}
  .toolbar button{padding:7px 12px;font-size:12.5px;border-radius:7px;}
  .toolbar button.secondary{border-color:transparent;background:transparent;box-shadow:none;}
  .toolbar button.secondary:hover{background:var(--paper);border-color:var(--line-soft);box-shadow:none;transform:none;}
  .toolbar .tag{margin-left:2px;}
  @media (max-width:640px){ .toolbar{width:100%;} }

  /* ============================ Left Sidebar ============================ */
  --sidebar-w: 208px;
  .app-shell{display:flex;align-items:flex-start;min-height:100vh;}
  .app-sidebar{
    position:sticky;top:0;align-self:flex-start;height:100vh;flex:0 0 var(--sidebar-w);width:var(--sidebar-w);z-index:600;
    display:flex;flex-direction:column;
    padding:20px 12px 12px;
    background:
      radial-gradient(220px 160px at 100% 0%, rgba(184,134,59,.16), transparent 60%),
      linear-gradient(165deg, #133730 0%, #1B4B43 46%, #0C2B25 100%);
    color:#DCE7DF;
    box-shadow:6px 0 28px rgba(15,51,44,.16);
    overflow-y:auto;
    transition:transform .32s var(--ease);
  }
  .app-sidebar::before{
    content:'';position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:
      repeating-linear-gradient(45deg, #EADFC5 0 1px, transparent 1px 30px),
      repeating-linear-gradient(-45deg, #EADFC5 0 1px, transparent 1px 30px);
  }
  .sidebar-brand{position:relative;padding:2px 4px 15px;margin-bottom:10px;border-bottom:1px solid rgba(234,223,197,.16);}
  .sidebar-brand-ar{font-family:'Fraunces',serif;font-size:14px;color:var(--accent-soft);line-height:1.3;}
  .sidebar-brand-title{font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:#fff;margin-top:4px;line-height:1.3;}
  .sidebar-brand-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-soft);margin-top:6px;display:flex;align-items:center;gap:6px;}
  .sidebar-brand-sub::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(184,134,59,.28);}
  .sidebar-nav{position:relative;display:flex;flex-direction:column;gap:2px;}
  .sidebar-label{position:relative;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:rgba(220,231,223,.5);padding:12px 8px 5px;}
  .nav-item{
    position:relative;display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:transparent;border:1px solid transparent;color:#CBD8CF;
    padding:8px 8px;border-radius:9px;font-size:12px;font-weight:600;font-family:'IBM Plex Sans',sans-serif;
    box-shadow:none;transition:background-color .15s var(--ease), color .15s var(--ease), transform .12s var(--ease), border-color .15s var(--ease);
  }
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px);box-shadow:none;}
  .nav-item:active{transform:translateX(2px) scale(.98);}
  .nav-item .nav-icon{width:24px;height:24px;flex:none;border-radius:7px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:background-color .15s ease,color .15s ease;}
  .nav-item .nav-icon svg{width:13px;height:13px;}
  .nav-item .nav-text{flex:1;line-height:1.2;}
  .nav-item.active{background:linear-gradient(90deg, rgba(184,134,59,.32), rgba(184,134,59,.08));border-color:rgba(184,134,59,.55);color:#fff;box-shadow:inset 0 0 0 1px rgba(184,134,59,.12);}
  .nav-item.active .nav-icon{background:var(--accent);color:#2A1D0B;}
  .nav-item.active::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 4px 4px 0;background:var(--accent);}
  /* .current = this section is the one actually on screen right now (a
     stronger fill than .active, which just means "open in the background,
     hidden"), so the two states read differently at a glance. */
  .nav-item.current{background:linear-gradient(90deg, rgba(184,134,59,.55), rgba(184,134,59,.18));border-color:var(--accent);}
  .nav-item.current .nav-icon{background:var(--accent);color:#2A1D0B;}
  /* Full-page view for a sidebar section (Dashboard, Search, Journal, ...) -
     replaces the main ledger in-place; Hide keeps the section's data alive
     in the background (its sidebar nav item stays lit) while Close resets
     it. */
  .panel-page{animation:fadeDown .4s var(--ease) both;}
  .panel-page-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    position:sticky;top:0;z-index:50;
    padding:11px 16px;margin:0 0 16px;border-radius:12px;
    background:linear-gradient(165deg,#163d35 0%, #1B4B43 55%, #0C2B25 100%);
    color:#EAF1EC;box-shadow:0 10px 26px rgba(15,51,44,.22), 0 2px 6px rgba(15,51,44,.15);
  }
  .panel-page-title{font-family:'Fraunces',serif;font-weight:600;font-size:17px;}
  .panel-page-controls{display:flex;gap:8px;}
  .panel-page-controls button{padding:7px 14px;font-size:12.5px;border-radius:8px;background:rgba(255,255,255,.08);color:#EAF1EC;border:1px solid rgba(255,255,255,.16);box-shadow:none;}
  .panel-page-controls button:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);transform:none;}
  .panel-page-controls button:not(.secondary){background:var(--accent);color:#2A1D0B;border-color:var(--accent);}
  .panel-page-controls button:not(.secondary):hover{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff;}
  .sidebar-divider{height:1px;background:rgba(234,223,197,.14);margin:10px 2px;}
  .sidebar-utility{position:relative;display:flex;align-items:center;gap:7px;padding:10px 4px 2px;}
  .sidebar-icon-btn{width:28px;height:28px;flex:none;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#DCE7DF;display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:none;}
  .sidebar-icon-btn svg{width:15px;height:15px;}
  .sidebar-icon-btn:hover{background:rgba(255,255,255,.16);color:#fff;transform:none;box-shadow:none;}
  .sidebar-icon-btn.danger{color:#F0C3B8;border-color:rgba(240,140,110,.25);}
  .sidebar-icon-btn.danger:hover{background:rgba(162,59,46,.35);}
  .sidebar-footer{position:relative;margin-top:auto;padding:11px 6px 2px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:rgba(220,231,223,.45);border-top:1px solid rgba(234,223,197,.1);}
  .sidebar-close{display:none;}
  .sidebar-toggle{display:none;background:var(--card);color:var(--primary-dark);border-color:var(--line);width:38px;height:38px;padding:0;align-items:center;justify-content:center;flex:none;}
  .sidebar-toggle svg{width:18px;height:18px;}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,32,27,.45);backdrop-filter:blur(1px);z-index:590;}

  .app-shell.no-sidebar .app-sidebar, .app-shell.no-sidebar .sidebar-overlay{display:none;}
  @media (max-width:900px){
    .app-sidebar{position:fixed;top:0;left:0;bottom:0;height:100vh;transform:translateX(-100%);}
    .app-sidebar.open{transform:translateX(0);}
    .sidebar-toggle{display:inline-flex;}
    .sidebar-close{display:inline-flex;position:absolute;top:16px;right:14px;background:rgba(255,255,255,.08);border-color:transparent;color:#fff;width:30px;height:30px;padding:0;align-items:center;justify-content:center;border-radius:8px;}
    .sidebar-overlay.open{display:block;}
  }

  button{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:600;border-radius:8px;border:1px solid var(--primary-dark);padding:8px 14px;cursor:pointer;background:var(--primary);color:#fff;transition:transform .16s var(--ease), background-color .18s ease, box-shadow .18s ease, border-color .18s ease;box-shadow:var(--shadow-sm);}
  button:hover{background:var(--primary-dark);box-shadow:var(--shadow-md);transform:translateY(-1px);}
  button:active{transform:translateY(0) scale(.97);box-shadow:var(--shadow-sm);}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  button.secondary{background:var(--card);color:var(--primary-dark);border-color:var(--line);}
  button.secondary:hover{background:#fff;border-color:var(--primary);}
  button.danger{background:var(--card);color:var(--danger);border-color:var(--danger-soft);}
  button.danger:hover{background:var(--danger-soft);border-color:var(--danger);}
  button.small{padding:5px 10px;font-size:12px;border-radius:6px;}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

  .card{scroll-margin-top:16px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--accent-soft);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:16px;
    box-shadow:var(--shadow-sm);
    animation:cardRise .5s var(--ease) both;
    transition:box-shadow .25s ease, border-left-color .25s ease;
  }
  .card:hover{box-shadow:var(--shadow-md);border-left-color:var(--accent);}
  @keyframes cardRise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}
  .card > h3{font-size:16.5px;margin-bottom:14px;padding-bottom:10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-soft);}
  .card > h3 .num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent-deep);border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:5px;padding:2px 7px;}
  .subnote{font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;line-height:1.5;}

  label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;letter-spacing:.01em;}
  input[type=text], input[type=number], input[type=date], input[type=password], select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;background:#fff;color:var(--ink);
    transition:border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
  }
  input[type=number]{font-family:'IBM Plex Mono',monospace;}
  input:hover, select:hover{border-color:#c3bda6;}
  input:focus, select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);background:#fff;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:140px;}

  .field{margin-bottom:10px;}

  .line-item{display:flex;gap:8px;align-items:flex-end;background:#fff;border:1px solid var(--line-soft);border-left:2px solid transparent;border-radius:8px;padding:9px 10px;margin-bottom:8px;transition:box-shadow .18s ease, border-color .18s ease;animation:rowIn .3s var(--ease) both;}
  .line-item:hover{box-shadow:var(--shadow-sm);border-color:var(--line);border-left-color:var(--accent);}
  @keyframes rowIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
  .line-item .voucher-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--primary-dark);color:#fff;border-radius:5px;padding:5px 8px;white-space:nowrap;align-self:center;}
  .status-badge{font-size:10.5px;font-weight:600;border-radius:20px;padding:5px 10px;white-space:nowrap;align-self:center;border:1px solid transparent;cursor:pointer;transition:background .15s var(--ease),transform .1s var(--ease);letter-spacing:.02em;}
  .status-badge:active{transform:scale(.95);}
  .status-badge:disabled{cursor:not-allowed;opacity:.6;}
  .status-badge.status-draft{background:#EDEEF1;color:#5B6270;border-color:#DADDE3;}
  .status-badge.status-reviewed{background:#DCEBFB;color:#1D5FA8;border-color:#BBDAF5;}
  .status-badge.status-approved{background:#DDEEE3;color:var(--primary-dark);border-color:#BFE0CC;}
  input.locked-text{background:var(--card-alt,#F7F8F4);cursor:default;color:var(--ink-soft);}

  .section-nav{
    position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:420;
    display:flex;flex-direction:column;gap:5px;align-items:stretch;
    padding:12px 9px;border-radius:20px;
    background:
      radial-gradient(140px 100px at 100% 0%, rgba(184,134,59,.20), transparent 65%),
      linear-gradient(165deg, #163d35 0%, #1B4B43 48%, #0C2B25 100%);
    box-shadow:0 18px 44px rgba(15,51,44,.32), 0 4px 12px rgba(15,51,44,.18), inset 0 0 0 1px rgba(234,223,197,.14);
    backdrop-filter:blur(6px);
  }
  .section-nav-label{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent-soft);text-align:center;padding:0 6px 6px;opacity:.8;white-space:nowrap;
  }
  .desc-input.input-missing{border-color:var(--danger,#B3261E);box-shadow:0 0 0 1px var(--danger,#B3261E) inset;}
  .flash-highlight{animation:flashHighlight 2.2s ease-out;}
  @keyframes flashHighlight{
    0%{box-shadow:0 0 0 3px var(--danger,#B3261E); border-color:var(--danger,#B3261E);}
    100%{box-shadow:0 0 0 0px transparent;}
  }
  .section-nav-target{
    background:var(--danger-soft,#FBE4E1);
    outline:2px solid var(--danger,#B3261E);
    outline-offset:3px;
    border-radius:8px;
    transition:background 1.2s ease 3.2s, outline-color 1.2s ease 3.2s;
  }
  .pw-wrap{position:relative;display:block;}
  .pw-wrap input{width:100%;padding-right:34px;box-sizing:border-box;}
  .pw-toggle-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px 6px;font-size:15px;line-height:1;color:var(--ink-soft,#666);}
  .pw-toggle-btn:hover{color:var(--ink,#222);}
  .xlsx-preview-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:center;justify-content:center;padding:3vh 3vw;}
  .xlsx-preview-modal{background:#fff;border-radius:10px;width:100%;height:100%;max-width:1200px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .xlsx-preview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);}
  .xlsx-preview-head h4{margin:0;font-size:15px;}
  .xlsx-preview-tabs{display:flex;gap:4px;padding:8px 14px 0;background:#F1F2EC;overflow-x:auto;flex:0 0 auto;}
  .xlsx-preview-tabs button{border:1px solid var(--line-soft);border-bottom:none;background:#E4E6DC;padding:6px 14px;font-size:12.5px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;}
  .xlsx-preview-tabs button.active{background:#fff;font-weight:700;}
  .xlsx-preview-body{flex:1 1 auto;overflow:auto;background:#fff;padding:14px;}
  table.xlsx-preview-table{border-collapse:collapse;font-size:12.5px;font-family:Calibri,Arial,sans-serif;}
  table.xlsx-preview-table td{border:1px solid #D6D6D6;padding:3px 6px;white-space:pre-wrap;vertical-align:middle;min-width:24px;}
  .doc-preview{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:10px 6px;}
  .doc-row{display:flex;align-items:baseline;gap:10px;padding:9px 16px;border-radius:8px;transition:background .15s ease;}
  .doc-row:hover{background:var(--paper);}
  .doc-row--title{justify-content:center;text-align:center;font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--primary-dark);padding-top:14px;padding-bottom:6px;}
  .doc-row--note{justify-content:center;text-align:center;font-size:13px;color:var(--ink-soft);line-height:1.55;padding:6px 22px;}
  .doc-row--caption{justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--accent-deep);text-transform:uppercase;padding-top:16px;}
  .doc-row--line{justify-content:space-between;border-bottom:1px dashed var(--line-soft);font-size:13.5px;}
  .doc-row--line:last-of-type{border-bottom:none;}
  .doc-row--total{font-weight:700;background:var(--primary-tint);border-radius:8px;border-bottom:none;margin-top:4px;font-size:14.5px;}
  .doc-desc{flex:1 1 auto;color:var(--ink);}
  .doc-sep{color:var(--line);margin:0 2px;}
  .doc-amt{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;color:var(--primary-dark);white-space:nowrap;font-weight:600;}
  .doc-row--total .doc-amt{color:var(--accent-deep);}
  .doc-editable{outline:none;border-radius:4px;padding:1px 3px;margin:-1px -3px;cursor:text;}
  .doc-editable:hover{background:var(--accent-soft);}
  .doc-editable:focus{background:#fff;box-shadow:0 0 0 2px var(--primary-tint);}
  .floating-window{
    position:fixed;top:6vh;right:2vw;width:min(880px,60vw);height:88vh;
    min-width:340px;min-height:220px;max-width:96vw;max-height:94vh;
    background:var(--card,#fff);border:1px solid var(--border,#D8DED2);border-radius:10px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:500;display:flex;flex-direction:column;
    resize:both;overflow:hidden;
  }
  .floating-window-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 12px;background:var(--card-alt,#F7F8F4);border-bottom:1px solid var(--border,#D8DED2);
    cursor:move;user-select:none;border-radius:10px 10px 0 0;flex:0 0 auto;
  }
  .floating-window-title{font-weight:700;font-size:14px;}
  .floating-window-controls{display:flex;gap:6px;}
  .floating-window-controls button{padding:2px 10px;min-width:0;line-height:1.6;}
  .floating-window-body{flex:1 1 auto;overflow:auto;padding:4px 10px 14px;}
  /* Monthly Ledger's own "Jump to" row - sticks to the top of the
     floating window's scroll area (not the page) so it stays clickable
     no matter how far down the window itself has been scrolled. */
  .ml-jump-nav{
    position:sticky;top:0;z-index:6;
    background:
      radial-gradient(180px 100px at 100% 0%, rgba(184,134,59,.24), transparent 65%),
      linear-gradient(165deg, #163d35 0%, #1B4B43 50%, #0C2B25 100%);
    border:1px solid rgba(234,223,197,.16);
    border-radius:14px;
    padding:10px 12px;
    margin:0 0 14px;
    box-shadow:0 14px 34px rgba(15,51,44,.26), 0 4px 10px rgba(15,51,44,.15);
  }
  .ml-jump-nav .ml-jump-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent-soft);align-self:center;margin-right:2px;opacity:.85;}
  .ml-jump-btn{
    border-radius:20px!important;
    background:rgba(255,255,255,.08)!important;
    color:#EAF1EC!important;
    border:1px solid rgba(255,255,255,.10)!important;
    box-shadow:none!important;
    transition:background-color .15s var(--ease), color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease)!important;
  }
  .ml-jump-btn:hover{
    background:var(--accent)!important;
    color:#2A1D0B!important;
    border-color:var(--accent)!important;
    transform:translateY(-1px);
  }
  /* Monthly Ledger section zones - each divider-bounded block gets a
     faint, alternating tint so sections read as distinct at a glance
     without needing hard borders everywhere. */
  .ml-zone{border-radius:14px;padding:14px 16px;margin:0 0 6px;}
  .ml-zone-a{background:linear-gradient(180deg, rgba(84,148,133,.08) 0%, rgba(84,148,133,.02) 100%);}
  .ml-zone-b{background:linear-gradient(180deg, rgba(184,134,59,.08) 0%, rgba(184,134,59,.02) 100%);}
  .floating-window-body .card{box-shadow:none;border:none;margin:0;padding:6px 0 0;}
  /* Top-level Daily Ledger / Monthly Ledger tab switcher - the two are
     mutually exclusive full-width views (Monthly Ledger used to open as
     a small floating window on top of the Daily Ledger; it's now a
     proper docked tab instead, so it gets the same reading width as the
     Daily Ledger rather than a cramped resizable box). */
  .ml-view-tabs{display:flex;gap:6px;background:var(--card-alt,#F7F8F4);border:1px solid var(--line-soft);border-radius:14px;padding:5px;margin:0 0 16px;max-width:440px;}
  .ml-view-tab{flex:1 1 0;background:transparent;color:var(--ink-soft);border:1px solid transparent;box-shadow:none;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;}
  .ml-view-tab:hover{background:rgba(0,0,0,.04);transform:none;}
  .ml-view-tab.active{background:linear-gradient(165deg,#163d35 0%, #1B4B43 55%, #0C2B25 100%);color:#EAF1EC;box-shadow:0 6px 16px rgba(15,51,44,.25);}
  /* Docked Monthly Ledger panel (replaces the old draggable/resizable
     floating-window look for this same #ml-floating-window /
     #ml-floating-body pair - kept the same element ids so every
     existing in-place refresh call (renderMonthlyLedgerWindowInPlace,
     refreshMonthlyLedgerComputedOnly, etc.) keeps working unchanged). */
  .floating-window.docked{
    position:static;top:auto;right:auto;left:auto;bottom:auto;
    width:100%;height:auto;min-width:0;min-height:0;max-width:none;max-height:none;
    resize:none;overflow:visible;
    background:transparent;border:none;box-shadow:none;border-radius:0;
  }
  .floating-window.docked .floating-window-header{display:none;}
  .floating-window.docked .floating-window-body{overflow:visible;padding:0;}
  .section-nav-item{position:relative;}
  .section-nav-dot{
    height:auto;min-width:0;width:100%;border-radius:12px;
    background:rgba(255,255,255,.06);color:#EAF1EC;border:1px solid rgba(255,255,255,.07);
    font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:flex-start;gap:9px;
    box-shadow:none;
    cursor:pointer;opacity:1;transition:background-color .15s var(--ease),color .15s var(--ease),transform .12s var(--ease),border-color .15s var(--ease);
    padding:9px 12px;white-space:nowrap;
  }
  .section-nav-dot .num{
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;
    width:20px;height:20px;flex:none;border-radius:6px;
    background:rgba(255,255,255,.12);color:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;opacity:1;
  }
  .section-nav-dot:hover{background:rgba(255,255,255,.13);transform:translateX(-2px);border-color:rgba(255,255,255,.14);}
  .section-nav-item.open .section-nav-dot{background:var(--accent);color:#2A1D0B;border-color:var(--accent);transform:translateX(-2px);}
  .section-nav-item.open .section-nav-dot .num{background:rgba(0,0,0,.16);color:#2A1D0B;}
  .section-nav-flyout{
    display:none;position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%);
    background:#fff;border:1px solid var(--line-soft);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:6px;min-width:230px;max-height:65vh;overflow-y:auto;
  }
  .section-nav-item.open .section-nav-flyout{display:block;}
  .section-nav-flyout-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;padding:5px 10px 7px;}
  .section-nav-flyout-item{
    display:block;width:100%;text-align:left;background:none;border:none;
    font-size:14px;padding:10px 10px;border-radius:7px;cursor:pointer;color:var(--ink);
  }
  .section-nav-flyout-item:hover{background:var(--card-alt,#F7F8F4);}
  @media (max-width: 480px){
    .section-nav{right:6px;padding:9px 6px;border-radius:16px;gap:4px;}
    .section-nav-label{display:none;}
    .section-nav-dot{font-size:11.5px;padding:8px 8px;gap:6px;}
    .section-nav-dot .num{width:17px;height:17px;font-size:10px;}
  }
  /* ============================ Login / Lock screen ============================ */
  .lock-screen{
    position:fixed;inset:0;z-index:800;
    display:flex;align-items:center;justify-content:center;
    padding:24px;overflow-y:auto;
    background:
      radial-gradient(900px 480px at 12% -10%, rgba(184,134,59,.20), transparent 55%),
      radial-gradient(820px 620px at 100% 6%, rgba(84,148,133,.28), transparent 55%),
      linear-gradient(165deg, #133730 0%, #1B4B43 46%, #0C2B25 100%);
  }
  .lock-screen::before{
    content:'';position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:
      repeating-linear-gradient(45deg, #EADFC5 0 1px, transparent 1px 32px),
      repeating-linear-gradient(-45deg, #EADFC5 0 1px, transparent 1px 32px);
  }
  .lock-card{
    position:relative;width:100%;max-width:420px;margin:40px 0;
    background:#fff;border-radius:20px;
    padding:34px 30px 28px;
    box-shadow:0 34px 80px rgba(0,0,0,.38), 0 10px 26px rgba(0,0,0,.2);
    animation:cardRise .55s var(--ease) both;
  }
  .lock-icon{
    width:58px;height:58px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(150deg, var(--primary) 0%, var(--primary-dark) 100%);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;box-shadow:0 12px 26px rgba(15,51,44,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .lock-card .eyebrow{display:flex;justify-content:center;margin-bottom:10px;}
  .lock-card h1{text-align:center;font-size:21px;margin-bottom:8px;}
  .lock-card .subnote{text-align:center;margin:0 0 16px;}
  .lock-card .build-tag{text-align:center;font-size:10.5px;color:var(--ink-soft);opacity:.65;margin:-10px 0 16px;}
  .lock-card .divider{margin:18px 0 14px;border:none;border-top:1px dashed var(--line);}
  .lock-card button[type=button]#unlock-btn,
  .lock-card button[type=button]#vault-unlock-btn{width:100%;padding:11px 14px;font-size:14px;border-radius:10px;margin-top:2px;}
  .lock-card .field input{padding:10px 12px;}
  @media (max-width:480px){
    .lock-card{padding:26px 20px 22px;border-radius:16px;}
  }

  .corner-nav-panel{
    position:fixed;right:14px;bottom:16px;z-index:430;
    display:flex;flex-direction:column;
    background:#fff;border:1px solid var(--line-soft);border-radius:14px;
    box-shadow:0 6px 18px rgba(15,51,44,.16), 0 1px 3px rgba(15,51,44,.08);
    padding:4px;gap:2px;opacity:.9;transition:opacity .15s var(--ease);
  }
  .corner-nav-panel:hover{opacity:1;}
  .corner-nav-btn{
    height:34px;width:34px;border-radius:10px;
    background:transparent;color:var(--primary-dark);border:none;
    font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease),transform .12s var(--ease);
  }
  .corner-nav-btn:hover{background:var(--accent-soft);color:var(--accent-deep);transform:translateY(-1px);}
  .corner-nav-btn:active{transform:translateY(0) scale(.94);}
  .corner-nav-panel-divider{height:1px;margin:1px 3px;background:var(--line-soft);}
  @media (max-width: 480px){
    .corner-nav-panel{right:8px;bottom:10px;}
    .corner-nav-btn{height:30px;width:30px;font-size:13px;}
  }
  .day-panel.locked{position:relative;}
  .day-panel.locked::after{
    content:'\1F512';
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) rotate(-18deg);
    font-size:min(30vw,320px);
    opacity:.035;
    pointer-events:none;
    z-index:0;
    filter:grayscale(1);
  }
  .day-panel.locked > .card{position:relative;z-index:1;}
  .line-item .desc{flex:3;}
  .line-item .amt{flex:1;min-width:100px;}
  .line-item .bank-sel{flex:1.4;min-width:120px;}

  .computed{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:7px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--primary-dark);display:flex;justify-content:space-between;align-items:center;margin-top:4px;transition:background-color .2s ease, box-shadow .2s ease;}
  .computed:hover{box-shadow:0 0 0 3px rgba(184,134,59,.12);}
  .computed .lbl{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;color:var(--ink-soft);}
  .computed.total{background:var(--primary);color:#fff;border:none;box-shadow:var(--shadow-sm);}

  .value-pop{display:inline-block;animation:valuePop .38s var(--ease);}

  .tag{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--line-soft);color:var(--ink-soft);border-radius:4px;padding:2px 6px;margin-left:6px;}
  mark.search-hit{background:var(--accent-soft);color:var(--accent-deep);padding:0 2px;border-radius:3px;font-weight:700;}
  .locked-day{position:relative;pointer-events:none;opacity:.55;user-select:none;}
  .locked-day::after{content:'\1F512 Locked';position:absolute;top:12px;right:14px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--danger);background:var(--danger-soft);padding:2px 8px;border-radius:5px;}

  .day-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:16px;scrollbar-width:thin;}
  .day-tabs::-webkit-scrollbar{height:6px;}
  .day-tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .day-tabs::-webkit-scrollbar-track{background:transparent;}
  .day-tab{flex:none;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12.5px;white-space:nowrap;color:var(--ink-soft);transition:all .16s var(--ease);}
  .day-tab:hover{border-color:var(--primary);color:var(--primary-dark);transform:translateY(-1px);}
  .day-tab.active{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff;box-shadow:var(--shadow-sm);}

  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
  .summary-box{background:#fff;border:1px solid var(--line-soft);border-radius:9px;padding:11px 13px;transition:box-shadow .2s ease, transform .2s ease;}
  .summary-box:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .summary-box .lbl{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Mono',monospace;}
  .summary-box .val{font-family:'IBM Plex Mono',monospace;font-size:18.5px;font-weight:600;color:var(--primary-dark);margin-top:3px;font-variant-numeric:tabular-nums;}
  .summary-box.grand{background:linear-gradient(155deg, var(--primary) 0%, var(--primary-dark) 78%);box-shadow:var(--shadow-md);border-color:transparent;position:relative;overflow:hidden;}
  .summary-box.grand::after{content:'';position:absolute;top:-30%;right:-15%;width:60%;height:160%;background:radial-gradient(circle, rgba(184,134,59,.22), transparent 65%);pointer-events:none;}
  .summary-box.grand .lbl{color:#cfe0d7;}
  .summary-box.grand .val{color:#fff;}

  .empty{color:var(--ink-soft);font-size:13px;font-style:italic;padding:8px 2px;}

  .setup-banks .bank-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;}
  .divider{height:1px;background:linear-gradient(90deg, var(--line), transparent);margin:18px 0;}
  .setup-card{padding-top:16px;}
  .setup-card .divider{margin:10px 0;}
  .setup-card .subnote{margin:-4px 0 10px;}
  .setup-card .setup-banks > label{margin-bottom:6px;}

  .coa-desc{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}

  footer.dl{position:sticky;bottom:0;background:linear-gradient(0deg,var(--paper) 65%, transparent);padding:18px 0 4px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}

  @media (max-width:640px){
    header.top{flex-direction:column;align-items:flex-start;}
    .line-item{flex-wrap:wrap;}
  }

  .modal-overlay{position:fixed;inset:0;background:rgba(15,51,44,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:overlayIn .18s ease both;backdrop-filter:blur(1px);}
  .modal-box{background:#fff;border-radius:14px;padding:22px 24px;max-width:400px;box-shadow:var(--shadow-lg);animation:modalIn .28s var(--ease) both;}
  .modal-box p{margin:0 0 18px;color:var(--ink);font-size:14px;line-height:1.6;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
    body::before{animation:none;}
  }
</style>

<script>
/* Bumped by hand whenever a meaningfully new copy of this file is shipped.
   Shown faintly in the footer so it's obvious at a glance whether a
   browser/host is serving a stale cached copy after an update - just
   compare what's on screen to what you expect. */
const APP_BUILD = '2026-07-15.1';
const APP_UPDATED_LABEL = 'Jul 15, 2026';

/* ======================================================================
   Chart of Accounts
   ====================================================================== */
const COA = [
  {key:'Trans',   short:'Trans',    label:'Transport',                 desc:'Microbus-related expenses: gas/octane, servicing, parts',                       notesheetLabel:'Transport',                  expensePhrase:'Transport',                     summaryLabel:'Transport Expense'},
  {key:'Tailor',  short:'Tailor',   label:'Tailor',                    desc:'Student uniform / dress making',                                                 notesheetLabel:'Tailor',                     expensePhrase:'Tailor/Uniform',                summaryLabel:'Tailor/Uniform Expense'},
  {key:'Utility', short:'Utility',  label:'Utility',                   desc:'Electricity meter load, internet bill, WASA (water) bill',                      notesheetLabel:'Utility',                    expensePhrase:'Utility',                       summaryLabel:'Utility Expense'},
  {key:'BooksSty',short:'BooksSty', label:'Books & Stationery',        desc:'Student books/khata, stationery purchases',                                      notesheetLabel:'Books & Stationery',         expensePhrase:'Books & Stationery',            summaryLabel:'Books & Stationery Expense'},
  {key:'Hons',    short:'Hons',     label:'Honourarium',               desc:'Payments to Director, examiners, or others for interviews/meetings',            notesheetLabel:'Honourarium',                expensePhrase:'Honourarium',                   summaryLabel:'Honourarium Expense'},
  {key:'EduAssist',short:'EduAssist',label:'Education & Assistance Fund',desc:'Fee compromise for a student (booked here as a cash expenditure)',             notesheetLabel:'Education & Assistance Fund',expensePhrase:'Education & Assistance Fund',   summaryLabel:'Education & Assistance Fund Expense'},

/* ======================================================================
   Journal / General Ledger / Trial Balance (traditional double-entry)
   ======================================================================
   A completely separate, read-only view built FROM the existing Daily/
   Monthly Ledger data - it never writes back to state.days or
   state.monthlyLedger, and doesn't feed the Monthly Ledger, Balance
   Sheet, or any export. Purely for double-entry bookkeeping practice
   alongside the institution's actual (cash-basis, single-entry-style)
   records.
   Revenue side: sourced from Monthly Ledger "revenueEntries" (the
   categorized figures that come from generating a Deposit Notesheet) -
   NOT from the Daily Ledger's day.serviceRevenue lump sum, which has no
   category breakdown. Debit Cash, Credit the matching category's Income
   account.
   Misc Collection: from each day's miscCollectionSections. Debit Cash,
   Credit a single pooled "Miscellaneous Collection Income" account.
   Expenditure side: from allVouchers() (every CoA-categorized withdrawal
   voucher). Debit the category's Expense account, Credit Cash - matches
   computeDayChain(), where every CoA voucher reduces Cash directly (bank
   involvement only happens through the separate deposits/withdrawals
   transfer records, which this journal does not model).
   "Loan" is the one CoA category booked as an Asset (Loan Receivable)
   rather than an Expense, since the money disbursed is still owed back
   by III Assets Ltd, not spent. */
const JOURNAL_EXPENSE_ACCOUNTS = Object.fromEntries(COA.map(c=>[c.key,
  c.key==='Loan'
    ? {label:'Loan Receivable (III Assets Ltd)', type:'asset'}
    : {label:c.summaryLabel, type:'expense'}
]));
const JOURNAL_REVENUE_ACCOUNTS = Object.fromEntries(REVENUE_CATS.map(c=>[c.key, {label:c.label+' Income', type:'income'}]));
const JOURNAL_MISC_ACCOUNT = {label:'Miscellaneous Collection Income', type:'income'};
const JOURNAL_CASH_ACCOUNT = {label:'Cash', type:'asset'};
/* Every journal entry as one balanced {date, desc, debitAccount,
   creditAccount, amount} line - built fresh each time from current
   state, sorted chronologically. Cheap enough to rebuild on demand;
   not cached or stored. */
function buildJournalEntries(){
  const entries = [];
  Object.keys(state.monthlyLedger.months).forEach(monthKey=>{
    const rec = state.monthlyLedger.months[monthKey];
    (rec.revenueEntries||[]).forEach(re=>{
      if(!re.date) return;
      REVENUE_CATS.forEach(c=>{
        const amt = Number(re[c.key])||0;
        if(amt===0) return;
        entries.push({date:re.date, desc:(re.desc||'').trim()||c.label, debitAccount:JOURNAL_CASH_ACCOUNT.label, creditAccount:JOURNAL_REVENUE_ACCOUNTS[c.key].label, amount:amt, source:'Revenue (Deposit Notesheet)'});
      });
    });
  });
  allDaysEverywhere().forEach(day=>{
    (day.miscCollectionSections||[]).forEach(sec=>{
      const amt = Number(sec.amount)||0;
      if(amt===0) return;
      entries.push({date:day.date, desc:(sec.desc||'').trim()||'Miscellaneous collection', debitAccount:JOURNAL_CASH_ACCOUNT.label, creditAccount:JOURNAL_MISC_ACCOUNT.label, amount:amt, source:'Misc Collection'});
    });
  });
  allVouchers().forEach(v=>{
    if(v.amount===0) return;
    const acc = JOURNAL_EXPENSE_ACCOUNTS[v.catKey];
    entries.push({date:v.date, desc:(v.desc||'').trim()||v.cat.label, debitAccount:acc.label, creditAccount:JOURNAL_CASH_ACCOUNT.label, amount:v.amount, source:'Expenditure Voucher', voucher:v.voucher});
  });
  entries.sort((a,b)=> a.date===b.date ? 0 : (a.date<b.date?-1:1));
  return entries;
}
/* Every account name that appears anywhere in the journal, in a sensible
   display order: Cash first, then Income accounts, then Expense/Asset
   accounts - each in the same order as REVENUE_CATS/COA. */
function journalAccountList(){
  return [
    JOURNAL_CASH_ACCOUNT.label,
    ...REVENUE_CATS.map(c=>JOURNAL_REVENUE_ACCOUNTS[c.key].label),
    JOURNAL_MISC_ACCOUNT.label,
    ...COA.map(c=>JOURNAL_EXPENSE_ACCOUNTS[c.key].label),
  ];
}
function journalAccountType(label){
  if(label===JOURNAL_CASH_ACCOUNT.label) return JOURNAL_CASH_ACCOUNT.type;
  if(label===JOURNAL_MISC_ACCOUNT.label) return JOURNAL_MISC_ACCOUNT.type;
  const rev = REVENUE_CATS.find(c=>JOURNAL_REVENUE_ACCOUNTS[c.key].label===label);
  if(rev) return 'income';
  const exp = COA.find(c=>JOURNAL_EXPENSE_ACCOUNTS[c.key].label===label);
  if(exp) return JOURNAL_EXPENSE_ACCOUNTS[exp.key].type;
  return 'other';
}

/* ======================================================================
   Fixed Asset Register + Depreciation
   ======================================================================
   Mirrors the institution's own paper register (serial, date, new,
   old/existing, defective, shortage, total - one row per stock-check/
   acquisition event per item), plus an optional value + useful-life on
   any row that added new units, so Straight-Line Depreciation can be
   calculated on that acquisition batch. Entirely separate from every
   other report - doesn't touch the Balance Sheet or Monthly Ledger. */
function newAssetItem(name){
  return { id:'ai'+Date.now()+Math.random().toString(36).slice(2,7), name, entries:[] };
}
function newAssetEntry(prevTotal){
  return {
    id:'ae'+Date.now()+Math.random().toString(36).slice(2,7),
    date: todayDateStr(),
    qtyNew: 0, qtyOld: prevTotal||0, qtyDefective: 0, qtyShortage: 0,
    value: null, usefulLifeYears: null, note:''
  };
}
function assetEntryTotal(e){
  return (Number(e.qtyOld)||0) + (Number(e.qtyNew)||0) - (Number(e.qtyDefective)||0) - (Number(e.qtyShortage)||0);
}
/* Straight-Line Depreciation for one acquisition entry (only meaningful
   when it has both a value and a useful life). asOfDate defaults to
   today. Depreciation accrues monthly from the entry's date; capped so
   accumulated depreciation never exceeds the original value. */
function depreciationForEntry(entry, asOfDate){
  const value = Number(entry.value)||0;
  const life = Number(entry.usefulLifeYears)||0;
  if(!value || !life || !entry.date) return null;
  const asOf = asOfDate || todayDateStr();
  const start = new Date(entry.date+'T00:00:00');
  const end = new Date(asOf+'T00:00:00');
  let months = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth());
  if(end.getDate()>=start.getDate()) months += 1; // count the current partial month once it's begun
  months = Math.max(0, months);
  const monthlyDep = value/(life*12);
  const accumulated = Math.min(value, monthlyDep*months);
  return { value, life, monthlyDep, accumulated, bookValue: value-accumulated, fullyDepreciated: accumulated>=value-0.5 };
}
/* Links a Miscellaneous-category voucher to a Fixed Asset Register item:
   creates (or updates, if already linked) one register entry for that
   voucher - qtyNew = qty given, qtyOld auto-continues from the item's
   last entry, value = the voucher's own amount. Moving the link to a
   different asset item removes the old entry and starts a fresh one on
   the new item. */
function ensureAssetLinkForItem(day, item, assetItemId, qty){
  const regItems = state.fixedAssetRegister.items;
  const assetItem = regItems.find(a=>a.id===assetItemId);
  if(!assetItem) return;
  let entry = item.assetLink ? assetItem.entries.find(e=>e.id===item.assetLink.entryId) : null;
  if(item.assetLink && item.assetLink.assetItemId!==assetItemId){
    // moved to a different asset item - drop the old entry first
    const oldItem = regItems.find(a=>a.id===item.assetLink.assetItemId);
    if(oldItem) oldItem.entries = oldItem.entries.filter(e=>e.id!==item.assetLink.entryId);
    entry = null;
  }
  if(!entry){
    const prevTotal = assetItem.entries.length ? assetEntryTotal(assetItem.entries[assetItem.entries.length-1]) : 0;
    entry = newAssetEntry(prevTotal);
    assetItem.entries.push(entry);
    item.assetLink = {assetItemId, entryId: entry.id};
  }
  entry.date = day.date;
  entry.qtyNew = Number(qty)||0;
  entry.value = Number(item.amount)||0;
  entry.note = 'Linked voucher: '+(item.voucher||'');
}
function removeAssetLinkForItem(item){
  if(!item.assetLink) return;
  const assetItem = state.fixedAssetRegister.items.find(a=>a.id===item.assetLink.assetItemId);
  if(assetItem){
    const entry = assetItem.entries.find(e=>e.id===item.assetLink.entryId);
    if(entry){
      logAuditDelete(`Asset entry (${assetItem.name})`, entry);
      assetItem.entries = assetItem.entries.filter(e=>e.id!==item.assetLink.entryId);
    }
  }
  item.assetLink = null;
}

/* ======================================================================
   Ratio Analysis & Cash Flow Statement
   ======================================================================
   Both read-only, separate views built from buildJournalEntries() plus
   the Monthly Ledger's own stored Cash-in-Hand/Bank-Balance figures
   (read via the same lastDayCashInHandInMonth/lastDayBankClosingInMonth
   helpers the real Balance Sheet uses, so the numbers agree with it).
   Doesn't touch the Balance Sheet, Monthly Ledger, or any export.
   Gratuity/Education-Assistance payable balances need the Monthly
   Ledger's own year-to-date revenue-transfer chain, which isn't
   duplicated here to avoid quietly getting it wrong - Current
   Liabilities below is Outstanding Payables (staff dues) only, as of
   the period's own end date. */
function outstandingPayablesAsOf(dateISO){
  return (state.payableRegistry||[]).filter(i=> i.fromDate<=dateISO && (i.toDate===null || i.toDate>dateISO))
    .reduce((s,i)=>s+(Number(i.amount)||0),0);
}
function ratioFiguresForMonth(key){
  const rec = state.monthlyLedger.months[key];
  const cash = (rec && rec.balanceSheet && rec.balanceSheet.cashInHandOverride!=null)
    ? rec.balanceSheet.cashInHandOverride
    : lastDayCashInHandInMonth(key);
  let bank = 0, bankKnown = false;
  state.banks.forEach(b=>{
    const override = (rec && rec.balanceSheet && rec.balanceSheet.bankBreakdown) ? rec.balanceSheet.bankBreakdown[b.id] : undefined;
    const v = (override!=null) ? Number(override) : lastDayBankClosingInMonth(key, b.id);
    if(v!=null){ bank += v; bankKnown = true; }
  });
  const [y,m] = key.split('-');
  const monthEndStr = toLocalDateStr(new Date(Number(y), Number(m), 0));
  const otherAsset = (rec && rec.balanceSheet && rec.balanceSheet.otherAsset) ? (Number(rec.balanceSheet.otherAsset.amount)||0) : 0;
  const otherAssetLabel = (rec && rec.balanceSheet && rec.balanceSheet.otherAsset) ? rec.balanceSheet.otherAsset.label : '';
  return {
    cash: cash!=null?cash:null,
    bank: bankKnown?bank:null,
    payables: outstandingPayablesAsOf(monthEndStr),
    otherAsset, otherAssetLabel
  };
}

function defaultExpenditureColumns(){

function monthKeyFor(month, year){
  const idx = MONTHS.indexOf(month);
  return idx>=0 ? `${year}-${String(idx+1).padStart(2,'0')}` : null;
}
function monthKeyLabel(key){
  const [y,m] = key.split('-');
  return `${MONTHS[Number(m)-1]} ${y}`;
}
/* The chronologically-first month ever tracked in this tool (by key,
   which sorts correctly as "YYYY-MM"). The one-time Starting Point
   figures (Revenue, Expenditure, Bank) are applied to this month only,
   so they add in exactly once no matter which month is being viewed. */
function earliestTrackedMonthKey(){
  const keys = Object.keys(state.monthlyLedger.months||{});
  if(keys.length===0) return null;
  return keys.sort()[0];
}
function prevMonthKey(key){
  const [y,m] = key.split('-').map(Number);
  const d = new Date(y, m-2, 1); // m-1 is this month 0-indexed, minus 1 more = previous month
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
/* Beginning Balance (Bank), per bank: the manually-typed figure for that
   specific bank if one has been entered, otherwise carried in
   automatically from the previous tracked month's own closing balance for
   that bank (computeMonthlyLedgerFigures' bankBreakdownShown, which
   already respects that bank's own manual entries for that earlier
   month) - so a new month doesn't start at a blank/zero balance just
   because nobody re-typed last month's closing figure by hand. Only
   carries from a month that's actually been tracked (has its own record
   already) - never silently creates one; for the very first month ever
   tracked, falls back instead to that bank's own share of the one-time
   starting point ("Set Starting Point"), if any. Broken out per bank
   (e.g. "IBBPLC Total", "TBL Total" on the Monthly Revenue export) since
   money sits in both accounts even though day-to-day deposits/
   withdrawals currently only happen through one of them. */
function effectiveBeginningBankBalanceFor(key, bankId){
  const rec = getMonthlyLedgerMonth(key);
  const manual = Number((rec.beginningBankBalanceByBank||{})[bankId])||0;
  if(manual!==0) return manual;
  const pk = prevMonthKey(key);
  if(state.monthlyLedger.months[pk]) return Number(computeMonthlyLedgerFigures(pk).bankBreakdownShown[bankId])||0;
  const seed = state.monthlyLedger.seed;
  if(seed && seed.active!==false && key===earliestTrackedMonthKey()) return Number((seed.bankBreakdown||{})[bankId])||0;
  // Legacy fallback: a month saved before Beginning Balance (Bank) was
  // split per bank may still only have the old single combined figure -
  // since all deposits/withdrawals currently run through TBL, attribute
  // that whole old figure to TBL rather than losing it.
  if(/tbl/i.test(state.banks.find(b=>b.id===bankId)?.name||'')){
    const oldManual = Number(rec.beginningBankBalance)||0;
    if(oldManual!==0) return oldManual;
  }
  return 0;
}
/* Opening Cash for the very first day ever recorded in the Daily Ledger:
   the manually-typed figure if one has been entered, otherwise carried in
   automatically from the previous tracked month's Monthly Ledger Cash in
   Hand (Balance Sheet), the same way Beginning Balance (Bank) carries in
   above - so day one of July doesn't start at a blank/zero cash balance
   just because nobody re-typed June's closing Cash in Hand by hand. Only
   carries from a month that's actually been tracked. Safe to call from
   inside computeAll(): the previous month, by definition of this being
   day zero, can never itself have day-level data, so
   computeMonthlyLedgerFigures never recurses back into computeAll() here. */
function effectiveOpeningCashManual(day){
  const manual = Number(day.openingCashManual)||0;
  if(manual!==0) return manual;
  const pk = prevMonthKey(day.date.slice(0,7));
  if(!state.monthlyLedger.months[pk]) return 0;
  return Number(computeMonthlyLedgerFigures(pk).cashInHandShown)||0;
}
/* Gets (creating if needed) the persistent record for one month - never
   deleted by Daily Ledger month switches, unlike state.days. */
function getMonthlyLedgerMonth(key){
  if(!state.monthlyLedger.months[key]){
    state.monthlyLedger.months[key] = {
      revenueEntries:[],
      revenueTotalDue:Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0])),
      revenueTransfer:Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0])),
      beginningBankBalance:0,
      beginningBankBalanceByBank:{},
      houseRentDeposit:0,
      houseRentDepositDate:'',
      houseRentDepositBankId:null,
      expenditureColumns:defaultExpenditureColumns(),
      expenditureEntries:[],
      salaryByAccount:0,
      salaryByAccountDate:'',
      salaryByAccountBankId:null,
      salaryByCash:0,
      salaryByCashDate:'',
      salaryByCashBankId:null,
      customRows:[],
      balanceSheet:{ cashInHandOverride:null, advancePayment:0,
        bankBalanceOverride:null, bankBreakdown:{},
        otherAsset:{label:'Debt to III Assets Ltd', amount:250000} },
      locked:false,
    };
  }
  return state.monthlyLedger.months[key];
}
/* Revenue category totals actually earned in one month (sums entries). */
function monthRevenueTotals(monthRec){
  const totals = Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0]));
  monthRec.revenueEntries.forEach(e=>{ REVENUE_CATS.forEach(c=>{ totals[c.key] += Number(e[c.key])||0; }); });
  return totals;
}
/* Sum of the Admission-Fee-only portion (excluding Admission Form) of this
   month's Deposit Notesheets - see revEntry.admissionFeeOnly above. Older
   revenue entries (generated before that split existed) have no
   admissionFeeOnly field at all - rather than silently contributing 0
   (which made Gratuity/EduAssist show 0 for every already-generated
   historical month), they fall back to their combined admissionFee figure
   (Fee + Form together), the best available approximation from data that
   was never split at the source. Only genuinely post-split entries use
   the accurate Fee-only figure. */
function monthAdmissionFeeOnlyTotal(monthRec){
  return (monthRec.revenueEntries||[]).reduce((s,e)=>s+(Number(e.admissionFeeOnly!==undefined ? e.admissionFeeOnly : e.admissionFee)||0),0);
}
/* Gratuity gets 1/6 and the Education Assistance Fund gets 1/30 of this
   month's Admission-Fee-only collections (never the Admission Form
   portion) - transferred automatically out of Admission Fee's own Yearly
   Running Total via effectiveRevenueTransfer below. */
function autoGratuityEduAssist(monthRec){
  const feeOnly = monthAdmissionFeeOnlyTotal(monthRec);
  return {gratuity: feeOnly/6, eduAssist: feeOnly/30};
}
/* "Yearly Running Total from Previous Month": the seed (if any, for
   whatever predates this tool) plus every tracked month of the same
   calendar year strictly before this one, summed live - no separate
   running counter to keep in sync by hand. */
/* Effective "transfer" value for one revenue category in one month.
   Admission Fee's transfer is NOT stored/manual - it auto-derives as the
   negative of whatever was entered for Gratuity + Education Assistance
   Fund transfer that month, so money moving out of Admission Fee into
   those two funds is automatically subtracted from Admission Fee's own
   Yearly Running Total (and, via yearlyRunningTotalBefore, carries into
   every later month too - no manual entry needed on the Admission Fee side). */
function effectiveRevenueTransfer(rec, key){
  if(key==='admissionFee'){
    return -(effectiveRevenueTransfer(rec, 'gratuity') + effectiveRevenueTransfer(rec, 'eduAssist'));
  }
  if(key==='gratuity' || key==='eduAssist'){
    const t = rec.revenueTransfer||{};
    const overrideKey = key+'Override';
    if(t[overrideKey]!==undefined && t[overrideKey]!==null) return Number(t[overrideKey])||0;
    return autoGratuityEduAssist(rec)[key];
  }
  return Number((rec.revenueTransfer||{})[key])||0;
}
function resolveColCoaKey(col){
  if(col.coaKey) return col.coaKey;
  const norm = (col.label||'').trim().toLowerCase();
  if(!norm) return null;
  for(const key in EXPENDITURE_LABEL_ALIASES){
    if(EXPENDITURE_LABEL_ALIASES[key].includes(norm)) return key;
  }
  const coa = COA.find(c=>c.label.toLowerCase()===norm || c.notesheetLabel.toLowerCase()===norm || c.short.toLowerCase()===norm);

function monthExpenditureColTotalForCoa(monthKey, coaKey){
  const rec = state.monthlyLedger.months[monthKey];
  if(!rec) return 0;
  const col = rec.expenditureColumns.find(c=>resolveColCoaKey(c)===coaKey);
  if(!col) return 0;
  if(col.source==='coa'){
    if(col.override!==undefined && col.override!==null) return Number(col.override)||0;
    const coaTotals = monthWithdrawCoaTotals(monthKey);
    let amt = coaTotals[coaKey]||0;
    const seed = state.monthlyLedger.seed;
    if(monthKey===earliestTrackedMonthKey() && seed && seed.active!==false){
      amt += Number((seed.expenditure||{})[coaKey])||0;
    }
    return amt;
  } else if(col.source==='entries'){
    return expenditureEntryColTotal(rec, col.id);
  }
  return Number(col.amount)||0;
}
function yearlyCoaExpenditureBefore(coaKey, key){
  const [yearStr, monStr] = key.split('-');
  let total = 0;
  Object.keys(state.monthlyLedger.months).forEach(k=>{
    const [ky,km] = k.split('-');
    if(ky===yearStr && Number(km) < Number(monStr)){
      total += monthExpenditureColTotalForCoa(k, coaKey);
    }
  });
  return total;
}
/* Running total of each revenue category's contribution to its Payable,
   for every month strictly before `key`. Most categories reset every
   January (a fresh Jan-Dec cycle each year) - but Gratuity and Education
   Assistance Fund are ongoing liabilities that keep accruing regardless
   of calendar year, so those two are summed across every month ever
   recorded, not just the current year. */
const YEARLY_RESET_EXEMPT_CATS = ['gratuity', 'eduAssist'];
function yearlyRunningTotalBefore(key){
  const [yearStr, monStr] = key.split('-');
  const totals = Object.fromEntries(REVENUE_CATS.map(c=>[c.key,0]));
  const seed = state.monthlyLedger.seed;
  if(seed){
    REVENUE_CATS.forEach(c=>{
      if(YEARLY_RESET_EXEMPT_CATS.includes(c.key) || seed.year===yearStr){
        totals[c.key] += Number(seed.revenue[c.key])||0;
      }
    });
  }
  Object.keys(state.monthlyLedger.months).forEach(k=>{
    const [ky,km] = k.split('-');
    const beforeKey = (ky<yearStr) || (ky===yearStr && Number(km)<Number(monStr));
    if(!beforeKey) return;
    const rec = state.monthlyLedger.months[k];
    const monthTotals = monthRevenueTotals(rec);
    REVENUE_CATS.forEach(c=>{
      const exempt = YEARLY_RESET_EXEMPT_CATS.includes(c.key);
      if(!exempt && ky!==yearStr) return; // non-exempt categories only accumulate within the same year
      let contrib = monthTotals[c.key] + effectiveRevenueTransfer(rec, c.key);
      if(c.key==='eduAssist') contrib -= monthExpenditureColTotalForCoa(k, 'EduAssist');
      totals[c.key] += contrib;
    });
  });
  return totals;
}

   auto-total without retyping anything. Only works for the month
   currently loaded in the Daily Ledger (state.days) - other months'
   'coa' columns fall back to 0 with a note, since their day-by-day data
   isn't in memory (it's in state.archive, month-scoped, not itemised by
   category there).
   NOTE: relies on the CURRENT Daily Ledger state (state.month/year,
   state.days) matching the requested month - callers should check

/* Returns the effective (possibly user-overridden) text for a COA
   category field, so Settings-panel edits apply everywhere the field is

function coaText(cat, field){
  const ov = state.settings && state.settings.coaOverrides && state.settings.coaOverrides[cat.key];
  return (ov && ov[field]!==undefined && ov[field]!=='') ? ov[field] : cat[field];
}
function revenueLabel(catKey){
  const ov = state.settings && state.settings.revenueLabelOverrides;
  return (ov && ov[catKey]) ? ov[catKey] : (REVENUE_CATS.find(c=>c.key===catKey)||{}).label;
}
function currentDailyLedgerCoaTotals(){
  const totals = {};
  COA.forEach(c=>{ totals[c.key] = 0; });
  state.days.forEach(day=>{
    COA.forEach(cat=>{ (day.coa[cat.key]||[]).forEach(item=>{ totals[cat.key] += Number(item.amount)||0; }); });
  });

/* Per-category expenditure totals for a given month, pulled from the
   saved Withdraw Notesheet history (state.withdrawNotesheetLog) instead
   of the live Daily Ledger - this is the actual source of truth for
   "what left the bank and which khat it was withdrawn for", and (unlike
   currentDailyLedgerCoaTotals) works for any month, not just whichever
   one is currently loaded in the Daily Ledger. A notesheet run is
   attributed to the month of its End Date. Matched by comparing each
   saved category's label against COA.summaryLabel, the same label the
   notesheet-generation step wrote it with. */
function monthWithdrawCoaTotals(key){
  const totals = {};
  COA.forEach(c=>{ totals[c.key] = 0; });
  const rec = state.monthlyLedger.months[key];
  if(rec){
    (rec.expenditureColumns||[]).forEach(col=>{
      if(col.source!=='coa') return;
      totals[col.coaKey] = (totals[col.coaKey]||0) + expenditureEntryColTotal(rec, col.id);

/* --- Asian/Indian comma grouping (12,34,567 instead of 1,234,567) for the
   amount input boxes themselves, formatted live as the person types. --- */
function asianGroupDigits(intDigits){
  if(intDigits.length<=3) return intDigits;
  const lastThree = intDigits.slice(-3);
  let other = intDigits.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return other + ',' + lastThree;
}
function formatAsianAmount(value){
  if(value===''||value===null||value===undefined) return '';
  const s = String(value);
  const neg = s.trim().startsWith('-');
  const cleaned = s.replace(/[^0-9.]/g,'');
  if(cleaned===''||cleaned==='.') return '';
  const dotIdx = cleaned.indexOf('.');
  let intPart = dotIdx===-1 ? cleaned : cleaned.slice(0,dotIdx);
  let decPart = dotIdx===-1 ? '' : cleaned.slice(dotIdx);
  intPart = intPart.replace(/^0+(?=\d)/,'');
  if(intPart==='') intPart='0';
  return (neg?'-':'') + asianGroupDigits(intPart) + decPart;
}

   resolves to 1000 the moment they leave the field (blur/Enter) - handy
   for things like "IOU was 1500, 500 came back, net 1000" without needing
   a calculator on the side. Only digits, spaces, a decimal point, and
   + - * / ( ) are ever accepted; anything else is stripped as typed. */
function looksLikePlainNumber(s){ return /^-?\d*\.?\d*$/.test(s); }
function evalAmountExpression(expr){
  const cleaned = String(expr||'').replace(/,/g,'').trim();
  if(!cleaned) return null;
  if(!/^[\d\s+\-*/().]+$/.test(cleaned)) return null; // reject anything not a plain arithmetic expression
  if(!/\d/.test(cleaned)) return null; // must contain at least one digit
  try{
    const result = Function('"use strict"; return (' + cleaned + ')')();
    return (typeof result==='number' && isFinite(result)) ? result : null;
  }catch(e){ return null; }
}
function resolveAmountField(inputEl, onChange, fallbackValue){
  const raw = inputEl.value.replace(/,/g,'').trim();
  if(raw===''){ inputEl.value=''; onChange(0); return; }
  if(looksLikePlainNumber(raw)){
    // Already a plain number - still (re)sync it. Pasted values can land
    // here already-plain (e.g. a hidden newline/tab from a spreadsheet
    // copy got stripped during typing) without onChange having fired yet,
    // so skipping this would silently leave the total out of date.
    const num = parseFloat(raw);
    inputEl.value = formatAsianAmount(raw);
    onChange(isNaN(num)?0:num);
    return;
  }
  const result = evalAmountExpression(raw);
  if(result===null){
    const m = raw.match(/^-?\d+(\.\d+)?/);
    const num = m ? parseFloat(m[0]) : (fallbackValue||0);
    inputEl.value = formatAsianAmount(num);
    onChange(num);
    return;
  }
  inputEl.value = formatAsianAmount(result);
  onChange(result);
}

/* Best-effort "what is this field part of" label for the audit log -
   the category badge if it's a line-item, else the enclosing card's
   title, else a generic fallback. Imprecise by nature (these two wiring
   functions are generic and don't know the data model), but good enough
   to make a log entry readable. */
function nearestEntityLabel(inputEl){
  const li = inputEl.closest('.line-item');
  if(li){
    const badge = li.querySelector('.voucher-badge');
    if(badge && badge.textContent.trim()) return badge.textContent.trim()+' voucher';
  }
  const card = inputEl.closest('.card');
  const h3 = card && card.querySelector('h3');
  if(h3) return h3.textContent.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').trim() || 'entry';
  return 'entry';
}
function wireAmountInput(inputEl, onChange, onPlainEnter){
  const fallbackValue = parseAmountInput(inputEl.value);
  let auditFocusVal = null;
  inputEl.addEventListener('focus', ()=>{ auditFocusVal = inputEl.value; });
  inputEl.addEventListener('input', ()=>{
    const raw = inputEl.value.replace(/,/g,'');
    if(looksLikePlainNumber(raw)){
      const digitsBeforeCursor = inputEl.value.slice(0, inputEl.selectionStart).replace(/[^0-9.]/g,'').length;
      let clean = raw.replace(/[^0-9.]/g,'');
      const firstDot = clean.indexOf('.');
      if(firstDot!==-1){ clean = clean.slice(0,firstDot+1) + clean.slice(firstDot+1).replace(/\./g,''); }
      const num = (clean===''||clean==='.') ? 0 : parseFloat(clean);
      const formatted = formatAsianAmount(clean);
      inputEl.value = formatted;
      let seen = 0, pos = 0;
      for(; pos<formatted.length; pos++){
        if(/[0-9.]/.test(formatted[pos])) seen++;
        if(seen>=digitsBeforeCursor){ pos++; break; }
      }
      inputEl.setSelectionRange(pos, pos);
      onChange(isNaN(num)?0:num);
    } else {
      const pos = inputEl.selectionStart;
      const sanitized = inputEl.value.replace(/[^0-9+\-*/(). ]/g,'');
      const sanitizedPlain = sanitized.replace(/,/g,'');
      if(looksLikePlainNumber(sanitizedPlain) && sanitizedPlain!==''){
        // Whatever made this look like an expression (e.g. a hidden
        // newline/tab pasted in from a spreadsheet cell) just got
        // stripped away, leaving a plain number - resolve it right now
        // rather than stranding it in the "wait for blur" branch, which
        // would otherwise show the number but never save it.
        const num = parseFloat(sanitizedPlain);
        inputEl.value = formatAsianAmount(sanitizedPlain);
        inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        onChange(isNaN(num)?0:num);
        return;
      }
      if(sanitized !== inputEl.value){
        inputEl.value = sanitized;
        inputEl.setSelectionRange(pos, pos);
      }
      // a math expression is mid-typing - wait for blur/Enter to resolve it
    }
  });
  inputEl.addEventListener('blur', ()=>{ resolveAmountField(inputEl, onChange, fallbackValue); });
  inputEl.addEventListener('blur', ()=>{
    if(auditFocusVal!==null) logAuditChange(nearestEntityLabel(inputEl), nearestFieldLabel(inputEl), auditFocusVal, inputEl.value);
    auditFocusVal = null;
  });
  inputEl.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      e.preventDefault();
      /* If this Enter still has an unresolved expression (e.g. "1500-500"),
         use it just to resolve/compute the result - don't also treat it as
         "move to a new line" yet. A second Enter, once the box already
         shows a plain resolved number, is what actually advances. This
         stops "compute the total" and "start a new entry" from colliding
         on the same keypress. */
      const rawBefore = inputEl.value.replace(/,/g,'').trim();
      const wasAlreadyPlain = looksLikePlainNumber(rawBefore) && rawBefore!=='';
      resolveAmountField(inputEl, onChange, fallbackValue);
      if(wasAlreadyPlain){
        inputEl.blur();
        if(onPlainEnter) onPlainEnter();
      }
      // else: expression just got resolved into a plain number and stays
      // focused/selected so the very next Enter (on the now-plain value)
      // can advance, without having silently skipped a line in between.
      else { inputEl.select(); }
    }
  });
}
function findDay(id){ return state.days.find(d=>d.id===id); }

/* --- Soft-delete / Undo -------------------------------------------------
   Every delete action calls pushUndo() with a closure that restores
   exactly what was removed. A small toast offers "Undo" for a short
   window (10s) or until another delete replaces it. */
function pushUndo(label, restoreFn){
  lastUndo = {label, restore: restoreFn};
  if(lastUndoTimer) clearTimeout(lastUndoTimer);
  lastUndoTimer = setTimeout(()=>{ lastUndo = null; render(); }, 10000);
}
function performUndo(){
  if(!lastUndo) return;
  lastUndo.restore();
  if(lastUndoTimer) clearTimeout(lastUndoTimer);
  lastUndo = null;
  saveState();
  render();
}
function renderUndoToast(){
  return el(`
    <div style="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--primary-dark);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;z-index:500;font-size:13px;animation:modalIn .25s var(--ease);max-width:92vw;">
      <span>${escapeHtml(lastUndo.label)}</span>
      <button type="button" data-action="perform-undo" style="background:var(--accent);border-color:var(--accent);white-space:nowrap;">Undo</button>
    </div>
  `);
}

/* --- Duplicate-amount warning ------------------------------------------
   A gentle heads-up (not a block) when the same amount shows up more than
   once in the same day - catches accidental double entry without getting
   in the way of legitimate repeats (e.g. two genuinely equal payments). */
function checkDuplicateAmount(day, amount, excludeItemId){
  if(!amount || amount<=0) return null;
  const matches = [];
  COA.forEach(cat=>{
    (day.coa[cat.key]||[]).forEach(it=>{
      if(it.id!==excludeItemId && Number(it.amount)===Number(amount)){
        matches.push({label: cat.label, desc: it.desc||'', voucher: it.voucher});
      }
    });
  });
  if(matches.length===0) return null;
  const m = matches[0];
  const where = m.desc ? `"${m.desc}" (${m.label}, ${m.voucher})` : `${m.label} (${m.voucher})`;
  return `Heads up: ${formatAsianAmount(amount)} was already entered today under ${where}${matches.length>1?` and ${matches.length-1} more`:''}. Might be a duplicate - or just two genuine entries.`;
}
function showDuplicateWarning(message){
  duplicateWarning = message;
  if(duplicateWarningTimer) clearTimeout(duplicateWarningTimer);
  duplicateWarningTimer = setTimeout(()=>{ duplicateWarning = null; render(); }, 7000);
  render();
}
function renderDuplicateWarningToast(){
  return el(`
    <div style="position:fixed;left:50%;bottom:${lastUndo?'78px':'22px'};transform:translateX(-50%);background:#7A5B12;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:14px;z-index:500;font-size:13px;animation:modalIn .25s var(--ease);max-width:92vw;">
      <span>&#9888; ${escapeHtml(duplicateWarning)}</span>
      <button type="button" data-action="dismiss-dup-warning" style="background:transparent;border-color:rgba(255,255,255,.5);color:#fff;white-space:nowrap;">Dismiss</button>
    </div>
  `);
}

/* Every day ever recorded, current month + everything archived by past
   "Refresh - new month" clears, so Search and Category Summary can see
   the full history rather than just what's currently loaded. */
function allDaysEverywhere(){
  const archived = (state.archive||[]).flatMap(m=>m.days||[]);
  return archived.concat(state.days);
}

/* Flattens every Cash Disbursed (CoA) voucher across every recorded day
   into one list of {date, cat, voucher, desc, amount}, for Search and
   Category Summary to filter and group. */
/* Category labels from imported Monthly Ledger expenditure columns don't
   always match a COA category's label exactly (spacing, punctuation,
   case) - normalize both sides the same way before comparing. */
function normalizeCatLabel(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[&/]/g,'and'); }
/* Expenditure entries imported straight into the Monthly Ledger (via
   "Import a previous month's workbook") for months that predate day-by-
   day Daily Ledger use - these never went through day.coa, so
   allVouchers() couldn't see them for Category Summary/Search/Annual
   Summary. Skipped for any month that DOES have real day-level data,
   since that's the more granular, authoritative source once it exists. */
function monthlyLedgerImportedVouchers(){
  const out = [];
  const months = (state.monthlyLedger && state.monthlyLedger.months) || {};
  const monthsWithDayData = new Set(allDaysEverywhere().map(d=>d.date.slice(0,7)));
  Object.keys(months).forEach(key=>{
    const rec = months[key];
    if(!rec) return;
    if(monthsWithDayData.has(key)) return;
    (rec.expenditureColumns||[]).forEach(col=>{
      const coaKey = resolveColCoaKey(col);
      const cat = coaKey ? COA.find(c=>c.key===coaKey) : null;
      if(!cat) return;
      if(col.source==='entries'){
        (rec.expenditureEntries||[]).forEach(entry=>{
          if(!entry.date) return;
          const amt = Number((entry.amounts||{})[col.id])||0;
          if(amt<=0) return;
          out.push({date:entry.date, cat, catKey:coaKey, voucher:'', desc:entry.desc||'', note:'', amount:amt});
        });
      } else {
        // 'coa' columns with no day-level data behind them are a single
        // manually-entered monthly total (col.override), not itemised
        // entries - represent that as one dated voucher for the month.
        const amt = monthExpenditureColTotalForCoa(key, coaKey);
        if(amt>0) out.push({date:`${key}-01`, cat, catKey:coaKey, voucher:'', desc:'', note:'', amount:amt});
      }
    });
  });
  return out;
}
/* Same idea as monthlyLedgerImportedVouchers(), but for the Revenue side -
   revenueEntries are keyed directly by REVENUE_CATS key (no column/label
   matching needed), and are the single source of truth for revenue
   whether the month was entered live or imported, so this covers every
   tracked month. */
function allRevenueVouchers(){
  const out = [];
  const months = (state.monthlyLedger && state.monthlyLedger.months) || {};
  Object.keys(months).forEach(key=>{
    const rec = months[key];
    if(!rec || !rec.revenueEntries) return;
    rec.revenueEntries.forEach(entry=>{
      if(!entry.date) return;
      REVENUE_CATS.forEach(cat=>{
        const amt = Number(entry[cat.key])||0;
        if(amt<=0) return;
        out.push({date:entry.date, cat, catKey:cat.key, voucher:'', desc:entry.desc||'', note:'', amount:amt});
      });
    });
  });
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
function allVouchers(){
  const out = [];
  allDaysEverywhere().forEach(day=>{
    COA.forEach(cat=>{
      (day.coa[cat.key]||[]).forEach(item=>{
        // A voucher with 2+ sections holds several separate amounts under
        // one voucher no. - Search and Category Summary should list each
        // section as its own row with its own amount, not the voucher's
        // summed total, so one big multi-section voucher doesn't inflate
        // a single search hit into one lump sum.
        const secs = (item.sections && item.sections.length) ? item.sections : [{desc:item.desc, amount:item.amount}];
        secs.forEach(sec=>{
          const amt = Number(sec.amount)||0;
          if(amt>0) out.push({date:day.date, cat, catKey:cat.key, voucher:item.voucher, desc:sec.desc||'', note:item.note||'', amount:amt});
        });
      });
    });
  });
  out.push(...monthlyLedgerImportedVouchers());
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
/* Flattens every imported historical Withdraw Notesheet (see
   parseHistoricalNotesheetFile / state.historicalImports) into the same
   {date, cat, catKey, voucher, desc, note, amount} shape as allVouchers(),
   so Search and Category Summary can filter/group them exactly like real
   vouchers. date is the notesheet's FROM date (day is a rough stand-in -
   the month/year are what's reliable, since the source notesheet only
   ever gave a date range in words, never a per-item date); rangeLabel and
   historical:true are carried along so the UI can show the written range
   instead of a fake precise date and mark the row as imported. This list
   is intentionally never mixed into allVouchers() itself. */
/* Categories available when importing/labelling a historical notesheet:
   the real Daily Ledger CoA (COA) plus any extra categories the person
   has added just for classifying old/historical notesheets that don't
   fit the current CoA (state.customHistoricalCategories). Kept separate
   from COA itself so it never touches live voucher entry, templates, the
   Withdraw Notesheet generator, or the Journal - purely a lookup/label
   list for historical import & its Search/Category Summary results. */
function historyCategories(){
  return COA.concat((state.customHistoricalCategories||[]).map(c=>(
    {key:c.key, label:c.label, short:c.label, notesheetLabel:c.label, custom:true}
  )));
}
function findHistoryCategory(key){ return historyCategories().find(c=>c.key===key) || null; }
function allHistoricalVouchers(){
  const out = [];
  (state.historicalImports||[]).forEach(imp=>{
    const cat = findHistoryCategory(imp.catKey);
    if(!cat) return;
    (imp.items||[]).forEach(it=>{
      const amt = Number(it.amount)||0;
      if(amt<=0) return;
      out.push({date:imp.fromDate, cat, catKey:imp.catKey, voucher:it.voucher||'', desc:it.desc||'', note:'', amount:amt, historical:true, rangeLabel:imp.rangeLabel, importId:imp.id});
    });
  });
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}
/* allVouchers() and allHistoricalVouchers() are each sorted internally,
   but simply concatenating them (real vouchers, then historical ones)
   does NOT produce one date-sorted list - it produces two separately-
   sorted blocks stuck together, so anything that reverses the result to
   show "newest first" ends up showing the whole historical block before
   the whole real-voucher block regardless of actual dates. Always use
   this instead of `allVouchers().concat(allHistoricalVouchers())` when
   the combined list needs to be in true date order. */
function allVouchersAndHistorical(){
  return allVouchers().concat(allHistoricalVouchers()).sort((a,b)=>a.date.localeCompare(b.date));
}
/* Reads one previously-generated Withdraw Notesheet .xlsx (the exact
   layout writeNotesheet() produces: B3 = "III/Acct/Madrasa/Withdraw/
   <Category>/<Number>", B5 = the "Following amount... disbursed from
   <date> - <date> (voucher no: X - Y) as..." sentence, then an S/no |
   Description | Amount table) and pulls out just what Search/Category
   Summary need: category, an approximate from/to date, the written date
   range as text, and each line item's own description+amount (not the
   voucher's summed total). Throws a plain Error with a human message on
   anything unrecognized, for the import UI to show as-is.
   overrideCatKey: when set (from the import form's category picker),
   used as-is instead of trying to auto-detect the category from B3 - lets
